<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.3 PID 离散化形式</text>

  <!-- 左：位置式 vs 增量式 -->
  <text x="20" y="58" font-size="12" fill="#555">① 位置式 vs 增量式（PD 下逐拍一致）</text>
  <g transform="translate(30,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#999" stroke-dasharray="5"/>
    <polyline fill="none" stroke="#2563eb" stroke-width="2.6" points="0,140 40,70 80,35 120,32 300,32"/>
    <polyline fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5" points="0,140 40,70 80,35 120,32 300,32"/>
    <text x="6" y="158" font-size="10" fill="#2563eb">■ 位置式</text>
    <text x="80" y="158" font-size="10" fill="#dc2626">■ 增量式（重合）</text>
  </g>

  <!-- 右：dt 越大越差 -->
  <text x="360" y="58" font-size="12" fill="#555">② 采样周期 dt 越大，离散化误差越大</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#999" stroke-dasharray="5"/>
    <!-- dt=0.01 -->
    <polyline fill="none" stroke="#059669" stroke-width="2.4" points="0,140 30,80 60,40 90,32 120,32 300,32"/>
    <!-- dt=0.10 -->
    <polyline fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="5" points="0,140 30,70 55,16 80,50 110,30 150,33 200,32 300,32"/>
    <!-- dt=0.30 -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.2" points="0,140 25,55 45,1 65,65 90,20 115,42 145,28 180,34 220,31 300,32"/>
    <text x="6" y="158" font-size="10" fill="#059669">■ dt=0.01</text>
    <text x="90" y="158" font-size="10" fill="#2563eb">■ dt=0.10</text>
    <text x="180" y="158" font-size="10" fill="#dc2626">■ dt=0.30</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：位置式与增量式是同一 PID 的两种写法（PD 下逐拍等价）；但 dt 太大时离散化误差会让系统更振荡——采样要够快。</text>
</svg>
