<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 MIMO 解耦 + IAE 自动整定：per-loop metric-driven tuning</text>

  <!-- ① 流程 -->
  <text x="20" y="56" font-size="12" fill="#555">① 流程：建 2×2 对象 → D=K⁻¹ 解耦 → 每回路 IAE 网格搜索 → 装回全系统</text>
  <g transform="translate(30,66)" font-size="11">
    <rect x="0" y="0" width="150" height="56" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="10" y="20" fill="#3730a3" font-weight="bold">2×2 对象 K=[[1,0.3],[0.5,1]]</text>
    <text x="10" y="38" fill="#4338ca">τ1=1, τ2=2</text>
    <text x="160" y="32" font-size="18" fill="#dc2626">→</text>
    <rect x="190" y="0" width="150" height="56" rx="6" fill="#cffafe" stroke="#0891b2"/>
    <text x="200" y="20" fill="#155e75" font-weight="bold">解耦器 D=K⁻¹</text>
    <text x="200" y="38" fill="#155e75">直流严格对角化</text>
    <text x="352" y="32" font-size="18" fill="#dc2626">→</text>
    <rect x="382" y="0" width="170" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="392" y="20" fill="#92400e" font-weight="bold">每回路 7×7 (Kp,Ki) 网格</text>
    <text x="392" y="38" fill="#92400e">IAE 最小 → (Kp*,Ki*)</text>
    <text x="564" y="32" font-size="18" fill="#dc2626">→</text>
    <rect x="590" y="0" width="80" height="56" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="600" y="20" fill="#065f46" font-weight="bold">全系统</text>
    <text x="600" y="38" fill="#065f46">IAE −63%</text>
  </g>

  <!-- ② 每回路 IAE 对比 -->
  <text x="20" y="158" font-size="12" fill="#555">② 两回路各自 IAE：固定 NOM vs IAE 自动（越小越好）</text>
  <g transform="translate(30,168)" font-size="11">
    <rect x="0" y="0" width="300" height="70" rx="6" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="10" y="20" fill="#374151" font-weight="bold">回路1 (r=[1,0])</text>
    <text x="10" y="40" fill="#374151">NOM IAE = 1.9816</text>
    <text x="10" y="58" fill="#065f46" font-weight="bold">自动 (2.3,1.5) IAE = 0.6666  −66.4%</text>
    <rect x="340" y="0" width="300" height="70" rx="6" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="350" y="20" fill="#374151" font-weight="bold">回路2 (r=[0,1])</text>
    <text x="350" y="40" fill="#374151">NOM IAE = 2.0013</text>
    <text x="350" y="58" fill="#065f46" font-weight="bold">自动 (2.3,1.5) IAE = 0.8084  −59.6%</text>
  </g>

  <!-- ③ 交叉耦合仍被压住 -->
  <text x="20" y="278" font-size="12" fill="#555">③ 解耦前提：自动整定时交叉耦合仍被压到 ≈0</text>
  <g transform="translate(30,288)" font-size="11">
    <rect x="0" y="0" width="320" height="46" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="12" y="20" fill="#1e40af">• 回路1阶跃：瞬态 |人y2| 峰值 = 0.0000</text>
    <text x="12" y="38" fill="#1e40af">• y1_ss≈1.0, y2_ss≈0.0</text>
    <rect x="340" y="0" width="320" height="46" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="352" y="20" fill="#1e40af">• 回路2阶跃：瞬态 |人y1| 峰值 = 0.0000</text>
    <text x="352" y="38" fill="#1e40af">• y2_ss≈1.0, y1_ss≈0.0</text>
  </g>

  <!-- ④ 洞见 -->
  <text x="20" y="372" font-size="12" fill="#555">④ 洞见：IAE 单目标在稳定对象上无内点最优</text>
  <g transform="translate(30,382)" font-size="11">
    <rect x="0" y="0" width="650" height="30" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="12" y="20" fill="#7f1d1d">最优落在搜索窗激进端 (2.3,1.5)：IAE 总偏好更大增益 → 工程须加超调/调节时间约束，或换 ITAE（见 L4.6/L4.8）</text>
  </g>
  <text x="20" y="412" font-size="11" fill="#666">要点：解耦（L4.7）+ IAE 打分（L4.6）+ 指标驱动寻优（L4.8）三者串成「多变量自动整定」；无编译器下经受管 Python 验证 10/10 + C++ 控制流镜像 12/12 PASS。</text>
</svg>
