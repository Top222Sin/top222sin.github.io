<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 分数阶 PID：λ/μ 两阶自由度 + Grünwald-Letnikov 离散化</text>

  <!-- ① 连续公式 -->
  <text x="20" y="56" font-size="12" fill="#555">① 连续型  u(t) = Kp·e(t) + Ki·D⁻ˡe(t) + Kd·Dᵐe(t)   （λ,μ 为积分/微分阶，不必=1）</text>

  <!-- ② 整数 vs 分数阶 -->
  <text x="20" y="82" font-size="12" fill="#555">② 与整数 PID 对比（同 Kp/Ki/Kd）</text>
  <g transform="translate(30,92)" font-size="11">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="10" y="20" fill="#3730a3" font-weight="bold">整数 PID（λ=1, μ=1）</text>
    <text x="10" y="40" fill="#4338ca">超调=0.0173</text>
    <text x="10" y="54" fill="#4338ca">IAE=1.1231</text>
    <rect x="240" y="0" width="200" height="60" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="250" y="20" fill="#065f46" font-weight="bold">FOPID（λ=1, μ=1.2）</text>
    <text x="250" y="40" fill="#065f46">超调=0.0000</text>
    <text x="250" y="54" fill="#065f46">IAE=1.1110</text>
    <text x="450" y="34" font-size="20" fill="#dc2626">→</text>
    <text x="478" y="26" fill="#991b1b" font-weight="bold">μ 多给相位超前</text>
    <text x="478" y="44" fill="#991b1b">超调↓ 更柔顺</text>
  </g>

  <!-- ③ GL 离散化 -->
  <text x="20" y="190" font-size="12" fill="#555">③ Grünwald-Letnikov：Dᵃe(k) ≈ h⁻ᵃ·Σⱼ(−1)ʲC(α,j)·e(k−j)</text>
  <g transform="translate(30,200)" font-size="10">
    <rect x="0" y="0" width="290" height="58" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="10" y="20" fill="#92400e" font-weight="bold">积分项 α=−λ：D⁻ˡe = h⁺ˡ·Σ wI[j]·e(k−j)</text>
    <text x="10" y="38" fill="#92400e">全历史不截断（否则丢积分器/DC）</text>
    <text x="10" y="52" fill="#92400e">λ=1 退化成标准积分</text>
    <rect x="310" y="0" width="290" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="320" y="20" fill="#5b21b6" font-weight="bold">微分项 α=+μ：Dᵐe = h⁻ᵐ·Σ wD[j]·e(k−j)</text>
    <text x="320" y="38" fill="#5b21b6">权重速衰，截断窗口即可（Hd=400）</text>
    <text x="320" y="52" fill="#5b21b6">μ=1 退化自检 (1,−1,0,0,0)</text>
  </g>

  <!-- ④ 关键数字 -->
  <text x="20" y="296" font-size="12" fill="#555">④ 验证要点（受管 Python 全 PASS）</text>
  <g transform="translate(40,304)" font-size="11">
    <rect x="0" y="0" width="300" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="12" y="20" fill="#14532d">• FOPID IAE 1.1110 &lt; 整数 1.1231</text>
    <text x="12" y="38" fill="#14532d">• FOPID 超调 0.0000 &lt; 整数 0.0173</text>
    <rect x="320" y="0" width="300" height="46" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="332" y="20" fill="#7f1d1d">• GL μ=1 系数 (1,−1,0,0,0) PASS</text>
    <text x="332" y="38" fill="#7f1d1d">• 稳态误差 5.8e-5 &lt; 0.02 PASS</text>
  </g>
  <text x="20" y="356" font-size="11" fill="#666">要点：λ/μ 是 PID 之外的两个额外自由度；积分必须全历史（初版截断→稳态下垂已修）。暖通/家电整定更柔顺。</text>
</svg>
