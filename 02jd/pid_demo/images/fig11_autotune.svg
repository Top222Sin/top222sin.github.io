<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.1 自动整定（relay 自激振荡 / Åström-Hägglund）⭐</text>

  <!-- 左上：relay 反馈环 -->
  <text x="20" y="56" font-size="12" fill="#555">① relay 自激振荡辨识</text>
  <g transform="translate(30,70)" font-size="10">
    <rect x="0" y="36" width="34" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="17" y="51" fill="#3730a3" text-anchor="middle">r=0</text>
    <line x1="34" y1="47" x2="64" y2="47" stroke="#444"/>
    <circle cx="74" cy="47" r="12" fill="#fff" stroke="#444"/>
    <text x="74" y="51" text-anchor="middle" fill="#222">Σ</text>
    <line x1="86" y1="47" x2="120" y2="47" stroke="#444"/>
    <rect x="120" y="36" width="74" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="157" y="51" fill="#92400e" text-anchor="middle">relay ±d</text>
    <line x1="194" y1="47" x2="230" y2="47" stroke="#444"/>
    <rect x="230" y="36" width="96" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="278" y="50" fill="#065f46" text-anchor="middle">plant K·e^{-Ls}/(Ts+1)</text>
    <line x1="326" y1="47" x2="360" y2="47" stroke="#444"/>
    <text x="370" y="51" font-size="10" fill="#333">y</text>
    <!-- 反馈 -->
    <line x1="360" y1="47" x2="360" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="360" y1="92" x2="74" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="74" y1="92" x2="74" y2="59" stroke="#bbb" stroke-dasharray="4"/>
    <text x="200" y="108" font-size="9" fill="#888" text-anchor="middle">负反馈（r=0 → 测 y 的振荡）</text>
  </g>

  <!-- 左下：波形 -->
  <text x="20" y="150" font-size="12" fill="#555">② 起振波形：方波 u(t) 激励出正弦 y(t)，量 a 与 Pu</text>
  <g transform="translate(30,162)">
    <!-- 方波 u -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2"
      points="0,12 60,12 60,32 120,32 120,12 180,12 180,32 240,32 240,12 300,12"/>
    <text x="0" y="6" font-size="9" fill="#991b1b">u = ±d（relay）</text>
    <!-- 正弦 y -->
    <polyline fill="none" stroke="#2563eb" stroke-width="2"
      points="0,90 15,74 30,67 45,74 60,90 75,106 90,113 105,106 120,90 135,74 150,67 165,74 180,90 195,106 210,113 225,106 240,90 255,74 270,67 285,74 300,90"/>
    <line x1="0" y1="90" x2="300" y2="90" stroke="#999" stroke-dasharray="4"/>
    <text x="0" y="128" font-size="9" fill="#1e40af">y(t) 正弦振荡（幅值 a，周期 Pu）</text>
  </g>

  <!-- 右：整定后阶跃响应 -->
  <text x="360" y="56" font-size="12" fill="#555">③ Z-N 整定后闭环阶跃（Ku/Pu→Kp/Ki/Kd）</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="180" x2="300" y2="180" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="180" stroke="#888"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="84" font-size="10" fill="#777">r=1</text>
    <polyline fill="none" stroke="#059669" stroke-width="2.4"
      points="0,180 30,90 60,18 78,-27 96,0 120,0 150,0 180,0 210,0 240,0 300,0"/>
    <text x="6" y="198" font-size="10" fill="#065f46">■ relay 整定 PID（无稳态误差，温和超调）</text>
    <text x="250" y="198" font-size="10" fill="#777">t(s)→</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：relay 把 plant 包成自激振荡环，量出 a、Pu → Ku=4d/(πa)；FOPDT 精确真值（求根 ωu·L+atan(ωu·T)=π）Ku=√(1+(ωuT)²)/K、Pu=2π/ωu 作对拍。对应 PX4 mc_autotune 的 _sys_id + computePidGmvc。</text>
</svg>
