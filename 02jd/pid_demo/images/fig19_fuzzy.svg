<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 模糊 PID：e,ec → 规则库 → 解模糊 → 增益自适应</text>

  <!-- 推理机链路 -->
  <text x="20" y="56" font-size="12" fill="#555">① 模糊推理机（不换控制器结构，只动 Kp/Ki/Kd）</text>
  <g transform="translate(20,66)" font-size="10">
    <rect x="0" y="20" width="56" height="24" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="28" y="36" fill="#3730a3" text-anchor="middle">e, ec</text>
    <line x1="56" y1="32" x2="84" y2="32" stroke="#444"/>
    <rect x="84" y="20" width="70" height="24" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="119" y="36" fill="#92400e" text-anchor="middle">×ge,gec</text>
    <line x1="154" y1="32" x2="182" y2="32" stroke="#444"/>
    <rect x="182" y="20" width="86" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="225" y="36" fill="#5b21b6" text-anchor="middle">三角隶属</text>
    <line x1="268" y1="32" x2="296" y2="32" stroke="#444"/>
    <rect x="296" y="8" width="120" height="48" rx="6" fill="#fce7f3" stroke="#db2777"/>
    <text x="356" y="26" fill="#9d174d" text-anchor="middle" font-weight="bold">7×7 规则库</text>
    <text x="356" y="42" fill="#9d174d" text-anchor="middle">ΔKp/ΔKi/ΔKd</text>
    <line x1="416" y1="32" x2="444" y2="32" stroke="#444"/>
    <rect x="444" y="20" width="86" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="487" y="36" fill="#1e40af" text-anchor="middle">重心法CoG</text>
    <line x1="530" y1="32" x2="558" y2="32" stroke="#444"/>
    <rect x="558" y="20" width="100" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="608" y="36" fill="#065f46" text-anchor="middle">kp=Kp0+kpsΔ</text>
  </g>

  <!-- 规则方向 -->
  <text x="20" y="146" font-size="12" fill="#555">② 规则方向（反对称）：大正误差 → 降 Kp 防超调、增 Ki 消静差</text>
  <g transform="translate(40,154)" font-size="11">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="12" y="18" fill="#14532d">• ΔKp(e=+3) = −2.00　（大误差降 Kp）</text>
    <text x="12" y="34" fill="#14532d">• ΔKi(e=+3) = +2.00　（增积分消静差）</text>
    <rect x="320" y="0" width="300" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="332" y="18" fill="#1e3a8a">• ΔKp(e=−3) = +2.00　（对称）</text>
    <text x="332" y="34" fill="#1e3a8a">• ΔKp(e=0) = 0.00　（原点不动）</text>
  </g>

  <!-- 闭环结果 -->
  <text x="20" y="228" font-size="12" fill="#555">③ 闭环对比（强欠阻尼 G(s)=1/(s²+0.4s+1)，ζ=0.2）</text>
  <g transform="translate(30,236)" font-size="11">
    <rect x="0" y="0" width="200" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="10" y="20" fill="#7f1d1d" font-weight="bold">固定 PID</text>
    <text x="10" y="38" fill="#7f1d1d">IAE=2.8965</text>
    <text x="10" y="52" fill="#7f1d1d">超调=0.4218</text>
    <rect x="240" y="0" width="200" height="56" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="250" y="20" fill="#065f46" font-weight="bold">模糊 PID</text>
    <text x="250" y="38" fill="#065f46">IAE=2.1381</text>
    <text x="250" y="52" fill="#065f46">超调=0.3695</text>
    <text x="450" y="34" font-size="18" fill="#dc2626">→</text>
    <text x="476" y="26" fill="#991b1b" font-weight="bold">超调↓13%</text>
    <text x="476" y="44" fill="#991b1b">IAE↓26%</text>
  </g>

  <text x="20" y="324" font-size="12" fill="#555">④ 验证要点（受管 Python 全 PASS）</text>
  <g transform="translate(40,332)" font-size="11">
    <rect x="0" y="0" width="300" height="22" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="12" y="15" fill="#14532d">• 推理自检 4 项 PASS（方向正确）</text>
    <rect x="320" y="0" width="300" height="22" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="332" y="15" fill="#7f1d1d">• 模糊超调/IAE &lt; 固定，稳态 1.4e-3</text>
  </g>
  <text x="20" y="356" font-size="11" fill="#666">要点：模糊 PID = 标准三项 + 规则库自适应增益；免模型、贴近人工经验；适合暖通/家电「允许慢但别冲」。</text>
</svg>
