<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 MIMO PID：2×2 耦合对象 + 静态解耦 D=K⁻¹</text>

  <!-- ① 结构 -->
  <text x="20" y="56" font-size="12" fill="#555">① 解耦后各路按 SISO 整定：u = D·u_loop，D=Kss⁻¹ 使 D·Kss=I</text>
  <g transform="translate(20,64)" font-size="10">
    <rect x="0" y="30" width="34" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="17" y="45" fill="#3730a3" text-anchor="middle">r</text>
    <line x1="34" y1="41" x2="60" y2="41" stroke="#444"/>
    <circle cx="70" cy="41" r="11" fill="#fff" stroke="#444"/>
    <text x="70" y="45" text-anchor="middle" fill="#222">Σ</text>
    <line x1="81" y1="41" x2="120" y2="41" stroke="#444"/>
    <rect x="120" y="30" width="60" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="150" y="45" fill="#065f46" text-anchor="middle">各路PID</text>
    <line x1="180" y1="41" x2="220" y2="41" stroke="#444"/>
    <rect x="220" y="30" width="64" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="252" y="45" fill="#92400e" text-anchor="middle">D=K⁻¹</text>
    <line x1="284" y1="41" x2="324" y2="41" stroke="#444"/>
    <rect x="324" y="30" width="120" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="384" y="45" fill="#5b21b6" text-anchor="middle">2×2 对象 K</text>
    <line x1="444" y1="41" x2="474" y2="41" stroke="#444"/>
    <text x="480" y="45" fill="#333">y</text>
    <line x1="474" y1="41" x2="474" y2="78" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="474" y1="78" x2="70" y2="78" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="70" y1="78" x2="70" y2="52" stroke="#bbb" stroke-dasharray="4"/>
    <text x="20" y="98" font-size="10" fill="#555">反馈：解耦器把对象在直流严格对角化 → 有效对象 D·K≈I，各路互不干扰</text>
  </g>

  <!-- ② K 与解耦 -->
  <text x="20" y="134" font-size="12" fill="#555">② 增益矩阵与解耦器</text>
  <g transform="translate(40,142)" font-size="11">
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#fce7f3" stroke="#db2777"/>
    <text x="75" y="20" fill="#9d174d" text-anchor="middle" font-weight="bold">K = [[1, 0.3],</text>
    <text x="75" y="38" fill="#9d174d" text-anchor="middle" font-weight="bold">     [0.5, 1]]</text>
    <text x="160" y="28" font-size="18" fill="#dc2626">→</text>
    <rect x="190" y="0" width="150" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="265" y="20" fill="#1e40af" text-anchor="middle" font-weight="bold">D = K⁻¹</text>
    <text x="265" y="38" fill="#1e40af" text-anchor="middle">D·Kss = I</text>
    <rect x="360" y="0" width="280" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="372" y="20" fill="#14532d">• Kss=(I−A)⁻¹B ≈ K（残差 1.2e-16）</text>
    <text x="372" y="38" fill="#14532d">• D·Kss=I（解耦自检 PASS）</text>
  </g>

  <!-- ③ 瞬态耦合对比 -->
  <text x="20" y="226" font-size="12" fill="#555">③ 瞬态交叉耦合峰值（r=[1,0]，看 y2 被拖出多少）</text>
  <g transform="translate(30,234)" font-size="11">
    <rect x="0" y="0" width="200" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="10" y="20" fill="#7f1d1d" font-weight="bold">无解耦</text>
    <text x="10" y="38" fill="#7f1d1d">y1_ss=0.9872</text>
    <text x="10" y="52" fill="#7f1d1d">瞬态 y2 峰值=0.1479</text>
    <rect x="240" y="0" width="200" height="56" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="250" y="20" fill="#065f46" font-weight="bold">解耦后</text>
    <text x="250" y="38" fill="#065f46">y1_ss=0.9944</text>
    <text x="250" y="52" fill="#065f46">瞬态 y2 峰值=0.0000</text>
    <text x="450" y="34" font-size="18" fill="#dc2626">→</text>
    <text x="476" y="26" fill="#991b1b" font-weight="bold">耦合压到≈0</text>
    <text x="476" y="44" fill="#991b1b">0.1479→0.0000</text>
  </g>

  <text x="20" y="324" font-size="12" fill="#555">④ 验证要点（受管 Python 全 PASS）</text>
  <g transform="translate(40,332)" font-size="11">
    <rect x="0" y="0" width="320" height="22" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="12" y="15" fill="#14532d">• Kss≈K、D·Kss=I、y2_ss≈0 全 PASS</text>
    <rect x="340" y="0" width="280" height="22" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="352" y="15" fill="#7f1d1d">• 瞬态峰值 0.1479→0.0000（解耦价值在瞬态）</text>
  </g>
  <text x="20" y="356" font-size="11" fill="#666">要点：稳态耦合本被积分器消除，解耦器真正价值在抑制瞬态耦合；与 control_demo L4.5 同构。D=K⁻¹ 要求 K 可逆、依赖模型精度。</text>
</svg>
