<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.1 被控对象建模与离散化</text>

  <!-- 左：方块图 -->
  <text x="20" y="58" font-size="12" fill="#555">① 连续 plant 方块图（单位阶跃激励）</text>
  <g transform="translate(40,95)">
    <rect x="0" y="40" width="70" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="35" y="62" font-size="11" fill="#1e40af" text-anchor="middle">阶跃 r(t)</text>
    <line x1="70" y1="57" x2="120" y2="57" stroke="#444"/>
    <rect x="120" y="36" width="120" height="42" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="180" y="58" font-size="12" fill="#92400e" text-anchor="middle">Plant</text>
    <text x="180" y="73" font-size="10" fill="#92400e" text-anchor="middle">K/(Ts+1)</text>
    <line x1="240" y1="57" x2="300" y2="57" stroke="#444"/>
    <text x="310" y="62" font-size="11" fill="#333">y(t)</text>
    <line x1="240" y1="57" x2="240" y2="150" stroke="#bbb"/>
    <line x1="240" y1="150" x2="70" y2="150" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="70" y1="150" x2="70" y2="78" stroke="#bbb" stroke-dasharray="4"/>
    <text x="120" y="168" font-size="10" fill="#888" text-anchor="middle">反馈（单位负反馈）</text>
  </g>

  <!-- 右：阶跃响应 -->
  <text x="360" y="58" font-size="12" fill="#555">② 离散化阶跃响应（三种方法≈重合，稳态=K）</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <!-- setpoint = 1.0 at y=0 -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="4" font-size="10" fill="#777">r=1</text>
    <!-- response curve 1-exp(-t) -->
    <polyline fill="none" stroke="#2563eb" stroke-width="2.4"
      points="0,140 13,95 26,52 39,31 52,21 65,12 78,7 91,4 104,3 130,1 156,0 208,0 260,0 300,0"/>
    <!-- forward (dashed, tiny offset) -->
    <polyline fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4"
      points="0,140 13,98 26,56 39,35 52,24 65,15 78,10 91,6 104,4 130,2 156,1 208,0 260,0 300,0"/>
    <!-- backward (dotted, tiny offset) -->
    <polyline fill="none" stroke="#059669" stroke-width="1.4" stroke-dasharray="2,3"
      points="0,140 13,92 26,48 39,27 52,18 65,10 78,5 91,3 104,2 130,0 156,0 208,0 260,0 300,0"/>
    <text x="6" y="158" font-size="10" fill="#2563eb">■ Tustin</text>
    <text x="80" y="158" font-size="10" fill="#dc2626">■ 前向</text>
    <text x="150" y="158" font-size="10" fill="#059669">■ 后向</text>
    <text x="240" y="158" font-size="10" fill="#777">t(s)→</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：连续 plant 经前向/后向/Tustin 离散后，稳态都=K；小 dt 下三者形态几乎重合。Tustin 无频偏、最常用。</text>
</svg>
