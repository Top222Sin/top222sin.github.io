<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.1 串级 PID 与多回路</text>

  <!-- 左：串级结构 -->
  <text x="20" y="58" font-size="12" fill="#555">① 位置环(外) → 速度环(内) → 执行机构</text>
  <g transform="translate(40,80)" font-size="11">
    <rect x="0" y="0" width="46" height="28" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="23" y="18" fill="#3730a3" text-anchor="middle">x_sp</text>
    <line x1="46" y1="14" x2="72" y2="14" stroke="#444"/>
    <rect x="72" y="0" width="52" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="98" y="18" fill="#1e40af" text-anchor="middle">P 位置</text>
    <line x1="124" y1="14" x2="150" y2="14" stroke="#444"/>
    <rect x="150" y="0" width="56" height="28" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="178" y="18" fill="#92400e" text-anchor="middle">v_sp</text>
    <line x1="206" y1="14" x2="232" y2="14" stroke="#444"/>
    <rect x="232" y="0" width="60" height="28" rx="4" fill="#fde68a" stroke="#b45309"/>
    <text x="262" y="18" fill="#78350f" text-anchor="middle">PID 速度</text>
    <line x1="292" y1="14" x2="320" y2="14" stroke="#444"/>
    <rect x="320" y="0" width="56" height="28" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="348" y="18" fill="#065f46" text-anchor="middle">plant</text>
    <text x="376" y="18" fill="#333" text-anchor="middle">x</text>
    <!-- feedback -->
    <line x1="348" y1="14" x2="348" y2="70" stroke="#aaa"/>
    <line x1="348" y1="70" x2="262" y2="70" stroke="#aaa" stroke-dasharray="4"/>
    <line x1="262" y1="70" x2="262" y2="28" stroke="#aaa" stroke-dasharray="4"/>
    <text x="306" y="86" font-size="10" fill="#888" text-anchor="middle">反馈 v（速度环）</text>
    <line x1="98" y1="14" x2="98" y2="110" stroke="#aaa"/>
    <line x1="98" y1="110" x2="24" y2="110" stroke="#aaa" stroke-dasharray="4"/>
    <line x1="24" y1="110" x2="24" y2="28" stroke="#aaa" stroke-dasharray="4"/>
    <text x="20" y="126" font-size="10" fill="#888" text-anchor="middle">反馈 x（位置环）</text>
  </g>

  <!-- 右：响应对比 -->
  <text x="360" y="58" font-size="12" fill="#555">② 串级（约束速度，零超调） vs 单环（超调）</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="36" font-size="10" fill="#777">r=1</text>
    <!-- cascade: smooth, no overshoot -->
    <polyline fill="none" stroke="#059669" stroke-width="2.4" points="0,140 30,90 60,55 95,36 130,32 300,32"/>
    <!-- single: overshoot -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5" points="0,140 25,80 45,10 70,55 100,33 135,34 300,32"/>
    <text x="6" y="158" font-size="10" fill="#059669">■ 串级</text>
    <text x="200" y="158" font-size="10" fill="#dc2626">■ 单环 PID</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：外环慢、内环快；外环输出是内环的设定值。内环把"快动态"包住，外环只管慢变量，并可对中间量（速度）限幅防超调。</text>
</svg>
