<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.4 离散稳定性与频率域</text>

  <!-- 左：z 平面单位圆 -->
  <text x="20" y="56" font-size="12" fill="#555">① z 平面：极点在单位圆内才稳定</text>
  <g transform="translate(30,80)">
    <circle cx="90" cy="80" r="60" fill="#f0f9ff" stroke="#2563eb" stroke-width="2"/>
    <line x1="20" y1="80" x2="160" y2="80" stroke="#bbb"/>
    <line x1="90" y1="10" x2="90" y2="150" stroke="#bbb"/>
    <circle cx="90" cy="80" r="2.5" fill="#333"/>
    <!-- 稳定极点 (|p|<1) -->
    <circle cx="115" cy="80" r="5" fill="#059669"/>
    <text x="120" y="74" font-size="10" fill="#065f46">FE 小Kp</text>
    <!-- Tustin 极点 (A-稳定, 恒在内) -->
    <circle cx="103" cy="80" r="5" fill="#2563eb"/>
    <text x="58" y="100" font-size="10" fill="#1e40af">Tustin</text>
    <!-- 不稳定极点 (|p|>1, 圆外) -->
    <circle cx="168" cy="80" r="5" fill="#dc2626"/>
    <text x="150" y="74" font-size="10" fill="#991b1b">FE 大Kp</text>
    <text x="40" y="158" font-size="10" fill="#555">圆内=稳定  圆外=发散</text>
  </g>

  <!-- 右：稳定边界 vs dt -->
  <text x="360" y="56" font-size="12" fill="#555">② 前向欧拉稳定域 Kp &lt; 2/dt − 1（dt 越大越窄）</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <!-- 稳定边界曲线 Kp_crit=2/dt-1 -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.4"
      points="50,3 100,74 200,108 300,120"/>
    <!-- 稳定区(曲线下方=低Kp) 浅绿 -->
    <path d="M0,140 L0,140 L50,140 L50,3 L100,74 L200,108 L300,120 L300,140 Z" fill="#dcfce7" opacity="0.5"/>
    <text x="6" y="158" font-size="10" fill="#555">dt→</text>
    <text x="6" y="12" font-size="10" fill="#555">Kp</text>
    <text x="120" y="30" font-size="10" fill="#065f46">稳定域</text>
    <text x="150" y="95" font-size="10" fill="#991b1b">失稳区</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：离散闭环稳不稳看极点是否落在单位圆内。前向欧拉对一阶 plant 有显式稳定界 Kp&lt;2/dt−1；Tustin 双线性变换 A-稳定，任意增益不发散。dt 越大，稳定域越窄。</text>
</svg>
