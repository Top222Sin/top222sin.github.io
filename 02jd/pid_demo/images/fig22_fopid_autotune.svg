<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 FOPID λ/μ 自动寻优：IAE 指标驱动网格搜索</text>

  <!-- ① 流程 -->
  <text x="20" y="56" font-size="12" fill="#555">① 流程：固定对象+Kp/Ki/Kd → 在 (λ,μ) 网格扫仿真 → 取 IAE 最小</text>
  <g transform="translate(30,66)" font-size="11">
    <rect x="0" y="0" width="150" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="10" y="20" fill="#3730a3" font-weight="bold">对象 G(s)=1/(s²+0.5s+1)</text>
    <text x="10" y="38" fill="#4338ca">固定 Kp/Ki/Kd</text>
    <text x="160" y="30" font-size="18" fill="#dc2626">→</text>
    <rect x="190" y="0" width="190" height="52" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="200" y="20" fill="#92400e" font-weight="bold">7×7 网格 (λ,μ)∈[0.7,1.3]</text>
    <text x="200" y="38" fill="#92400e">每格跑 FOPID 仿真算 IAE</text>
    <text x="392" y="30" font-size="18" fill="#dc2626">→</text>
    <rect x="420" y="0" width="190" height="52" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="430" y="20" fill="#065f46" font-weight="bold">argmin IAE → (λ*,μ*)</text>
    <text x="430" y="38" fill="#065f46">自动找到 (1.1, 1.3)</text>
  </g>

  <!-- ② IAE 对比 -->
  <text x="20" y="158" font-size="12" fill="#555">② 三种整定的 IAE（越小越好）</text>
  <g transform="translate(30,168)" font-size="11">
    <rect x="0" y="0" width="200" height="64" rx="6" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="10" y="20" fill="#374151" font-weight="bold">整数 PID (1.0,1.0)</text>
    <text x="10" y="40" fill="#374151">IAE = 1.1228</text>
    <text x="10" y="56" fill="#374151">基准</text>
    <rect x="240" y="0" width="200" height="64" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="250" y="20" fill="#92400e" font-weight="bold">手工 FOPID (1.0,1.2)</text>
    <text x="250" y="40" fill="#92400e">IAE = 1.1105</text>
    <text x="250" y="56" fill="#92400e">−1.1%</text>
    <rect x="480" y="0" width="200" height="64" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="490" y="20" fill="#065f46" font-weight="bold">自动寻优 (1.1,1.3)</text>
    <text x="490" y="40" fill="#065f46">IAE = 1.0645</text>
    <text x="490" y="56" fill="#065f46">−5.2%</text>
  </g>

  <!-- ③ 发现 -->
  <text x="20" y="268" font-size="12" fill="#555">③ 自动发现：μ*&gt;1（分数阶微分确有用），印证 L4.4 直觉</text>
  <g transform="translate(30,278)" font-size="11">
    <rect x="0" y="0" width="300" height="46" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="12" y="20" fill="#1e40af">• 比整数 PID 降 5.2% IAE</text>
    <text x="12" y="38" fill="#1e40af">• 比手工 FOPID 降 4.1% IAE</text>
    <rect x="320" y="0" width="320" height="46" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="332" y="20" fill="#7f1d1d">• 指标即偏好：换 ITAE 最优会移动</text>
    <text x="332" y="38" fill="#7f1d1d">• 选哪个指标，最优就落在哪</text>
  </g>
  <text x="20" y="356" font-size="11" fill="#666">要点：整定从「人拍脑袋」→「指标驱动」；网格搜索是初版最直观的方案；无编译器下经受管 Python 验证 5/5 + C++ 控制流镜像 5/5 PASS。</text>
</svg>
