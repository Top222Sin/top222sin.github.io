<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2 IMC / λ 整定（一个旋钮 λ 直接设定闭环带宽）</text>

  <!-- IMC 结构 -->
  <text x="20" y="56" font-size="12" fill="#555">① IMC 控制器 C=(Ts+1)/(K(λs+1))；完美模型下闭环 Y/R=1/(λs+1)，时间常数 TC=λ</text>
  <g transform="translate(30,72)" font-size="10">
    <rect x="0" y="40" width="34" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="17" y="55" fill="#3730a3" text-anchor="middle">r</text>
    <line x1="34" y1="51" x2="60" y2="51" stroke="#444"/>
    <circle cx="70" cy="51" r="11" fill="#fff" stroke="#444"/>
    <text x="70" y="55" text-anchor="middle" fill="#222">Σ</text>
    <line x1="81" y1="51" x2="116" y2="51" stroke="#444"/>
    <rect x="116" y="40" width="70" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="151" y="55" fill="#92400e" text-anchor="middle">C=(Ts+1)/(K(λs+1))</text>
    <line x1="186" y1="51" x2="216" y2="51" stroke="#444"/>
    <rect x="216" y="40" width="80" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="256" y="55" fill="#065f46" text-anchor="middle">Gp=K/(Ts+1)</text>
    <line x1="296" y1="51" x2="326" y2="51" stroke="#444"/>
    <text x="332" y="55" font-size="10" fill="#333">y</text>
    <!-- 反馈 -->
    <line x1="326" y1="51" x2="326" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="326" y1="92" x2="70" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="70" y1="92" x2="70" y2="62" stroke="#bbb" stroke-dasharray="4"/>
    <!-- λ 旋钮 -->
    <rect x="116" y="100" width="190" height="20" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="211" y="114" fill="#5b21b6" text-anchor="middle">滤波器 F=1/(λs+1)  ← λ 是唯一调参旋钮</text>
    <text x="430" y="40" font-size="10" fill="#7c3aed">模型 Gm=Gp</text>
    <line x1="256" y1="62" x2="256" y2="150" stroke="#059669" stroke-dasharray="3"/>
    <line x1="256" y1="150" x2="326" y2="150" stroke="#059669" stroke-dasharray="3"/>
    <line x1="326" y1="150" x2="326" y2="92" stroke="#059669" stroke-dasharray="3"/>
    <rect x="360" y="140" width="120" height="20" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="420" y="154" fill="#065f46" text-anchor="middle">Gm 反馈支路</text>
  </g>

  <!-- λ vs 调节时间 表 -->
  <text x="20" y="196" font-size="12" fill="#555">② 验证：对象 K=1,T=2；IMC 增益 Kc=2/λ, Ki=1/λ；闭环 TC=λ 可预测</text>
  <g transform="translate(40,206)" font-size="11">
    <rect x="0" y="0" width="600" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="12" y="22" fill="#0f172a">λ = 1.0 → 调节 3.92s（≈3.912λ）   末值 1.0000（稳态误差≈0）</text>
    <text x="12" y="42" fill="#0f172a">λ = 2.0 → 调节 7.88s（≈7.824λ）    末值 0.9999</text>
    <text x="12" y="62" fill="#0f172a">λ = 4.0 → 调节 15.70s（≈15.65λ）   末值 0.9931</text>
  </g>

  <!-- 鲁棒性 -->
  <g transform="translate(40,288)" font-size="11">
    <rect x="0" y="0" width="600" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="12" y="20" fill="#713f12">鲁棒性：对象增益失配 K=1.5（模型 K=1）时仍零稳态误差，有效 TC=λ/K_actual=2/1.5→实测 5.24s（理论 5.22s）</text>
  </g>

  <text x="20" y="326" font-size="11" fill="#666">要点：IMC 从模型正推控制器，λ 直接等于你想要的闭环时间常数——比 Z-N 更可解释、可直接设带宽。λ 小=快但敏感，λ 大=慢但鲁棒。滤波器阶数需使 C 真分式（高阶对象配 1/(λs+1)^r）。</text>
</svg>
