<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.2 PID 三项（P/I/D）的物理意义</text>

  <!-- 左：三项各自的角色 -->
  <text x="20" y="58" font-size="12" fill="#555">① 三项各自的角色（trade-off：不是越大越好）</text>
  <g transform="translate(30,80)" font-size="11">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="10" y="20" fill="#1e40af" font-weight="bold">P 比例</text>
    <text x="10" y="34" fill="#1e40af" font-size="10">响应快，但必有稳态余差</text>
    <rect x="0" y="54" width="120" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="10" y="74" fill="#92400e" font-weight="bold">I 积分</text>
    <text x="10" y="88" fill="#92400e" font-size="10">消余差，却引入超调/振荡</text>
    <rect x="0" y="108" width="120" height="40" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="10" y="128" fill="#065f46" font-weight="bold">D 微分</text>
    <text x="10" y="142" fill="#065f46" font-size="10">阻尼抑超调，放大噪声</text>
    <!-- 汇聚到权衡 -->
    <line x1="120" y1="20" x2="180" y2="74" stroke="#64748b"/>
    <line x1="120" y1="74" x2="180" y2="74" stroke="#64748b"/>
    <line x1="120" y1="128" x2="180" y2="74" stroke="#64748b"/>
    <circle cx="186" cy="74" r="20" fill="#f1f5f9" stroke="#475569"/>
    <text x="186" y="70" fill="#334155" font-size="9" text-anchor="middle">权衡</text>
    <text x="186" y="82" fill="#334155" font-size="9" text-anchor="middle">Trade-off</text>
  </g>

  <!-- 右：P / PI / PID 阶跃响应 -->
  <text x="360" y="58" font-size="12" fill="#555">② 同一 plant 下 P（有余差）/ PI（超调）/ PID（抑超调）</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <!-- setpoint r=1 -->
    <line x1="0" y1="20" x2="300" y2="20" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="24" font-size="10" fill="#777">r=1</text>
    <!-- P 停在 0.667 -->
    <polyline fill="none" stroke="#2563eb" stroke-width="2.4"
      points="0,135 15,75 30,62 45,59 60,58 90,58 300,58"/>
    <!-- PI 超调 -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.4"
      points="0,135 15,66 30,26 45,6 60,14 75,20 300,20"/>
    <!-- PID 抑超调 -->
    <polyline fill="none" stroke="#059669" stroke-width="2.4"
      points="0,135 15,49 30,20 36,15 45,20 300,20"/>
    <text x="6" y="158" font-size="10" fill="#2563eb">■ P（余差~0.33）</text>
    <text x="130" y="158" font-size="10" fill="#dc2626">■ PI（超调）</text>
    <text x="210" y="158" font-size="10" fill="#059669">■ PID（抑超调）</text>
    <text x="250" y="158" font-size="10" fill="#777">t(s)→</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：P 留稳态余差（type-0 系统必有），I 把余差磨到 0 却带来超调，D 提供阻尼压住超调。三者是权衡而非叠加就更好。</text>
</svg>
