<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2 Smith 预估器（把死区时间 L 移出反馈环）</text>

  <!-- 主回路 + 模型 -->
  <text x="20" y="56" font-size="12" fill="#555">① 反馈量 yf = y − ym_delayed + ym：用无滞后模型"抵消"真实滞后，控制器等效面对无滞后对象</text>
  <g transform="translate(30,72)" font-size="10">
    <rect x="0" y="40" width="34" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="17" y="55" fill="#3730a3" text-anchor="middle">r</text>
    <line x1="34" y1="51" x2="60" y2="51" stroke="#444"/>
    <circle cx="70" cy="51" r="11" fill="#fff" stroke="#444"/>
    <text x="70" y="55" text-anchor="middle" fill="#222">Σ</text>
    <line x1="81" y1="51" x2="116" y2="51" stroke="#444"/>
    <rect x="116" y="40" width="54" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="143" y="55" fill="#92400e" text-anchor="middle">PI</text>
    <line x1="170" y1="51" x2="210" y2="51" stroke="#444"/>
    <rect x="210" y="40" width="60" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="240" y="55" fill="#065f46" text-anchor="middle">plant 1/(Ts+1)</text>
    <line x1="270" y1="51" x2="300" y2="51" stroke="#444"/>
    <rect x="300" y="40" width="60" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="330" y="55" fill="#991b1b" text-anchor="middle">delay L</text>
    <line x1="360" y1="51" x2="390" y2="51" stroke="#444"/>
    <text x="396" y="55" font-size="10" fill="#333">y</text>
    <!-- 反馈 y → yf -->
    <line x1="390" y1="51" x2="390" y2="96" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="390" y1="96" x2="70" y2="96" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="70" y1="96" x2="70" y2="62" stroke="#bbb" stroke-dasharray="4"/>
    <!-- 模型支路 -->
    <text x="430" y="40" font-size="10" fill="#7c3aed">模型(无滞后)</text>
    <line x1="240" y1="51" x2="240" y2="130" stroke="#7c3aed"/>
    <rect x="430" y="120" width="120" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="490" y="140" fill="#5b21b6" text-anchor="middle">ym = 1/(Ts+1)·u</text>
    <text x="490" y="156" fill="#7c3aed" text-anchor="middle">ym_delayed = ym@(t−L)</text>
    <text x="490" y="172" fill="#5b21b6" text-anchor="middle">yf = y − ym_delayed + ym</text>
    <line x1="430" y1="149" x2="116" y2="149" stroke="#7c3aed" stroke-dasharray="3"/>
    <line x1="430" y1="149" x2="116" y2="51" stroke="#7c3aed" stroke-dasharray="3"/>
  </g>

  <!-- 关键数字 -->
  <text x="20" y="208" font-size="12" fill="#555">② 同样激进增益 Kp=1.6, Ki=0.8，对象 K=1,T=2,L=4（死区&gt;对象常数）</text>
  <g transform="translate(40,216)" font-size="11">
    <rect x="0" y="0" width="300" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="12" y="22" fill="#7f1d1d">• 普通 PI（同增益）：超调 63614%</text>
    <text x="12" y="42" fill="#7f1d1d">• 末值 637 → 死区在环内直接发散</text>
    <rect x="320" y="0" width="300" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="332" y="22" fill="#14532d">• Smith（同增益）：超调 0%，末值 1.00</text>
    <text x="332" y="42" fill="#14532d">• 调节 24.55s；模型略失配 Lm=3.5→22.05s</text>
  </g>

  <text x="20" y="304" font-size="11" fill="#666">要点：Smith 把 L 从反馈环移到"传输延迟"（只平移响应、不毁稳定性）。代价是高度依赖模型精度——模型失配是头号天敌。普通 PI 在带滞后对象上被迫用小增益→巨慢；Smith 让你用无滞后模型对应的激进增益。</text>
</svg>
