<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.2 鲁棒与抗扰（扰动前馈 / DOB）⭐</text>

  <!-- 左：plant + 扰动注入 -->
  <text x="20" y="56" font-size="12" fill="#555">① plant x' = −x + u + d（d 为未知扰动）</text>
  <g transform="translate(30,70)" font-size="10">
    <rect x="0" y="40" width="34" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="17" y="55" fill="#3730a3" text-anchor="middle">r</text>
    <line x1="34" y1="51" x2="60" y2="51" stroke="#444"/>
    <circle cx="70" cy="51" r="11" fill="#fff" stroke="#444"/>
    <text x="70" y="55" text-anchor="middle" fill="#222">Σ</text>
    <line x1="81" y1="51" x2="116" y2="51" stroke="#444"/>
    <rect x="116" y="40" width="60" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="146" y="55" fill="#92400e" text-anchor="middle">PID+u_ff</text>
    <line x1="176" y1="51" x2="210" y2="51" stroke="#444"/>
    <rect x="210" y="40" width="70" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="245" y="55" fill="#065f46" text-anchor="middle">plant 1/(s+1)</text>
    <line x1="280" y1="51" x2="310" y2="51" stroke="#444"/>
    <text x="316" y="55" font-size="10" fill="#333">x</text>
    <!-- 扰动 -->
    <text x="232" y="22" font-size="10" fill="#dc2626">d</text>
    <line x1="245" y1="26" x2="245" y2="40" stroke="#dc2626"/>
    <!-- 反馈 -->
    <line x1="310" y1="51" x2="310" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="310" y1="92" x2="70" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="70" y1="92" x2="70" y2="62" stroke="#bbb" stroke-dasharray="4"/>
    <!-- DOB -->
    <rect x="116" y="100" width="150" height="20" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="191" y="114" fill="#5b21b6" text-anchor="middle">DOB: d_hat=LPF(x'+x−u)</text>
    <line x1="245" y1="100" x2="245" y2="62" stroke="#7c3aed" stroke-dasharray="3"/>
  </g>

  <!-- 左下：DOB 估计收敛 -->
  <text x="20" y="152" font-size="12" fill="#555">② DOB 估计 d_hat 收敛到真值 d0</text>
  <g transform="translate(30,162)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="125" x2="300" y2="125" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="125" stroke="#888"/>
    <line x1="0" y1="25" x2="300" y2="25" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="29" font-size="9" fill="#777">d0=0.5</text>
    <polyline fill="none" stroke="#7c3aed" stroke-width="2.4"
      points="0,125 75,125 110,95 150,55 200,32 300,25"/>
    <text x="6" y="142" font-size="9" fill="#7c3aed">■ d_hat(t) → 0.5（t=5s 起注入扰动）</text>
    <text x="250" y="142" font-size="9" fill="#777">t(s)→</text>
  </g>

  <!-- 右：三种抗扰响应对比 -->
  <text x="360" y="56" font-size="12" fill="#555">③ 阶跃扰动后：PID仅偏差大，FF/DOB 显著抑制</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="250" x2="300" y2="250" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="250" stroke="#888"/>
    <line x1="0" y1="70" x2="300" y2="70" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="74" font-size="9" fill="#777">r=1</text>
    <!-- PID only -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.2"
      points="0,250 15,142 30,88 45,70 60,70 75,70 90,20 105,95 120,70 150,70 180,70 210,70 240,70 300,70"/>
    <!-- FF -->
    <polyline fill="none" stroke="#059669" stroke-width="2.2"
      points="0,250 15,142 30,88 45,70 60,70 75,66 90,68 105,70 120,70 300,70"/>
    <!-- DOB -->
    <polyline fill="none" stroke="#7c3aed" stroke-width="2.2"
      points="0,250 15,142 30,88 45,70 60,70 75,75 90,72 105,70 120,70 300,70"/>
    <text x="6" y="268" font-size="9" fill="#dc2626">■ PID仅</text>
    <text x="120" y="268" font-size="9" fill="#059669">■ +完美前馈</text>
    <text x="210" y="268" font-size="9" fill="#7c3aed">■ +DOB</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：PID 仅靠积分缓慢磨回扰动（大瞬态）；扰动前馈（已知 d）直接抵消；DOB 用低通观测 d 并前馈，未知扰动下也能大幅抑制偏差，且 d_hat 收敛到真值。对应 PX4 加速度前馈/抗风扰。</text>
</svg>
