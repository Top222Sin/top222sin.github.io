<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.3 在线/自动调参系统（AutoTuner 状态机）⭐</text>

  <!-- 状态机 -->
  <g font-size="11">
    <!-- IDLE -->
    <rect x="60" y="48" width="60" height="26" rx="13" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="90" y="65" fill="#3730a3" text-anchor="middle">IDLE</text>
    <line x1="90" y1="74" x2="101" y2="100" stroke="#444"/>
    <!-- 主链 -->
    <rect x="60"  y="100" width="82" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="101" y="116" fill="#1e40af" text-anchor="middle">INIT</text>
    <text x="101" y="128" font-size="9" fill="#1e40af" text-anchor="middle">就绪</text>

    <rect x="160" y="100" width="82" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="201" y="116" fill="#1e40af" text-anchor="middle">EXCITE</text>
    <text x="201" y="128" font-size="9" fill="#1e40af" text-anchor="middle">relay 激励</text>

    <rect x="260" y="100" width="82" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="301" y="116" fill="#1e40af" text-anchor="middle">IDENTIFY</text>
    <text x="301" y="128" font-size="9" fill="#1e40af" text-anchor="middle">Ku / Pu</text>

    <rect x="360" y="100" width="82" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="401" y="116" fill="#92400e" text-anchor="middle">VERIFY</text>
    <text x="401" y="128" font-size="9" fill="#92400e" text-anchor="middle">超调/稳态误差</text>

    <rect x="460" y="100" width="82" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="501" y="116" fill="#1e40af" text-anchor="middle">SAVE</text>
    <text x="501" y="128" font-size="9" fill="#1e40af" text-anchor="middle">质量门</text>

    <rect x="560" y="100" width="82" height="34" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="601" y="116" fill="#065f46" text-anchor="middle">COMPLETE</text>
    <text x="601" y="128" font-size="9" fill="#065f46" text-anchor="middle">落库</text>

    <!-- 箭头 -->
    <line x1="142" y1="117" x2="158" y2="117" stroke="#444"/><polygon points="158,117 152,114 152,120" fill="#444"/>
    <line x1="242" y1="117" x2="258" y2="117" stroke="#444"/><polygon points="258,117 252,114 252,120" fill="#444"/>
    <line x1="342" y1="117" x2="358" y2="117" stroke="#444"/><polygon points="358,117 352,114 352,120" fill="#444"/>
    <line x1="442" y1="117" x2="458" y2="117" stroke="#444"/><polygon points="458,117 452,114 452,120" fill="#444"/>
    <line x1="542" y1="117" x2="558" y2="117" stroke="#444"/><polygon points="558,117 552,114 552,120" fill="#444"/>

    <!-- FAILED 分支 -->
    <rect x="360" y="200" width="82" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="401" y="216" fill="#991b1b" text-anchor="middle">FAILED</text>
    <text x="401" y="228" font-size="9" fill="#991b1b" text-anchor="middle">告警·拒存</text>
    <line x1="401" y1="134" x2="401" y2="198" stroke="#dc2626" stroke-dasharray="4"/>
    <polygon points="401,198 397,190 405,190" fill="#dc2626"/>
    <text x="470" y="172" font-size="9" fill="#991b1b">质量门不达标→告警</text>
  </g>

  <!-- 报告 -->
  <text x="20" y="262" font-size="12" fill="#555">运行报告：</text>
  <text x="40" y="282" font-size="11" fill="#065f46">✔ 健康 roll / pitch / yaw → 三轴 SAVED → COMPLETE（无告警）</text>
  <text x="40" y="300" font-size="11" fill="#991b1b">✘ 退化 plant（负增益/inverted）→ 闭环验证失败 → FAILED（告警并拒绝保存）</text>

  <text x="20" y="322" font-size="11" fill="#666">要点：把整定做成状态机 + 质量门 + 告警。好 plant 自动落库，坏 plant 必告警——对应 PX4 McAutotuneAttitudeControl 的 idle→…→save 状态机与辨识失败处理。</text>
</svg>
