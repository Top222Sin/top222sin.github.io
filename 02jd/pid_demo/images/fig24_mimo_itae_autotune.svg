<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 MIMO 解耦 + ITAE 自动整定：指标即偏好（IAE vs ITAE 同台）</text>

  <!-- ① 流程 + 指标切换 -->
  <text x="20" y="56" font-size="12" fill="#555">① 同一流程，仅把打分函数 IAE → ITAE</text>
  <g transform="translate(30,66)" font-size="11">
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="10" y="20" fill="#3730a3" font-weight="bold">2×2 对象 K=[[1,0.3],[0.5,1]]</text>
    <text x="10" y="38" fill="#4338ca">τ1=1, τ2=2</text>
    <text x="160" y="29" font-size="18" fill="#dc2626">→</text>
    <rect x="190" y="0" width="140" height="50" rx="6" fill="#cffafe" stroke="#0891b2"/>
    <text x="200" y="20" fill="#155e75" font-weight="bold">解耦器 D=K⁻¹</text>
    <text x="200" y="38" fill="#155e75">直流对角化</text>
    <text x="342" y="29" font-size="18" fill="#dc2626">→</text>
    <rect x="372" y="0" width="150" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="382" y="20" fill="#92400e" font-weight="bold">顺序整定 7×7 (Kp,Ki)</text>
    <text x="382" y="38" fill="#92400e">metric 可选 IAE/ITAE</text>
    <text x="534" y="29" font-size="18" fill="#dc2626">→</text>
    <rect x="564" y="0" width="100" height="50" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="574" y="20" fill="#065f46" font-weight="bold">全系统</text>
    <text x="574" y="38" fill="#065f46">对比 IAE/ITAE</text>
  </g>
  <g transform="translate(30,124)" font-size="11">
    <rect x="0" y="0" width="650" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="12" y="18" fill="#5b21b6" font-weight="bold">指标切换徽章： IAEmetric  →  ITAEmetric   （同一网格/仿真/解耦，唯一变量=指标）</text>
  </g>

  <!-- ② 最优增益对比 -->
  <text x="20" y="184" font-size="12" fill="#555">② 最优增益：换 ITAE 后整体移向「更温和」（Kp/Ki 下降）</text>
  <g transform="translate(30,194)" font-size="11">
    <rect x="0" y="0" width="320" height="86" rx="6" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="12" y="20" fill="#374151" font-weight="bold">IAE 目标最优</text>
    <text x="12" y="42" fill="#374151">回路1 (Kp=2.3, Ki=1.5)</text>
    <text x="12" y="62" fill="#374151">回路2 (Kp=2.3, Ki=1.5)</text>
    <text x="12" y="80" fill="#374151">全系统 IAE=1.4750  ITAE=1.5910</text>
    <rect x="330" y="0" width="320" height="86" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="342" y="20" fill="#14532d" font-weight="bold">ITAE 目标最优</text>
    <text x="342" y="42" fill="#14532d">回路1 (Kp=1.4, Ki=1.5)  <tspan fill="#dc2626" font-weight="bold">Kp↓ 2.3→1.4</tspan></text>
    <text x="342" y="62" fill="#14532d">回路2 (Kp=2.3, Ki=1.3)  <tspan fill="#dc2626" font-weight="bold">Ki↓ 1.5→1.3</tspan></text>
    <text x="342" y="80" fill="#14532d">全系统 IAE=1.5218  ITAE=1.2646</text>
  </g>

  <!-- ③ 指标分数 2x2 -->
  <text x="20" y="312" font-size="12" fill="#555">③ 同台打分：ITAE 整定使 ITAE 降 20.5%，代价 IAE 仅升 3.2%</text>
  <g transform="translate(190,322)" font-size="11">
    <rect x="0" y="0" width="300" height="96" rx="6" fill="#fff" stroke="#9ca3af"/>
    <rect x="0" y="0" width="120" height="24" fill="#374151"/><text x="8" y="17" fill="#fff" font-weight="bold">整定方式</text>
    <rect x="120" y="0" width="90" height="24" fill="#1d4ed8"/><text x="128" y="17" fill="#fff" font-weight="bold">全系统 IAE</text>
    <rect x="210" y="0" width="90" height="24" fill="#7c3aed"/><text x="218" y="17" fill="#fff" font-weight="bold">全系统 ITAE</text>
    <rect x="0" y="24" width="120" height="24" fill="#f1f5f9"/><text x="8" y="41" fill="#334155">IAE 整定</text>
    <text x="128" y="41" fill="#0f172a">1.4750</text><text x="218" y="41" fill="#0f172a">1.5910</text>
    <rect x="0" y="48" width="120" height="24" fill="#ecfdf5"/><text x="8" y="65" fill="#14532d">ITAE 整定</text>
    <text x="128" y="65" fill="#065f46">1.5218 (+3.2%)</text><text x="218" y="65" fill="#065f46">1.2646 (−20.5%)</text>
    <rect x="0" y="72" width="300" height="24" fill="#fef9c3"/><text x="8" y="89" fill="#713f12">结论：换指标→最优移向温和；几乎不牺牲 IAE 量</text>
  </g>

  <!-- ④ 洞见 -->
  <text x="20" y="440" font-size="12" fill="#555">④ 洞见：指标就是一句「你最在意什么」</text>
  <g transform="translate(30,448)" font-size="11">
    <rect x="0" y="0" width="650" height="22" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="12" y="15" fill="#7f1d1d">喂 IAE → 最优猛(Kp=2.3)；喂 ITAE → 最优温和(Kp=1.4)。与 L4.8 同构：「选哪个指标，最优就落哪」是数学事实。</text>
  </g>
</svg>
