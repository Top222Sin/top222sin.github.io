<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.5 抗积分饱和（Integral Windup）</text>

  <!-- 左：windup 成因 -->
  <text x="20" y="58" font-size="12" fill="#555">① 成因：饱和时积分仍在累积</text>
  <g transform="translate(30,80)">
    <rect x="0" y="10" width="90" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="45" y="32" font-size="11" fill="#1e40af" text-anchor="middle">误差 e</text>
    <rect x="110" y="10" width="90" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
    <text x="155" y="32" font-size="11" fill="#92400e" text-anchor="middle">积分器 ∫</text>
    <rect x="220" y="10" width="95" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
    <text x="267" y="30" font-size="11" fill="#991b1b" text-anchor="middle">执行器</text>
    <text x="267" y="42" font-size="10" fill="#991b1b" text-anchor="middle">限幅±uMax</text>
    <line x1="90" y1="27" x2="110" y2="27" stroke="#444"/>
    <line x1="200" y1="27" x2="220" y2="27" stroke="#444"/>
    <line x1="315" y1="27" x2="340" y2="27" stroke="#444"/>
    <text x="350" y="32" font-size="11" fill="#333">u</text>
    <text x="110" y="70" font-size="10" fill="#dc2626" text-anchor="middle">↑ 饱和期间仍累加 → 反向后大超调</text>
  </g>

  <!-- 右：响应对比 -->
  <text x="360" y="58" font-size="12" fill="#555">② 无抗饱和 vs 条件积分</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="36" font-size="10" fill="#777">r=1</text>
    <!-- 无抗饱和：大超调 -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5"
      points="0,140 20,55 40,0 62,78 92,18 120,52 160,32 230,32 300,32"/>
    <!-- 条件积分：小超调 -->
    <polyline fill="none" stroke="#059669" stroke-width="2.4"
      points="0,140 30,68 60,40 90,32 120,32 300,32"/>
    <text x="6" y="158" font-size="10" fill="#dc2626">■ 无抗饱和(大超调)</text>
    <text x="180" y="158" font-size="10" fill="#059669">■ 条件积分</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：执行器饱和时，积分器必须"冻结"（条件积分/回算），否则一旦误差反向会被积出来的大项甩出严重超调。</text>
</svg>
