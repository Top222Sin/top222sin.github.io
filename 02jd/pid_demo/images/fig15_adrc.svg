<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3 ADRC 自抗扰控制（ESO 估计总扰动并抵消）</text>

  <!-- 主回路 -->
  <text x="20" y="56" font-size="12" fill="#555">① 闭环：ESO 估计总扰动 f，控制律 u=(u0−ẑ₃)/b0 将其抵消，闭环退化为 ωc 决定的二阶理想系统</text>
  <g transform="translate(30,72)" font-size="10">
    <rect x="0" y="40" width="34" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="17" y="55" fill="#3730a3" text-anchor="middle">r</text>
    <line x1="34" y1="51" x2="60" y2="51" stroke="#444"/>
    <circle cx="70" cy="51" r="11" fill="#fff" stroke="#444"/>
    <text x="70" y="55" text-anchor="middle" fill="#222">Σ</text>
    <line x1="81" y1="51" x2="116" y2="51" stroke="#444"/>
    <rect x="116" y="40" width="80" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="156" y="55" fill="#92400e" text-anchor="middle">u0=Kp·e+Kd·ė</text>
    <line x1="196" y1="51" x2="226" y2="51" stroke="#444"/>
    <rect x="226" y="40" width="50" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="251" y="55" fill="#991b1b" text-anchor="middle">−ẑ₃ /b0</text>
    <line x1="276" y1="51" x2="306" y2="51" stroke="#444"/>
    <rect x="306" y="40" width="78" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="345" y="55" fill="#065f46" text-anchor="middle">plant y''=f+b0u</text>
    <line x1="384" y1="51" x2="414" y2="51" stroke="#444"/>
    <text x="420" y="55" font-size="10" fill="#333">y</text>
    <!-- 反馈 -->
    <line x1="414" y1="51" x2="414" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="414" y1="92" x2="70" y2="92" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="70" y1="92" x2="70" y2="62" stroke="#bbb" stroke-dasharray="4"/>
    <!-- 总扰动 f 注入 -->
    <text x="345" y="22" font-size="10" fill="#dc2626">f=−2y'−y+d(t)</text>
    <line x1="345" y1="26" x2="345" y2="40" stroke="#dc2626"/>
  </g>

  <!-- ESO 框 -->
  <text x="20" y="148" font-size="12" fill="#555">② 扩张状态观测器（线性 ESO，观测器带宽 ωo）：把 f 当第 3 个状态估计出来</text>
  <g transform="translate(60,160)" font-size="10">
    <rect x="0" y="20" width="450" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="225" y="40" fill="#5b21b6" text-anchor="middle">ESO:  ż1=ẑ2−β1·e0 ,  ż2=ẑ3−β2·e0+b0·u ,  ż3=−β3·e0   (e0=ẑ1−y)</text>
    <text x="225" y="56" fill="#7c3aed" text-anchor="middle">β1=3ωo, β2=3ωo², β3=ωo³  →  ẑ₃ 估计总扰动 f</text>
    <line x1="0" y1="43" x2="-40" y2="43" stroke="#7c3aed"/>
    <text x="-44" y="47" font-size="10" fill="#7c3aed" text-anchor="end">u,y</text>
    <line x1="450" y1="43" x2="490" y2="43" stroke="#7c3aed"/>
    <text x="494" y="47" font-size="10" fill="#7c3aed">ẑ₃ → 抵消项</text>
  </g>

  <!-- 关键数字 -->
  <text x="20" y="248" font-size="12" fill="#555">③ 验证要点（受管 Python 全 PASS）</text>
  <g transform="translate(40,256)" font-size="11">
    <rect x="0" y="0" width="300" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="12" y="22" fill="#14532d">• ESO 估计总扰动 |ẑ₃−f| = 0.0000（死准）</text>
    <text x="12" y="42" fill="#14532d">• 仅用 b0=1 跟踪 r=1，稳态误差 0.0000</text>
    <rect x="320" y="0" width="300" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="332" y="22" fill="#7f1d1d">• 斜坡扰动 d(t)=t：ADRC max|e|=0.025</text>
    <text x="332" y="42" fill="#7f1d1d">• 同条件无积分 PD  max|e|=0.328（≈13×）</text>
  </g>

  <text x="20" y="324" font-size="11" fill="#666">要点：ADRC 的"积分"来自 ESO 对总扰动的估计与抵消，故模型无关；只依赖 b0 近似正确、ωo 足够高。工业韩京清方法在电机/无人机/伺服抗未知扰动中常用。</text>
</svg>
