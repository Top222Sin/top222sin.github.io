<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.4 整定直觉（Ziegler-Nichols / 试凑）</text>

  <!-- 左：开环阶跃 + FOPDT 拟合 -->
  <text x="20" y="58" font-size="12" fill="#555">① 开环阶跃 → 拟合 FOPDT(K,T,L)</text>
  <g transform="translate(30,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="36" font-size="10" fill="#777">K=1</text>
    <!-- dead time region -->
    <rect x="0" y="0" width="20" height="140" fill="#fee2e2" opacity="0.5"/>
    <text x="2" y="158" font-size="10" fill="#b91c1c">L 死区</text>
    <!-- response: flat then S-curve -->
    <polyline fill="none" stroke="#2563eb" stroke-width="2.4"
      points="0,140 20,140 30,125 45,80 60,52 90,36 120,32 300,32"/>
    <!-- T region marker -->
    <line x1="20" y1="0" x2="20" y2="140" stroke="#059669" stroke-dasharray="3"/>
    <line x1="60" y1="0" x2="60" y2="140" stroke="#059669" stroke-dasharray="3"/>
    <text x="22" y="14" font-size="10" fill="#059669">T</text>
  </g>

  <!-- 右：整定前后闭环对比 -->
  <text x="360" y="58" font-size="12" fill="#555">② 闭环：纯P(试凑) vs Z-N PID</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#888"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="36" font-size="10" fill="#777">r=1</text>
    <!-- P-only: offset at 0.5 -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5"
      points="0,140 40,90 100,86 300,86"/>
    <!-- Z-N PID: reaches 1.0 -->
    <polyline fill="none" stroke="#059669" stroke-width="2.4"
      points="0,140 40,70 70,20 100,38 140,32 300,32"/>
    <text x="6" y="158" font-size="10" fill="#dc2626">■ 纯P (余差0.5)</text>
    <text x="200" y="158" font-size="10" fill="#059669">■ Z-N PID</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：开环阶跃读出 K/T/L → 套 Z-N 公式即得一组可用增益；对比纯 P 试凑，Z-N 自动消除稳态误差且不过度振荡。</text>
</svg>
