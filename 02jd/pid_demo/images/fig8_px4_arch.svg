<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.3 多旋翼 PID 架构解析（PX4 代码走读）⭐</text>

  <!-- 左：PX4 RateControl 结构 -->
  <text x="20" y="56" font-size="12" fill="#555">① PX4 角速率控制律（lib/rate_control）</text>
  <g transform="translate(30,72)" font-size="10">
    <rect x="0" y="54" width="40" height="24" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="20" y="70" fill="#3730a3" text-anchor="middle">e</text>
    <!-- 三路并行 -->
    <rect x="62" y="8"  width="58" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="91" y="22" fill="#1e40af" text-anchor="middle">K·P</text>
    <rect x="62" y="52" width="58" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="91" y="66" fill="#1e40af" text-anchor="middle">K·I/s</text>
    <rect x="62" y="96" width="58" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="91" y="110" fill="#1e40af" text-anchor="middle">K·D/s*</text>
    <line x1="40" y1="66" x2="62" y2="19" stroke="#444"/>
    <line x1="40" y1="66" x2="62" y2="63" stroke="#444"/>
    <line x1="40" y1="66" x2="62" y2="107" stroke="#444"/>
    <!-- summer -->
    <circle cx="150" cy="66" r="14" fill="#fff" stroke="#444"/>
    <text x="150" y="70" text-anchor="middle" fill="#222">Σ</text>
    <line x1="120" y1="19" x2="150" y2="60" stroke="#444"/>
    <line x1="120" y1="63" x2="136" y2="66" stroke="#444"/>
    <line x1="120" y1="107" x2="150" y2="72" stroke="#444"/>
    <!-- ×K -->
    <rect x="178" y="54" width="34" height="24" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="195" y="70" fill="#92400e" text-anchor="middle">×K</text>
    <!-- FF -->
    <line x1="195" y1="40" x2="195" y2="20" stroke="#059669"/>
    <text x="200" y="20" fill="#065f46">FF·rate_sp</text>
    <!-- u -->
    <rect x="226" y="54" width="34" height="24" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="243" y="70" fill="#065f46" text-anchor="middle">u</text>
    <line x1="164" y1="66" x2="178" y2="66" stroke="#444"/>
    <line x1="212" y1="66" x2="226" y2="66" stroke="#444"/>
    <!-- saturation feedback (anti-windup) -->
    <line x1="243" y1="78" x2="300" y2="78" stroke="#dc2626" stroke-dasharray="4"/>
    <line x1="300" y1="78" x2="300" y2="120" stroke="#dc2626" stroke-dasharray="4"/>
    <line x1="300" y1="120" x2="91" y2="120" stroke="#dc2626" stroke-dasharray="4"/>
    <line x1="91" y1="120" x2="91" y2="74" stroke="#dc2626" stroke-dasharray="4"/>
    <text x="250" y="94" font-size="9" fill="#991b1b">饱和反馈→冻结积分(抗windup)</text>
    <text x="62" y="128" font-size="9" fill="#888">*D 项经低通滤波</text>
  </g>

  <!-- 右：等效增益映射 -->
  <text x="360" y="56" font-size="12" fill="#555">② 并行式 ⇄ 经典 PID 增益映射</text>
  <g transform="translate(360,80)" font-size="13">
    <rect x="0" y="0" width="300" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="12" y="28" fill="#0f172a">并行式:  u = K·(P·e + I∫e + D·d) + FF·sp</text>
    <line x1="20" y1="70" x2="20" y2="150" stroke="#64748b"/>
    <line x1="280" y1="70" x2="280" y2="150" stroke="#64748b"/>
    <text x="150" y="64" fill="#475569" text-anchor="middle">↓ 展开（K 乘进去）</text>
    <rect x="0" y="100" width="300" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="12" y="128" fill="#1e40af">经典:  u = (K·P)e + (K·I)∫e + (K·D)d</text>
    <text x="12" y="170" fill="#334155">⇒ Kp = K·P ,  Ki = K·I ,  Kd = K·D</text>
    <text x="12" y="192" fill="#334155">PX4 参数: MC_ROLLRATE_{P,I,D} · K</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：PX4 用并行式 u=K·(P+I/s+sD)+FF；饱和时由 control allocator 回传标志冻结积分。本 demo 三件事：形式等价经典PID、FF 减小滞后、条件积分抗 windup。</text>
</svg>
