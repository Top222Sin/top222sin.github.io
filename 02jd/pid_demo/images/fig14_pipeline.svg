<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.4 全流程工具链（Capstone：三环串级 + 整定 + 退化告警）⭐</text>

  <!-- 左：三环串级 -->
  <text x="20" y="54" font-size="12" fill="#555">① PX4 风格三环串级（位置P→速度PID→速率PID并行式→执行器→plant）</text>
  <g transform="translate(30,64)" font-size="9">
    <text x="0" y="0" fill="#333">x_sp</text>
    <line x1="34" y1="-4" x2="58" y2="-4" stroke="#444"/>
    <circle cx="64" cy="-4" r="11" fill="#fff" stroke="#444"/>
    <text x="64" y="0" text-anchor="middle" fill="#222">Σ</text>
    <line x1="75" y1="-4" x2="96" y2="-4" stroke="#444"/>
    <rect x="96" y="-16" width="96" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="144" y="-2" fill="#1e40af" text-anchor="middle">P·Kpx (限幅vmax)</text>
    <line x1="192" y1="-4" x2="210" y2="-4" stroke="#444"/>
    <text x="214" y="-1" fill="#333">v_sp</text>
    <line x1="214" y1="-4" x2="214" y2="34" stroke="#444"/>
    <circle cx="230" cy="34" r="11" fill="#fff" stroke="#444"/>
    <text x="230" y="38" text-anchor="middle" fill="#222">Σ</text>
    <line x1="241" y1="34" x2="262" y2="34" stroke="#444"/>
    <rect x="262" y="22" width="96" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="310" y="36" fill="#1e40af" text-anchor="middle">PID_v (Kpv/Iv/Dv)</text>
    <line x1="358" y1="34" x2="376" y2="34" stroke="#444"/>
    <text x="380" y="37" fill="#333">a_sp</text>
    <line x1="380" y1="34" x2="380" y2="70" stroke="#444"/>
    <circle cx="396" cy="70" r="11" fill="#fff" stroke="#444"/>
    <text x="396" y="74" text-anchor="middle" fill="#222">Σ</text>
    <line x1="407" y1="70" x2="428" y2="70" stroke="#444"/>
    <rect x="428" y="58" width="120" height="24" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="488" y="74" fill="#3730a3" text-anchor="middle">PID_a 并行 K·(P+I/s+sD)+FF</text>
    <line x1="548" y1="70" x2="566" y2="70" stroke="#444"/>
    <text x="570" y="73" fill="#333">u</text>
    <line x1="570" y1="70" x2="570" y2="106" stroke="#444"/>
    <rect x="500" y="106" width="140" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="570" y="120" fill="#92400e" text-anchor="middle">执行器 1/(τs+1)</text>
    <line x1="570" y1="128" x2="570" y2="150" stroke="#444"/>
    <rect x="520" y="150" width="100" height="22" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="570" y="164" fill="#065f46" text-anchor="middle">∫∫ → x (v,a)</text>
    <!-- 反馈 -->
    <line x1="570" y1="172" x2="570" y2="250" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="570" y1="250" x2="64" y2="250" stroke="#bbb" stroke-dasharray="4"/>
    <line x1="64" y1="250" x2="64" y2="7" stroke="#bbb" stroke-dasharray="4"/>
    <rect x="20" y="244" width="60" height="16" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="50" y="256" fill="#991b1b" text-anchor="middle" font-size="8">sensor</text>
  </g>
  <!-- 退化注入 + 告警 -->
  <g font-size="9">
    <line x1="120" y1="250" x2="120" y2="276" stroke="#dc2626" stroke-dasharray="3"/>
    <text x="126" y="280" fill="#991b1b">退化注入</text>
    <rect x="200" y="270" width="120" height="20" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="260" y="284" fill="#991b1b" text-anchor="middle">ALARM：拒绝带病运行</text>
  </g>

  <!-- 右：端到端响应 -->
  <text x="360" y="54" font-size="12" fill="#555">② 端到端阶跃：健康收敛到设定值，退化发散告警</text>
  <g transform="translate(360,80)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#ccc"/>
    <line x1="0" y1="250" x2="300" y2="250" stroke="#888"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#888"/>
    <line x1="300" y1="0" x2="300" y2="250" stroke="#888"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#999" stroke-dasharray="5"/>
    <text x="306" y="84" font-size="9" fill="#777">x_sp=1</text>
    <!-- 健康 -->
    <polyline fill="none" stroke="#059669" stroke-width="2.4"
      points="0,250 30,150 60,95 90,82 120,80 180,80 240,80 300,80"/>
    <!-- 退化发散 -->
    <polyline fill="none" stroke="#dc2626" stroke-width="2.4"
      points="0,250 30,150 60,70 90,20 110,5"/>
    <text x="120" y="22" font-size="9" fill="#991b1b">x→∞ 发散</text>
    <text x="6" y="268" font-size="9" fill="#059669">■ 健康（收敛、无稳态误差）</text>
    <text x="190" y="268" font-size="9" fill="#dc2626">■ 退化（告警）</text>
  </g>

  <text x="20" y="320" font-size="11" fill="#666">要点：位置→速度→速率三环串级复刻 PX4 PositionControl+RateControl；内环用 relay 辨识 + 解析 FOPDT 真值交叉校验后自动整定；传感器翻转/模型失配等退化注入会触发告警，拒绝带病运行。</text>
</svg>
