<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- L4 BF16/FP16 NEON：转换舍入 / 三指令语义 / 精度谱有序 / 低精三档落点 -->
  <rect width="680" height="300" fill="#f7f8fa"/>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">L4 BF16/FP16 NEON · FMLAL / BFMMLA 与精度谱</text>
  <line x1="20" y1="32" x2="660" y2="32" stroke="#d1d5db" stroke-width="1"/>

  <!-- Panel 1: 转换舍入 -->
  <rect x="20" y="42" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="42" width="310" height="24" rx="8" fill="#1d4ed8"/>
  <rect x="20" y="58" width="310" height="8" fill="#1d4ed8"/>
  <text x="32" y="59" font-size="12" font-weight="700" fill="#ffffff">① 转换舍入（RNE，累加器统一 fp32）</text>
  <g font-size="11" fill="#374151">
    <text x="32" y="86">BF16: 1+8+7（同指数位→动态范围≈FP32）</text>
    <text x="32" y="102">FP16: 1+5+10（精度高，动态范围小）</text>
    <text x="32" y="118">bf16(1.0625)=精确(1/16)；fp16(0.1)=0x2E66</text>
    <text x="32" y="134">fp16(65504)=最大正规数；1e30→Inf(0x7C00)</text>
    <text x="32" y="150" fill="#9ca3af">累加器统一 fp32（防低精累加爆炸）</text>
  </g>

  <!-- Panel 2: 三指令语义 -->
  <rect x="350" y="42" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="350" y="42" width="310" height="24" rx="8" fill="#7c3aed"/>
  <rect x="350" y="58" width="310" height="8" fill="#7c3aed"/>
  <text x="362" y="59" font-size="12" font-weight="700" fill="#ffffff">② 三指令语义</text>
  <g transform="translate(362,72)" font-size="11">
    <rect x="0" y="0" width="286" height="22" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="6" y="15" fill="#5b21b6">BFMMLA: 2x4 bf16 × 4x2 bf16 → 2x2 fp32</text>
    <rect x="0" y="26" width="286" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="6" y="41" fill="#5b21b6">FMLAL: fp16 向量(8) → fp32 长点积累加</text>
    <rect x="0" y="52" width="286" height="22" rx="4" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="6" y="67" fill="#5b21b6">vaddq_f16: 4 路 fp16 逐元素加</text>
  </g>

  <!-- Panel 3: 精度谱有序 -->
  <rect x="20" y="168" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="168" width="310" height="24" rx="8" fill="#b45309"/>
  <rect x="20" y="184" width="310" height="8" fill="#b45309"/>
  <text x="32" y="185" font-size="12" font-weight="700" fill="#ffffff">③ 精度谱有序：fp16 ≤ bf16 ≤ int8</text>
  <!-- 条形图 -->
  <g transform="translate(32,206)" font-size="10" fill="#92400e">
    <text x="0" y="10">fp16</text>
    <rect x="34" y="2" width="30" height="10" fill="#fcd34d" stroke="#b45309"/>
    <text x="70" y="11">3.47e-4</text>
    <text x="0" y="28">bf16</text>
    <rect x="34" y="20" width="78" height="10" fill="#fbbf24" stroke="#b45309"/>
    <text x="118" y="29">3.33e-3</text>
    <text x="0" y="46">int8</text>
    <rect x="34" y="38" width="120" height="10" fill="#f59e0b" stroke="#b45309"/>
    <text x="160" y="47">8.80e-3</text>
    <text x="0" y="68" fill="#9ca3af">尾数位越多 → 误差越小</text>
  </g>

  <!-- Panel 4: 低精三档落点 -->
  <rect x="350" y="168" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="350" y="168" width="310" height="24" rx="8" fill="#0d9488"/>
  <rect x="350" y="184" width="310" height="8" fill="#0d9488"/>
  <text x="362" y="185" font-size="12" font-weight="700" fill="#ffffff">④ 低精三档落点 / 互引</text>
  <g font-size="10.5" fill="#374151">
    <text x="362" y="208">承接 neon_l2_int8_gemm → 共组低精三档</text>
    <text x="362" y="224">(int8 / bf16 / fp16)</text>
    <text x="362" y="242">SME2 互引: neon_l4_sme2 bmopa =</text>
    <text x="362" y="256">  BFMMLA 的「外积版」（同 bf16→fp32）</text>
    <text x="362" y="272" fill="#9ca3af">后端: NCNN gemm_int8.h / MNN KleidiAI bf16 档</text>
  </g>
</svg>
