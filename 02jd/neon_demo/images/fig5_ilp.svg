<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#fbfcfe"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#1f2933">图二：单累加器(延迟受限) vs 8 累加器(喂满双 NEON 管)</text>

  <!-- 单累加器 -->
  <text x="20" y="56" font-weight="bold" fill="#b45309">单累加器 · 1 条依赖链（A76: FMLA 延迟 4）</text>
  <rect x="20" y="66" width="630" height="26" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="26" y="84" fill="#64748b">周期:</text>
  <g fill="#fbbf24" stroke="#d6b656">
    <rect x="80" y="68" width="44" height="22"/><rect x="248" y="68" width="44" height="22"/><rect x="416" y="68" width="44" height="22"/>
  </g>
  <text x="92" y="84" fill="#7c4a03">fmla</text><text x="260" y="84" fill="#7c4a03">fmla</text><text x="428" y="84" fill="#7c4a03">fmla</text>
  <text x="26" y="110" fill="#94a3b8">↑ 每 4 周期才发一条，NEON1 端口全程空转</text>

  <!-- 双 NEON 管示意 -->
  <text x="20" y="150" font-weight="bold" fill="#166534">8 累加器 · 多独立链（每周期 2 条 fmla 喂满双管）</text>
  <rect x="20" y="160" width="630" height="26" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="26" y="178" fill="#1e40af">NEON0:</text>
  <g fill="#60a5fa" stroke="#3b82f6">
    <rect x="92" y="162" width="30" height="22"/><rect x="156" y="162" width="30" height="22"/><rect x="220" y="162" width="30" height="22"/><rect x="284" y="162" width="30" height="22"/><rect x="348" y="162" width="30" height="22"/>
  </g>
  <text x="92" y="178" fill="#fff">a0</text><text x="156" y="178" fill="#fff">a2</text><text x="220" y="178" fill="#fff">a4</text><text x="284" y="178" fill="#fff">a6</text><text x="348" y="178" fill="#fff">a..</text>
  <rect x="20" y="190" width="630" height="26" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="26" y="208" fill="#1e40af">NEON1:</text>
  <g fill="#34d399" stroke="#10b981">
    <rect x="124" y="192" width="30" height="22"/><rect x="188" y="192" width="30" height="22"/><rect x="252" y="192" width="30" height="22"/><rect x="316" y="192" width="30" height="22"/><rect x="380" y="192" width="30" height="22"/>
  </g>
  <text x="124" y="208" fill="#fff">a1</text><text x="188" y="208" fill="#fff">a3</text><text x="252" y="208" fill="#fff">a5</text><text x="316" y="208" fill="#fff">a7</text><text x="380" y="208" fill="#fff">a..</text>
  <text x="26" y="238" fill="#94a3b8">↑ a0..a7 互相独立，每周期 2 条 fmla 同时飞，延迟被完全掩盖</text>
  <text x="26" y="262" font-weight="bold" fill="#0f766e">结论：ILP 深度 ≥ 端口数 → 摸到吞吐上限；否则被延迟链卡在 1/延迟。</text>
</svg>
