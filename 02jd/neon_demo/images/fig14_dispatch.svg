<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图四：三路分发 —— HWCAP 决定走 NEON / 基础 SVE(V1) / SVE2</text>

  <rect x="240" y="36" width="200" height="38" rx="6" fill="#fff" stroke="#475569"/>
  <text x="340" y="60" fill="#334155" text-anchor="middle">getauxval(AT_HWCAP/2)</text>

  <defs><marker id="dm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker></defs>
  <line x1="280" y1="74" x2="130" y2="118" stroke="#475569" stroke-width="1.6" marker-end="url(#dm)"/>
  <line x1="340" y1="74" x2="340" y2="118" stroke="#475569" stroke-width="1.6" marker-end="url(#dm)"/>
  <line x1="400" y1="74" x2="550" y2="118" stroke="#475569" stroke-width="1.6" marker-end="url(#dm)"/>

  <text x="130" y="112" fill="#b91c1c" text-anchor="middle">皆无 SVE</text>
  <text x="340" y="112" fill="#0891b2" text-anchor="middle">HWCAP_SVE（非 SVE2）</text>
  <text x="550" y="112" fill="#047857" text-anchor="middle">HWCAP2_SVE2</text>

  <rect x="40" y="124" width="180" height="120" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="130" y="150" fill="#9a3412" font-weight="bold" text-anchor="middle">NEON 内核</text>
  <text x="130" y="176" fill="#7c2d12" text-anchor="middle">A76 / A78 / X1</text>
  <text x="130" y="200" fill="#7c2d12" text-anchor="middle">-march=armv8-a+simd</text>
  <text x="130" y="224" fill="#7c2d12" text-anchor="middle">固定 128-bit，逐代手写</text>

  <rect x="250" y="124" width="180" height="120" rx="6" fill="#e0f2fe" stroke="#0891b2"/>
  <text x="340" y="150" fill="#0e7490" font-weight="bold" text-anchor="middle">基础 SVE 内核</text>
  <text x="340" y="176" fill="#155e75" text-anchor="middle">Neoverse-V1（VL=8）</text>
  <text x="340" y="200" fill="#155e75" text-anchor="middle">-march=armv8.4-a+sve</text>
  <text x="340" y="224" fill="#155e75" text-anchor="middle">FP32 VLA 同份内核</text>

  <rect x="460" y="124" width="180" height="120" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="550" y="150" fill="#065f46" font-weight="bold" text-anchor="middle">SVE2 内核</text>
  <text x="550" y="176" fill="#065f46" text-anchor="middle">X2 / V2 / X4 / N2</text>
  <text x="550" y="200" fill="#065f46" text-anchor="middle">-march=armv9-a+sve2</text>
  <text x="550" y="224" fill="#065f46" text-anchor="middle">同份 FP32 + 额外 svdot</text>
</svg>
