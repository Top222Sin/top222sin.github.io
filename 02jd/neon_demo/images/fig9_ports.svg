<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图三：累加器数 → 喂满端口（A76 双管 / X1 四管）</text>
  <text x="20" y="50" font-weight="bold" fill="#166534">A76：双 NEON 管（每周期 2 条 fmla 上限）</text>
  <text x="20" y="72" fill="#b45309">4x4（4 acc）→ 1/cyc，1 个管空转：</text>
  <rect x="20" y="80" width="320" height="22" fill="#fff" stroke="#e2e8f0"/>
  <rect x="28" y="82" width="40" height="18" fill="#fbbf24"/>
  <rect x="196" y="82" width="40" height="18" fill="#fbbf24"/>
  <text x="360" y="96" fill="#94a3b8">每 4 周期才 1 条飞行</text>
  <text x="20" y="130" fill="#166534">8x4（8 acc）→ 2/cyc，双管全满：</text>
  <rect x="20" y="138" width="320" height="22" fill="#fff" stroke="#e2e8f0"/>
  <g fill="#34d399">
    <rect x="28" y="140" width="40" height="18"/><rect x="76" y="140" width="40" height="18"/>
    <rect x="124" y="140" width="40" height="18"/><rect x="172" y="140" width="40" height="18"/>
  </g>
  <g fill="#60a5fa">
    <rect x="48" y="164" width="40" height="18"/><rect x="96" y="164" width="40" height="18"/>
    <rect x="144" y="164" width="40" height="18"/><rect x="192" y="164" width="40" height="18"/>
  </g>
  <text x="360" y="170" fill="#166534">每周期 2 条飞行 → 满峰值</text>
  <text x="20" y="220" font-weight="bold" fill="#7c3aed">X1：四 NEON 管（每周期 4 条 fmla 上限）</text>
  <text x="20" y="242" fill="#64748b">8x4 只喂满一半；需 16x4（16 acc）才摸满四管：</text>
  <rect x="20" y="250" width="340" height="22" fill="#fff" stroke="#e2e8f0"/>
  <g fill="#a78bfa">
    <rect x="28" y="252" width="28" height="18"/><rect x="64" y="252" width="28" height="18"/><rect x="100" y="252" width="28" height="18"/><rect x="136" y="252" width="28" height="18"/>
    <rect x="172" y="252" width="28" height="18"/><rect x="208" y="252" width="28" height="18"/><rect x="244" y="252" width="28" height="18"/><rect x="280" y="252" width="28" height="18"/>
  </g>
  <text x="370" y="266" fill="#7c3aed">16/4 = 4/cyc → 满 X1 峰值</text>
</svg>
