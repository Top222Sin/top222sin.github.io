<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#111">延迟 4 周期 · 吞吐 2/周期 下的调度对比</text>

  <!-- left panel -->
  <text x="20" y="62" font-size="13" font-weight="700" fill="#b3242b">左：只有 1 个累加器 → 依赖链空转</text>
  <line x1="20" y1="92" x2="320" y2="92" stroke="#bbb" stroke-width="1"/>
  <text x="20" y="86" font-size="10" fill="#888">时间 →  每格 1 周期</text>
  <!-- sdot boxes with gaps -->
  <rect x="20"  y="100" width="34" height="26" rx="3" fill="#e0585e"/><text x="37" y="117" font-size="10" fill="#fff" text-anchor="middle">s0</text>
  <rect x="170" y="100" width="34" height="26" rx="3" fill="#e0585e"/><text x="187" y="117" font-size="10" fill="#fff" text-anchor="middle">s1</text>
  <rect x="320" y="100" width="34" height="26" rx="3" fill="#e0585e"/><text x="337" y="117" font-size="10" fill="#fff" text-anchor="middle">s2</text>
  <!-- stall marks -->
  <rect x="54"  y="100" width="116" height="26" rx="3" fill="#fbe3e4" stroke="#f0b6b8" stroke-dasharray="3 3"/>
  <rect x="204" y="100" width="116" height="26" rx="3" fill="#fbe3e4" stroke="#f0b6b8" stroke-dasharray="3 3"/>
  <text x="112" y="117" font-size="9" fill="#c0434a" text-anchor="middle">停顿 ×4</text>
  <text x="262" y="117" font-size="9" fill="#c0434a" text-anchor="middle">停顿 ×4</text>
  <text x="20" y="150" font-size="11.5" fill="#7a1f24">每条 sdot 必须等前一条结果（4 周期）→ 吞吐压到 0.25×</text>

  <!-- right panel -->
  <text x="360" y="62" font-size="13" font-weight="700" fill="#1d7a3a">右：16 个累加器 → 流水填满</text>
  <line x1="360" y1="92" x2="660" y2="92" stroke="#bbb" stroke-width="1"/>
  <text x="360" y="86" font-size="10" fill="#888">时间 →  每 0.5 周期发一条</text>
  <!-- dense stream of 16 sdot, two rows to show overlap -->
  <g font-size="9" fill="#fff" text-anchor="middle">
    <rect x="360" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="370" y="115">s0</text>
    <rect x="372" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="382" y="115">s1</text>
    <rect x="384" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="394" y="115">s2</text>
    <rect x="396" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="406" y="115">s3</text>
    <rect x="408" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="418" y="115">s4</text>
    <rect x="420" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="430" y="115">s5</text>
    <rect x="432" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="442" y="115">s6</text>
    <rect x="444" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="454" y="115">s7</text>
    <rect x="456" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="466" y="115">s8</text>
    <rect x="468" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="478" y="115">s9</text>
    <rect x="480" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="490" y="115">s10</text>
    <rect x="492" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="502" y="115">s11</text>
    <rect x="504" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="514" y="115">s12</text>
    <rect x="516" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="526" y="115">s13</text>
    <rect x="528" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="538" y="115">s14</text>
    <rect x="540" y="100" width="20" height="22" rx="3" fill="#34a853"/><text x="550" y="115">s15</text>
  </g>
  <text x="360" y="150" font-size="11.5" fill="#155f2c">16 条 sdot 互不依赖，v16 结果还在飞行中，后面 15 条已排队发射 → 吞吐拉满</text>

  <rect x="20" y="300" width="640" height="58" rx="8" fill="#eef7f0" stroke="#9fd3ad"/>
  <text x="34" y="322" font-size="12.5" fill="#155f2c" font-weight="700">累加器的数量 = ILP 深度 = 你能重叠多少条独立指令来掩盖延迟</text>
  <text x="34" y="342" font-size="12" fill="#155f2c">低于这个数，内核就在空转等数据。ncnn int8 用 16 个、fp32 用 8 个，正是这个权衡。</text>
</svg>