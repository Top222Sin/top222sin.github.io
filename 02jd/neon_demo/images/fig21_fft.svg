<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <rect width="680" height="240" fill="#fbfdff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1a2b4a">图三 · FFT 蝶形 + NEON（复数 SoA 存法）</text>
  <g font-size="11" fill="#22324f">
    <rect x="40" y="60" width="120" height="60" rx="6" fill="#e8f1ff" stroke="#3b82f6"/>
    <text x="100" y="84" text-anchor="middle" font-weight="bold">复数 SoA</text>
    <text x="100" y="102" text-anchor="middle">re[] / im[]</text>
    <text x="100" y="118" text-anchor="middle">(各 4 路并载)</text>
    <rect x="220" y="60" width="160" height="60" rx="6" fill="#fff4e6" stroke="#f59e0b"/>
    <text x="300" y="82" text-anchor="middle" font-weight="bold">一只蝶形（×4 路）</text>
    <text x="300" y="100" text-anchor="middle">tr=br·wr−bi·wi</text>
    <text x="300" y="116" text-anchor="middle">ti=br·wi+bi·wr</text>
    <rect x="430" y="60" width="180" height="60" rx="6" fill="#eafaf0" stroke="#22c55e"/>
    <text x="520" y="82" text-anchor="middle" font-weight="bold">NEON 指令映射</text>
    <text x="520" y="100" text-anchor="middle">vmulq / vsubq / vaddq</text>
    <text x="520" y="116" text-anchor="middle">vld1q 取 4 实部+4 虚部</text>
  </g>
  <text x="20" y="155" font-size="11" fill="#445">迭代：位反转重排 → 逐级(len=2,4,8…)蝶形；每级 twiddle = e^(−2πi/len)</text>
  <text x="20" y="178" font-size="11" fill="#445">SVE2 对照（L3 第五部分）：svld2 拆交织复数 → 同理，但向量长度随核自适应、谓词掩尾部</text>
  <text x="20" y="205" font-size="11" fill="#b45309">落点：语音/音频前处理、频域滤波、可分离卷积频域加速；MNN/kai 含 FFT 类 ukernel</text>
  <g stroke="#94a3b8" stroke-dasharray="3">
    <line x1="160" y1="90" x2="220" y2="90"/><line x1="380" y1="90" x2="430" y2="90"/>
  </g>
</svg>
