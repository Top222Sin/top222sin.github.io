<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="320" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图一：GEMM 分块 + 打包几何（C 切 MR×NR，K 切 KC，B 打包成连续面板）</text>
  <rect x="30" y="50" width="180" height="180" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="44" fill="#334155" text-anchor="middle">C [M × N]</text>
  <g stroke="#cbd5e1">
    <line x1="30" y1="110" x2="210" y2="110"/><line x1="30" y1="170" x2="210" y2="170"/>
    <line x1="90" y1="50" x2="90" y2="230"/><line x1="150" y1="50" x2="150" y2="230"/>
  </g>
  <rect x="150" y="170" width="60" height="60" fill="#fde68a" stroke="#d6b656"/>
  <text x="180" y="205" fill="#7c4a03" text-anchor="middle">MR×NR</text>
  <rect x="260" y="50" width="60" height="180" fill="#ffffff" stroke="#94a3b8"/>
  <text x="290" y="44" fill="#334155" text-anchor="middle">K</text>
  <rect x="260" y="170" width="60" height="60" fill="#bbf7d0" stroke="#10b981"/>
  <text x="290" y="205" fill="#065f46" text-anchor="middle">KC</text>
  <rect x="380" y="50" width="270" height="80" rx="4" fill="#ffffff" stroke="#5b8fd6"/>
  <text x="515" y="44" fill="#334155" text-anchor="middle">B 打包面板 [KC × NR]（连续）</text>
  <g fill="#bfdbfe" stroke="#3b82f6">
    <rect x="390" y="60" width="50" height="60"/><rect x="445" y="60" width="50" height="60"/>
    <rect x="500" y="60" width="50" height="60"/><rect x="555" y="60" width="50" height="60"/>
    <rect x="610" y="60" width="32" height="60" fill="#e0e7ff"/>
  </g>
  <text x="515" y="145" fill="#1e40af" text-anchor="middle">一次 vld1q 取 4 个连续 float → 零跨步</text>
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <line x1="290" y1="170" x2="380" y2="100"/>
  </g>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="330" y="135" fill="#64748b">打包</text>
  <rect x="380" y="190" width="270" height="50" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="395" y="210" fill="#475569">微内核每步：A 连续 + Bp 连续</text>
  <text x="395" y="228" fill="#475569">→ vld1q 双载入 + 8× vmlaq（见 §四/§五）</text>
</svg>
