<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <!-- header -->
  <rect x="20"  y="20" width="310" height="40" rx="6" fill="#3a6ea5"/><text x="175" y="45" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Intrinsics（L2）</text>
  <rect x="350" y="20" width="310" height="40" rx="6" fill="#a5503a"/><text x="505" y="45" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">手写汇编（L3）</text>

  <!-- rows -->
  <g font-size="12.5" fill="#222">
    <!-- row template -->
    <text x="20" y="92"  font-weight="600">你决定什么</text>
    <text x="350" y="92" font-weight="600">你决定什么</text>
    <text x="20" y="120">只说「做什么」</text>
    <text x="350" y="120">每条指令 / 寄存器 / 周期</text>

    <text x="20" y="158" font-weight="600">寄存器</text>
    <text x="350" y="158" font-weight="600">寄存器</text>
    <text x="20" y="186">编译器分配（可能 spill）</text>
    <text x="350" y="186">你分配 + 约束钉死（"=w","2"(..)）</text>

    <text x="20" y="224" font-weight="600">指令顺序</text>
    <text x="350" y="224" font-weight="600">指令顺序</text>
    <text x="20" y="252">编译器排（保守）</text>
    <text x="350" y="252">你排（ILP / prfm 预取 / 循环尾）</text>

    <text x="20" y="290" font-weight="600">何时下沉</text>
    <text x="350" y="290" font-weight="600">何时下沉</text>
    <text x="20" y="318">大多数热点已够</text>
    <text x="350" y="318">真·热微内核（每秒上亿次）</text>
  </g>
  <rect x="20" y="330" width="640" height="20" rx="4" fill="#f3f4f6"/>
  <text x="340" y="344" font-size="11" fill="#666" text-anchor="middle">下沉 = 账单逼的，不是炫技：spill / 多余 vst / 未排好的停顿 在亿次调用下不可接受</text>
</svg>