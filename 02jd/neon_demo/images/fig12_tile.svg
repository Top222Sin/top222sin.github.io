<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图二：同一份 VLA 内核，NR 随 svcntw() 变化，MR 不变</text>
  <rect x="20" y="40" width="210" height="220" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="125" y="60" fill="#334155" font-weight="bold" text-anchor="middle">一份 SVE2 内核</text>
  <g font-size="10" fill="#475569">
    <text x="32" y="84">const int VL = svcntw();</text>
    <text x="32" y="104">for j in 0..N step VL:</text>
    <text x="32" y="124">  pg = svwhilelt(0, nr)</text>
    <text x="32" y="144">  c[0..MR] = svdup(0)</text>
    <text x="32" y="164">  for k:</text>
    <text x="32" y="184">    b = svld1(pg, B)</text>
    <text x="32" y="204">    c[r]+=svmla(pg,a,b)</text>
    <text x="32" y="224">  svst1(pg, C, c)</text>
  </g>
  <text x="125" y="252" fill="#64748b" font-size="10" text-anchor="middle">代码完全不变</text>
  <g font-size="11">
    <text x="300" y="58" fill="#334155">X2  (VL=4):</text>
    <rect x="300" y="66" width="160" height="40" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="380" y="91" fill="#1e40af">MR=8 × NR=4 累加器棋盘</text>
    <text x="300" y="128" fill="#334155">V1  (VL=8):</text>
    <rect x="300" y="136" width="280" height="40" fill="#dcfce7" stroke="#22c55e"/>
    <text x="440" y="161" fill="#166534" text-anchor="middle">MR=8 × NR=8</text>
    <text x="300" y="198" fill="#334155">X4  (VL=16):</text>
    <rect x="300" y="206" width="360" height="40" fill="#fae8ff" stroke="#c026d3"/>
    <text x="480" y="231" fill="#86198f" text-anchor="middle">MR=8 × NR=16</text>
  </g>
  <text x="480" y="270" fill="#64748b" font-size="10" text-anchor="middle">→ 列方向自适应，行方向(MR)由你定，工作集仍进 L1</text>
  <defs><marker id="bm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker></defs>
  <line x1="230" y1="150" x2="298" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#bm)"/>
</svg>
