<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="260" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图四：调优前后 perf 对比（趋势示意）</text>
  <text x="20" y="60" fill="#334155">cycles（越少越好）</text>
  <rect x="180" y="48" width="200" height="22" fill="#fecaca" stroke="#dc2626"/>
  <text x="186" y="64" fill="#7f1d1d">naive i,j,k : 高</text>
  <rect x="180" y="76" width="90" height="22" fill="#bbf7d0" stroke="#10b981"/>
  <text x="186" y="92" fill="#065f46">packed 8x4 : 低</text>
  <text x="20" y="130" fill="#334155">IPC（越高越好）</text>
  <rect x="180" y="118" width="70" height="22" fill="#fecaca" stroke="#dc2626"/>
  <text x="186" y="134" fill="#7f1d1d">naive : 低</text>
  <rect x="180" y="146" width="220" height="22" fill="#bbf7d0" stroke="#10b981"/>
  <text x="186" y="162" fill="#065f46">packed 8x4 : 高（近峰值）</text>
  <text x="20" y="200" fill="#334155">cache-misses（越少越好）</text>
  <rect x="180" y="188" width="210" height="22" fill="#fecaca" stroke="#dc2626"/>
  <text x="186" y="204" fill="#7f1d1d">naive : 高（跨步）</text>
  <rect x="180" y="216" width="80" height="22" fill="#bbf7d0" stroke="#10b981"/>
  <text x="186" y="232" fill="#065f46">packed : 低</text>
</svg>
