<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img">
  <title>一条 vmulq 一次算 4 只 FFT 蝴蝶（原理级）</title>
  <desc>复数 FFT 数据按 SoA 存放：128-bit NEON 寄存器装 4 个 float，因此一条 vmulq 同时乘 4 只独立蝴蝶的同名分量。"4" 来自 128 bit 除以 32-bit float。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#2C2C2A">图三·乙（原理级）· 一条 vmulq 一次算 4 只蝴蝶</text>
  <text x="340" y="48" text-anchor="middle" style="font-size:12px;fill:#5F5E5A">复数 SoA 存法：128-bit 每 lane = 一只蝴蝶的一个 float</text>

  <text x="40" y="74" style="font-size:12px;font-weight:500;fill:#185FA5">4 只蝴蝶（k = 0..3）</text>
  <g>
    <rect x="40" y="82" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="52" y="102" style="font-size:13px;font-weight:500;fill:#2C2C2A">蝴蝶 k = 0</text>
    <text x="52" y="120" style="font-size:12px;fill:#5F5E5A">a0, b0  w0 &#8594; A0, B0</text>
  </g>
  <g>
    <rect x="40" y="136" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="52" y="156" style="font-size:13px;font-weight:500;fill:#2C2C2A">蝴蝶 k = 1</text>
    <text x="52" y="174" style="font-size:12px;fill:#5F5E5A">a1, b1  w1 &#8594; A1, B1</text>
  </g>
  <g>
    <rect x="40" y="190" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="52" y="210" style="font-size:13px;font-weight:500;fill:#2C2C2A">蝴蝶 k = 2</text>
    <text x="52" y="228" style="font-size:12px;fill:#5F5E5A">a2, b2  w2 &#8594; A2, B2</text>
  </g>
  <g>
    <rect x="40" y="244" width="200" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="52" y="264" style="font-size:13px;font-weight:500;fill:#2C2C2A">蝴蝶 k = 3</text>
    <text x="52" y="282" style="font-size:12px;fill:#5F5E5A">a3, b3  w3 &#8594; A3, B3</text>
  </g>

  <text x="300" y="74" style="font-size:12px;font-weight:500;fill:#185FA5">SoA 打包 &#8594; 每寄存器 4 lane</text>
  <g>
    <text x="300" y="78" style="font-size:11px;fill:#185FA5">vA_re</text>
    <rect x="300" y="82" width="220" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="300" y="92" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="355" y="92" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="410" y="92" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="465" y="92" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="327" y="110" text-anchor="middle" style="font-size:12px;fill:#042C53">a0</text>
    <text x="382" y="110" text-anchor="middle" style="font-size:12px;fill:#042C53">a1</text>
    <text x="437" y="110" text-anchor="middle" style="font-size:12px;fill:#042C53">a2</text>
    <text x="492" y="110" text-anchor="middle" style="font-size:12px;fill:#042C53">a3</text>
  </g>
  <g>
    <text x="300" y="132" style="font-size:11px;fill:#185FA5">vB_re</text>
    <rect x="300" y="136" width="220" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="300" y="146" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="355" y="146" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="410" y="146" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="465" y="146" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="327" y="164" text-anchor="middle" style="font-size:12px;fill:#042C53">b0</text>
    <text x="382" y="164" text-anchor="middle" style="font-size:12px;fill:#042C53">b1</text>
    <text x="437" y="164" text-anchor="middle" style="font-size:12px;fill:#042C53">b2</text>
    <text x="492" y="164" text-anchor="middle" style="font-size:12px;fill:#042C53">b3</text>
  </g>
  <g>
    <text x="300" y="186" style="font-size:11px;fill:#185FA5">vW_re</text>
    <rect x="300" y="190" width="220" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="300" y="200" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="355" y="200" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="410" y="200" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="465" y="200" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="327" y="218" text-anchor="middle" style="font-size:12px;fill:#042C53">wr0</text>
    <text x="382" y="218" text-anchor="middle" style="font-size:12px;fill:#042C53">wr1</text>
    <text x="437" y="218" text-anchor="middle" style="font-size:12px;fill:#042C53">wr2</text>
    <text x="492" y="218" text-anchor="middle" style="font-size:12px;fill:#042C53">wr3</text>
  </g>
  <g>
    <text x="300" y="240" style="font-size:11px;fill:#185FA5">vW_im</text>
    <rect x="300" y="244" width="220" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="300" y="254" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="355" y="254" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="410" y="254" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="465" y="254" width="55" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="327" y="272" text-anchor="middle" style="font-size:12px;fill:#042C53">wi0</text>
    <text x="382" y="272" text-anchor="middle" style="font-size:12px;fill:#042C53">wi1</text>
    <text x="437" y="272" text-anchor="middle" style="font-size:12px;fill:#042C53">wi2</text>
    <text x="492" y="272" text-anchor="middle" style="font-size:12px;fill:#042C53">wi3</text>
  </g>

  <path d="M245 165 H295" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="158" text-anchor="middle" style="font-size:11px;fill:#5F5E5A">SoA</text>

  <g>
    <rect x="560" y="108" width="110" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="615" y="128" text-anchor="middle" style="font-size:13px;font-weight:500;fill:#412402">vmulq</text>
    <text x="615" y="146" text-anchor="middle" style="font-size:11px;fill:#412402">vA_re &#215; vB_re</text>
  </g>
  <path d="M520 105 C545 105, 545 131, 560 131" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520 159 C545 159, 545 131, 560 131" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="560" y="170" width="110" height="62" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="615" y="190" text-anchor="middle" style="font-size:12px;font-weight:500;fill:#173404">4 lanes</text>
    <text x="615" y="208" text-anchor="middle" style="font-size:12px;fill:#173404">a_k &#183; b_k</text>
    <text x="615" y="224" text-anchor="middle" style="font-size:11px;fill:#173404">k = 0..3</text>
  </g>
  <path d="M615 154 V170" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="312" width="630" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="52" y="332" style="font-size:12px;font-weight:500;fill:#2C2C2A">&#8220;4&#8221; 从哪来？</text>
  <text x="52" y="350" style="font-size:12px;fill:#5F5E5A">128-bit 寄存器 &#247; 32-bit float = 4 lanes。一条 vmulq/vaddq/vsubq 同时作用 4 个 float，</text>
  <text x="52" y="368" style="font-size:12px;fill:#5F5E5A">所以 4 只蝴蝶并行。完整复乘：tw = w&#183;b 需 tw_re = w_re&#183;b_re &#8722; w_im&#183;b_im，</text>
  <text x="52" y="384" style="font-size:12px;fill:#5F5E5A">tw_im = w_re&#183;b_im + w_im&#183;b_re（也用 vW_im）；每步都是 4-lane 操作 &#8594; 每条指令 4 只蝴蝶。</text>
</svg>