<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="240" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图四：requantize 编解码流水线（float ↔ int8）</text>
  <g font-size="11">
    <rect x="20" y="60" width="110" height="50" rx="6" fill="#fff" stroke="#fb923c"/>
    <text x="75" y="82" fill="#7c2d12" text-anchor="middle">float v</text>
    <text x="75" y="100" fill="#7c2d12" text-anchor="middle">×(scale_in)</text>
    <rect x="150" y="60" width="110" height="50" rx="6" fill="#fff" stroke="#fb923c"/>
    <text x="205" y="82" fill="#7c2d12" text-anchor="middle">+bias</text>
    <text x="205" y="100" fill="#7c2d12" text-anchor="middle">relu</text>
    <rect x="280" y="60" width="110" height="50" rx="6" fill="#fff" stroke="#fb923c"/>
    <text x="335" y="82" fill="#7c2d12" text-anchor="middle">×(scale_out)</text>
    <text x="335" y="100" fill="#7c2d12" text-anchor="middle">round</text>
    <rect x="410" y="60" width="110" height="50" rx="6" fill="#dcfce7" stroke="#10b981"/>
    <text x="465" y="82" fill="#065f46" text-anchor="middle">饱和窄化</text>
    <text x="465" y="100" fill="#065f46" text-anchor="middle">→ int8</text>
    <rect x="540" y="60" width="110" height="50" rx="6" fill="#dcfce7" stroke="#10b981"/>
    <text x="595" y="82" fill="#065f46" text-anchor="middle">int8 out</text>
    <text x="595" y="100" fill="#065f46" text-anchor="middle">谓词写回</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.4" marker-end="url(#qm)">
    <line x1="130" y1="85" x2="150" y2="85"/>
    <line x1="260" y1="85" x2="280" y2="85"/>
    <line x1="390" y1="85" x2="410" y2="85"/>
    <line x1="520" y1="85" x2="540" y2="85"/>
  </g>
  <defs><marker id="qm" markerWidth="9" markerHeight="9" refX="7" anchor="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
  <rect x="20" y="140" width="630" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="35" y="162" fill="#334155" font-weight="bold">SVE2 一行流：</text>
  <text x="35" y="184" fill="#475569">f = svmla(pg, bias, v, scale_in);  f = svmul(pg, f, scale_out);</text>
  <text x="35" y="204" fill="#475569">i8 = svqxtnb(svqxtnt(i32));  svst1b(pg, out, i8);   // 谓词掩尾部，可 fuse 进 GEMM</text>
  <text x="35" y="224" fill="#64748b" font-size="9">锚点：ncnn requantize_arm.cpp / MNN CommonOptFunctionNeon.cpp 量化路径</text>
</svg>
