<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- L4 SME/SME2 矩阵扩展：外积分解 / ZA 阵列 / 三精度分档 / 承上启下 -->
  <rect width="680" height="300" fill="#f7f8fa"/>

  <!-- 顶栏标题 -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">L4 SME/SME2 矩阵扩展 · ZA 外积累加</text>
  <line x1="20" y1="32" x2="660" y2="32" stroke="#d1d5db" stroke-width="1"/>

  <!-- Panel 1: 外积分解 -->
  <rect x="20" y="42" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="42" width="310" height="24" rx="8" fill="#4f46e5"/>
  <rect x="20" y="58" width="310" height="8" fill="#4f46e5"/>
  <text x="32" y="59" font-size="12" font-weight="700" fill="#ffffff">① 外积分解（vs SVE2 行点积）</text>
  <text x="32" y="86" font-size="11" fill="#374151">SVE2: C[i][j]=Σ_k A[i][k]·B[k][j]  (行点积)</text>
  <text x="32" y="102" font-size="11" fill="#374151">SME : C=Σ_k outer(A[:,k], B[k,:])   (外积)</text>
  <!-- 外积图示 -->
  <g transform="translate(32,110)">
    <rect x="0" y="0" width="14" height="40" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="7" y="48" text-anchor="middle" font-size="9" fill="#4f46e5">A[:,k]</text>
    <rect x="24" y="0" width="40" height="14" fill="#c7d2fe" stroke="#4f46e5"/>
    <text x="44" y="-3" text-anchor="middle" font-size="9" fill="#4f46e5">B[k,:]</text>
    <text x="72" y="9" font-size="11" fill="#6b7280">⊗</text>
    <rect x="86" y="0" width="40" height="40" fill="#eef2ff" stroke="#4f46e5" stroke-dasharray="3 2"/>
    <text x="106" y="48" text-anchor="middle" font-size="9" fill="#4f46e5">outer (M×N)</text>
    <text x="140" y="22" font-size="11" fill="#6b7280">累加→ZA</text>
    <text x="184" y="14" font-size="10" fill="#9ca3af">K 次 fmopa</text>
    <text x="184" y="28" font-size="10" fill="#9ca3af">= 一个 GEMM</text>
  </g>

  <!-- Panel 2: ZA 阵列 -->
  <rect x="350" y="42" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="350" y="42" width="310" height="24" rx="8" fill="#0d9488"/>
  <rect x="350" y="58" width="310" height="8" fill="#0d9488"/>
  <text x="362" y="59" font-size="12" font-weight="700" fill="#ffffff">② ZA 阵列（4×4 瓦片，SVL=128）</text>
  <!-- 4x4 tile -->
  <g transform="translate(362,82)">
    <rect x="0" y="0" width="64" height="64" fill="#f0fdfa" stroke="#0d9488"/>
    <g stroke="#5eead4" stroke-width="0.7">
      <line x1="16" y1="0" x2="16" y2="64"/><line x1="32" y1="0" x2="32" y2="64"/><line x1="48" y1="0" x2="48" y2="64"/>
      <line x1="0" y1="16" x2="64" y2="16"/><line x1="0" y1="32" x2="64" y2="32"/><line x1="0" y1="48" x2="64" y2="48"/>
    </g>
    <text x="8" y="11" font-size="8" fill="#0d9488">za</text>
    <text x="32" y="74" text-anchor="middle" font-size="9" fill="#0d9488">S = SVL/32 = 4 lane</text>
  </g>
  <text x="442" y="92" font-size="11" fill="#374151">fmopa: za[i][j] += a[i]·b[j]</text>
  <text x="442" y="108" font-size="11" fill="#374151">累加器=2D 阵列</text>
  <text x="442" y="124" font-size="11" fill="#374151">(非若干向量寄存器)</text>
  <text x="442" y="142" font-size="10" fill="#9ca3af">读出: svld1_hor/ver_za32</text>

  <!-- Panel 3: 三精度分档 -->
  <rect x="20" y="168" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="168" width="310" height="24" rx="8" fill="#b45309"/>
  <rect x="20" y="184" width="310" height="8" fill="#b45309"/>
  <text x="32" y="185" font-size="12" font-weight="700" fill="#ffffff">③ 三精度外积累加（同模型，不同精度）</text>
  <g transform="translate(32,202)">
    <rect x="0" y="0" width="84" height="22" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="42" y="15" text-anchor="middle" font-size="10" fill="#92400e">fmopa fp32</text>
    <rect x="92" y="0" width="84" height="22" rx="4" fill="#fed7aa" stroke="#b45309"/>
    <text x="134" y="15" text-anchor="middle" font-size="10" fill="#92400e">smopa i8→i32</text>
    <rect x="184" y="0" width="84" height="22" rx="4" fill="#fde68a" stroke="#b45309"/>
    <text x="226" y="15" text-anchor="middle" font-size="10" fill="#92400e">bmopa bf16→f32</text>
    <text x="0" y="40" font-size="10" fill="#6b7280">累加器统一 fp32/i32（防低精累加爆炸）</text>
    <text x="0" y="56" font-size="10" fill="#9ca3af">SME2: mopa = 2×fmopa（Z+Z 拼 256-bit 块）</text>
  </g>

  <!-- Panel 4: 承上启下 -->
  <rect x="350" y="168" width="310" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="350" y="168" width="310" height="24" rx="8" fill="#6366f1"/>
  <rect x="350" y="184" width="310" height="8" fill="#6366f1"/>
  <text x="362" y="185" font-size="12" font-weight="700" fill="#ffffff">④ 承上启下 / 落点</text>
  <text x="362" y="208" font-size="10.5" fill="#374151">承接 neon_l3_sve_kernels (行点积→外积)</text>
  <text x="362" y="224" font-size="10.5" fill="#374151">精度互引: neon_l2_int8_gemm / neon_l4_bf16</text>
  <text x="362" y="240" font-size="10.5" fill="#374151">后端: MNN KleidiAI sme2_mla/sme2_dot 档</text>
  <text x="362" y="256" font-size="10.5" fill="#9ca3af">跨域同构: KF_demo kf_l3_factor (因子→信息矩阵累加)</text>
  <text x="362" y="272" font-size="10" fill="#9ca3af">11 项 bit-exact 对拍全 PASS (err=0)</text>
</svg>
