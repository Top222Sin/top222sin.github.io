<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="280" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图三：尾部处理 —— NEON 补 remainder vs SVE2 谓词一体化</text>
  <rect x="20" y="40" width="300" height="210" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="170" y="62" fill="#9a3412" font-weight="bold" text-anchor="middle">NEON（固定 4 lane）</text>
  <rect x="40" y="74" width="260" height="60" rx="4" fill="#ffedd5" stroke="#fb923c"/>
  <text x="170" y="98" fill="#7c2d12" text-anchor="middle">主循环：j += 4</text>
  <text x="170" y="118" fill="#7c2d12" text-anchor="middle">处理 4 的倍数部分</text>
  <text x="170" y="158" fill="#b91c1c" font-weight="bold" text-anchor="middle">↓ 手写 remainder</text>
  <rect x="40" y="170" width="260" height="60" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="170" y="194" fill="#991b1b" text-anchor="middle">标量 for：补 N%4</text>
  <text x="170" y="214" fill="#991b1b" text-anchor="middle">每行都来一遍 → 脏</text>
  <rect x="360" y="40" width="300" height="210" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="510" y="62" fill="#065f46" font-weight="bold" text-anchor="middle">SVE2（VLA + 谓词）</text>
  <rect x="380" y="74" width="260" height="140" rx="4" fill="#d1fae5" stroke="#10b981"/>
  <text x="510" y="100" fill="#065f46" text-anchor="middle">单一主循环：j += svcntw()</text>
  <text x="510" y="124" fill="#065f46" text-anchor="middle">pg = svwhilelt(0, nr)</text>
  <text x="510" y="148" fill="#065f46" text-anchor="middle">载入/乘加/写回 全部带 pg</text>
  <text x="510" y="178" fill="#047857" text-anchor="middle">尾部由"假位"自然屏蔽</text>
  <text x="510" y="202" fill="#047857" font-weight="bold" text-anchor="middle">零 remainder 循环</text>
  <defs><marker id="cm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker></defs>
  <line x1="320" y1="145" x2="360" y2="145" stroke="#475569" stroke-width="1.6" marker-end="url(#cm)"/>
</svg>
