<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- L4 跨平台 SIMD 抽象：kernel 只写一次 → Simd<L> 抽象 → NEON/SSE/AVX/标量 多端 -->
  <rect width="680" height="300" fill="#f7f8fa"/>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">L4 跨平台 SIMD 抽象 · 一处写多端编译（NEON / SSE / AVX / 标量）</text>

  <!-- 左：kernel 只写一次 -->
  <rect x="14" y="44" width="196" height="150" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
  <text x="112" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#185FA5">kernel 只写一次</text>
  <rect x="28" y="74" width="168" height="22" rx="4" fill="#eef4fb"/>
  <text x="112" y="89" text-anchor="middle" font-size="11" fill="#374151">simd_dot&lt;L&gt;(a,b,n)</text>
  <rect x="28" y="102" width="168" height="22" rx="4" fill="#eef4fb"/>
  <text x="112" y="117" text-anchor="middle" font-size="11" fill="#374151">simd_saxpy&lt;L&gt;(a,x,y,n)</text>
  <rect x="28" y="130" width="168" height="22" rx="4" fill="#eef4fb"/>
  <text x="112" y="145" text-anchor="middle" font-size="11" fill="#374151">simd_relu&lt;L&gt;(x,y,n)</text>
  <text x="112" y="176" text-anchor="middle" font-size="10" fill="#6b7280">只调统一 API，</text>
  <text x="112" y="188" text-anchor="middle" font-size="10" fill="#6b7280">完全不关心 L 是几</text>

  <!-- 中：Simd&lt;L&gt; 抽象 API -->
  <rect x="242" y="44" width="150" height="150" rx="6" fill="#ffffff" stroke="#0c447c" stroke-width="1.5"/>
  <text x="317" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Simd&lt;L&gt; 抽象 API</text>
  <text x="317" y="85" text-anchor="middle" font-size="11" fill="#374151">vload / vstore</text>
  <text x="317" y="103" text-anchor="middle" font-size="11" fill="#374151">vbroadcast</text>
  <text x="317" y="121" text-anchor="middle" font-size="11" fill="#374151">vadd / vsub / vmul</text>
  <text x="317" y="139" text-anchor="middle" font-size="11" fill="#374151">vhsum（水平归约）</text>
  <text x="317" y="157" text-anchor="middle" font-size="11" fill="#374151">vrelu</text>
  <text x="317" y="182" text-anchor="middle" font-size="10" fill="#6b7280">解耦「向量是什么」</text>
  <text x="317" y="194" text-anchor="middle" font-size="10" fill="#6b7280">与「算什么」</text>

  <!-- 右：四个后端 -->
  <text x="556" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#3B6D11">后端（条件编译选一）</text>
  <rect x="470" y="48" width="172" height="30" rx="4" fill="#eaf3e6" stroke="#3B6D11" stroke-width="1"/>
  <text x="556" y="67" text-anchor="middle" font-size="11" fill="#243d0a">ARM NEON  float32x4_t</text>
  <rect x="470" y="82" width="172" height="30" rx="4" fill="#eaf3e6" stroke="#3B6D11" stroke-width="1"/>
  <text x="556" y="101" text-anchor="middle" font-size="11" fill="#243d0a">x86 SSE   __m128</text>
  <rect x="470" y="116" width="172" height="30" rx="4" fill="#eaf3e6" stroke="#3B6D11" stroke-width="1"/>
  <text x="556" y="135" text-anchor="middle" font-size="11" fill="#243d0a">x86 AVX   __m256</text>
  <rect x="470" y="150" width="172" height="30" rx="4" fill="#fdeaea" stroke="#A32D2D" stroke-width="1"/>
  <text x="556" y="169" text-anchor="middle" font-size="11" fill="#7a1d1d">标量回退（本沙箱走此路）</text>

  <!-- 箭头 -->
  <path d="M210 119 L240 119" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M392 119 L468 119" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 底：验证结论 + 同构链 -->
  <rect x="14" y="208" width="652" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="28" y="228" font-size="11" font-weight="700" fill="#185FA5">验证（5/5，受管 Python + C++ 控制流镜像双复核）</text>
  <text x="28" y="246" font-size="10.5" fill="#374151">· dot&lt;2/4/8&gt; 跨宽度结果一致 且 == 朴素标量（double 累加器，误差 4.4e-16）</text>
  <text x="28" y="262" font-size="10.5" fill="#374151">· saxpy / relu / load-store 往返 / vadd 逐元素 == 标量（误差 0）</text>
  <text x="28" y="280" font-size="10.5" fill="#6b7280">跨域同构：向量水平归约 Σ 累加 ≡ LS 法方程 JᵀJ ≡ KF 因子图 Λ ≡ SME ZA 外积 —— 同一套线性代数，换后端不改算法。</text>
</svg>
