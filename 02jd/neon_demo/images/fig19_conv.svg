<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250">
  <rect width="680" height="250" fill="#fbfdff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1a2b4a">图一 · 卷积三种打法对比</text>
  <g font-size="11" fill="#22324f">
    <rect x="20" y="50" width="150" height="80" rx="8" fill="#e8f1ff" stroke="#3b82f6"/>
    <text x="95" y="74" text-anchor="middle" font-weight="bold" fill="#1d4ed8">直接 NEON(3x3)</text>
    <text x="95" y="94" text-anchor="middle">vext 滑动窗口</text>
    <text x="95" y="112" text-anchor="middle">无变换开销</text>
    <rect x="190" y="50" width="150" height="80" rx="8" fill="#eafaf0" stroke="#22c55e"/>
    <text x="265" y="74" text-anchor="middle" font-weight="bold" fill="#15803d">im2col + GEMM</text>
    <text x="265" y="94" text-anchor="middle">任意 kernel(k=3/4/5)</text>
    <text x="265" y="112" text-anchor="middle">复用 8x4 微内核</text>
    <rect x="360" y="50" width="150" height="80" rx="8" fill="#fff4e6" stroke="#f59e0b"/>
    <text x="435" y="74" text-anchor="middle" font-weight="bold" fill="#b45309">Winograd F(2,3)</text>
    <text x="435" y="94" text-anchor="middle">变换域逐点乘</text>
    <text x="435" y="112" text-anchor="middle">3x3 乘法最少</text>
    <rect x="530" y="50" width="130" height="80" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
    <text x="595" y="74" text-anchor="middle" font-weight="bold" fill="#7e22ce">深度可分离</text>
    <text x="595" y="94" text-anchor="middle">逐通道独立</text>
    <text x="595" y="112" text-anchor="middle">DW + PW</text>
  </g>
  <text x="20" y="165" font-size="11" fill="#445">选谁：3x3→直接 / 任意 k→im2col / 3x3 要省乘法→Winograd / 轻量模型→深度可分离</text>
  <line x1="170" y1="90" x2="190" y2="90" stroke="#94a3b8" stroke-dasharray="3"/>
  <line x1="340" y1="90" x2="360" y2="90" stroke="#94a3b8" stroke-dasharray="3"/>
  <line x1="510" y1="90" x2="530" y2="90" stroke="#94a3b8" stroke-dasharray="3"/>
</svg>
