<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="240" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图二：GEMM 微内核在 NCNN/MNN 的三代分档</text>
  <g font-size="11">
    <rect x="20" y="50" width="200" height="160" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="120" y="72" fill="#9a3412" font-weight="bold" text-anchor="middle">NEON (128b)</text>
    <text x="120" y="98" fill="#7c2d12" text-anchor="middle">NCNN: 手写</text>
    <text x="120" y="118" fill="#7c2d12" text-anchor="middle">gemm_int8.h SDOT</text>
    <text x="120" y="142" fill="#7c2d12" text-anchor="middle">MNN KleidiAI:</text>
    <text x="120" y="162" fill="#7c2d12" text-anchor="middle">dotprod / i8mm</text>
    <text x="120" y="190" fill="#b91c1c" text-anchor="middle">每代一份汇编</text>
    <rect x="240" y="50" width="200" height="160" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="340" y="72" fill="#065f46" font-weight="bold" text-anchor="middle">SVE2 (VLA)</text>
    <text x="340" y="98" fill="#065f46" text-anchor="middle">MNN KleidiAI:</text>
    <text x="340" y="118" fill="#065f46" text-anchor="middle">*sdot / *sdot_asm</text>
    <text x="340" y="142" fill="#065f46" text-anchor="middle">一份源码</text>
    <text x="340" y="162" fill="#065f46" text-anchor="middle">VL 随核自适应</text>
    <text x="340" y="190" fill="#047857" font-weight="bold" text-anchor="middle">X2/V1/X4 通吃</text>
    <rect x="460" y="50" width="200" height="160" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="560" y="72" fill="#5b21b6" font-weight="bold" text-anchor="middle">SME2 (外积)</text>
    <text x="560" y="98" fill="#5b21b6" text-anchor="middle">MNN KleidiAI:</text>
    <text x="560" y="118" fill="#5b21b6" text-anchor="middle">*mopa / sme2_mla</text>
    <text x="560" y="142" fill="#5b21b6" text-anchor="middle">/ sme2_dot</text>
    <text x="560" y="162" fill="#5b21b6" text-anchor="middle">矩阵外积指令</text>
    <text x="560" y="190" fill="#6d28d9" font-weight="bold" text-anchor="middle">吞吐再上一档</text>
  </g>
  <text x="340" y="228" fill="#64748b" font-size="10" text-anchor="middle">编译旗: -march=armv8.2-a+i8mm+dotprod+sve+sve2+fp16（KleidiAI.cmake 实摘）</text>
</svg>
