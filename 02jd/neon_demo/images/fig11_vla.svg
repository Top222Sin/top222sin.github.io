<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图一：NEON 逐代手写 vs SVE2 一份自适应</text>
  <rect x="20" y="45" width="300" height="230" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="170" y="66" fill="#9a3412" font-weight="bold" text-anchor="middle">NEON / ASIMD（Armv8.x，无 SVE）</text>
  <g font-size="11">
    <rect x="40" y="80" width="260" height="30" fill="#fff" stroke="#fb923c"/><text x="50" y="100" fill="#7c2d12">A76 内核  (128b, 手写 8×4)</text>
    <rect x="40" y="118" width="260" height="30" fill="#fff" stroke="#fb923c"/><text x="50" y="138" fill="#7c2d12">A78 内核  (128b, 手写 8×4)</text>
    <rect x="40" y="156" width="260" height="30" fill="#fff" stroke="#fb923c"/><text x="50" y="176" fill="#7c2d12">X1  内核  (128b, 手写 8×4)</text>
  </g>
  <text x="170" y="212" fill="#9a3412" text-anchor="middle">每代一份汇编</text>
  <text x="170" y="230" fill="#9a3412" text-anchor="middle">尾部还各写 remainder</text>
  <text x="170" y="256" fill="#b91c1c" font-weight="bold" text-anchor="middle">维护成本 ∝ 核数 × 维度</text>
  <rect x="360" y="45" width="300" height="230" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="510" y="66" fill="#065f46" font-weight="bold" text-anchor="middle">SVE2（Armv9，VLA）</text>
  <g font-size="11">
    <rect x="380" y="80" width="260" height="30" fill="#fff" stroke="#10b981"/><text x="390" y="100" fill="#065f46">X2  内核  ← 同一份 .c（VL=4）</text>
    <rect x="380" y="118" width="260" height="30" fill="#fff" stroke="#10b981"/><text x="390" y="138" fill="#065f46">V1  内核  ← 同一份 .c（VL=8）</text>
    <rect x="380" y="156" width="260" height="30" fill="#fff" stroke="#10b981"/><text x="390" y="176" fill="#065f46">X4  内核  ← 同一份 .c（VL=16）</text>
  </g>
  <text x="510" y="212" fill="#065f46" text-anchor="middle">NR = svcntw() 运行时决定</text>
  <text x="510" y="230" fill="#065f46" text-anchor="middle">svwhilelt 掩掉尾部，无 remainder</text>
  <text x="510" y="256" fill="#047857" font-weight="bold" text-anchor="middle">一份源码，全核通吃</text>
  <defs><marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker></defs>
  <line x1="320" y1="160" x2="360" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="340" y="152" fill="#475569" font-size="10" text-anchor="middle">迁移</text>
</svg>
