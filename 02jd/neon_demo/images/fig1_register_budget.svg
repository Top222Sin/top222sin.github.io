  <!-- row2 V16-V31 -->
  <g font-size="10" fill="#222" text-anchor="middle">
    <rect x="20"  y="200" width="36" height="54" rx="3" fill="#a9dcb0"/><text x="38"  y="230">V16</text>
    <rect x="60"  y="200" width="36" height="54" rx="3" fill="#a9dcb0"/><text x="78"  y="230">V17</text>
