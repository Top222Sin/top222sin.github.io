    <rect x="460" y="120" width="36" height="54" rx="3" fill="#f6c98f"/><text x="478" y="150">V11</text>
    <rect x="500" y="120" width="36" height="54" rx="3" fill="#f6c98f"/><text x="518" y="150">V12</text>
