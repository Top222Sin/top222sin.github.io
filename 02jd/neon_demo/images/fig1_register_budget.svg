    <rect x="300" y="120" width="36" height="54" rx="3" fill="#cfe9cf"/><text x="318" y="150">V7</text>
    <rect x="340" y="120" width="36" height="54" rx="3" fill="#f6c98f"/><text x="358" y="150">V8</text>
