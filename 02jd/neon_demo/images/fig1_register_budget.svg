  <text x="20" y="290" font-size="12.5" fill="#1a1a1a" font-weight="600">ncnn int8 内核的实际用法</text>
  <text x="20" y="310" font-size="12" fill="#333">· 累加器 v16–v31（16 个 int32x4 → 8×8 输出块的 64 个部分和）</text>
  <text x="20" y="328" font-size="12" fill="#333">· 数据块 A/B 用 v0–v7（载入 tile）</text>
  <text x="20" y="346" font-size="12" fill="#b3541e" font-weight="600">· V8–V15 故意留空：用了就得保存/恢复，付代价 → 主动让出</text>

  <rect x="20" y="364" width="640" height="86" rx="8" fill="#fff6ee" stroke="#f0b080"/>
  <text x="34" y="388" font-size="12.5" fill="#7a3d12" font-weight="700">★ 输出块尺寸 = 寄存器账单逼出来的</text>
  <text x="34" y="408" font-size="12" fill="#7a3d12">块再大 → 累加器数 &gt; 32 → 溢出(spill)到栈 → 直接慢一个数量级。</text>
  <text x="34" y="428" font-size="12" fill="#7a3d12">所以「这个 GEMM 算 8×几的块」不是数学选择，是预算决策。</text>
</svg>