<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="490" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="700" fill="#111">图一 · AArch64 寄存器预算 — V0–V31（32 × 128-bit）</text>
  <text x="20" y="52" font-size="12.5" fill="#666">ncnn int8 GEMM 内核（gemm_int8.h:10018）的分配账本</text>

  <rect x="20" y="68" width="14" height="14" rx="2" fill="#cfe9cf"/><text x="40" y="80" font-size="12" fill="#333">V0–V7 调用方保存（自由）</text>
  <rect x="220" y="68" width="14" height="14" rx="2" fill="#f6c98f"/><text x="240" y="80" font-size="12" fill="#333">V8–V15 被调方保存（要 stp/ldp → 躲开）</text>
  <rect x="470" y="68" width="14" height="14" rx="2" fill="#a9dcb0"/><text x="490" y="80" font-size="12" fill="#333">V16–V31 调用方保存（自由）</text>

  <!-- row1 V0-V15 -->
  <g font-size="10" fill="#222" text-anchor="middle">
    <rect x="20"  y="120" width="36" height="54" rx="3" fill="#cfe9cf"/><text x="38"  y="150">V0</text>
