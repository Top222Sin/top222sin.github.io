<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="250" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图三：变换即"编解码"——conv(Winograd)=FFT 的角色替代</text>
  <rect x="20" y="50" width="150" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95" y="72" fill="#1e40af" text-anchor="middle">输入(像素域)</text>
  <text x="95" y="92" fill="#1e40af" text-anchor="middle">↓ 编码</text>
  <rect x="20" y="110" width="150" height="50" rx="6" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="95" y="132" fill="#1e40af" text-anchor="middle">变换域</text>
  <text x="95" y="152" fill="#1e40af" text-anchor="middle">↓ 逐点乘(GEMM)</text>
  <rect x="20" y="170" width="150" height="50" rx="6" fill="#93c5fd" stroke="#3b82f6"/>
  <text x="95" y="192" fill="#1e3a8a" text-anchor="middle">输出(像素域)</text>
  <text x="95" y="212" fill="#1e3a8a" text-anchor="middle">↑ 解码</text>
  <text x="235" y="80" fill="#334155">NCNN: transform_input → 变换域乘 → transform_output</text>
  <text x="235" y="104" fill="#334155">FFT:   fft_forward    → 频域乘   → fft_inverse</text>
  <text x="235" y="135" fill="#047857" font-weight="bold">SVE2 写法：</text>
  <text x="235" y="158" fill="#047857">svld2 拆 [re,im] 成两向量 → 分量级复数乘加 → svst2 写回</text>
  <text x="235" y="182" fill="#047857">svwhilelt 掩尾部，零 remainder 循环</text>
  <text x="235" y="212" fill="#64748b" font-size="10">锚点：ncnn convolution_3x3_winograd.h: transform_kernel/input/output</text>
</svg>
