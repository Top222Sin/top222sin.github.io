<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Menlo, Consolas, monospace" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#fbfcfe"/>
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#1f2933">图二：8x4 微内核的寄存器棋盘（8 个累加器 + A/B 数据，占 V0–V7 区）</text>
  <text x="30" y="60" fill="#334155">8 个 float32x4 累加器（v0..v7，各 4 lane）</text>
  <g font-size="11">
    <g fill="#bfdbfe" stroke="#3b82f6">
      <rect x="30" y="70" width="60" height="22"/><rect x="96" y="70" width="60" height="22"/><rect x="162" y="70" width="60" height="22"/><rect x="228" y="70" width="60" height="22"/>
      <rect x="30" y="96" width="60" height="22"/><rect x="96" y="96" width="60" height="22"/><rect x="162" y="96" width="60" height="22"/><rect x="228" y="96" width="60" height="22"/>
      <rect x="30" y="122" width="60" height="22"/><rect x="96" y="122" width="60" height="22"/><rect x="162" y="122" width="60" height="22"/><rect x="228" y="122" width="60" height="22"/>
      <rect x="30" y="148" width="60" height="22"/><rect x="96" y="148" width="60" height="22"/><rect x="162" y="148" width="60" height="22"/><rect x="228" y="148" width="60" height="22"/>
      <rect x="30" y="174" width="60" height="22"/><rect x="96" y="174" width="60" height="22"/><rect x="162" y="174" width="60" height="22"/><rect x="228" y="174" width="60" height="22"/>
      <rect x="30" y="200" width="60" height="22"/><rect x="96" y="200" width="60" height="22"/><rect x="162" y="200" width="60" height="22"/><rect x="228" y="200" width="60" height="22"/>
      <rect x="30" y="226" width="60" height="22"/><rect x="96" y="226" width="60" height="22"/><rect x="162" y="226" width="60" height="22"/><rect x="228" y="226" width="60" height="22"/>
      <rect x="30" y="252" width="60" height="22"/><rect x="96" y="252" width="60" height="22"/><rect x="162" y="252" width="60" height="22"/><rect x="228" y="252" width="60" height="22"/>
    </g>
    <text x="40" y="85" fill="#1e3a8a">acc0</text><text x="106" y="85" fill="#1e3a8a">acc1</text><text x="172" y="85" fill="#1e3a8a">acc2</text><text x="238" y="85" fill="#1e3a8a">acc3</text>
    <text x="40" y="111" fill="#1e3a8a">acc4</text><text x="106" y="111" fill="#1e3a8a">acc5</text><text x="172" y="111" fill="#1e3a8a">acc6</text><text x="238" y="111" fill="#1e3a8a">acc7</text>
    <text x="320" y="120" fill="#64748b">↑ 8 累加器 = 8 条独立 fmla 链</text>
    <text x="320" y="140" fill="#64748b">A 行广播 vdupq_n（1 寄存器复用）</text>
    <text x="320" y="160" fill="#64748b">B 向量 vld1q（1 寄存器/步）</text>
    <text x="320" y="190" fill="#0f766e" font-weight="bold">总占用 ≪ 32 V → 无 spill，纯叶子</text>
    <text x="320" y="215" fill="#94a3b8">∥ 对比：块扩到 16x4 / 溢出 → spill 到栈</text>
  </g>
</svg>
