<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <rect x="0" y="0" width="680" height="34" fill="#0c447c"/>
  <text x="16" y="22" font-size="15" fill="#ffffff" font-weight="bold">CMSIS-DSP（L4.4）· 库 API 语义可移植复刻 — 仅 x86 标量对照</text>

  <!-- 左面板：5 个 API 语义卡 -->
  <text x="16" y="56" font-size="12.5" fill="#185FA5" font-weight="bold">① 库 API → 可移植语义复刻（Cortex-M 真跑替换本实现）</text>
  <g font-size="11">
    <!-- mat_mult -->
    <rect x="16" y="66" width="200" height="46" rx="4" fill="#eef4fb" stroke="#185FA5" stroke-width="1"/>
    <text x="24" y="84" font-size="11.5" fill="#0c447c" font-weight="bold">arm_mat_mult_f32</text>
    <text x="24" y="101" fill="#333">C = A·B  行主序后乘</text>

    <!-- FIR -->
    <rect x="16" y="118" width="200" height="46" rx="4" fill="#eef4fb" stroke="#185FA5" stroke-width="1"/>
    <text x="24" y="136" font-size="11.5" fill="#0c447c" font-weight="bold">arm_fir_f32</text>
    <text x="24" y="153" fill="#333">延迟线 y[n]=Σh[k]·x[n-k]</text>

    <!-- biquad -->
    <rect x="16" y="170" width="200" height="46" rx="4" fill="#eef4fb" stroke="#185FA5" stroke-width="1"/>
    <text x="24" y="188" font-size="11.5" fill="#0c447c" font-weight="bold">arm_biquad_cascade_df1_f32</text>
    <text x="24" y="205" fill="#333">S 级二阶节级联 DF1</text>

    <!-- RFFT -->
    <rect x="16" y="222" width="200" height="46" rx="4" fill="#eef4fb" stroke="#185FA5" stroke-width="1"/>
    <text x="24" y="240" font-size="11.5" fill="#0c447c" font-weight="bold">arm_rfft_fast_f32</text>
    <text x="24" y="257" fill="#333">实 FFT：基-2 DIT + CMSIS 打包</text>

    <!-- PID -->
    <rect x="16" y="274" width="200" height="22" rx="4" fill="#eef4fb" stroke="#185FA5" stroke-width="1"/>
    <text x="24" y="289" font-size="11" fill="#0c447c" font-weight="bold">arm_pid_f32  y=A0·e+A1·e1+A2·e2+y1</text>
  </g>

  <!-- 中箭头：复刻 → 对拍 -->
  <line x1="232" y1="160" x2="288" y2="160" stroke="#A32D2D" stroke-width="2" marker-end="url(#ah)"/>
  <text x="234" y="152" font-size="10.5" fill="#A32D2D" font-weight="bold">语义复刻</text>

  <!-- 右面板：独立参考 + 验证 -->
  <text x="300" y="56" font-size="12.5" fill="#3B6D11" font-weight="bold">② 独立参考实现（对拍基准）</text>
  <g font-size="11">
    <rect x="300" y="66" width="200" height="46" rx="4" fill="#eef7e8" stroke="#3B6D11" stroke-width="1"/>
    <text x="308" y="84" font-size="11.5" fill="#3B6D11" font-weight="bold">朴素 A·B / 直接卷积</text>
    <text x="308" y="101" fill="#333">mat_mult · FIR 基准</text>

    <rect x="300" y="118" width="200" height="46" rx="4" fill="#eef7e8" stroke="#3B6D11" stroke-width="1"/>
    <text x="308" y="136" font-size="11.5" fill="#3B6D11" font-weight="bold">直接 DF1 差分方程</text>
    <text x="308" y="153" fill="#333">biquad 状态递推基准</text>

    <rect x="300" y="170" width="200" height="46" rx="4" fill="#eef7e8" stroke="#3B6D11" stroke-width="1"/>
    <text x="308" y="188" font-size="11.5" fill="#3B6D11" font-weight="bold">朴素 DFT (double)</text>
    <text x="308" y="205" fill="#333">RFFT 频域基准</text>

    <rect x="300" y="222" width="200" height="46" rx="4" fill="#eef7e8" stroke="#3B6D11" stroke-width="1"/>
    <text x="308" y="240" font-size="11.5" fill="#3B6D11" font-weight="bold">手算 PI 累加</text>
    <text x="308" y="257" fill="#333">PID 真义含 y1（积分递推）</text>

    <rect x="300" y="274" width="200" height="22" rx="4" fill="#f3e9c9" stroke="#A32D2D" stroke-width="1"/>
    <text x="308" y="289" font-size="10.5" fill="#A32D2D" font-weight="bold">⚠ 抓 bug：CMSIS PID 含前次输出 y1</text>
  </g>

  <!-- 底部：5/5 PASS -->
  <rect x="516" y="66" width="150" height="230" rx="6" fill="#fbfcfe" stroke="#185FA5" stroke-width="1.2"/>
  <text x="528" y="88" font-size="12" fill="#0c447c" font-weight="bold">验证 5/5 PASS</text>
  <g font-size="10.5" fill="#333">
    <text x="528" y="112">✓ mat_mult == 朴素 A·B</text>
    <text x="528" y="134">✓ FIR == 直接卷积</text>
    <text x="528" y="156">✓ biquad == DF1 差分</text>
    <text x="528" y="178">✓ RFFT == DFT</text>
    <text x="528" y="200">✓ PID == 手算 PI</text>
  </g>
  <line x1="528" y1="214" x2="654" y2="214" stroke="#ccc"/>
  <text x="528" y="234" font-size="10" fill="#A32D2D" font-weight="bold">真·不可编译验证：</text>
  <text x="528" y="252" font-size="9.5" fill="#555">受管 Python 镜像</text>
  <text x="528" y="266" font-size="9.5" fill="#555">+ C++ 控制流镜像</text>
  <text x="528" y="284" font-size="9.5" fill="#185FA5" font-weight="bold">逐字对拍一致</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A32D2D"/>
    </marker>
  </defs>
</svg>
