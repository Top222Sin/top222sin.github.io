<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.9 多目标跟踪（JPDA / GM-PHD）+ OOSM 时间偏移 · 三个要点</text>

  <!-- ① JPDA 软关联 -->
  <g>
    <rect x="20" y="50" width="315" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <rect x="20" y="50" width="315" height="30" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="177" y="70" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① JPDA 软关联（谁是谁，含歧义）</text>
    <!-- 目标与门 -->
    <ellipse cx="95" cy="150" rx="58" ry="34" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="245" cy="150" rx="58" ry="34" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="95" cy="150" r="5" fill="#1e3a8a"/><text x="95" y="172" font-size="11" fill="#1e3a8a" text-anchor="middle">t1</text>
    <circle cx="245" cy="150" r="5" fill="#1e3a8a"/><text x="245" y="172" font-size="11" fill="#1e3a8a" text-anchor="middle">t2</text>
    <circle cx="112" cy="140" r="3.5" fill="#dc2626"/><text x="112" y="132" font-size="10" fill="#dc2626" text-anchor="middle">m1</text>
    <circle cx="228" cy="160" r="3.5" fill="#dc2626"/><text x="228" y="178" font-size="10" fill="#dc2626" text-anchor="middle">m2</text>
    <circle cx="305" cy="105" r="3.5" fill="#9ca3af"/><text x="305" y="98" font-size="10" fill="#9ca3af" text-anchor="middle">m3(杂波)</text>
    <circle cx="170" cy="150" r="3.5" fill="#f59e0b"/><text x="170" y="138" font-size="10" fill="#b45309" text-anchor="middle">m4(歧义)</text>
    <text x="36" y="200" font-size="11" fill="#555">β_1m4 = β_2m4 = 0.1037（对称软分配）</text>
    <text x="36" y="218" font-size="11" fill="#555">组合新息 = Σβ_ij·(z_j−x_i⁻) 凸组合</text>
  </g>

  <!-- ② OOSM 乱序量测 -->
  <g>
    <rect x="345" y="50" width="315" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <rect x="345" y="50" width="315" height="30" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="502" y="70" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">② OOSM 乱序量测（迟到怎么用）</text>
    <!-- 时间轴 -->
    <line x1="365" y1="120" x2="640" y2="120" stroke="#d97706" stroke-width="2"/>
    <text x="365" y="113" font-size="10" fill="#78350f">0</text>
    <text x="630" y="113" font-size="10" fill="#78350f">N</text>
    <circle cx="400" cy="120" r="3.5" fill="#16a34a"/><text x="400" y="138" font-size="9" fill="#555" text-anchor="middle">m</text>
    <text x="420" y="108" font-size="10" fill="#dc2626">z[m] 迟到</text>
    <line x1="400" y1="116" x2="560" y2="92" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="560" cy="92" r="4" fill="#dc2626"/><text x="560" y="84" font-size="9" fill="#dc2626" text-anchor="middle">到达@N</text>
    <text x="361" y="170" font-size="11" fill="#555">定理：从 m-1 重滤波 ≡ 全部量测正序</text>
    <text x="361" y="190" font-size="11" fill="#555">oosm=1.38555 ≡ ref=1.38555 ≠ disc=1.39741</text>
    <text x="361" y="218" font-size="11" fill="#555">常量目标：P_oosm=0.0474 &lt; P_disc=0.0498</text>
  </g>

  <!-- ③ GM-PHD 基数估计 -->
  <g>
    <rect x="20" y="250" width="315" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <rect x="20" y="250" width="315" height="30" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="177" y="270" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">③ GM-PHD 基数估计（几个目标）</text>
    <!-- 基数演化折线 -->
    <polyline points="40,400 90,400 140,360 190,360 240,360 290,400 320,400" fill="none" stroke="#9333ea" stroke-width="2.5"/>
    <circle cx="90" cy="400" r="3" fill="#9333ea"/><circle cx="140" cy="360" r="3" fill="#9333ea"/>
    <circle cx="240" cy="360" r="3" fill="#9333ea"/><circle cx="290" cy="400" r="3" fill="#9333ea"/>
    <text x="40" y="418" font-size="9" fill="#555">k=0</text>
    <text x="135" y="352" font-size="9" fill="#581c87">出生 k=10</text>
    <text x="200" y="352" font-size="9" fill="#581c87">存活 ≈1</text>
    <text x="270" y="352" font-size="9" fill="#581c87">死亡 k=40</text>
    <text x="36" y="438" font-size="11" fill="#555">N̂: 出生前 0.0000 → 存活 0.9823 → 死亡后 0.0000</text>
    <text x="36" y="456" font-size="11" fill="#555">Σw 直接给出目标数，免逐对关联</text>
  </g>

  <!-- ④ 承接关系 -->
  <g>
    <rect x="345" y="250" width="315" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <rect x="345" y="250" width="315" height="30" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="502" y="270" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">④ 承接：多目标 = 单目标 KF 的泛化</text>
    <text x="361" y="308" font-size="12" fill="#14532d">JPDA → 单步 KF 更新的「关联」泛化</text>
    <text x="361" y="332" font-size="12" fill="#14532d">GM-PHD → L2.2 信息滤波的强度延伸</text>
    <text x="361" y="356" font-size="12" fill="#14532d">OOSM → L2.3 RTS 时间一致性的工程化</text>
    <text x="361" y="380" font-size="12" fill="#14532d">关联概率分母 = L2.4 NIS/χ² 闸门的推广</text>
    <text x="361" y="406" font-size="11.5" fill="#555">承接 L2.2 / L2.3 / L2.4 / L3.4</text>
  </g>
</svg>
