<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.2 可观测性：rank(O)=n 才估得出来</text>
  <!-- O 矩阵堆叠 -->
  <defs>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="25" font-size="13" fill="#1e3a8a" text-anchor="middle">H（一拍观测）</text>
    <rect x="0" y="50" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="75" font-size="13" fill="#1e3a8a" text-anchor="middle">H·F（预测后再看）</text>
    <rect x="0" y="100" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="125" font-size="13" fill="#1e3a8a" text-anchor="middle">H·F²（两拍后再看）</text>
    <line x1="160" y1="90" x2="220" y2="90" stroke="#555" stroke-width="2" marker-end="url(#arrD)"/>
    <text x="190" y="80" font-size="11.5" fill="#555" text-anchor="middle">堆叠</text>
    <rect x="230" y="30" width="180" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="320" y="75" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">O = [H;HF;HF²;…]</text>
    <text x="320" y="105" font-size="13" fill="#14532d" text-anchor="middle">rank(O) = n ?</text>
    <text x="320" y="132" font-size="11.5" fill="#555" text-anchor="middle">满秩 → 状态唯一确定</text>
  </g>
  <!-- 案例 -->
  <rect x="450" y="60" width="210" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="555" y="86" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">demo 案例①</text>
  <text x="555" y="110" font-size="12.5" fill="#78350f" text-anchor="middle">[p,v,b] 只测位置</text>
  <text x="555" y="134" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">rank = 3 ✅ 可观测</text>
  <text x="555" y="160" font-size="11.5" fill="#555" text-anchor="middle">零偏经 dt²/2 路径泄漏进观测</text>
  <text x="555" y="182" font-size="11.5" fill="#555" text-anchor="middle">但收敛慢，需要激励加速</text>
  <rect x="450" y="215" width="210" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="555" y="241" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">demo 案例②（反例）</text>
  <text x="555" y="265" font-size="12.5" fill="#7f1d1d" text-anchor="middle">[px,py,vx,vy] 只测 vx</text>
  <text x="555" y="289" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">rank = 1 ❌ 不可观测</text>
  <text x="555" y="312" font-size="11.5" fill="#555" text-anchor="middle">py/vy 永不收敛（P 只增不减）</text>
  <!-- 底部结论 -->
  <rect x="40" y="255" width="390" height="80" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="235" y="280" font-size="12.5" fill="#581c87" text-anchor="middle">增广新状态前先算 rank（行消元，阈值 1e-8）</text>
  <text x="235" y="302" font-size="12.5" fill="#581c87" text-anchor="middle">不可观测：加激励 / 加传感器 / 删状态</text>
  <text x="235" y="324" font-size="11.5" fill="#555" text-anchor="middle">经典病：匀速直行→航向不可观测；单目→尺度不可观测</text>
</svg>
