<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.2 信息滤波器：KF 的对偶（更新只需加法）</text>
  <!-- 对比表 -->
  <rect x="40" y="60" width="290" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="88" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">标准 KF（矩参数化）</text>
  <text x="185" y="118" font-size="13" fill="#1e3a8a" text-anchor="middle">预测（易）：x⁻=Fx, P⁻=FPFᵀ+Q</text>
  <text x="185" y="148" font-size="13" fill="#1e3a8a" text-anchor="middle">更新（难）：K, Joseph 重构 P</text>
  <text x="185" y="178" font-size="12" fill="#555" text-anchor="middle">状态大 → P 稠密难存</text>
  <text x="185" y="204" font-size="12" fill="#555" text-anchor="middle">P→∞ 表示无知</text>
  <rect x="360" y="60" width="290" height="180" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="88" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">信息滤波器 IF（Ω=P⁻¹）</text>
  <text x="505" y="118" font-size="13" fill="#14532d" text-anchor="middle">预测（难）：Ω⁻=(FΩ⁻¹Fᵀ+Q)⁻¹</text>
  <text x="505" y="148" font-size="13" fill="#14532d" text-anchor="middle">更新（易）：Ω += HᵀR⁻¹H ← 加法!</text>
  <text x="505" y="178" font-size="12" fill="#555" text-anchor="middle">无观测的状态不动（稀疏）</text>
  <text x="505" y="204" font-size="12" fill="#555" text-anchor="middle">Ω→0 表示无知</text>
  <!-- 等价 -->
  <rect x="40" y="260" width="600" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="286" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">代数完全等价（demo 对拍差 ~1e-15）</text>
  <text x="340" y="310" font-size="12.5" fill="#78350f" text-anchor="middle">开发轶事：IF 与 KF 差 4.7e-2 → 抓出 KF Joseph 漏写 +KRKᵀ</text>
  <text x="340" y="330" font-size="12" fill="#78350f" text-anchor="middle">等价的东西必须逐位相等，否则必有一边错（交叉验证方法论）</text>
</svg>
