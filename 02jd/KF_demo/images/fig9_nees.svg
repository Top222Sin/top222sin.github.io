<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.4 NEES/NIS：滤波器的"诚实度体检"</text>
  <!-- 两个统计量 -->
  <rect x="40" y="60" width="300" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="86" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">NEES（需真值）</text>
  <text x="190" y="112" font-size="13" fill="#1e3a8a" text-anchor="middle">(x_true−x̂)ᵀ P⁻¹ (x_true−x̂) ~ χ²(n)</text>
  <text x="190" y="138" font-size="12" fill="#555" text-anchor="middle">仿真/测试场验收用</text>
  <rect x="360" y="60" width="300" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="86" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">NIS（只要观测）</text>
  <text x="510" y="112" font-size="13" fill="#14532d" text-anchor="middle">νᵀ S⁻¹ ν ~ χ²(m)</text>
  <text x="510" y="138" font-size="12" fill="#555" text-anchor="middle">在线监控：模型失配/传感器故障报警</text>
  <!-- 体温计 -->
  <g transform="translate(60,200)">
    <rect x="0" y="0" width="560" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="330" y="0" width="230" height="40" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="160" y="25" font-size="13" fill="#14532d" text-anchor="middle">NEES &lt; n：欠信（虚胖，白丢精度）</text>
    <text x="445" y="25" font-size="13" fill="#7f1d1d" text-anchor="middle">NEES &gt; n：过信（说谎！）红灯</text>
    <line x1="300" y1="-8" x2="300" y2="48" stroke="#222" stroke-width="2"/>
    <text x="300" y="62" font-size="12" fill="#222" text-anchor="middle">E[NEES]=n（诚实点）</text>
  </g>
  <!-- demo 数字 -->
  <rect x="40" y="290" width="600" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="311" font-size="13" fill="#78350f" text-anchor="middle">demo（400 次 MC）：匹配 → NEES=1.01 ✅；Q 调小 200× → NEES=40 ❌</text>
  <text x="340" y="332" font-size="12" fill="#78350f" text-anchor="middle">NEES=40 意味实际误差是自报 P 的 6.3 倍——调参从玄学变科学</text>
</svg>
