<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.1 IMU/GPS 误差状态 ES-EKF：标称轨迹 + 小误差滤波</text>
  <defs>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- 架构 -->
  <rect x="40" y="60" width="170" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="88" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">IMU 100Hz</text>
  <text x="125" y="112" font-size="12" fill="#1e3a8a" text-anchor="middle">a_meas = a+b+n</text>
  <text x="125" y="134" font-size="11.5" fill="#555" text-anchor="middle">积分标称轨迹</text>
  <rect x="260" y="60" width="180" height="90" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="350" y="86" font-size="13.5" font-weight="bold" fill="#581c87" text-anchor="middle">误差 KF（线性）</text>
  <text x="350" y="110" font-size="12" fill="#581c87" text-anchor="middle">δx=[δp, δv, δb]</text>
  <text x="350" y="132" font-size="11.5" fill="#555" text-anchor="middle">F 含 −dt²/2, −dt 耦合</text>
  <rect x="490" y="60" width="160" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="88" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">GPS 1~10Hz</text>
  <text x="570" y="112" font-size="12" fill="#14532d" text-anchor="middle">H=[1,0,0]</text>
  <text x="570" y="134" font-size="11.5" fill="#555" text-anchor="middle">更新+误差注入归零</text>
  <line x1="210" y1="105" x2="260" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="490" y1="105" x2="440" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrC)"/>
  <!-- 结果 -->
  <rect x="40" y="180" width="310" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="195" y="206" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">demo 结果（1D 简化）</text>
  <text x="195" y="230" font-size="12.5" fill="#78350f" text-anchor="middle">ES-EKF RMSE 0.12 m vs 纯 DR 4.9 m</text>
  <text x="195" y="254" font-size="12.5" fill="#78350f" text-anchor="middle">零偏 b̂ 收敛：|b̂−b|=0.008</text>
  <rect x="380" y="180" width="270" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="515" y="206" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">GPS 失锁 2 秒（demo 段）</text>
  <text x="515" y="230" font-size="12.5" fill="#7f1d1d" text-anchor="middle">误差 0.077 → 0.137 m（平稳增长）</text>
  <text x="515" y="254" font-size="12.5" fill="#7f1d1d" text-anchor="middle">恢复后 0.041 m：零偏已估准是关键</text>
  <!-- 结论 -->
  <text x="340" y="300" font-size="12.5" fill="#222" text-anchor="middle">为什么误差状态？δx 小 → 线性化永远准；修正后归零重置，</text>
  <text x="340" y="320" font-size="12.5" fill="#222" text-anchor="middle">永远工作在线性化甜点区（PX4 EKF2 同构，24 维扰动状态）</text>
</svg>
