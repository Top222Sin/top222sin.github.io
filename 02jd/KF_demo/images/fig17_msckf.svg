<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.6 MSCKF：左零空间投影消掉特征误差</text>
  <defs>
    <marker id="arrH" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- 对比 -->
  <rect x="40" y="60" width="290" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="86" font-size="13.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">EKF-SLAM</text>
  <text x="185" y="112" font-size="12.5" fill="#7f1d1d" text-anchor="middle">状态 = 机器人 + 所有特征</text>
  <text x="185" y="136" font-size="12.5" fill="#7f1d1d" text-anchor="middle">维数 3+2M（M 上千 → 崩）</text>
  <text x="185" y="160" font-size="12" fill="#7f1d1d" text-anchor="middle">协方差 O(n²) 稠密</text>
  <rect x="360" y="60" width="290" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="505" y="86" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">MSCKF</text>
  <text x="505" y="112" font-size="12.5" fill="#14532d" text-anchor="middle">状态 = IMU误差 + 滑窗位姿克隆</text>
  <text x="505" y="136" font-size="12.5" fill="#14532d" text-anchor="middle">维数 15+6K（K≈20，恒定）</text>
  <text x="505" y="160" font-size="12" fill="#14532d" text-anchor="middle">计算量与特征数解耦 → VIO 实时</text>
  <!-- 零空间投影 -->
  <rect x="40" y="205" width="610" height="115" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="230" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">三行代数（一个特征被 K 个位姿观测）</text>
  <text x="345" y="256" font-size="13.5" fill="#1e3a8a" text-anchor="middle">r = Hx·δx + Hf·δf + n        （δf 是特征误差，讨厌）</text>
  <text x="345" y="282" font-size="13.5" fill="#1e3a8a" text-anchor="middle">A·Hf = 0                        （左零空间，Gram-Schmidt/QR）</text>
  <text x="345" y="308" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">A·r = (A·Hx)·δx + A·n    ← δf 消失，纯位姿约束！</text>
  <text x="345" y="330" font-size="11.5" fill="#555" text-anchor="middle">demo 不变量：f̂ 扰动 1e-5 → 原始 r 变 1e-3，A·r 只变 1e-12</text>
</svg>
