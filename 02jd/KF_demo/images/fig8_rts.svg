<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.3 RTS 平滑器：未来的信息倒灌回过去</text>
  <defs>
    <marker id="arr8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- 前向 -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="500" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="250" y="22" font-size="12.5" fill="#1e3a8a" text-anchor="middle">前向 KF（存档 x_k, P_k, x⁻, P⁻）→</text>
    <!-- 后向 -->
    <rect x="0" y="60" width="500" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="250" y="82" font-size="12.5" fill="#14532d" text-anchor="middle">← 后向 RTS：xˢ_k = x_k + C_k(xˢ_{k+1} − x⁻_{k+1})</text>
    <path d="M490,34 L490,60" stroke="#555" stroke-width="2" marker-end="url(#arr8)"/>
    <text x="150" y="115" font-size="12" fill="#555" text-anchor="middle">C_k = P_k Fᵀ (P⁻_{k+1})⁻¹：把"未来新信息"摊给过去</text>
  </g>
  <!-- 改善曲线 -->
  <g transform="translate(80,210)">
    <line x1="0" y1="110" x2="540" y2="110" stroke="#999"/>
    <line x1="0" y1="110" x2="0" y2="0" stroke="#999"/>
    <path d="M0,15 C60,15 540,15 540,15" stroke="#dc2626" stroke-width="2" fill="none"/>
    <path d="M0,15 C80,100 200,90 270,88 C350,86 450,90 540,12" stroke="#16a34a" stroke-width="2.5" fill="none"/>
    <text x="70" y="10" font-size="12" fill="#dc2626">滤波 RMSE（因果）</text>
    <text x="330" y="72" font-size="12" fill="#16a34a">平滑 RMSE（中段最低）</text>
    <text x="540" y="128" font-size="11" fill="#555" text-anchor="end">k=N</text>
    <text x="2" y="128" font-size="11" fill="#555">k=0</text>
    <text x="270" y="128" font-size="11" fill="#555" text-anchor="middle">末端：平滑=滤波（无未来可用）</text>
  </g>
  <rect x="500" y="60" width="160" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="84" font-size="12.5" fill="#78350f" text-anchor="middle">demo: 0.44 → 0.22</text>
  <text x="580" y="104" font-size="12" fill="#78350f" text-anchor="middle">改善 50%</text>
</svg>
