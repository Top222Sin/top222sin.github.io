<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.5 EKF-SLAM：路标增广 + 回环收敛</text>
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- 回环示意 -->
  <g transform="translate(50,70)">
    <circle cx="120" cy="90" r="75" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4"/>
    <path d="M120,15 A75,75 0 0 1 193,75" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrG)"/>
    <circle cx="120" cy="15" r="5" fill="#16a34a"/>
    <text x="135" y="18" font-size="12" fill="#14532d">起点/终点（回环）</text>
    <circle cx="120" cy="90" r="4" fill="#d97706"/>
    <circle cx="45" cy="90" r="4" fill="#d97706"/>
    <circle cx="195" cy="90" r="4" fill="#d97706"/>
    <text x="120" y="112" font-size="11.5" fill="#78350f" text-anchor="middle">m1</text>
    <text x="38" y="112" font-size="11.5" fill="#78350f" text-anchor="middle">m2</text>
    <text x="200" y="112" font-size="11.5" fill="#78350f" text-anchor="middle">m3</text>
    <line x1="45" y1="90" x2="120" y2="15" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="30" y="45" font-size="11.5" fill="#dc2626">重访 m2：观测同时</text>
    <text x="30" y="62" font-size="11.5" fill="#dc2626">修正路标与位姿</text>
  </g>
  <!-- 联合协方差 -->
  <rect x="330" y="60" width="320" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="490" y="86" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">联合协方差 P（n=3+2M 维，稠密）</text>
  <g transform="translate(360,100)">
    <rect x="0" y="0" width="36" height="36" fill="#2563eb" opacity="0.7"/>
    <rect x="36" y="0" width="90" height="36" fill="#f59e0b" opacity="0.55"/>
    <rect x="0" y="36" width="36" height="90" fill="#f59e0b" opacity="0.55"/>
    <rect x="36" y="36" width="90" height="90" fill="#16a34a" opacity="0.45"/>
    <text x="18" y="22" font-size="10.5" fill="#fff" text-anchor="middle">机器人</text>
    <text x="81" y="85" font-size="11" fill="#14532d" text-anchor="middle">路标块</text>
  </g>
  <text x="490" y="172" font-size="11.5" fill="#dc2626" text-anchor="middle">橙色交叉块 = 相关性：回环拉回全局漂移的通道</text>
  <!-- 结论 -->
  <rect x="40" y="230" width="610" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="256" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">精髓与软肋</text>
  <text x="345" y="280" font-size="12.5" fill="#78350f" text-anchor="middle">精髓：路标↔位姿相关性让"回到旧路标"修正全局漂移（demo 路标误差 &lt; 0.22 m）</text>
  <text x="345" y="304" font-size="12.5" fill="#78350f" text-anchor="middle">软肋：O(n²) 稠密协方差，路标一多实时性崩塌</text>
  <text x="345" y="328" font-size="12" fill="#555" text-anchor="middle">出路：FastSLAM / 图优化（g2o/GTSAM）→ 现代 SLAM 主流</text>
</svg>
