<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.5 Q/R 调参：过信与欠信（8 种子平均 RMSE）</text>
  <!-- 柱状对比 -->
  <g transform="translate(60,60)">
    <text x="0" y="-10" font-size="13" fill="#555">平均 RMSE（越小越好）</text>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#999"/>
    <rect x="20" y="52" width="90" height="108" fill="#16a34a" opacity="0.85"/>
    <text x="65" y="45" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">0.25</text>
    <text x="65" y="180" font-size="12" fill="#14532d" text-anchor="middle">匹配 (q, r)</text>
    <rect x="150" y="0" width="90" height="160" fill="#dc2626" opacity="0.8"/>
    <text x="195" y="-6" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">0.44</text>
    <text x="195" y="180" font-size="12" fill="#7f1d1d" text-anchor="middle">Q×400 (跟噪声)</text>
    <rect x="280" y="106" width="90" height="54" fill="#d97706" opacity="0.85"/>
    <text x="325" y="99" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">0.25~0.26</text>
    <text x="325" y="180" font-size="12" fill="#78350f" text-anchor="middle">R×400 (滞后)</text>
  </g>
  <!-- 病症表 -->
  <rect x="40" y="250" width="610" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="274" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">两种病 × 体检指标（NEES 见 L2.4）</text>
  <text x="345" y="298" font-size="12.5" fill="#78350f" text-anchor="middle">过信（Q 调太小）：跟不上真值 → NEES ≫ n 红灯</text>
  <text x="345" y="322" font-size="12.5" fill="#78350f" text-anchor="middle">欠信（Q/R 虚大）：P 虚胖、估计抖/滞后 → NEES ≪ n</text>
  <!-- 提示 -->
  <rect x="440" y="80" width="220" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="105" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">调参直觉</text>
  <text x="550" y="130" font-size="12" fill="#1e3a8a" text-anchor="middle">想跟手 → Q↑ 或 R↓</text>
  <text x="550" y="152" font-size="12" fill="#1e3a8a" text-anchor="middle">想平滑 → Q↓ 或 R↑</text>
  <text x="550" y="174" font-size="12" fill="#1e3a8a" text-anchor="middle">两者是同一旋钮（L1.3 的 K）</text>
  <text x="550" y="200" font-size="11" fill="#dc2626" text-anchor="middle">单次实现会骗人——必须多种子平均</text>
</svg>
