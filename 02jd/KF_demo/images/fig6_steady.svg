<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.1 稳态 KF：DARE 迭代与 Wiener 等价</text>
  <!-- DARE 迭代环 -->
  <defs>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="60" y="70" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="100" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P⁻ = FPFᵀ + Q</text>
  <text x="160" y="128" font-size="12" fill="#1e3a8a" text-anchor="middle">预测</text>
  <rect x="60" y="200" width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="230" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">P = (I−KH)P⁻(I−KH)ᵀ</text>
  <text x="160" y="252" font-size="13.5" fill="#14532d" text-anchor="middle">+ KRKᵀ（Joseph 完整式）</text>
  <text x="160" y="272" font-size="11" fill="#dc2626" text-anchor="middle">⚠ 漏 +KRKᵀ → 收敛到错误 P</text>
  <path d="M160,150 L160,200" stroke="#555" stroke-width="2" marker-end="url(#arr6)"/>
  <path d="M40,240 L40,110 L60,110" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr6)"/>
  <text x="30" y="180" font-size="12" fill="#555" text-anchor="middle" transform="rotate(-90 30 180)">循环至收敛</text>
  <!-- 收敛示意 -->
  <g transform="translate(330,80)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#999"/>
    <line x1="0" y1="180" x2="280" y2="180" stroke="#999"/>
    <path d="M0,20 C30,120 60,160 100,168 C150,174 220,175 280,175" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="0" y1="177" x2="280" y2="177" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="230" y="168" font-size="12" fill="#d97706">P∞（不动点）</text>
    <text x="140" y="200" font-size="12" fill="#555" text-anchor="middle">迭代次数（~55 步收敛 1e-14）</text>
  </g>
  <!-- Wiener -->
  <rect x="330" y="300" width="330" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="495" y="327" font-size="12.5" fill="#78350f" text-anchor="middle">稳态 KF ≡ Wiener 滤波器：固定 K∞，每拍一次矩阵乘</text>
</svg>
