<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.3 粒子滤波：粒子云表达任意分布</text>
  <defs>
    <marker id="arrE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- SIR 四步 -->
  <g transform="translate(50,60)">
    <rect x="0" y="0" width="140" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="70" y="26" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 传播</text>
    <text x="70" y="48" font-size="11.5" fill="#1e3a8a" text-anchor="middle">粒子过模型+噪声</text>
    <rect x="170" y="0" width="140" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="240" y="26" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">② 加权</text>
    <text x="240" y="48" font-size="11.5" fill="#14532d" text-anchor="middle">w ∝ p(z|xᵢ)</text>
    <rect x="340" y="0" width="140" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="410" y="26" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">③ 估计</text>
    <text x="410" y="48" font-size="11.5" fill="#78350f" text-anchor="middle">加权均值/分位数</text>
    <rect x="510" y="0" width="140" height="64" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="580" y="26" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">④ 重采样</text>
    <text x="580" y="48" font-size="11.5" fill="#581c87" text-anchor="middle">Neff&lt;N/2 时触发</text>
    <path d="M650,32 L672,32 L672,96 L20,96 L20,64" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrE)"/>
  </g>
  <!-- 双峰示意 -->
  <g transform="translate(60,190)">
    <line x1="0" y1="110" x2="560" y2="110" stroke="#999"/>
    <g fill="#2563eb">
      <circle cx="80" cy="60" r="3.5"/><circle cx="95" cy="40" r="4"/><circle cx="110" cy="55" r="3.5"/>
      <circle cx="65" cy="45" r="3"/><circle cx="125" cy="65" r="3"/>
    </g>
    <g fill="#16a34a">
      <circle cx="330" cy="70" r="4.5"/><circle cx="350" cy="45" r="5.5"/><circle cx="370" cy="60" r="5"/>
      <circle cx="312" cy="50" r="4"/><circle cx="390" cy="72" r="4"/><circle cx="350" cy="78" r="4.5"/>
    </g>
    <text x="100" y="128" font-size="12" fill="#2563eb" text-anchor="middle">假峰（野值 x+3）小权重</text>
    <text x="355" y="128" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">真值峰：权重集中</text>
    <text x="480" y="40" font-size="12" fill="#7f1d1d">KF 的单峰高斯</text>
    <text x="480" y="58" font-size="12" fill="#7f1d1d">被迫骑在两峰间</text>
    <path d="M200,105 Q240,30 280,105" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3"/>
  </g>
  <rect x="420" y="150" width="230" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="535" y="174" font-size="12" fill="#78350f" text-anchor="middle">demo：多峰 PF=0.39 vs KF=1.09</text>
</svg>
