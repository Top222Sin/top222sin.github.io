<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.3 增益 K：边界行为与稳态 Riccati</text>
  <!-- 数轴 -->
  <line x1="60" y1="120" x2="620" y2="120" stroke="#555" stroke-width="2"/>
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="60" y1="120" x2="620" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arr3)"/>
  <circle cx="100" cy="120" r="7" fill="#dc2626"/>
  <circle cx="580" cy="120" r="7" fill="#2563eb"/>
  <circle cx="340" cy="120" r="7" fill="#16a34a"/>
  <text x="100" y="95" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">K = 1</text>
  <text x="100" y="150" font-size="12" fill="#dc2626" text-anchor="middle">r→0 全信观测</text>
  <text x="100" y="167" font-size="11" fill="#555" text-anchor="middle">x 直接跳到 z</text>
  <text x="580" y="95" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">K = 0</text>
  <text x="580" y="150" font-size="12" fill="#2563eb" text-anchor="middle">r→∞ 全信模型</text>
  <text x="580" y="167" font-size="11" fill="#555" text-anchor="middle">忽略观测</text>
  <text x="340" y="95" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">K ∈ (0,1)</text>
  <text x="340" y="150" font-size="12" fill="#16a34a" text-anchor="middle">方差加权折中</text>
  <!-- K 收敛曲线 -->
  <g transform="translate(80,200)">
    <line x1="0" y1="120" x2="540" y2="120" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="120" x2="0" y2="0" stroke="#999" stroke-width="1"/>
    <path d="M0,24 C40,60 90,90 150,101 C220,109 320,112 540,112" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="0" y1="115" x2="540" y2="115" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="500" y="110" font-size="12" fill="#d97706">K∞ ≈ 0.27</text>
    <text x="20" y="20" font-size="12" fill="#2563eb">K₀ ≈ 0.80</text>
    <text x="270" y="138" font-size="12" fill="#555" text-anchor="middle">步数 k（单调收敛，与初值无关）</text>
  </g>
  <rect x="380" y="35" width="280" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="61" font-size="12.5" fill="#78350f" text-anchor="middle">稳态：p ← (1−K)(p+q) 收敛 → K∞ 唯一</text>
</svg>
