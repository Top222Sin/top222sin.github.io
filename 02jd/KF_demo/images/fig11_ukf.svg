<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.6 UKF：sigma 点"穿"过非线性 vs 一点线性化</text>
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <!-- sigma 点示意 -->
  <g transform="translate(50,70)">
    <ellipse cx="80" cy="70" rx="55" ry="40" fill="#dbeafe" opacity="0.6" stroke="#2563eb" stroke-dasharray="4,3"/>
    <circle cx="80" cy="70" r="4" fill="#222"/>
    <circle cx="25" cy="70" r="4" fill="#d97706"/>
    <circle cx="135" cy="70" r="4" fill="#d97706"/>
    <circle cx="80" cy="30" r="4" fill="#d97706"/>
    <circle cx="80" cy="110" r="4" fill="#d97706"/>
    <text x="80" y="132" font-size="12" fill="#1e3a8a" text-anchor="middle">N(x, P)：中心 + ±√(n+λ)·colᵢ(√P)</text>
    <line x1="170" y1="70" x2="230" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="200" y="58" font-size="11.5" fill="#555" text-anchor="middle">非线性 f/h</text>
    <ellipse cx="330" cy="55" rx="60" ry="30" fill="#dcfce7" opacity="0.6" stroke="#16a34a" stroke-dasharray="4,3"/>
    <circle cx="330" cy="55" r="4" fill="#222"/>
    <circle cx="280" cy="70" r="4" fill="#d97706"/>
    <circle cx="380" cy="40" r="4" fill="#d97706"/>
    <text x="330" y="105" font-size="12" fill="#14532d" text-anchor="middle">传播后的点 → 加权矩匹配</text>
    <text x="330" y="122" font-size="12" fill="#14532d" text-anchor="middle">均值/协方差精确到三阶</text>
  </g>
  <!-- 对比数据 -->
  <rect x="460" y="70" width="210" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="565" y="96" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">极坐标→直角 vs 40万MC</text>
  <text x="565" y="122" font-size="12.5" fill="#78350f" text-anchor="middle">EKF 均值误差 0.088</text>
  <text x="565" y="146" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">UKF 均值误差 0.0007（120×）</text>
  <text x="565" y="172" font-size="12.5" fill="#78350f" text-anchor="middle">EKF 协方差低估不确定性</text>
  <text x="565" y="196" font-size="11" fill="#555" text-anchor="middle">线性模型下 UKF ≡ KF（demo ~1e-11）</text>
  <!-- 权重警示 -->
  <rect x="40" y="230" width="620" height="110" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="350" y="256" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">实现细节（本仓库真实踩坑）</text>
  <text x="350" y="282" font-size="12.5" fill="#581c87" text-anchor="middle">① α=1e-3 时权重 ±10⁶，浮点对消 → 教学实现建议 α=1.0</text>
  <text x="350" y="306" font-size="12.5" fill="#581c87" text-anchor="middle">② 更新阶段必须从 N(x⁻,P⁻) 重新采点，复用旧点会丢 Q 的贡献</text>
  <text x="350" y="330" font-size="12" fill="#555" text-anchor="middle">不变量自检：线性模型下 UKF 必须逐位等于 KF</text>
</svg>
