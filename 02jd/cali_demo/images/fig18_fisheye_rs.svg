<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L4 鱼眼模型 + 滚动快门（工业相机非理想现实）</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5f5e5a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A32D2D"/></marker>
  </defs>

  <!-- ============ Panel A: 广角投影压缩 ============ -->
  <text x="175" y="52" text-anchor="middle" font-size="11" fill="#0c447c">① 广角投影：鱼眼把 θ 压进有限半径</text>
  <!-- 坐标轴 -->
  <line x1="60" y1="240" x2="330" y2="240" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="60" y1="240" x2="60" y2="40" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="345" y="244" font-size="9" fill="#5f5e5a">θ (°)</text>
  <text x="48" y="36" font-size="9" fill="#5f5e5a">像素半径</text>
  <!-- 刻度 0/45/90 -->
  <text x="60"  y="254" font-size="8" fill="#5f5e5a" text-anchor="middle">0</text>
  <text x="195" y="254" font-size="8" fill="#5f5e5a" text-anchor="middle">45</text>
  <text x="330" y="254" font-size="8" fill="#5f5e5a" text-anchor="middle">90</text>

  <!-- 鱼眼曲线 f·θ_d(θ): θ=0→r=0 ; θ=90→r=803 → y=240-803*0.249=40 -->
  <polyline points="60,240 93,205 126,177 159,153 192,132 225,114 258,96 291,72 330,40"
            fill="none" stroke="#185FA5" stroke-width="2.2"/>
  <circle cx="330" cy="40" r="3" fill="#185FA5"/>
  <text x="338" y="44" font-size="9" fill="#0c447c">鱼眼 r=f·θ_d(θ) 有界</text>

  <!-- 针孔曲线 f·tanθ: 60°→519.6(y=111) 69.5°→803(y=40) 之后出界→∞ -->
  <polyline points="60,240 133,160 195,111 256,68 285,48" fill="none" stroke="#A32D2D" stroke-width="2.2" stroke-dasharray="5 3"/>
  <path d="M285 48 L300 30 L312 18" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="300" y="22" font-size="9" fill="#a32d2d">针孔 r=f·tanθ →∞</text>

  <rect x="150" y="262" width="180" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="240" y="279" font-size="9" fill="#27500a" text-anchor="middle">同 f/传感器：鱼眼 90° vs 针孔 69.5°</text>

  <!-- ============ Panel B: 滚动快门倾斜 ============ -->
  <text x="510" y="52" text-anchor="middle" font-size="11" fill="#0c447c">② 滚动快门：竖直直线被剪切为斜线</text>
  <!-- 图像框 -->
  <rect x="400" y="70" width="200" height="150" rx="4" fill="#fbfcfe" stroke="#5f5e5a"/>
  <text x="500" y="64" font-size="8" fill="#5f5e5a" text-anchor="middle">CMOS 逐行读出 (顶→底)</text>
  <!-- 扫描行提示 -->
  <g stroke="#cbd5e0" stroke-width="0.6">
    <line x1="400" y1="95"  x2="600" y2="95"/><line x1="400" y1="120" x2="600" y2="120"/>
    <line x1="400" y1="145" x2="600" y2="145"/><line x1="400" y1="170" x2="600" y2="170"/>
    <line x1="400" y1="195" x2="600" y2="195"/>
  </g>
  <!-- 全局快门：竖直绿线 -->
  <line x1="500" y1="78" x2="500" y2="212" stroke="#3B6D11" stroke-width="2.4"/>
  <text x="508" y="92" font-size="8" fill="#27500a">全局快门</text>
  <!-- 滚动快门：红斜线（倾斜 ~73px） -->
  <line x1="448" y1="78" x2="552" y2="212" stroke="#A32D2D" stroke-width="2.4"/>
  <text x="556" y="92" font-size="8" fill="#a32d2d">RS 倾斜</text>

  <!-- 时序条 -->
  <rect x="400" y="232" width="200" height="14" rx="3" fill="#E6F0FA" stroke="#185FA5"/>
  <line x1="400" y1="239" x2="600" y2="239" stroke="#185FA5" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="400" y="258" font-size="8" fill="#0c447c">t(v) = (v/H)·T_read，φ(v)=ω·t(v)</text>
  <text x="400" y="272" font-size="8" fill="#a32d2d">ω 绕光轴滚动 → u(v)=cx−(v−cy)·tanφ(v)</text>

  <rect x="430" y="285" width="140" height="0" fill="none"/>
</svg>
