<svg viewBox="0 0 680 330" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L2.5 四类误差校验指标</text>

  <!-- ① 内参逐图重投影误差 -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="300" height="115" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#27500a">① 内参：逐图重投影</text>
    <line x1="40" y1="100" x2="270" y2="100" stroke="#5f5e5a"/>
    <g fill="#639922">
      <rect x="50"  y="86" width="16" height="14"/>
      <rect x="72"  y="80" width="16" height="20"/>
      <rect x="94"  y="90" width="16" height="10"/>
      <rect x="116" y="78" width="16" height="22"/>
      <rect x="138" y="88" width="16" height="12"/>
      <rect x="160" y="82" width="16" height="18"/>
      <rect x="182" y="92" width="16" height="8"/>
      <rect x="204" y="84" width="16" height="16"/>
      <rect x="226" y="88" width="16" height="12"/>
      <rect x="248" y="86" width="16" height="14"/>
    </g>
    <line x1="40" y1="84" x2="270" y2="84" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="210" y="80" font-size="9" fill="#8a5a0f">均值线</text>
    <text x="150" y="112" text-anchor="middle" font-size="9" fill="#27500a">每图残差（px）≈ 噪声水平</text>
  </g>

  <!-- ② 手眼 AX=XB 一致性 -->
  <g transform="translate(360,50)">
    <rect x="0" y="0" width="300" height="115" rx="10" fill="#E6F0FA" stroke="#185FA5" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#0c447c">② 手眼：AX = XB 一致性</text>
    <!-- 两条路径汇合 -->
    <path d="M40 80 L120 50 L210 50 L270 80" fill="none" stroke="#185FA5" stroke-width="2"/>
    <path d="M40 80 L120 110 L210 110 L270 80" fill="none" stroke="#5B9BD5" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="40" cy="80" r="4" fill="#0c447c"/><text x="34" y="98" font-size="9" fill="#0c447c">基</text>
    <circle cx="270" cy="80" r="4" fill="#0c447c"/><text x="262" y="98" font-size="9" fill="#0c447c">板</text>
    <text x="120" y="44" font-size="9" fill="#185FA5">A·X</text>
    <text x="120" y="124" font-size="9" fill="#5B9BD5">X·B</text>
    <!-- 残差小弧 -->
    <path d="M255 70 Q270 80 255 90" fill="none" stroke="#E24B4A" stroke-width="1.5"/>
    <text x="210" y="72" font-size="9" fill="#a32d2d">残差 δ</text>
    <text x="150" y="108" text-anchor="middle" font-size="9" fill="#0c447c">两路应重合；δ 大=手眼错</text>
  </g>

  <!-- ③ TCP 多点一致性 -->
  <g transform="translate(20,185)">
    <rect x="0" y="0" width="300" height="115" rx="10" fill="#FBF1D6" stroke="#BA7517" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#8a5a0f">③ TCP：多点一致性</text>
    <circle cx="150" cy="75" r="4" fill="#7a4f00"/><text x="156" y="72" font-size="9" fill="#7a4f00">TCP（同一点）</text>
    <g stroke="#BA7517" stroke-width="1.5" fill="none">
      <line x1="150" y1="75" x2="60"  y2="40"/>
      <line x1="150" y1="75" x2="240" y2="40"/>
      <line x1="150" y1="75" x2="70"  y2="100"/>
      <line x1="150" y1="75" x2="235" y2="100"/>
      <line x1="150" y1="75" x2="150" y2="35"/>
    </g>
    <g fill="#BA7517"><circle cx="60" cy="40" r="3"/><circle cx="240" cy="40" r="3"/><circle cx="70" cy="100" r="3"/><circle cx="235" cy="100" r="3"/><circle cx="150" cy="35" r="3"/></g>
    <text x="150" y="112" text-anchor="middle" font-size="9" fill="#8a5a0f">多点应汇聚于同一尖点（max 距离=误差）</text>
  </g>

  <!-- ④ 系统性 vs 随机（半径分箱） -->
  <g transform="translate(360,185)">
    <rect x="0" y="0" width="300" height="115" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#501313">④ 系统性 vs 随机（径向分箱）</text>
    <!-- 随机：均匀 -->
    <text x="12" y="42" font-size="9" fill="#27500a">随机噪声</text>
    <rect x="90" y="34" width="60" height="10" fill="#639922"/><text x="156" y="43" font-size="8" fill="#444441">中心</text>
    <rect x="90" y="48" width="66" height="10" fill="#639922"/><text x="162" y="57" font-size="8" fill="#444441">边缘</text>
    <text x="250" y="50" font-size="9" fill="#27500a">≈ 均匀</text>
    <!-- 模型错：边缘系统性偏大 -->
    <text x="12" y="80" font-size="9" fill="#a32d2d">模型错</text>
    <rect x="90" y="72" width="40" height="10" fill="#E24B4A"/><text x="136" y="81" font-size="8" fill="#444441">中心</text>
    <rect x="90" y="86" width="150" height="10" fill="#E24B4A"/><text x="246" y="95" font-size="8" fill="#444441">边缘</text>
    <text x="250" y="90" font-size="9" fill="#a32d2d">边缘 ≫ 中心</text>
    <text x="150" y="112" text-anchor="middle" font-size="9" fill="#501313">按主点半径分箱即可区分两类残差</text>
  </g>
</svg>
