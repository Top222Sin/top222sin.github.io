<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">双目 rig：左右相机 + 基线 B + 极线约束</text>

  <!-- 基线 B -->
  <line x1="120" y1="70" x2="560" y2="70" stroke="#185FA5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">基线 B = ‖T‖</text>

  <!-- 左相机 -->
  <g transform="translate(110,70)">
    <rect x="-26" y="0" width="52" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="10" fill="#185FA5"/>
    <text x="0" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">左相机</text>
    <text x="0" y="78" text-anchor="middle" font-size="10" fill="#444441">K_L, 外参</text>
  </g>

  <!-- 右相机 -->
  <g transform="translate(550,70)">
    <rect x="-26" y="0" width="52" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="10" fill="#185FA5"/>
    <text x="0" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">右相机</text>
    <text x="0" y="78" text-anchor="middle" font-size="10" fill="#444441">K_R, 外参</text>
  </g>

  <!-- 棋盘（前方） -->
  <g transform="translate(300,170)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#fff" stroke="#3B6D11" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="20" y2="60" stroke="#3B6D11"/>
    <line x1="40" y1="0" x2="40" y2="60" stroke="#3B6D11"/>
    <line x1="60" y1="0" x2="60" y2="60" stroke="#3B6D11"/>
    <line x1="0" y1="20" x2="80" y2="20" stroke="#3B6D11"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#3B6D11"/>
    <text x="40" y="82" text-anchor="middle" font-size="11" fill="#27500a">同步拍摄的棋盘</text>
  </g>

  <!-- 空间点 X 与射线 -->
  <circle cx="340" cy="200" r="4" fill="#E24B4A"/>
  <text x="350" y="204" font-size="11" fill="#a32d2d">X</text>
  <line x1="340" y1="200" x2="110" y2="90" stroke="#E24B4A" stroke-width="1.5"/>
  <line x1="340" y1="200" x2="550" y2="90" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="200" y="150" font-size="10" fill="#a32d2d">极线(左)</text>
  <text x="430" y="150" font-size="10" fill="#a32d2d">极线(右)</text>

  <!-- 相对位姿标注 -->
  <g transform="translate(250,250)">
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#FCEBEB" stroke="#993C1D" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">双目标定 → 求 R, T (‖T‖=B)</text>
  </g>
</svg>
