<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L4.4 结构光 3D 扫描（相移解码 + 高度恢复）</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5f5e5a"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#185FA5"/></marker>
  </defs>

  <!-- ============ Panel A: 相移条纹 + 解码 ============ -->
  <text x="175" y="52" text-anchor="middle" font-size="11" fill="#0c447c">① N=4 步相移正弦条纹 + 相位解码</text>
  <!-- 投影仪->物体->相机 -->
  <rect x="70" y="70" width="34" height="22" rx="4" fill="#E6F0FA" stroke="#185FA5"/>
  <text x="87" y="85" text-anchor="middle" font-size="8" fill="#0c447c">投影</text>
  <rect x="246" y="64" width="40" height="34" rx="4" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="266" y="85" text-anchor="middle" font-size="8" fill="#27500a">物体</text>
  <rect x="430" y="70" width="34" height="22" rx="4" fill="#FBEAEA" stroke="#A32D2D"/>
  <text x="447" y="85" text-anchor="middle" font-size="8" fill="#a32d2d">相机</text>
  <line x1="104" y1="81" x2="246" y2="81" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arB)"/>
  <line x1="286" y1="81" x2="430" y2="81" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 4 条相移条纹 -->
  <g transform="translate(0,120)">
    <line x1="60" y1="60" x2="330" y2="60" stroke="#5f5e5a" stroke-width="1"/>
    <text x="48" y="64" font-size="8" fill="#5f5e5a">u</text>
    <polyline points="60,60 84,34 108,60 132,86 156,60 180,34 204,60 228,86 252,60 276,34 300,60 324,86 330,58" fill="none" stroke="#185FA5" stroke-width="2"/>
    <text x="120" y="22" font-size="8" fill="#0c447c">I₀: cos(θ)</text>
    <polyline points="60,60 84,86 108,60 132,34 156,60 180,86 204,60 228,34 252,60 276,86 300,60 324,34 330,42" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="200" y="22" font-size="8" fill="#27500a">I₁: cos(θ+90°)</text>
    <polyline points="60,60 84,60 108,60 132,60 156,60 180,60 204,60 228,60 252,60 276,60 300,60 324,60 330,60" fill="none" stroke="#A32D2D" stroke-width="1.4" stroke-dasharray="2 3"/>
    <text x="60" y="44" font-size="8" fill="#a32d2d">I₂: cos(θ+180°)</text>
  </g>

  <!-- 解码盒 -->
  <rect x="360" y="150" width="200" height="44" rx="6" fill="#E6F0FA" stroke="#185FA5"/>
  <text x="460" y="168" text-anchor="middle" font-size="9.5" fill="#0c447c">φ_w = atan2(ΣIₙsin, ΣIₙcos)</text>
  <text x="460" y="184" text-anchor="middle" font-size="9.5" fill="#0c447c">解包裹(参考平面定整周期) → p_est</text>
  <line x1="330" y1="180" x2="360" y2="172" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arB)"/>

  <rect x="360" y="210" width="280" height="34" rx="6" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="500" y="228" text-anchor="middle" font-size="9.5" fill="#27500a">解码=-θ 精确；无整周期跳变（真斜率 1.8 ≪ 周期 24）</text>

  <!-- ============ Panel B: 高度恢复 ============ -->
  <text x="505" y="52" text-anchor="middle" font-size="11" fill="#0c447c">② 高度场恢复（3D 重建）</text>
  <!-- 高度剖面 h(u) at v=vc -->
  <line x1="400" y1="250" x2="640" y2="250" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="400" y1="250" x2="400" y2="110" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="646" y="254" font-size="8" fill="#5f5e5a">u</text>
  <text x="392" y="116" font-size="8" fill="#5f5e5a">h</text>
  <!-- 高斯凸起剖面 (峰值2.0 对应 y=250-2.0*55=140) -->
  <polyline points="400,250 420,246 440,234 460,214 480,190 500,168 520,150 540,140 560,150 580,168 600,190 620,214 640,234"
            fill="none" stroke="#A32D2D" stroke-width="2.2"/>
  <circle cx="540" cy="140" r="3" fill="#A32D2D"/>
  <text x="548" y="138" font-size="8" fill="#a32d2d">峰值 h=2.0</text>
  <text x="400" y="268" font-size="8" fill="#5f5e5a">参考平面 h=0</text>
  <line x1="400" y1="250" x2="640" y2="250" stroke="#3B6D11" stroke-width="1.4"/>

  <rect x="400" y="278" width="240" height="0" fill="none"/>
  <rect x="420" y="278" width="200" height="16" fill="none"/>
  <text x="520" y="292" font-size="8.5" fill="#27500a">最大恢复误差 ~1.97e-14（bit 级精确）</text>
</svg>
