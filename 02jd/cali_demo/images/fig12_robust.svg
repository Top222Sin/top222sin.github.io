<svg viewBox="0 0 680 260" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L3.2 鲁棒估计：RANSAC 剔坏帧</text>

  <!-- ① 含坏帧的数据 -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="190" height="165" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#501313">① 采集帧（含坏帧）</text>
    <g>
      <circle cx="40" cy="55" r="6" fill="#5B9BD5"/><circle cx="70" cy="55" r="6" fill="#5B9BD5"/><circle cx="100" cy="55" r="6" fill="#5B9BD5"/><circle cx="130" cy="55" r="6" fill="#5B9BD5"/>
      <circle cx="40" cy="85" r="6" fill="#5B9BD5"/><circle cx="70" cy="85" r="6" fill="#A32D2D"/><circle cx="100" cy="85" r="6" fill="#5B9BD5"/><circle cx="130" cy="85" r="6" fill="#5B9BD5"/>
      <circle cx="40" cy="115" r="6" fill="#5B9BD5"/><circle cx="70" cy="115" r="6" fill="#5B9BD5"/><circle cx="100" cy="115" r="6" fill="#A32D2D"/><circle cx="130" cy="115" r="6" fill="#5B9BD5"/>
      <circle cx="40" cy="145" r="6" fill="#5B9BD5"/><circle cx="70" cy="145" r="6" fill="#5B9BD5"/><circle cx="100" cy="145" r="6" fill="#5B9BD5"/><circle cx="130" cy="145" r="6" fill="#A32D2D"/>
    </g>
    <text x="95" y="180" text-anchor="middle" font-size="9" fill="#501313">红=坏帧（系统性偏差）</text>
  </g>

  <!-- 箭头 + 中位数评分 -->
  <g transform="translate(220,50)">
    <text x="0" y="40" font-size="11" fill="#1a202c">RANSAC</text>
    <text x="0" y="58" font-size="9" fill="#444441">多子集采样</text>
    <text x="0" y="74" font-size="9" fill="#444441">中位数评分</text>
    <text x="0" y="90" font-size="9" fill="#444441">取最低中位</text>
    <text x="0" y="106" font-size="9" fill="#444441">inlier 精修</text>
    <path d="M150 60 L180 60" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- ③ 结果对比 -->
  <g transform="translate(410,50)">
    <rect x="0" y="0" width="250" height="165" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#27500a">③ 内参恢复对比（焦距误差）</text>
    <!-- baseline 红 -->
    <rect x="30" y="45" width="190" height="22" fill="#FCEBEB" stroke="#A32D2D"/>
    <rect x="30" y="45" width="150" height="22" fill="#E24B4A"/>
    <text x="35" y="61" font-size="9" fill="#fff">基线(含坏帧) 偏大</text>
    <!-- robust 绿 -->
    <rect x="30" y="85" width="190" height="22" fill="#EAF3DE" stroke="#3B6D11"/>
    <rect x="30" y="85" width="30" height="22" fill="#639922"/>
    <text x="35" y="101" font-size="9" fill="#fff">RANSAC 小</text>
    <text x="125" y="135" text-anchor="middle" font-size="9" fill="#27500a">inlier 精修 → 拉回真值 ✓</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#185FA5"/>
    </marker>
  </defs>
</svg>
