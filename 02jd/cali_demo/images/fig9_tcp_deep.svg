<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L2.4 误差传播与共面退化</text>

  <!-- 左：误差随噪声 -->
  <g transform="translate(20,55)">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <text x="150" y="-8" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">TCP 误差 vs 法兰噪声</text>
    <line x1="40" y1="170" x2="270" y2="170" stroke="#5f5e5a"/>
    <!-- 0.5mm -->
    <rect x="60" y="140" width="44" height="30" fill="#639922"/><text x="82" y="186" text-anchor="middle" font-size="9" fill="#444441">0.5mm</text>
    <!-- 1mm -->
    <rect x="130" y="110" width="44" height="60" fill="#BA7517"/><text x="152" y="186" text-anchor="middle" font-size="9" fill="#444441">1mm</text>
    <!-- 3mm -->
    <rect x="200" y="50" width="44" height="120" fill="#E24B4A"/><text x="222" y="186" text-anchor="middle" font-size="9" fill="#444441">3mm</text>
    <text x="150" y="195" text-anchor="middle" font-size="10" fill="#444441">输入噪声↑  ⇒  TCP 误差↑</text>
  </g>

  <!-- 右：球心拟合 -->
  <g transform="translate(360,55)">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <text x="150" y="-8" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">球心拟合（四点法本质）</text>
    <!-- 好：3D 散布 -->
    <circle cx="80" cy="100" r="48" fill="none" stroke="#639922" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g fill="#639922"><circle cx="80" cy="52" r="3"/><circle cx="124" cy="100" r="3"/><circle cx="80" cy="148" r="3"/><circle cx="40" cy="120" r="3"/><circle cx="110" cy="70" r="3"/></g>
    <circle cx="80" cy="100" r="4" fill="#27500a"/><text x="80" y="170" text-anchor="middle" font-size="9" fill="#27500a">3D 散布→球心唯一 ✓</text>
    <!-- 退化：共面 -->
    <line x1="170" y1="60" x2="270" y2="60" stroke="#A32D2D" stroke-width="2"/>
    <g fill="#A32D2D"><circle cx="185" cy="60" r="3"/><circle cx="210" cy="60" r="3"/><circle cx="235" cy="60" r="3"/><circle cx="260" cy="60" r="3"/></g>
    <text x="220" y="90" text-anchor="middle" font-size="9" fill="#a32d2d">共面→法向不可观 ✗</text>
    <text x="220" y="110" text-anchor="middle" font-size="9" fill="#a32d2d">A 矩阵病态</text>
  </g>
</svg>
