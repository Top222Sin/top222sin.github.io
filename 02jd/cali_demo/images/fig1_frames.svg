<svg viewBox="0 0 680 360" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L1.1 四大坐标系与变换链</text>

  <!-- 节点模板：圆角矩形 + 三色坐标轴(小 trihedron) -->
  <g>
    <rect x="30" y="70" width="130" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="70" cy="118" r="3" fill="#444441"/>
    <line x1="70" y1="118" x2="105" y2="118" stroke="#E24B4A" stroke-width="2"/>
    <line x1="70" y1="118" x2="70" y2="90" stroke="#639922" stroke-width="2"/>
    <line x1="70" y1="118" x2="55" y2="132" stroke="#378ADD" stroke-width="2"/>
    <text x="135" y="96" text-anchor="end" font-size="13" font-weight="500" fill="#0c447c">target</text>
    <text x="135" y="114" text-anchor="end" font-size="11" fill="#5f5e5a">标定板系</text>
  </g>
  <g>
    <rect x="190" y="70" width="130" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="230" cy="118" r="3" fill="#444441"/>
    <line x1="230" y1="118" x2="265" y2="118" stroke="#E24B4A" stroke-width="2"/>
    <line x1="230" y1="118" x2="230" y2="90" stroke="#639922" stroke-width="2"/>
    <line x1="230" y1="118" x2="215" y2="132" stroke="#378ADD" stroke-width="2"/>
    <text x="295" y="96" text-anchor="end" font-size="13" font-weight="500" fill="#0c447c">cam</text>
    <text x="295" y="114" text-anchor="end" font-size="11" fill="#5f5e5a">相机系</text>
  </g>
  <g>
    <rect x="350" y="70" width="130" height="76" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <circle cx="390" cy="118" r="3" fill="#444441"/>
    <line x1="390" y1="118" x2="425" y2="118" stroke="#E24B4A" stroke-width="2"/>
    <line x1="390" y1="118" x2="390" y2="90" stroke="#639922" stroke-width="2"/>
    <line x1="390" y1="118" x2="375" y2="132" stroke="#378ADD" stroke-width="2"/>
    <text x="455" y="96" text-anchor="end" font-size="13" font-weight="500" fill="#27500a">gripper</text>
    <text x="455" y="114" text-anchor="end" font-size="11" fill="#5f5e5a">末端/工具系</text>
  </g>
  <g>
    <rect x="510" y="70" width="140" height="76" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <circle cx="550" cy="118" r="3" fill="#444441"/>
    <line x1="550" y1="118" x2="585" y2="118" stroke="#E24B4A" stroke-width="2"/>
    <line x1="550" y1="118" x2="550" y2="90" stroke="#639922" stroke-width="2"/>
    <line x1="550" y1="118" x2="535" y2="132" stroke="#378ADD" stroke-width="2"/>
    <text x="635" y="96" text-anchor="end" font-size="13" font-weight="500" fill="#27500a">base</text>
    <text x="635" y="114" text-anchor="end" font-size="11" fill="#5f5e5a">机器人基座系</text>
  </g>

  <!-- 箭头 + 变换标签 -->
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <line x1="165" y1="108" x2="183" y2="108" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="174" y="100" text-anchor="middle" font-size="10" fill="#5f5e5a">T_t2c</text>
  <line x1="325" y1="108" x2="343" y2="108" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="334" y="100" text-anchor="middle" font-size="10" fill="#5f5e5a">T_c2g</text>
  <line x1="485" y1="108" x2="503" y2="108" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="494" y="100" text-anchor="middle" font-size="10" fill="#5f5e5a">T_g2b</text>

  <!-- 链公式 -->
  <rect x="60" y="190" width="560" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="214" text-anchor="middle" font-size="13" fill="#633806">T_target2base = T_gripper2base · T_cam2gripper · T_target2cam</text>
  <text x="340" y="234" text-anchor="middle" font-size="11" fill="#854f0b">左乘顺序：从右到左逐层把点变到基座系（target→cam→gripper→base）</text>

  <!-- 说明 -->
  <text x="60" y="290" font-size="12" fill="#444441">要点：</text>
  <text x="60" y="312" font-size="12" fill="#444441">1) T 复合是左乘，求逆用 Rᵀ/-Rᵀt（或 SVD 数值逆）；2) 欧拉角有万向锁，优化/组合用 R·四元数·旋转向量；</text>
  <text x="60" y="332" font-size="12" fill="#444441">3) 记号 T_A2B = "A 在 B 下的位姿"。本图所有变换在 demo 里随机生成并做闭环校验。</text>
</svg>
