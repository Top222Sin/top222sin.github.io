<svg viewBox="0 0 680 290" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L1.2 三类标定板：检测 → 3D 映射</text>

  <!-- 棋盘格 -->
  <g transform="translate(40,55)">
    <rect x="0" y="0" width="150" height="100" rx="6" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <g>
      <rect x="10" y="10" width="20" height="20" fill="#222"/><rect x="50" y="10" width="20" height="20" fill="#222"/><rect x="90" y="10" width="20" height="20" fill="#222"/><rect x="130" y="10" width="10" height="20" fill="#222"/>
      <rect x="30" y="30" width="20" height="20" fill="#222"/><rect x="70" y="30" width="20" height="20" fill="#222"/><rect x="110" y="30" width="20" height="20" fill="#222"/>
      <rect x="10" y="50" width="20" height="20" fill="#222"/><rect x="50" y="50" width="20" height="20" fill="#222"/><rect x="90" y="50" width="20" height="20" fill="#222"/><rect x="130" y="50" width="10" height="20" fill="#222"/>
      <rect x="30" y="70" width="20" height="20" fill="#222"/><rect x="70" y="70" width="20" height="20" fill="#222"/><rect x="110" y="70" width="20" height="20" fill="#222"/>
    </g>
    <text x="75" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">棋盘格 Chessboard</text>
    <text x="75" y="143" text-anchor="middle" font-size="10" fill="#5f5e5a">findChessboardCorners</text>
  </g>

  <!-- 圆点阵 -->
  <g transform="translate(270,55)">
    <rect x="0" y="0" width="150" height="100" rx="6" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <g fill="#222">
      <circle cx="20" cy="20" r="7"/><circle cx="55" cy="20" r="7"/><circle cx="90" cy="20" r="7"/><circle cx="125" cy="20" r="7"/>
      <circle cx="20" cy="55" r="7"/><circle cx="55" cy="55" r="7"/><circle cx="90" cy="55" r="7"/><circle cx="125" cy="55" r="7"/>
      <circle cx="20" cy="80" r="7"/><circle cx="55" cy="80" r="7"/><circle cx="90" cy="80" r="7"/><circle cx="125" cy="80" r="7"/>
    </g>
    <text x="75" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">圆点阵 Circles</text>
    <text x="75" y="143" text-anchor="middle" font-size="10" fill="#5f5e5a">findCirclesGrid</text>
  </g>

  <!-- Charuco -->
  <g transform="translate(500,55)">
    <rect x="0" y="0" width="150" height="100" rx="6" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <g>
      <rect x="10" y="10" width="22" height="22" fill="#222"/><rect x="54" y="10" width="22" height="22" fill="#222"/><rect x="98" y="10" width="22" height="22" fill="#222"/>
      <rect x="32" y="32" width="22" height="22" fill="#222"/><rect x="76" y="32" width="22" height="22" fill="#222"/><rect x="120" y="32" width="10" height="22" fill="#222"/>
      <rect x="10" y="54" width="22" height="22" fill="#222"/><rect x="54" y="54" width="22" height="22" fill="#222"/><rect x="98" y="54" width="22" height="22" fill="#222"/>
    </g>
    <g fill="#fff"><circle cx="21" cy="21" r="4"/><circle cx="65" cy="21" r="4"/><circle cx="109" cy="21" r="4"/><circle cx="43" cy="43" r="4"/><circle cx="87" cy="43" r="4"/><circle cx="21" cy="65" r="4"/><circle cx="65" cy="65" r="4"/><circle cx="109" cy="65" r="4"/></g>
    <text x="75" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">Charuco</text>
    <text x="75" y="143" text-anchor="middle" font-size="10" fill="#5f5e5a">detectCharucoBoard(aruco)</text>
  </g>

  <!-- 箭头到映射 -->
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <line x1="340" y1="200" x2="340" y2="222" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="170" y="226" width="340" height="46" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#633806">角点/圆心 → objectPoints = (c·squareSize, r·squareSize, 0) mm</text>
  <text x="340" y="264" text-anchor="middle" font-size="10" fill="#854f0b">squareSize 必须用真实物理尺寸，否则内参直接差一个量级</text>
</svg>
