<svg viewBox="0 0 680 280" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L3.1 端到端验证：投影验证 + 闭环够取验证</text>

  <!-- 左：前向投影验证 -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="320" height="200" rx="10" fill="#E6F0FA" stroke="#185FA5" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#0c447c">① 投影验证（已知 3D → 像素）</text>
    <!-- 3D 目标 -->
    <circle cx="60" cy="150" r="4" fill="#0c447c"/><text x="40" y="170" font-size="9" fill="#0c447c">目标 P</text>
    <!-- 相机 -->
    <path d="M250 110 L290 90 L290 170 L250 150 Z" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    <text x="250" y="190" font-size="9" fill="#185FA5">相机</text>
    <!-- 光束 -->
    <line x1="60" y1="150" x2="270" y2="120" stroke="#5B9BD5" stroke-width="1"/>
    <!-- 像素面（真实 vs 估计） -->
    <rect x="250" y="60" width="48" height="80" rx="4" fill="#fff" stroke="#5f5e5a"/>
    <circle cx="274" cy="90" r="3" fill="#3B6D11"/><text x="300" y="86" font-size="9" fill="#27500a">真值像素</text>
    <circle cx="268" cy="110" r="3" fill="#E24B4A"/><text x="300" y="106" font-size="9" fill="#a32d2d">估计像素</text>
    <line x1="274" y1="90" x2="268" y2="110" stroke="#a32d2d" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="160" y="210" text-anchor="middle" font-size="9" fill="#0c447c">像素差 = 投影验证误差（px）</text>
  </g>

  <!-- 右：闭环够取验证 -->
  <g transform="translate(360,50)">
    <rect x="0" y="0" width="320" height="200" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="12" y="20" font-size="12" font-weight="500" fill="#27500a">② 闭环够取验证（像素 → 够到点）</text>
    <!-- 已知平面 z=z_t -->
    <line x1="40" y1="150" x2="280" y2="150" stroke="#8a8a86" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="200" y="165" font-size="9" fill="#444441">已知高度平面 z=z_t</text>
    <!-- 真值目标 -->
    <circle cx="120" cy="150" r="4" fill="#0c447c"/><text x="100" y="140" font-size="9" fill="#0c447c">真值目标</text>
    <!-- 反投影射线 -->
    <line x1="250" y1="70" x2="120" y2="150" stroke="#5B9BD5" stroke-width="1"/>
    <path d="M250 60 L290 50 L290 95 L250 85 Z" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    <text x="232" y="105" font-size="9" fill="#185FA5">相机</text>
    <!-- 够到点（误差） -->
    <circle cx="135" cy="150" r="4" fill="#E24B4A"/><text x="120" y="132" font-size="9" fill="#a32d2d">够到点</text>
    <line x1="120" y1="150" x2="135" y2="150" stroke="#a32d2d" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="160" y="200" text-anchor="middle" font-size="9" fill="#27500a">3D 偏差 = 够取误差（mm）</text>
  </g>
</svg>
