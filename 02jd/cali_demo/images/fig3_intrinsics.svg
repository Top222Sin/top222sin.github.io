<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L1.3 针孔模型与投影链</text>

  <!-- 针孔示意图 -->
  <g transform="translate(0,0)">
    <!-- 光轴 -->
    <line x1="60" y1="150" x2="320" y2="150" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="60" y="146" font-size="10" fill="#5f5e5a">光轴 Z</text>
    <!-- 物点 P -->
    <circle cx="120" cy="70" r="4" fill="#E24B4A"/>
    <text x="120" y="60" text-anchor="middle" font-size="11" fill="#a32d2d">P (X,Y,Z)</text>
    <!-- 光心 O -->
    <circle cx="120" cy="150" r="4" fill="#444441"/>
    <text x="128" y="166" font-size="10" fill="#444441">光心 O</text>
    <!-- 成像平面 -->
    <line x1="270" y1="95" x2="270" y2="220" stroke="#185FA5" stroke-width="2"/>
    <text x="278" y="92" font-size="10" fill="#0c447c">成像面 (Z=f)</text>
    <!-- 投影线 P->O->p' -->
    <line x1="120" y1="70" x2="270" y2="195" stroke="#639922" stroke-width="1.5"/>
    <circle cx="270" cy="195" r="4" fill="#639922"/>
    <text x="278" y="200" font-size="10" fill="#27500a">p' (x,y)</text>
    <!-- 焦距 f -->
    <line x1="120" y1="170" x2="270" y2="170" stroke="#BA7517" stroke-width="1"/>
    <text x="185" y="185" text-anchor="middle" font-size="10" fill="#854f0b">f</text>
    <text x="120" y="240" text-anchor="middle" font-size="10" fill="#5f5e5a">y = -f·Y/Z (倒像)</text>
  </g>

  <!-- 右侧 K 与公式 -->
  <g transform="translate(360,55)">
    <rect x="0" y="0" width="290" height="120" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="14" y="24" font-size="12" font-weight="500" fill="#0c447c">内参矩阵 K</text>
    <text x="40" y="52" font-size="13" fill="#1a202c">[ fx   0   cx ]</text>
    <text x="40" y="74" font-size="13" fill="#1a202c">[  0   fy  cy ]</text>
    <text x="40" y="96" font-size="13" fill="#1a202c">[  0    0    1 ]</text>
    <text x="14" y="118" font-size="10" fill="#5f5e5a">fx,fy=焦距(像素)  cx,cy=主点</text>
  </g>
  <g transform="translate(360,190)">
    <rect x="0" y="0" width="290" height="70" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="14" y="24" font-size="12" fill="#633806">u = fx·(X/Z) + cx</text>
    <text x="14" y="44" font-size="12" fill="#633806">v = fy·(Y/Z) + cy</text>
    <text x="14" y="62" font-size="10" fill="#854f0b">再叠加径向/切向畸变 → calibrateCamera 反估</text>
  </g>
</svg>
