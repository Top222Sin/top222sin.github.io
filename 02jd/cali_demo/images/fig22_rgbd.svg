<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L4.5 RGB-D（深度偏置标定 + 深度-彩色外参对齐）</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5f5e5a"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#185FA5"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A32D2D"/></marker>
  </defs>

  <!-- ============ Panel A: 深度偏置标定 + 校正 ============ -->
  <text x="175" y="52" text-anchor="middle" font-size="11" fill="#0c447c">① 深度偏置标定 + 校正</text>
  <!-- 坐标轴 -->
  <line x1="60" y1="250" x2="320" y2="250" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="60" y1="250" x2="60" y2="80" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="326" y="254" font-size="9" fill="#5f5e5a">d_true</text>
  <text x="44" y="78" font-size="9" fill="#5f5e5a">d</text>
  <text x="60" y="266" font-size="8" fill="#5f5e5a">0</text>
  <text x="318" y="266" font-size="8" fill="#5f5e5a">3.0</text>
  <!-- 真值 y=x (绿) -->
  <line x1="60" y1="250" x2="318" y2="40" stroke="#3B6D11" stroke-width="2"/>
  <text x="200" y="60" font-size="8" fill="#27500a">真值 d_meas = d_true</text>
  <!-- 测值 y=x+0.01x² (红, 略上偏) -->
  <polyline points="60,250 105,213 150,178 195,145 240,114 285,85 318,63"
            fill="none" stroke="#A32D2D" stroke-width="2"/>
  <text x="120" y="200" font-size="8" fill="#a32d2d">测值 d_meas=d+0.01d²</text>
  <!-- 标定点 -->
  <g fill="#185FA5">
    <circle cx="60"  cy="250" r="3"/><circle cx="116" cy="205" r="3"/>
    <circle cx="173" cy="162" r="3"/><circle cx="230" cy="121" r="3"/>
    <circle cx="287" cy="82"  r="3"/><circle cx="318" cy="63"  r="3"/>
  </g>
  <text x="150" y="284" font-size="8" fill="#0c447c">拟合 c=0.01 → 校正回 y=x (误差 4e-15)</text>

  <!-- ============ Panel B: 深度-彩色外参对齐 ============ -->
  <text x="505" y="52" text-anchor="middle" font-size="11" fill="#0c447c">② 深度-彩色外参对齐（回环重投影）</text>
  <!-- 深度相机 -->
  <rect x="370" y="90" width="44" height="26" rx="4" fill="#E6F0FA" stroke="#185FA5"/>
  <text x="392" y="107" text-anchor="middle" font-size="8" fill="#0c447c">深度</text>
  <!-- 彩色相机 -->
  <rect x="566" y="90" width="44" height="26" rx="4" fill="#FBEAEA" stroke="#A32D2D"/>
  <text x="588" y="107" text-anchor="middle" font-size="8" fill="#a32d2d">彩色</text>
  <!-- 3D 点 -->
  <circle cx="468" cy="160" r="4" fill="#3B6D11"/>
  <text x="474" y="164" font-size="8" fill="#27500a">3D 点 P</text>
  <!-- 变换 R,t -->
  <line x1="414" y1="116" x2="468" y2="158" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arB)"/>
  <line x1="566" y1="116" x2="472" y2="158" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arR)"/>
  <text x="430" y="138" font-size="8" fill="#0c447c">投影→深度图</text>
  <text x="500" y="138" font-size="8" fill="#a32d2d">R,t→彩色图</text>
  <!-- 回环 -->
  <path d="M468 164 C 440 210, 600 210, 572 164" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="500" y="226" font-size="8" fill="#5f5e5a">逆变换 Rᵀ(p−t) 回深度帧</text>

  <rect x="370" y="248" width="240" height="34" rx="6" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="490" y="266" text-anchor="middle" font-size="9.5" fill="#27500a">回环重投影最大偏差 ~2.2e-16</text>
  <text x="490" y="279" text-anchor="middle" font-size="9" fill="#27500a">像素级配准自洽（深度↔彩色对齐）</text>
</svg>
