<svg viewBox="0 0 680 280" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L2.2 三种方法收敛到同一 X</text>

  <!-- 方程 -->
  <rect x="170" y="48" width="340" height="46" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#633806">A · X = X · B</text>
  <text x="340" y="84" text-anchor="middle" font-size="10" fill="#854f0b">旋转 R_A·R_X=R_X·R_B ｜ 平移 (R_A−I)t_X = R_X·t_B − t_A</text>

  <!-- 三种方法 -->
  <g transform="translate(40,120)">
    <rect x="0" y="0" width="170" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">Park–Martin</text>
    <text x="85" y="42" text-anchor="middle" font-size="10" fill="#5f5e5a">对偶四元数 SVD</text>
  </g>
  <g transform="translate(255,120)">
    <rect x="0" y="0" width="170" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">Tsai–Lenz</text>
    <text x="85" y="42" text-anchor="middle" font-size="10" fill="#5f5e5a">skew 矩阵两步法</text>
  </g>
  <g transform="translate(470,120)">
    <rect x="0" y="0" width="170" height="60" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="500" fill="#27500a">Gauss–Newton</text>
    <text x="85" y="42" text-anchor="middle" font-size="10" fill="#5f5e5a">非线性精化(闭式出发)</text>
  </g>

  <defs><marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <line x1="125" y1="180" x2="300" y2="215" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar3)"/>
  <line x1="340" y1="180" x2="340" y2="215" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar3)"/>
  <line x1="555" y1="180" x2="380" y2="215" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar3)"/>

  <!-- 结果 X -->
  <g transform="translate(280,220)">
    <rect x="0" y="0" width="120" height="46" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#501313">X (cam2gripper)</text>
    <text x="60" y="36" text-anchor="middle" font-size="10" fill="#a32d2d">三者误差一致</text>
  </g>
</svg>
