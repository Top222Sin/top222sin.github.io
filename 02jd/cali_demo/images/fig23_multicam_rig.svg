<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L4.6 多相机 rig（环视 BEV 拼接 + 回环一致性）</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5f5e5a"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#185FA5"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3B6D11"/></marker>
  </defs>

  <!-- ============ Panel A: 4 相机环绕 rig + BEV ============ -->
  <text x="175" y="52" text-anchor="middle" font-size="11" fill="#0c447c">① 4 相机环绕 rig + 环视 BEV 拼接</text>
  <!-- 俯视: 车体/rig 方框 -->
  <rect x="120" y="110" width="100" height="100" rx="8" fill="#fbfcfe" stroke="#5f5e5a" stroke-width="1.4"/>
  <text x="170" y="165" text-anchor="middle" font-size="8" fill="#5f5e5a">rig</text>
  <!-- 4 相机 -->
  <g fill="#185FA5">
    <rect x="160" y="92" width="20" height="10" rx="2"/><rect x="160" y="218" width="20" height="10" rx="2"/>
    <rect x="102" y="150" width="10" height="20" rx="2"/><rect x="218" y="150" width="10" height="20" rx="2"/>
  </g>
  <!-- 朝外地面覆盖 -->
  <g stroke="#185FA5" stroke-width="1" opacity="0.7">
    <line x1="170" y1="92" x2="170" y2="58" marker-end="url(#arB)"/>
    <line x1="170" y1="228" x2="170" y2="262" marker-end="url(#arB)"/>
    <line x1="102" y1="160" x2="66" y2="160" marker-end="url(#arB)"/>
    <line x1="228" y1="160" x2="264" y2="160" marker-end="url(#arB)"/>
  </g>
  <!-- 拼接 BEV 圆 -->
  <circle cx="170" cy="160" r="92" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="170" y="262" text-anchor="middle" font-size="8" fill="#27500a">拼接 BEV 视野 (环视)</text>
  <!-- 回环闭合 -->
  <rect x="40" y="248" width="200" height="34" rx="6" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="140" y="266" text-anchor="middle" font-size="9.5" fill="#27500a">回环闭合 cam0→…→cam0 = I</text>
  <text x="140" y="278" text-anchor="middle" font-size="9" fill="#27500a">R 偏差 3e-16, t 偏差 4e-16</text>

  <!-- ============ Panel B: IPM + 跨相机一致 ============ -->
  <text x="505" y="52" text-anchor="middle" font-size="11" fill="#0c447c">② IPM 逆透视 + 跨相机一致</text>
  <!-- 相机 -->
  <rect x="380" y="95" width="34" height="20" rx="4" fill="#E6F0FA" stroke="#185FA5"/>
  <text x="397" y="109" text-anchor="middle" font-size="8" fill="#0c447c">相机</text>
  <!-- 地面平面 -->
  <line x1="380" y1="230" x2="630" y2="230" stroke="#3B6D11" stroke-width="1.4"/>
  <text x="380" y="244" font-size="8" fill="#27500a">rig 地面 (z=0)</text>
  <!-- 像素->射线->地面 -->
  <line x1="397" y1="115" x2="470" y2="230" stroke="#A32D2D" stroke-width="1.4"/>
  <circle cx="470" cy="230" r="3" fill="#A32D2D"/>
  <text x="476" y="224" font-size="8" fill="#a32d2d">像素(u,v)</text>
  <text x="410" y="178" font-size="8" fill="#185FA5">射线 K⁻¹(u,v,1)</text>
  <!-- IPM 箭头 -->
  <path d="M470 230 C 500 250, 560 250, 590 232" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="520" y="266" font-size="8" fill="#5f5e5a">IPM 逆透视 → BEV 坐标</text>
  <!-- 第二相机交叉 -->
  <rect x="600" y="95" width="34" height="20" rx="4" fill="#FBEAEA" stroke="#A32D2D"/>
  <text x="617" y="109" text-anchor="middle" font-size="8" fill="#a32d2d">相机2</text>
  <line x1="617" y1="115" x2="560" y2="230" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 2"/>

  <rect x="380" y="276" width="250" height="0" fill="none"/>
  <rect x="400" y="272" width="220" height="16" fill="none"/>
  <text x="510" y="284" font-size="8.5" fill="#27500a">跨相机共享地面点 37 个, 偏差 9e-16</text>
</svg>
