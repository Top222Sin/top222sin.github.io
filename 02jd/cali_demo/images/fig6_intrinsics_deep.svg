<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L2.1 内参精度的三大因素</text>

  <!-- 1) 姿态覆盖度 -->
  <g transform="translate(20,55)">
    <rect x="0" y="0" width="180" height="170" rx="10" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">① 姿态覆盖度</text>
    <!-- 好：全视场 -->
    <rect x="10" y="15" width="70" height="55" fill="#E6F1FB" stroke="#185FA5"/>
    <g fill="#E24B4A"><circle cx="18" cy="25" r="2.5"/><circle cx="45" cy="22" r="2.5"/><circle cx="70" cy="28" r="2.5"/><circle cx="20" cy="50" r="2.5"/><circle cx="48" cy="55" r="2.5"/><circle cx="72" cy="52" r="2.5"/></g>
    <text x="45" y="84" text-anchor="middle" font-size="9" fill="#27500a">全视场多样 ✓</text>
    <!-- 差：只中心 -->
    <rect x="100" y="15" width="70" height="55" fill="#FAECE7" stroke="#993C1D"/>
    <g fill="#E24B4A"><circle cx="128" cy="40" r="2.5"/><circle cx="135" cy="38" r="2.5"/><circle cx="132" cy="45" r="2.5"/></g>
    <text x="135" y="84" text-anchor="middle" font-size="9" fill="#712b13">只拍中心 ✗</text>
    <text x="90" y="110" text-anchor="middle" font-size="10" fill="#444441">约束不足 →</text>
    <text x="90" y="126" text-anchor="middle" font-size="10" fill="#444441">K 某些自由度</text>
    <text x="90" y="142" text-anchor="middle" font-size="10" fill="#444441">估计不准</text>
  </g>

  <!-- 2) 畸变模型阶数 -->
  <g transform="translate(250,55)">
    <rect x="0" y="0" width="180" height="170" rx="10" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">② 畸变模型阶数</text>
    <line x1="15" y1="120" x2="165" y2="120" stroke="#5f5e5a"/>
    <!-- 真值(平滑) -->
    <path d="M15 100 Q60 60 90 95 T165 90" fill="none" stroke="#639922" stroke-width="2"/>
    <text x="90" y="138" text-anchor="middle" font-size="9" fill="#27500a">真值(平滑)</text>
    <!-- 4参数拟合 -->
    <path d="M15 100 Q70 75 110 95 T165 92" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    <text x="90" y="156" text-anchor="middle" font-size="9" fill="#0c447c">4参数：稳</text>
    <!-- 8参数过拟合 -->
    <path d="M15 100 Q40 50 55 100 Q75 140 95 95 Q120 50 140 105 Q155 130 165 92" fill="none" stroke="#E24B4A" stroke-width="1.5"/>
    <text x="90" y="174" text-anchor="middle" font-size="9" fill="#a32d2d">8参数：过拟合噪声</text>
  </g>

  <!-- 3) 角点精度 -->
  <g transform="translate(480,55)">
    <rect x="0" y="0" width="180" height="170" rx="10" fill="#fff" stroke="#185FA5" stroke-width="1"/>
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="500" fill="#0c447c">③ 角点亚像素精度</text>
    <circle cx="50" cy="60" r="22" fill="none" stroke="#222" stroke-width="3"/>
    <circle cx="50" cy="60" r="2" fill="#E24B4A"/>
    <text x="50" y="100" text-anchor="middle" font-size="9" fill="#27500a">对焦清晰 ✓</text>
    <circle cx="130" cy="60" r="22" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
    <text x="130" y="100" text-anchor="middle" font-size="9" fill="#712b13">离焦模糊 ✗</text>
    <text x="90" y="128" text-anchor="middle" font-size="10" fill="#444441">角点误差 →</text>
    <text x="90" y="144" text-anchor="middle" font-size="10" fill="#444441">直接变成内参误差</text>
  </g>
</svg>
