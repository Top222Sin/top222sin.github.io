<svg viewBox="0 0 680 280" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#1a202c">L3.3 自动/在线标定系统：自检 + 报警 + 再标定</text>

  <!-- 主链路 -->
  <g font-size="10" text-anchor="middle">
    <rect x="20"  y="70" width="78" height="40" rx="8" fill="#E6F0FA" stroke="#185FA5"/><text x="59"  y="94" fill="#0c447c">采集帧</text>
    <rect x="118" y="70" width="78" height="40" rx="8" fill="#E6F0FA" stroke="#185FA5"/><text x="157" y="94" fill="#0c447c">内参 K</text>
    <rect x="216" y="70" width="78" height="40" rx="8" fill="#E6F0FA" stroke="#185FA5"/><text x="255" y="94" fill="#0c447c">手眼 X</text>
    <rect x="314" y="70" width="78" height="40" rx="8" fill="#E6F0FA" stroke="#185FA5"/><text x="353" y="94" fill="#0c447c">TCP</text>
    <rect x="412" y="70" width="88" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11"/><text x="456" y="94" fill="#27500a">误差校验</text>
    <rect x="520" y="70" width="78" height="40" rx="8" fill="#FBF1D6" stroke="#BA7517"/><text x="559" y="94" fill="#8a5a0f">质量闸门</text>
    <!-- 箭头 -->
    <g stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#ar)">
      <line x1="98" y1="90" x2="116" y2="90"/><line x1="196" y1="90" x2="214" y2="90"/>
      <line x1="294" y1="90" x2="312" y2="90"/><line x1="392" y1="90" x2="410" y2="90"/>
      <line x1="500" y1="90" x2="518" y2="90"/>
    </g>
    <!-- 分支 -->
    <path d="M559 110 L559 150 L250 150 L250 112" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arG)"/>
    <text x="400" y="144" font-size="9" fill="#27500a">PASS → 部署产线</text>
    <path d="M559 110 L600 110 L600 200 L59 200 L59 112" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arR)"/>
    <text x="430" y="195" font-size="9" fill="#a32d2d">FAIL / 温漂 → 触发再标定 ↺</text>
  </g>

  <!-- 指标卡片 -->
  <g transform="translate(20,150)" font-size="9" fill="#444441">
    <rect x="0" y="20" width="210" height="58" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <text x="8" y="38" fill="#0c447c" font-weight="500">质量闸门指标</text>
    <text x="8" y="54">内参RMS &lt; 2px</text>
    <text x="8" y="68">手眼 &lt;0.5° / &lt;1mm</text>
    <text x="8" y="76">TCP &lt;1mm</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5f5e5a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#639922"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A32D2D"/></marker>
  </defs>
</svg>
