<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">调库 vs 手写 kernel：工作量对比与调用栈</text>

  <!-- Left: 手写 kernel -->
  <rect x="20" y="44" width="300" height="250" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="34" y="64" font-size="12" font-weight="700" fill="#b91c1c">自己写 kernel（L2/L3）</text>
  <g font-size="9.5" fill="#7f1d1d">
    <rect x="34" y="74" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="88">1. 设计分块 tiling / 寄存器棋盘</text>
    <rect x="34" y="98" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="112">2. 搬数据到 shared memory</text>
    <rect x="34" y="122" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="136">3. 保证 global 合并访问</text>
    <rect x="34" y="146" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="160">4. 绕开 bank conflict / 双缓冲</text>
    <rect x="34" y="170" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="184">5. 调 launch_bounds / occupancy</text>
    <rect x="34" y="194" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="208">6. Nsight 找热点、反复迭代</text>
    <rect x="34" y="218" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="232">7. 数值对拍 + 边界保护</text>
    <rect x="34" y="242" width="270" height="20" rx="4" fill="#fee2e2"/><text x="42" y="256">8. 跨 GPU 架构重调</text>
  </g>

  <!-- Right: 调库 -->
  <rect x="360" y="44" width="300" height="250" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="374" y="64" font-size="12" font-weight="700" fill="#047857">调 cuBLAS / cuDNN（L1）</text>
  <g font-size="9.5" fill="#065f46">
    <rect x="374" y="74" width="270" height="20" rx="4" fill="#d1fae5"/><text x="382" y="88">1. create handle（建上下文）</text>
    <rect x="374" y="98" width="270" height="20" rx="4" fill="#d1fae5"/><text x="382" y="112">2. 设描述符 / 指针模式</text>
    <rect x="374" y="122" width="270" height="20" rx="4" fill="#a7f3d0"/><text x="382" y="136" font-weight="700">3. 一行调用：cublasSgemm / cudnnConv</text>
    <rect x="374" y="146" width="270" height="20" rx="4" fill="#d1fae5"/><text x="382" y="160">4. 校验 + destroy / free</text>
    <rect x="374" y="190" width="270" height="84" rx="6" fill="#f0fdf4" stroke="#34d399" stroke-dasharray="3"/>
    <text x="382" y="208" font-size="9" fill="#047857">库内部替你完成：</text>
    <text x="382" y="224" font-size="8.5" fill="#065f46">分块 / 合并 / 寄存器分配 /</text>
    <text x="382" y="238" font-size="8.5" fill="#065f46">算法自动选择 / 跨代调优</text>
    <text x="382" y="258" font-size="8.5" fill="#065f46">(NVIDIA 工程师已调至极致)</text>
  </g>

  <!-- call stack bottom -->
  <text x="20" y="312" font-size="11" font-weight="700" fill="#0f172a">调用栈</text>
  <g font-size="9.5">
    <rect x="20" y="320" width="140" height="24" rx="4" fill="#e0e7ff"/><text x="28" y="335" fill="#3730a3">你的代码</text>
    <text x="164" y="336" fill="#94a3b8">→</text>
    <rect x="180" y="320" width="160" height="24" rx="4" fill="#ddd6fe"/><text x="188" y="335" fill="#5b21b6">cuBLAS/cuDNN API</text>
    <text x="344" y="336" fill="#94a3b8">→</text>
    <rect x="360" y="320" width="160" height="24" rx="4" fill="#c7d2fe"/><text x="368" y="335" fill="#3730a3">库内调好的 kernel</text>
    <text x="524" y="336" fill="#94a3b8">→</text>
    <rect x="540" y="320" width="120" height="24" rx="4" fill="#1e3a8a"/><text x="548" y="335" fill="#ffffff">GPU SM 执行</text>
  </g>
</svg>
