<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="590" fill="#fafbfc"/>
  <text x="340" y="24" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">L4 cuFFT + cuSPARSE + cuRAND 库族：科学计算三大调库（四联图）</text>

  <!-- Panel 1: cuFFT -->
  <rect x="14" y="40" width="320" height="250" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="30" y="64" font-size="13" font-weight="bold" fill="#4c6ef5">① cuFFT —— 复迭 / 卷积</text>
  <rect x="34" y="78" width="74" height="26" rx="4" fill="#e7f0ff" stroke="#4c6ef5"/>
  <text x="71" y="95" font-size="11" fill="#1f2d3d" text-anchor="middle">信号 x[n]</text>
  <text x="118" y="95" font-size="14" fill="#1f2d3d">→</text>
  <rect x="130" y="78" width="60" height="26" rx="4" fill="#e7f0ff" stroke="#4c6ef5"/>
  <text x="160" y="95" font-size="11" fill="#1f2d3d" text-anchor="middle">fft()</text>
  <text x="192" y="95" font-size="14" fill="#1f2d3d">→</text>
  <rect x="204" y="78" width="80" height="26" rx="4" fill="#e7f0ff" stroke="#4c6ef5"/>
  <text x="244" y="95" font-size="11" fill="#1f2d3d" text-anchor="middle">X[k] 频域</text>
  <text x="288" y="95" font-size="14" fill="#1f2d3d">→</text>
  <rect x="296" y="78" width="26" height="26" rx="4" fill="#e7f0ff" stroke="#4c6ef5"/>
  <text x="309" y="95" font-size="11" fill="#1f2d3d" text-anchor="middle">·</text>
  <text x="34" y="124" font-size="10.5" fill="#495057">radix-2 Cooley-Tukey 迭代（原位、位反排）</text>
  <text x="34" y="142" font-size="10.5" fill="#495057">fft(x) == 朴素 DFT（max|Δ|&lt;1e-9）</text>
  <text x="34" y="160" font-size="10.5" fill="#495057">ifft(fft(x)) == x（往返一致）</text>
  <rect x="34" y="176" width="280" height="1" fill="#e9ecef"/>
  <text x="34" y="196" font-size="10.5" fill="#2f9e44" font-weight="bold">卷积定理</text>
  <text x="34" y="214" font-size="10.5" fill="#495057">ifft(fft(a)·fft(b)) == 直接卷积(a,b)</text>
  <text x="34" y="238" font-size="10" fill="#868e96">应用：频谱分析 / 快速卷积 / 相关</text>
  <text x="34" y="258" font-size="10" fill="#868e96">（科学计算、信号处理）</text>

  <!-- Panel 2: cuSPARSE -->
  <rect x="346" y="40" width="320" height="250" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="362" y="64" font-size="13" font-weight="bold" fill="#e8590c">② cuSPARSE —— CSR 稀疏</text>
  <text x="362" y="88" font-size="10.5" fill="#495057">稠密 D 6×6 → CSR</text>
  <text x="362" y="106" font-size="10.5" fill="#1f2d3d" font-family="Consolas,monospace">row_ptr=[0 3 6 9 ...]</text>
  <text x="362" y="124" font-size="10.5" fill="#1f2d3d" font-family="Consolas,monospace">col_idx=[0 1 2 | 1 2 3 ...]</text>
  <text x="362" y="142" font-size="10.5" fill="#1f2d3d" font-family="Consolas,monospace">val   =[... 非零 ...]</text>
  <rect x="362" y="158" width="280" height="1" fill="#e9ecef"/>
  <text x="362" y="178" font-size="10.5" fill="#2f9e44" font-weight="bold">SpMV：y = A·x</text>
  <text x="362" y="196" font-size="10.5" fill="#495057">csr_spmv == 稠密 matvec（max|Δ|&lt;1e-12）</text>
  <text x="362" y="214" font-size="10.5" fill="#495057">csr2dense 往返 == 原稠密（max|Δ|&lt;1e-12）</text>
  <text x="362" y="238" font-size="10" fill="#868e96">应用：稀疏矩阵 / 图 / 有限元 / 推荐</text>
  <text x="362" y="258" font-size="10" fill="#868e96">（科学计算、稀疏线性代数）</text>

  <!-- Panel 3: cuRAND -->
  <rect x="14" y="306" width="320" height="250" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="30" y="330" font-size="13" font-weight="bold" fill="#7048e8">③ cuRAND —— 确定性随机</text>
  <rect x="34" y="344" width="74" height="26" rx="4" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="71" y="361" font-size="11" fill="#1f2d3d" text-anchor="middle">seed</text>
  <text x="118" y="361" font-size="14" fill="#1f2d3d">→</text>
  <rect x="130" y="344" width="60" height="26" rx="4" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="160" y="361" font-size="11" fill="#1f2d3d" text-anchor="middle">LCG</text>
  <text x="192" y="361" font-size="14" fill="#1f2d3d">→</text>
  <rect x="204" y="344" width="80" height="26" rx="4" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="244" y="361" font-size="11" fill="#1f2d3d" text-anchor="middle">U(0,1)</text>
  <text x="288" y="361" font-size="14" fill="#1f2d3d">→</text>
  <rect x="296" y="344" width="26" height="26" rx="4" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="309" y="361" font-size="11" fill="#1f2d3d" text-anchor="middle">N</text>
  <text x="34" y="396" font-size="10.5" fill="#495057">确定性：同种子 → 流逐位一致（det=TRUE）</text>
  <text x="34" y="414" font-size="10.5" fill="#495057">Box-Muller：U→N(0,1)</text>
  <text x="34" y="432" font-size="10.5" fill="#495057">N=20000：mean≈0, std≈1（|<x|-1|&lt;0.03）</text>
  <rect x="34" y="448" width="280" height="1" fill="#e9ecef"/>
  <text x="34" y="468" font-size="10" fill="#868e96">应用：蒙特卡洛 / 初始化 / 数据增强</text>
  <text x="34" y="488" font-size="10" fill="#868e96">（科学计算、随机模拟）</text>

  <!-- Panel 4: 同构/应用 -->
  <rect x="346" y="306" width="320" height="250" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="362" y="330" font-size="13" font-weight="bold" fill="#1f2d3d">④ 调库篇延伸 + 应用指向</text>
  <text x="362" y="354" font-size="10.5" fill="#495057">L1.3 调库基线：cuBLAS / cuDNN</text>
  <text x="362" y="372" font-size="10.5" fill="#495057">↳ 本篇延伸三大数学/稀疏/随机库族</text>
  <rect x="362" y="388" width="280" height="1" fill="#e9ecef"/>
  <text x="362" y="408" font-size="10.5" fill="#2f9e44" font-weight="bold">应用指向</text>
  <text x="362" y="426" font-size="10.5" fill="#495057">· 科学计算：FFT 谱分析、稀疏求解</text>
  <text x="362" y="444" font-size="10.5" fill="#495057">· 信号处理：快速卷积 / 滤波</text>
  <text x="362" y="462" font-size="10.5" fill="#495057">· 稀疏：图 / FEM / 推荐系统</text>
  <text x="362" y="480" font-size="10.5" fill="#495057">· 调试/随机：蒙特卡洛 / 初始化</text>
  <text x="362" y="508" font-size="10" fill="#868e96">真机 API 由 __CUDACC__ 守护（见 cpp）</text>
  <text x="362" y="528" font-size="10" fill="#868e96">host 端 double 模型，确定性可复现</text>

  <text x="14" y="582" font-size="10" fill="#adb5bd">纯 C++ 可跑（g++）；受管 Python 双复核 6/6 PASS。配色沿用 cuda_demo L4 规范。</text>
</svg>
