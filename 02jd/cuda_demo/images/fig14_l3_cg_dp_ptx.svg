<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="600" fill="#fafbfc"/>
  <text x="340" y="24" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">L3.3  cooperative groups + dynamic parallelism + PTX/SASS 反汇编（四联图）</text>

  <!-- ============ Panel 1: cooperative groups grid.sync ============ -->
  <g>
    <rect x="10" y="38" width="320" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">① cooperative groups：grid.sync 压掉一趟 kernel</text>

    <text x="90" y="82" font-size="10" font-weight="bold" fill="#c92a2a" text-anchor="middle">经典：两趟 kernel</text>
    <rect x="26" y="92" width="120" height="26" rx="4" fill="#ffe3e3" stroke="#e03131"/>
    <text x="86" y="109" font-size="9" fill="#495057" text-anchor="middle">kernel A → partial[]</text>
    <text x="86" y="130" font-size="9" fill="#c92a2a" text-anchor="middle">↓ launch 边界 (往返)</text>
    <rect x="26" y="136" width="120" height="26" rx="4" fill="#ffe3e3" stroke="#e03131"/>
    <text x="86" y="153" font-size="9" fill="#495057" text-anchor="middle">kernel B → total</text>
    <text x="86" y="176" font-size="8.5" fill="#868e96" text-anchor="middle">2 launch + partial 全局往返</text>

    <text x="248" y="82" font-size="10" font-weight="bold" fill="#2b8a3e" text-anchor="middle">CG：一趟 persistent</text>
    <rect x="186" y="92" width="128" height="24" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="250" y="108" font-size="9" fill="#495057" text-anchor="middle">phase1 → partial[]</text>
    <rect x="186" y="120" width="128" height="20" rx="4" fill="#7048e8" stroke="#5f3dc4"/>
    <text x="250" y="134" font-size="9" fill="#fff" text-anchor="middle">grid.sync() 整网栅栏</text>
    <rect x="186" y="144" width="128" height="24" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="250" y="160" font-size="9" fill="#495057" text-anchor="middle">phase2 → total</text>
    <text x="250" y="182" font-size="8.5" fill="#2b8a3e" text-anchor="middle">1 launch，partial 不回 host</text>

    <line x1="150" y1="150" x2="184" y2="150" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar1)"/>
    <text x="170" y="204" font-size="9.5" fill="#495057" text-anchor="middle">启动须换 cudaLaunchCooperativeKernel</text>
    <text x="170" y="220" font-size="9" fill="#495057" text-anchor="middle">所有 block 须同时驻留 → occupancy API 估容量</text>
    <text x="170" y="240" font-size="9" fill="#7048e8" text-anchor="middle">迭代型算法(Jacobi/CG/persistent RNN)收益最大</text>
    <text x="170" y="262" font-size="9" fill="#868e96" text-anchor="middle">= L2.4 shared 归约的「跨 block」放大版</text>
    <defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#868e96"/></marker></defs>
  </g>

  <!-- ============ Panel 2: dynamic parallelism tree ============ -->
  <g>
    <rect x="350" y="38" width="320" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">② dynamic parallelism：设备端递归 launch</text>

    <rect x="482" y="76" width="56" height="22" rx="4" fill="#4c6ef5" stroke="#3b5bdb"/>
    <text x="510" y="91" font-size="9" fill="#fff" text-anchor="middle">[0,N)</text>
    <rect x="410" y="118" width="56" height="22" rx="4" fill="#748ffc" stroke="#4263eb"/>
    <text x="438" y="133" font-size="9" fill="#fff" text-anchor="middle">[0,N/2)</text>
    <rect x="554" y="118" width="56" height="22" rx="4" fill="#748ffc" stroke="#4263eb"/>
    <text x="582" y="133" font-size="9" fill="#fff" text-anchor="middle">[N/2,N)</text>
    <rect x="382" y="160" width="42" height="20" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="403" y="174" font-size="8" fill="#495057" text-anchor="middle">叶子</text>
    <rect x="430" y="160" width="42" height="20" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="451" y="174" font-size="8" fill="#495057" text-anchor="middle">叶子</text>
    <rect x="540" y="160" width="42" height="20" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="561" y="174" font-size="8" fill="#495057" text-anchor="middle">叶子</text>
    <rect x="588" y="160" width="42" height="20" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="609" y="174" font-size="8" fill="#495057" text-anchor="middle">叶子</text>
    <line x1="500" y1="98" x2="438" y2="118" stroke="#868e96" stroke-width="1.3"/>
    <line x1="520" y1="98" x2="582" y2="118" stroke="#868e96" stroke-width="1.3"/>
    <line x1="428" y1="140" x2="403" y2="160" stroke="#868e96" stroke-width="1.3"/>
    <line x1="448" y1="140" x2="451" y2="160" stroke="#868e96" stroke-width="1.3"/>
    <line x1="572" y1="140" x2="561" y2="160" stroke="#868e96" stroke-width="1.3"/>
    <line x1="592" y1="140" x2="609" y2="160" stroke="#868e96" stroke-width="1.3"/>

    <text x="510" y="202" font-size="9.5" fill="#495057" text-anchor="middle">n≤cutoff→线性求和；否则一分为二、各 launch 一 child</text>
    <text x="510" y="219" font-size="9" fill="#c92a2a" text-anchor="middle">编译：nvcc -rdc=true -lcudadevrt</text>
    <text x="510" y="236" font-size="9" fill="#c92a2a" text-anchor="middle">CDP2(CUDA12)移除设备端 cudaDeviceSynchronize()</text>
    <text x="510" y="252" font-size="9" fill="#495057" text-anchor="middle">改用 TailLaunch(顺序)/FireAndForget(并发)</text>
    <text x="510" y="272" font-size="9" fill="#7048e8" text-anchor="middle">N=65536,cutoff=1024 → launch=126, 深度=6</text>
  </g>

  <!-- ============ Panel 3: PTX vs SASS mapping ============ -->
  <g>
    <rect x="10" y="300" width="320" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">③ 两层 ISA：PTX(虚拟) → SASS(原生)</text>

    <rect x="26" y="336" width="130" height="24" rx="4" fill="#e7f5ff" stroke="#1c7ed6"/>
    <text x="91" y="352" font-size="9.5" fill="#1c7ed6" text-anchor="middle">PTX：跨架构、稳定</text>
    <rect x="184" y="336" width="130" height="24" rx="4" fill="#fff4e6" stroke="#f08c00"/>
    <text x="249" y="352" font-size="9.5" fill="#e8590c" text-anchor="middle">SASS：每架构、真执行</text>

    <text x="34" y="384" font-size="9" font-family="Consolas,monospace" fill="#495057">ld.global.f32</text>
    <text x="200" y="384" font-size="9" font-family="Consolas,monospace" fill="#495057">LDG.E.32</text>
    <text x="34" y="406" font-size="9" font-family="Consolas,monospace" fill="#495057">fma.rn.f32</text>
    <text x="200" y="406" font-size="9" font-family="Consolas,monospace" fill="#495057">FFMA</text>
    <text x="34" y="428" font-size="9" font-family="Consolas,monospace" fill="#495057">st.global.f32</text>
    <text x="200" y="428" font-size="9" font-family="Consolas,monospace" fill="#495057">STG.E.32</text>
    <text x="34" y="450" font-size="9" font-family="Consolas,monospace" fill="#1c7ed6">cp.async...</text>
    <text x="200" y="450" font-size="9" font-family="Consolas,monospace" fill="#e8590c">LDGSTS (Ampere)</text>
    <text x="34" y="472" font-size="9" font-family="Consolas,monospace" fill="#7048e8">mma.sync...</text>
    <text x="200" y="472" font-size="9" font-family="Consolas,monospace" fill="#7048e8">HMMA (Volta+)</text>
    <line x1="150" y1="380" x2="196" y2="380" stroke="#adb5bd" stroke-width="1"/>
    <line x1="150" y1="402" x2="196" y2="402" stroke="#adb5bd" stroke-width="1"/>
    <line x1="150" y1="424" x2="196" y2="424" stroke="#adb5bd" stroke-width="1"/>
    <line x1="150" y1="446" x2="196" y2="446" stroke="#adb5bd" stroke-width="1"/>
    <line x1="150" y1="468" x2="196" y2="468" stroke="#adb5bd" stroke-width="1"/>

    <text x="170" y="500" font-size="9" fill="#495057" text-anchor="middle">一条 PTX → 一/多条 SASS（ptxas 调度优化）</text>
    <text x="170" y="518" font-size="9" fill="#495057" text-anchor="middle">SASS 固定 16 字节/指令 (Volta+)</text>
    <rect x="26" y="530" width="288" height="48" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="34" y="547" font-size="8.5" font-family="Consolas,monospace" fill="#868e96">nvcc -cubin -arch=sm_80 k.cu -o k.cubin</text>
    <text x="34" y="561" font-size="8.5" font-family="Consolas,monospace" fill="#868e96">nvdisasm -g k.cubin   /   -cfg → Graphviz</text>
    <text x="34" y="574" font-size="8.5" font-family="Consolas,monospace" fill="#868e96">nvcc -Xptxas -v  (看寄存器/smem/spill)</text>
  </g>

  <!-- ============ Panel 4: SASS triage signals ============ -->
  <g>
    <rect x="350" y="300" width="320" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">④ SASS 分诊：从指令读性能信号</text>

    <rect x="362" y="334" width="150" height="22" rx="4" fill="#ffe3e3" stroke="#e03131"/>
    <text x="437" y="349" font-size="9" font-family="Consolas,monospace" fill="#c92a2a" text-anchor="middle">LDL / STL</text>
    <text x="524" y="349" font-size="9" fill="#c92a2a">寄存器溢出 (先修!)</text>

    <rect x="362" y="362" width="150" height="22" rx="4" fill="#fff3bf" stroke="#f59f00"/>
    <text x="437" y="377" font-size="9" font-family="Consolas,monospace" fill="#e67700" text-anchor="middle">BRA (真分支)</text>
    <text x="524" y="377" font-size="9" fill="#e67700">warp 发散 (回看 L2.2)</text>

    <rect x="362" y="390" width="150" height="22" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="437" y="405" font-size="9" font-family="Consolas,monospace" fill="#2b8a3e" text-anchor="middle">@P / @!P 谓词化</text>
    <text x="524" y="405" font-size="9" fill="#2b8a3e">发散被压平 (好)</text>

    <rect x="362" y="418" width="150" height="22" rx="4" fill="#d0ebff" stroke="#1c7ed6"/>
    <text x="437" y="433" font-size="9" font-family="Consolas,monospace" fill="#1971c2" text-anchor="middle">LDGSTS</text>
    <text x="524" y="433" font-size="9" fill="#1971c2">cp.async 生效 (L3.1)</text>

    <rect x="362" y="446" width="150" height="22" rx="4" fill="#e5dbff" stroke="#7048e8"/>
    <text x="437" y="461" font-size="9" font-family="Consolas,monospace" fill="#6741d9" text-anchor="middle">HMMA / IMMA</text>
    <text x="524" y="461" font-size="9" fill="#6741d9">Tensor Core (L3.2)</text>

    <rect x="362" y="474" width="150" height="22" rx="4" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="437" y="489" font-size="9" font-family="Consolas,monospace" fill="#2b8a3e" text-anchor="middle">FFMA / LDG.128</text>
    <text x="524" y="489" font-size="9" fill="#2b8a3e">融合乘加 / 向量访存</text>

    <rect x="362" y="506" width="150" height="22" rx="4" fill="#ffe8cc" stroke="#f76707"/>
    <text x="437" y="521" font-size="9" font-family="Consolas,monospace" fill="#d9480f" text-anchor="middle">FMUL + FADD</text>
    <text x="524" y="521" font-size="9" fill="#d9480f">未融合 (查 --fmad)</text>

    <text x="510" y="548" font-size="9.5" fill="#c92a2a" text-anchor="middle">优先消灭：寄存器溢出 + 真分支</text>
    <text x="510" y="566" font-size="9" fill="#495057" text-anchor="middle">高级特性验收：LDGSTS/HMMA/LDG.128 现形</text>
    <text x="510" y="582" font-size="9" fill="#868e96" text-anchor="middle">把 L3.1/L3.2 的优化在指令里逐条对上号</text>
  </g>
</svg>
