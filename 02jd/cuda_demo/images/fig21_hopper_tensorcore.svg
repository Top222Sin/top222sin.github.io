<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="590" fill="#fafbfc"/>
  <text x="340" y="24" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">L4  Hopper (SM_90) Tensor Core 主线：FP8 + TMA + 稀疏 + FlashAttention（四联图）</text>

  <!-- ============ Panel 1: FP8 (E4M3) ============ -->
  <g>
    <rect x="10" y="38" width="320" height="242" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">① FP8 (E4M3) Tensor Core</text>
    <!-- bit layout -->
    <rect x="30" y="80" width="20" height="26" rx="3" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="40" y="97" font-size="9" fill="#495057" text-anchor="middle">S</text>
    <rect x="52" y="80" width="80" height="26" rx="3" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="92" y="97" font-size="9" fill="#495057" text-anchor="middle">eeee(4)</text>
    <rect x="134" y="80" width="60" height="26" rx="3" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="164" y="97" font-size="9" fill="#495057" text-anchor="middle">mmm(3)</text>
    <text x="210" y="97" font-size="10" fill="#7048e8" text-anchor="middle">1B / 数</text>
    <text x="210" y="110" font-size="8" fill="#868e96" text-anchor="middle">max=240</text>
    <text x="92" y="122" font-size="9" fill="#868e96" text-anchor="middle">fp8 量化 → fp32 累加（同 TC 纪律）</text>
    <!-- memory bars -->
    <text x="30" y="150" font-size="10" fill="#495057">操作数字节（同张量）</text>
    <rect x="30" y="158" width="120" height="16" fill="#adb5bd"/>
    <text x="158" y="170" font-size="9" fill="#495057">fp32 4B</text>
    <rect x="30" y="178" width="60" height="16" fill="#4c6ef5"/>
    <text x="96" y="190" font-size="9" fill="#495057">fp16 2B</text>
    <rect x="30" y="198" width="30" height="16" fill="#7048e8"/>
    <text x="66" y="210" font-size="9" fill="#495057">fp8 1B</text>
    <text x="200" y="170" font-size="9" fill="#495057" text-anchor="middle">fp8 比 fp16</text>
    <text x="200" y="184" font-size="11" font-weight="bold" fill="#e8590c" text-anchor="middle">内存 2×↓</text>
    <text x="200" y="198" font-size="9" fill="#495057" text-anchor="middle">带宽 2×↓</text>
    <!-- throughput -->
    <text x="30" y="232" font-size="9" fill="#495057">H100 TC 峰值：fp16 989.4 → fp8 1979 TFLOPS（≈2×）</text>
    <text x="30" y="248" font-size="9" fill="#495057">fp8-sparse(2:4) 3958（≈4× fp16-dense）</text>
    <text x="30" y="266" font-size="9" fill="#7048e8">精度谱：fp8(e4m3) 误差 &gt; fp16（3 mant 位 vs 10）</text>
  </g>

  <!-- ============ Panel 2: TMA ============ -->
  <g>
    <rect x="350" y="38" width="320" height="242" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">② TMA 描述符驱动 bulk async copy</text>
    <!-- source tensor -->
    <rect x="366" y="78" width="120" height="80" rx="3" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="426" y="92" font-size="9" fill="#495057" text-anchor="middle">全局张量 A[M,K]</text>
    <rect x="386" y="104" width="40" height="24" rx="2" fill="none" stroke="#7048e8" stroke-dasharray="3 2"/>
    <text x="406" y="119" font-size="8" fill="#7048e8" text-anchor="middle">box</text>
    <text x="426" y="150" font-size="8" fill="#868e96" text-anchor="middle">2D strided 取数</text>
    <!-- descriptor -->
    <rect x="500" y="78" width="150" height="40" rx="4" fill="#1f2d3d"/>
    <text x="575" y="95" font-size="9" fill="#a5d8ff" text-anchor="middle" font-family="Consolas,monospace">CUtensorMap</text>
    <text x="575" y="110" font-size="8" fill="#ced4da" text-anchor="middle">dims/strides/swizzle</text>
    <!-- shared + swizzle -->
    <rect x="500" y="130" width="150" height="34" rx="4" fill="#2f9e44" stroke="#2b8a3e"/>
    <text x="575" y="146" font-size="9" fill="#fff" text-anchor="middle">shared（swizzle 128B）</text>
    <text x="575" y="158" font-size="8" fill="#e6fcf0" text-anchor="middle">破 bank conflict</text>
    <line x1="426" y1="118" x2="500" y2="98" stroke="#7048e8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="575" y1="118" x2="575" y2="130" stroke="#868e96" stroke-width="1.5"/>
    <!-- multicast -->
    <rect x="366" y="190" width="70" height="30" rx="4" fill="#4c6ef5" stroke="#3b5bdb"/>
    <text x="401" y="209" font-size="9" fill="#fff" text-anchor="middle">CTA 0</text>
    <rect x="450" y="190" width="70" height="30" rx="4" fill="#4c6ef5" stroke="#3b5bdb"/>
    <text x="485" y="209" font-size="9" fill="#fff" text-anchor="middle">CTA 1</text>
    <text x="575" y="205" font-size="9" fill="#7048e8" text-anchor="middle">multicast</text>
    <line x1="575" y2="165" x2="401" y1="147" stroke="#1c7ed6" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="575" y2="165" x2="485" y1="147" stroke="#1c7ed6" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="510" y="248" font-size="9" fill="#495057" text-anchor="middle">异步、不占寄存器；一次搬整个 tile</text>
    <text x="510" y="262" font-size="9" fill="#868e96" text-anchor="middle">cp.async.bulk.tensor + tcgen05（sm_90 新增）</text>
  </g>

  <!-- ============ Panel 3: 稀疏 TC ============ -->
  <g>
    <rect x="10" y="300" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">③ 稀疏 Tensor Core（2:4 结构化稀疏）</text>
    <!-- 4 cells -->
    <rect x="40" y="344" width="48" height="34" rx="4" fill="#a5d8ff" stroke="#1c7ed6"/>
    <text x="64" y="365" font-size="10" fill="#495057" text-anchor="middle">w0 ✓</text>
    <rect x="92" y="344" width="48" height="34" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="116" y="365" font-size="10" fill="#868e96" text-anchor="middle">w1 ✗</text>
    <rect x="144" y="344" width="48" height="34" rx="4" fill="#a5d8ff" stroke="#1c7ed6"/>
    <text x="168" y="365" font-size="10" fill="#495057" text-anchor="middle">w2 ✓</text>
    <rect x="196" y="344" width="48" height="34" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="220" y="365" font-size="10" fill="#868e96" text-anchor="middle">w3 ✗</text>
    <text x="120" y="334" font-size="9" fill="#7048e8" text-anchor="middle">每 4 个权重保留 2 个</text>
    <!-- metadata -->
    <rect x="40" y="396" width="204" height="28" rx="4" fill="#1f2d3d"/>
    <text x="52" y="414" font-size="10" fill="#b2f2bb" text-anchor="middle">2-bit</text>
    <text x="142" y="414" font-size="10" fill="#ced4da" text-anchor="middle" font-family="Consolas,monospace">meta = 编码 {w0,w2}</text>
    <text x="270" y="414" font-size="8" fill="#868e96">6 种模式</text>
    <text x="120" y="448" font-size="10" fill="#495057" text-anchor="middle">稀疏 TC 跳过零项 → 2× 吞吐</text>
    <text x="120" y="466" font-size="9" fill="#868e96" text-anchor="middle">权重先 2:4 剪枝 + 编码元数据</text>
    <text x="120" y="492" font-size="9" fill="#495057" text-anchor="middle">剪枝保留 |.| 最大的 2 个（magnitude-aware）</text>
    <text x="120" y="510" font-size="9" fill="#7048e8" text-anchor="middle">稀疏路径 == 显式剪枝（逐位一致 err=0）</text>
    <text x="120" y="540" font-size="9" fill="#868e96" text-anchor="middle">PTX：mma.sp.sync.aligned.m16n8k16... + metadata</text>
  </g>

  <!-- ============ Panel 4: FlashAttention ============ -->
  <g>
    <rect x="350" y="300" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">④ FlashAttention（online softmax）</text>
    <!-- naive N×N -->
    <rect x="372" y="344" width="74" height="74" rx="3" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="409" y="378" font-size="9" fill="#495057" text-anchor="middle">naive</text>
    <text x="409" y="392" font-size="9" fill="#495057" text-anchor="middle">S[N×N]</text>
    <text x="409" y="408" font-size="8" fill="#868e96" text-anchor="middle">物化注意力</text>
    <text x="409" y="436" font-size="9" fill="#e8590c" text-anchor="middle">峰值显存 ∝ N²</text>
    <!-- flash tiles -->
    <rect x="470" y="344" width="40" height="22" rx="2" fill="#2f9e44" stroke="#2b8a3e"/>
    <text x="490" y="358" font-size="8" fill="#fff" text-anchor="middle">tile</text>
    <rect x="470" y="370" width="40" height="22" rx="2" fill="#2f9e44" stroke="#2b8a3e"/>
    <rect x="470" y="396" width="40" height="22" rx="2" fill="#2f9e44" stroke="#2b8a3e"/>
    <text x="490" y="410" font-size="8" fill="#495057" text-anchor="middle">…流式</text>
    <rect x="516" y="344" width="40" height="74" rx="2" fill="#a5d8ff" stroke="#1c7ed6"/>
    <text x="536" y="378" font-size="8" fill="#495057" text-anchor="middle">O</text>
    <text x="536" y="392" font-size="8" fill="#495057" text-anchor="middle">M×d</text>
    <text x="536" y="436" font-size="9" fill="#2b8a3e" text-anchor="middle">峰值显存 ∝ N</text>
    <text x="496" y="466" font-size="9" fill="#868e96" text-anchor="middle">不物化 N×N → IO-aware</text>
    <text x="496" y="492" font-size="10" fill="#495057" text-anchor="middle">online softmax：边算边维护 running m/l</text>
    <text x="496" y="510" font-size="9" fill="#7048e0" text-anchor="middle">Flash == naive（fp32 容差内，maxdiff 8e-7）</text>
    <text x="496" y="540" font-size="9" fill="#868e96" text-anchor="middle">N=2048 峰值显存比值≈33×（naive 16.7MB vs flash 0.5MB）</text>
  </g>
</svg>
