<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" font-family="Segoe UI, Arial, sans-serif">
  <!-- ===================== 背景 ===================== -->
  <rect x="0" y="0" width="680" height="580" fill="#fafbfc"/>
  <text x="340" y="24" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">L3.1  kernel fusion + 异步拷贝 + pipeline  （四联图）</text>

  <!-- ============ Panel 1: naive fusion ============ -->
  <g>
    <rect x="10" y="38" width="320" height="232" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">① kernel fusion：naive（拆 3 kernel）</text>
    <!-- global mem nodes -->
    <rect x="30"  y="150" width="44" height="30" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <rect x="150" y="150" width="44" height="30" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <rect x="270" y="150" width="44" height="30" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="52"  y="170" font-size="11" fill="#495057" text-anchor="middle">x</text>
    <text x="172" y="170" font-size="11" fill="#495057" text-anchor="middle">t1</text>
    <text x="292" y="170" font-size="11" fill="#495057" text-anchor="middle">t2</text>
    <!-- kernel nodes -->
    <rect x="90"  y="90"  width="50" height="28" rx="5" fill="#4c6ef5" stroke="#3b5bdb"/>
    <rect x="210" y="90"  width="50" height="28" rx="5" fill="#4c6ef5" stroke="#3b5bdb"/>
    <rect x="330" y="90"  width="50" height="28" rx="5" fill="#4c6ef5" stroke="#3b5bdb"/>
    <text x="115" y="108" font-size="11" fill="#fff" text-anchor="middle">×scale</text>
    <text x="235" y="108" font-size="11" fill="#fff" text-anchor="middle">+bias</text>
    <text x="355" y="108" font-size="11" fill="#fff" text-anchor="middle">gelu</text>
    <!-- arrows -->
    <line x1="74"  y1="150" x2="90"  y2="118" stroke="#868e96" stroke-width="1.5"/>
    <line x1="140" y1="118" x2="150" y2="150" stroke="#868e96" stroke-width="1.5"/>
    <line x1="194" y1="150" x2="210" y2="118" stroke="#868e96" stroke-width="1.5"/>
    <line x1="260" y1="118" x2="270" y2="150" stroke="#868e96" stroke-width="1.5"/>
    <line x1="314" y1="150" x2="330" y2="118" stroke="#868e96" stroke-width="1.5"/>
    <line x1="380" y1="118" x2="394" y2="150" stroke="#868e96" stroke-width="1.5"/>
    <text x="394" y="170" font-size="11" fill="#495057" text-anchor="middle">y</text>
    <!-- read/write tags -->
    <text x="115" y="200" font-size="10" fill="#868e96" text-anchor="middle">读x 写t1</text>
    <text x="235" y="200" font-size="10" fill="#868e96" text-anchor="middle">读t1 写t2</text>
    <text x="355" y="200" font-size="10" fill="#868e96" text-anchor="middle">读t2 写y</text>
    <text x="170" y="250" font-size="12" font-weight="bold" fill="#e03131" text-anchor="middle">6× 全局往返（3 读 + 3 写）</text>
  </g>

  <!-- ============ Panel 2: fused ============ -->
  <g>
    <rect x="350" y="38" width="320" height="232" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">② kernel fusion：fused（合 1 kernel）</text>
    <rect x="370" y="150" width="44" height="30" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="392" y="170" font-size="11" fill="#495057" text-anchor="middle">x</text>
    <rect x="470" y="90" width="80" height="30" rx="6" fill="#2f9e44" stroke="#2b8a3e"/>
    <text x="510" y="110" font-size="11" fill="#fff" text-anchor="middle">×scale+ Bias+gelu</text>
    <rect x="620" y="150" width="44" height="30" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="642" y="170" font-size="11" fill="#495057" text-anchor="middle">y</text>
    <line x1="414" y1="150" x2="470" y2="120" stroke="#868e96" stroke-width="1.5"/>
    <line x1="550" y1="120" x2="620" y2="150" stroke="#868e96" stroke-width="1.5"/>
    <text x="392" y="200" font-size="10" fill="#868e96" text-anchor="middle">读x</text>
    <text x="642" y="200" font-size="10" fill="#868e96" text-anchor="middle">写y</text>
    <text x="510" y="138" font-size="10" fill="#2b8a3e" text-anchor="middle">全程寄存器，t1/t2 不落全局</text>
    <text x="510" y="250" font-size="12" font-weight="bold" fill="#2f9e44" text-anchor="middle">2× 全局往返（1 读 + 1 写）→ 流量 3×↓</text>
  </g>

  <!-- ============ Panel 3: cp.async ============ -->
  <g>
    <rect x="10" y="300" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">③ cp.async：全局→共享，异步、不落寄存器</text>
    <!-- gmem -->
    <rect x="30" y="360" width="70" height="36" rx="4" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="65" y="383" font-size="11" fill="#495057" text-anchor="middle">全局内存</text>
    <!-- async dashed arrow bypassing register -->
    <path d="M100 378 C150 360 170 360 220 378" stroke="#1971c2" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <text x="160" y="356" font-size="10" fill="#1971c2" text-anchor="middle">cp.async（引擎直搬）</text>
    <!-- smem -->
    <rect x="240" y="360" width="70" height="36" rx="4" fill="#b2f2bb" stroke="#2f9e44"/>
    <text x="275" y="383" font-size="11" fill="#495057" text-anchor="middle">共享内存</text>
    <!-- register (bypassed) -->
    <rect x="150" y="430" width="70" height="30" rx="4" fill="#f1f3f5" stroke="#ced4da" stroke-dasharray="3 3"/>
    <text x="185" y="450" font-size="10" fill="#868e96" text-anchor="middle">寄存器(绕过)</text>
    <line x1="160" y1="396" x2="185" y2="430" stroke="#ced4da" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- engine -->
    <rect x="30" y="430" width="100" height="30" rx="6" fill="#7048e8" stroke="#5f3dc4"/>
    <text x="80" y="450" font-size="10" fill="#fff" text-anchor="middle">异步拷贝引擎</text>
    <!-- issuing thread continues -->
    <rect x="240" y="430" width="80" height="30" rx="6" fill="#fab005" stroke="#e67700"/>
    <text x="280" y="450" font-size="10" fill="#fff" text-anchor="middle">发射线程</text>
    <line x1="320" y1="445" x2="356" y2="445" stroke="#e67700" stroke-width="1.5"/>
    <text x="362" y="450" font-size="11" fill="#e67700">继续→</text>
    <text x="170" y="505" font-size="11" fill="#495057" text-anchor="middle">关键：数据不经过寄存器，发射线程不阻塞等待</text>
    <text x="170" y="525" font-size="10" fill="#868e96" text-anchor="middle">SM_80+；Hopper 由 TMA(cp.async.bulk) 取代，语义一致</text>
  </g>

  <!-- ============ Panel 4: pipeline timeline ============ -->
  <g>
    <rect x="350" y="300" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">④ pipeline：消费 tile i 时预取 tile i+1</text>
    <!-- naive lane -->
    <text x="362" y="352" font-size="10" fill="#868e96">naive（无重叠）</text>
    <rect x="362" y="356" width="40" height="14" fill="#ffd8a8"/>
    <rect x="404" y="356" width="40" height="14" fill="#4c6ef5"/>
    <rect x="446" y="356" width="40" height="14" fill="#ffd8a8"/>
    <rect x="488" y="356" width="40" height="14" fill="#4c6ef5"/>
    <rect x="530" y="356" width="40" height="14" fill="#ffd8a8"/>
    <rect x="572" y="356" width="40" height="14" fill="#4c6ef5"/>
    <text x="362" y="372" font-size="9" fill="#868e96">橙=copy 蓝=compute（串行，互相等待）</text>
    <!-- pipelined lanes -->
    <text x="362" y="402" font-size="10" fill="#868e96">kStages=2（重叠）</text>
    <text x="356" y="420" font-size="9" fill="#495057">Copy</text>
    <rect x="392" y="412" width="40" height="12" fill="#ffd8a8"/>
    <rect x="434" y="412" width="40" height="12" fill="#ffd8a8"/>
    <rect x="476" y="412" width="40" height="12" fill="#ffd8a8"/>
    <rect x="518" y="412" width="40" height="12" fill="#ffd8a8"/>
    <rect x="560" y="412" width="40" height="12" fill="#ffd8a8"/>
    <text x="350" y="440" font-size="9" fill="#495057">Compute</text>
    <rect x="434" y="432" width="40" height="12" fill="#4c6ef5"/>
    <rect x="476" y="432" width="40" height="12" fill="#4c6ef5"/>
    <rect x="518" y="432" width="40" height="12" fill="#4c6ef5"/>
    <rect x="560" y="432" width="40" height="12" fill="#4c6ef5"/>
    <rect x="602" y="432" width="40" height="12" fill="#4c6ef5"/>
    <!-- overlap bracket -->
    <path d="M434 424 L434 448" stroke="#e03131" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="470" y="464" font-size="9" fill="#e03131" text-anchor="middle">计算 tile i 时，copy 已在搬 tile i+1</text>
    <text x="510" y="500" font-size="11" fill="#495057" text-anchor="middle">收益上限≈2×（均衡/访存主导）</text>
    <text x="510" y="520" font-size="10" fill="#868e96" text-anchor="middle">compute-bound 时趋近 1×：本就没延迟可藏</text>
  </g>
</svg>
