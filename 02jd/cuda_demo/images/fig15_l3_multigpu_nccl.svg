<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <!-- ===================== 背景 ===================== -->
  <rect x="0" y="0" width="680" height="590" fill="#f7f8fa"/>
  <text x="340" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2d3d">L3.4 多 GPU / NVLink / NCCL 通信 —— 四联图</text>
  <text x="340" y="44" font-size="11" text-anchor="middle" fill="#6b7785">把「单卡并行」放大到交换机尺度：一个 GPU = 一个 tile</text>

  <!-- ===================== 面板1：并行形态 ===================== -->
  <rect x="10" y="56" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="170" y="76" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2d3d">① 四种并行形态（通信频率递增）</text>
  <rect x="24" y="88" width="292" height="30" rx="5" fill="#e8f0fe"/>
  <text x="32" y="107" font-size="11" fill="#1f2d3d"><tspan font-weight="bold">数据并行 DP</tspan> 切 batch · 每步 1 次 AllReduce</text>
  <rect x="24" y="124" width="292" height="30" rx="5" fill="#e6f4ea"/>
  <text x="32" y="143" font-size="11" fill="#1f2d3d"><tspan font-weight="bold">张量并行 TP</tspan> 切一层权重 · 每层多次 AllReduce</text>
  <rect x="24" y="160" width="292" height="30" rx="5" fill="#fef3e0"/>
  <text x="32" y="179" font-size="11" fill="#1f2d3d"><tspan font-weight="bold">流水线并行 PP</tspan> 切层 · 相邻卡传激活</text>
  <rect x="24" y="196" width="292" height="30" rx="5" fill="#fde8e8"/>
  <text x="32" y="215" font-size="11" fill="#1f2d3d"><tspan font-weight="bold">模型并行 MP</tspan> 单算子放不下一张卡</text>
  <rect x="24" y="234" width="292" height="40" rx="5" fill="#fff7e6" stroke="#f0c36d"/>
  <text x="32" y="252" font-size="11" fill="#7a5c00">TP 通信最频繁 → 必须待在 NVLink 域内</text>
  <text x="32" y="268" font-size="11" fill="#7a5c00">DP 每步才同步 → 容忍跨节点</text>
  <text x="170" y="304" font-size="10" text-anchor="middle" fill="#9aa4b2">呼应 §1：Tensor Core 张量并行 = 切 GEMM + NCCL 求和</text>

  <!-- ===================== 面板2：带宽悬崖 ===================== -->
  <rect x="350" y="56" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="76" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2d3d">② 带宽悬崖（每级 ~10×）</text>
  <!-- 条形（按双向 GB/s，对数感用高度近似） -->
  <rect x="364" y="92"  width="180" height="14" rx="3" fill="#1a7f37"/>
  <text x="552" y="103" font-size="10" fill="#1f2d3d">NVLink4 H100 900</text>
  <rect x="364" y="112" width="120" height="14" rx="3" fill="#2da44e"/>
  <text x="492" y="123" font-size="10" fill="#1f2d3d">NVLink3 600</text>
  <rect x="364" y="132" width="60"  height="14" rx="3" fill="#79c0ff"/>
  <text x="432" y="143" font-size="10" fill="#1f2d3d">PCIe5 128</text>
  <rect x="364" y="152" width="30"  height="14" rx="3" fill="#a5d8ff"/>
  <text x="402" y="163" font-size="10" fill="#1f2d3d">PCIe4 64</text>
  <rect x="364" y="172" width="16"  height="14" rx="3" fill="#d0d7de"/>
  <text x="388" y="183" font-size="10" fill="#1f2d3d">IB 50</text>
  <rect x="364" y="192" width="8"   height="14" rx="3" fill="#e0e0e0"/>
  <text x="380" y="203" font-size="10" fill="#1f2d3d">Eth 12</text>
  <rect x="364" y="216" width="292" height="50" rx="5" fill="#fff7e6" stroke="#f0c36d"/>
  <text x="372" y="234" font-size="11" fill="#7a5c00">NVSwitch：8×H100 全连接 mesh</text>
  <text x="372" y="250" font-size="11" fill="#7a5c00">任意两卡同时 900 GB/s，无最慢环链路</text>
  <text x="372" y="266" font-size="10" fill="#9aa4b2">PCIe 跨 switch 有效带宽常只剩 1/2</text>
  <text x="510" y="304" font-size="10" text-anchor="middle" fill="#9aa4b2">呼应 §2：TP 掉进 PCIe 悬崖 → 算力空转</text>

  <!-- ===================== 面板3：Ring AllReduce ===================== -->
  <rect x="10" y="330" width="320" height="248" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="170" y="350" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2d3d">③ Ring AllReduce（= L2.4 跨卡版）</text>
  <!-- 4 卡环 -->
  <circle cx="60"  cy="392" r="16" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="60"  y="396" font-size="11" text-anchor="middle" fill="#1f2d3d">G0</text>
  <circle cx="280" cy="392" r="16" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="280" y="396" font-size="11" text-anchor="middle" fill="#1f2d3d">G1</text>
  <circle cx="280" cy="470" r="16" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="280" y="474" font-size="11" text-anchor="middle" fill="#1f2d3d">G2</text>
  <circle cx="60"  cy="470" r="16" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="60"  y="474" font-size="11" text-anchor="middle" fill="#1f2d3d">G3</text>
  <path d="M76 392 H264" stroke="#d0d7de" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M280 408 V454" stroke="#d0d7de" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M264 470 H76" stroke="#d0d7de" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M60 454 V408" stroke="#d0d7de" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d0d7de"/>
    </marker>
  </defs>
  <rect x="24" y="498" width="292" height="20" rx="4" fill="#e6f4ea"/>
  <text x="32" y="512" font-size="10" fill="#1f2d3d">scatter-reduce：N−1 步累加 → 每卡一块完整</text>
  <rect x="24" y="522" width="292" height="20" rx="4" fill="#e8f0fe"/>
  <text x="32" y="536" font-size="10" fill="#1f2d3d">all-gather：N−1 步扩散 → 每卡全量</text>
  <rect x="24" y="546" width="292" height="22" rx="4" fill="#fff7e6" stroke="#f0c36d"/>
  <text x="32" y="561" font-size="10" fill="#7a5c00">bus/GPU = 2·(N−1)/N·K ；N=8 K=1GB → 1.75 GB</text>

  <!-- ===================== 面板4：comm-compute overlap ===================== -->
  <rect x="350" y="330" width="320" height="248" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="350" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2d3d">④ comm-compute overlap（= L3.1 跨卡版）</text>
  <!-- GPU0 时间线 -->
  <text x="358" y="372" font-size="10" fill="#1f2d3d">GPU0</text>
  <rect x="396" y="362" width="120" height="14" rx="3" fill="#79c0ff"/>
  <text x="402" y="373" font-size="9" fill="#fff">compute 100ms</text>
  <rect x="396" y="378" width="55" height="14" rx="3" fill="#f0c36d"/>
  <text x="402" y="389" font-size="9" fill="#fff">comm 54ms</text>
  <!-- GPU1 时间线 -->
  <text x="358" y="412" font-size="10" fill="#1f2d3d">GPU1</text>
  <rect x="451" y="402" width="65" height="14" rx="3" fill="#f0c36d"/>
  <text x="457" y="413" font-size="9" fill="#fff">comm 54ms</text>
  <rect x="451" y="418" width="120" height="14" rx="3" fill="#79c0ff"/>
  <text x="457" y="429" font-size="9" fill="#fff">compute 100ms</text>
  <rect x="364" y="442" width="292" height="20" rx="4" fill="#e6f4ea"/>
  <text x="372" y="456" font-size="10" fill="#1f2d3d">重叠：step = max(compute, comm) = 100ms</text>
  <rect x="364" y="466" width="292" height="20" rx="4" fill="#fde8e8"/>
  <text x="372" y="480" font-size="10" fill="#1f2d3d">不重叠：100+54 = 154ms（PCIe4 时 865ms）</text>
  <rect x="364" y="490" width="292" height="22" rx="4" fill="#fff7e6" stroke="#f0c36d"/>
  <text x="372" y="505" font-size="10" fill="#7a5c00">NVLink 把通信藏进计算 → 多卡近线性扩展</text>
  <text x="372" y="528" font-size="10" fill="#9aa4b2">NCCL 异步排在 stream：ncclAllReduce(...,stream)</text>
  <text x="372" y="546" font-size="10" fill="#9aa4b2">高优先级 stream 最大化 overlap（§3.3）</text>
  <text x="510" y="566" font-size="10" text-anchor="middle" fill="#9aa4b2">闭环：卡间带宽 = 多卡扩展的新瓶颈</text>

  <!-- 脚注 -->
  <text x="10" y="586" font-size="9" fill="#9aa4b2">真实锚点：NCCL API 文档 (docs.nvidia.com/deeplearning/nccl) · NVLink 博客 (developer.nvidia.com/blog) · 代码 ring_allreduce_host() 对拍 PASS</text>
</svg>
