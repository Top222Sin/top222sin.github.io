<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 860" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="680" height="860" fill="#f8fafc"/>
  <text x="20" y="34" font-size="18" font-weight="800" fill="#0f172a">onnxruntime CUDA EP 工业级模式（六条对照 L2.1–L2.4）</text>
  <text x="20" y="52" font-size="11" fill="#64748b">源码：microsoft/onnxruntime · main · transpose_impl.cu / softmax_warpwise_impl.cuh / layer_norm_impl.cu / gemm.cc</text>

  <!-- ============ Panel 1: Tiled transpose ============ -->
  <rect x="20" y="64" width="310" height="346" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="36" y="88" font-size="13" font-weight="700" fill="#1d4ed8">① 分块转置 + tile[32][33] padding</text>
  <text x="36" y="106" font-size="10" fill="#64748b">transpose_impl.cu:10-46 · 对应 L2.1 bank/pad</text>

  <!-- input row-major -->
  <text x="36" y="132" font-size="10" font-weight="600" fill="#334155">输入（行连续）</text>
  <g transform="translate(36,140)">
    <rect x="0" y="0" width="20" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="22" y="0" width="20" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="44" y="0" width="20" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="0" y="22" width="20" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="22" y="22" width="20" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="44" y="22" width="20" height="20" fill="#dbeafe" stroke="#93c5fd"/>
  </g>
  <!-- arrow 合并读 -->
  <line x1="100" y1="172" x2="140" y2="200" stroke="#15803d" stroke-width="2" marker-end="url(#arwg)"/>
  <text x="100" y="166" font-size="9" fill="#15803d">合并读</text>

  <!-- shared tile 32x33 -->
  <text x="150" y="210" font-size="10" font-weight="600" fill="#334155">__shared__ tile[32][33]</text>
  <g transform="translate(150,216)" stroke="#cbd5e1">
    <rect x="0" y="0" width="120" height="80" fill="#f8fafc"/>
    <line x1="0" y1="20" x2="120" y2="20"/><line x1="0" y1="40" x2="120" y2="40"/><line x1="0" y1="60" x2="120" y2="60"/>
    <line x1="20" y1="0" x2="20" y2="80"/><line x1="40" y1="0" x2="40" y2="80"/><line x1="60" y1="0" x2="60" y2="80"/><line x1="80" y1="0" x2="80" y2="80"/><line x1="100" y1="0" x2="100" y2="80"/>
    <rect x="120" y="0" width="20" height="80" fill="#fee2e2" stroke="#fca5a5"/>
  </g>
  <text x="276" y="222" font-size="9" font-weight="700" fill="#b91c1c">+1 列</text>
  <text x="276" y="234" font-size="9" fill="#b91c1c">破 bank</text>
  <text x="276" y="246" font-size="9" fill="#b91c1c">conflict</text>

  <!-- arrow 合并写 -->
  <line x1="210" y1="300" x2="170" y2="330" stroke="#15803d" stroke-width="2" marker-end="url(#arwg)"/>
  <text x="214" y="306" font-size="9" fill="#15803d">合并写</text>

  <!-- output -->
  <text x="36" y="350" font-size="10" font-weight="600" fill="#334155">输出（转置）</text>
  <g transform="translate(36,356)">
    <rect x="0" y="0" width="20" height="20" fill="#dcfce7" stroke="#86efac"/>
    <rect x="0" y="22" width="20" height="20" fill="#dcfce7" stroke="#86efac"/>
    <rect x="0" y="44" width="20" height="20" fill="#dcfce7" stroke="#86efac"/>
    <rect x="22" y="0" width="20" height="20" fill="#dcfce7" stroke="#86efac"/>
    <rect x="22" y="22" width="20" height="20" fill="#dcfce7" stroke="#86efac"/>
    <rect x="22" y="44" width="20" height="20" fill="#dcfce7" stroke="#86efac"/>
  </g>
  <text x="36" y="398" font-size="9" fill="#475569">读/写都合并 → 事务数大降；tiling 不改 AI，砍冗余延迟</text>

  <!-- ============ Panel 2: Softmax warp reduce ============ -->
  <rect x="350" y="64" width="310" height="346" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="366" y="88" font-size="13" font-weight="700" fill="#1d4ed8">② warp 归约：__shfl_xor（无 shared）</text>
  <text x="366" y="106" font-size="10" fill="#64748b">softmax_warpwise_impl.cuh:45-56 · 对应 L2.4 shuffle</text>

  <!-- registers -->
  <text x="366" y="132" font-size="10" font-weight="600" fill="#334155">每线程寄存器 vals[WARP_ITER]</text>
  <g transform="translate(366,140)">
    <rect x="0" y="0" width="22" height="18" fill="#dbeafe" stroke="#93c5fd"/><text x="6" y="13" font-size="9" fill="#1e3a8a">R0</text>
    <rect x="26" y="0" width="22" height="18" fill="#dbeafe" stroke="#93c5fd"/><text x="32" y="13" font-size="9" fill="#1e3a8a">R1</text>
    <rect x="52" y="0" width="22" height="18" fill="#dbeafe" stroke="#93c5fd"/><text x="58" y="13" font-size="9" fill="#1e3a8a">R2</text>
    <rect x="78" y="0" width="22" height="18" fill="#dbeafe" stroke="#93c5fd"/><text x="84" y="13" font-size="9" fill="#1e3a8a">R3</text>
    <rect x="104" y="0" width="22" height="18" fill="#dbeafe" stroke="#93c5fd"/><text x="110" y="13" font-size="9" fill="#1e3a8a">R4</text>
    <rect x="130" y="0" width="22" height="18" fill="#dbeafe" stroke="#93c5fd"/><text x="136" y="13" font-size="9" fill="#1e3a8a">R5</text>
  </g>
  <!-- xor butterfly -->
  <text x="366" y="186" font-size="10" font-weight="600" fill="#334155">xor 蝶形归约（offset 16→8→4…）</text>
  <g transform="translate(366,194)" stroke="#475569" stroke-width="1.4" fill="none">
    <line x1="11" y1="6" x2="69" y2="38"/><line x1="37" y1="6" x2="43" y2="38"/>
    <line x1="63" y1="6" x2="11" y2="38"/><line x1="89" y1="6" x2="92" y2="38"/>
    <line x1="115" y1="6" x2="157" y2="38"/><line x1="141" y1="6" x2="135" y2="38"/>
    <line x1="167" y1="6" x2="115" y2="38"/><line x1="193" y1="6" x2="187" y2="38"/>
    <circle cx="11" cy="6" r="3" fill="#1d4ed8"/><circle cx="37" cy="6" r="3" fill="#1d4ed8"/>
    <circle cx="63" cy="6" r="3" fill="#1d4ed8"/><circle cx="89" cy="6" r="3" fill="#1d4ed8"/>
    <circle cx="115" cy="6" r="3" fill="#1d4ed8"/><circle cx="141" cy="6" r="3" fill="#1d4ed8"/>
    <circle cx="167" cy="6" r="3" fill="#1d4ed8"/><circle cx="193" cy="6" r="3" fill="#1d4ed8"/>
    <circle cx="11" cy="44" r="3" fill="#7c3aed"/><circle cx="92" cy="44" r="3" fill="#7c3aed"/>
    <circle cx="115" cy="44" r="3" fill="#7c3aed"/><circle cx="187" cy="44" r="3" fill="#7c3aed"/>
  </g>
  <!-- max / sum -->
  <rect x="366" y="270" width="120" height="26" rx="6" fill="#fef9c3" stroke="#fde047"/>
  <text x="376" y="287" font-size="10" fill="#854d0e">warp_reduce → max、sum</text>
  <line x1="426" y1="296" x2="426" y2="320" stroke="#475569" marker-end="url(#arw)"/>
  <rect x="366" y="324" width="150" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="376" y="340" font-size="10" fill="#166534">写回：invsum 只算一次</text>
  <text x="366" y="392" font-size="9" fill="#475569">寄存器内 shuffle，无需 __syncthreads / shared → 最低延迟</text>

  <!-- ============ Panel 3: LayerNorm reduction tree ============ -->
  <rect x="20" y="430" width="310" height="346" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="36" y="454" font-size="13" font-weight="700" fill="#1d4ed8">③ 跨 warp 归约 + grid-stride</text>
  <text x="36" y="472" font-size="10" fill="#64748b">layer_norm_impl.cu:136-179,345 · 对应 L2.2 occupancy</text>

  <!-- warps -->
  <text x="36" y="498" font-size="10" font-weight="600" fill="#334155">warp 内：shfl_down 归约</text>
  <rect x="36" y="504" width="80" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="46" y="525" font-size="10" fill="#1e3a8a">warp0 μ,σ²</text>
  <rect x="200" y="504" width="80" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="210" y="525" font-size="10" fill="#1e3a8a">warp1 μ,σ²</text>
  <line x1="116" y1="521" x2="200" y2="521" stroke="#475569" marker-end="url(#arw)"/>

  <rect x="36" y="560" width="244" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="578" font-size="9" fill="#334155">warp 间：写 ubuf/ibuf（shared）</text>
  <text x="46" y="592" font-size="9" fill="#334155">offset 折半合并 → __syncthreads</text>
  <line x1="158" y1="544" x2="158" y2="560" stroke="#475569" marker-end="url(#arw)"/>

  <rect x="36" y="624" width="244" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="46" y="642" font-size="10" fill="#166534">threadIdx=(0,0) 广播 μ,σ² 给全块</text>
  <line x1="158" y1="600" x2="158" y2="624" stroke="#475569" marker-end="url(#arw)"/>
  <text x="36" y="682" font-size="9" fill="#475569">外层 for i1=blockIdx.y; i1&lt;n1; i1+=gridDim.y</text>
  <text x="36" y="696" font-size="9" fill="#475569">= grid-stride：一个 block 管多行 → SM 不空转</text>
  <text x="36" y="724" font-size="9" fill="#475569">threads_y 按 n2 自适应（round_up_pow2，受 maxThreadsPerBlock 约束）</text>
  <text x="36" y="746" font-size="9" fill="#475569">→ 在「并行行数 / 占用率」间选平衡（L2.2）</text>

  <!-- ============ Panel 4: GEMM delegate to lib ============ -->
  <rect x="350" y="430" width="310" height="346" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="366" y="454" font-size="13" font-weight="700" fill="#1d4ed8">④ GEMM 不手写 → 交给库</text>
  <text x="366" y="472" font-size="10" fill="#64748b">gemm.cc:78-79,157 · 抽象边界 / compute-bound</text>

  <rect x="430" y="500" width="150" height="36" rx="18" fill="#fef9c3" stroke="#fde047"/>
  <text x="444" y="522" font-size="10" fill="#854d0e">手写 tiling？</text>
  <line x1="430" y1="518" x2="408" y2="560" stroke="#b91c1c" stroke-width="2" marker-end="url(#arw)"/>
  <text x="392" y="556" font-size="9" font-weight="700" fill="#b91c1c">❌ 交给库</text>
  <line x1="580" y1="518" x2="600" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="606" y="556" width="2" height="2" fill="none"/>
  <rect x="372" y="588" width="266" height="64" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="384" y="610" font-size="11" font-weight="700" fill="#1e3a8a">cuBLAS / cuBLASLt</text>
  <text x="384" y="626" font-size="9" fill="#334155">· TunableGemm 运行时选算法</text>
  <text x="384" y="640" font-size="9" fill="#334155">· workspace + 启发式 + Tensor Core</text>

  <rect x="372" y="676" width="266" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="384" y="696" font-size="9" fill="#334155">自己只做：shape 解析 / bias broadcast</text>
  <text x="384" y="710" font-size="9" fill="#334155">（用 GetConstOnes 小 GEMM 代替循环）</text>
  <text x="384" y="724" font-size="9" fill="#334155">/ 绑定到正确 stream（Stream(ctx)）</text>
  <text x="372" y="760" font-size="9" fill="#475569">= L2.3 compute-bound：把极致手活交给库，吃满算力</text>
</svg>
