<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000" font-family="Consolas, Menlo, monospace">
  <rect x="0" y="0" width="680" height="1000" fill="#f6f8fb"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#14233a">NEON 对照线 ⑤/⑥：大块 Winograd + Depthwise pack8</text>
  <text x="24" y="54" font-size="12" fill="#5b6b82">数据/指令流：把乘加搬进变换域与多通道寄存器（ncnn ARM 后端 3×3 卷积完整覆盖）</text>

  <!-- ============================ 5a ============================ -->
  <text x="24" y="92" font-size="15" font-weight="bold" fill="#0b5cad">⑤a  Winograd F(4×4,3×3)  ——  6×6 输入块 → 4×4 输出   |   MAC 144 → 36  (4.00×)</text>
  <line x1="24" y1="104" x2="656" y2="104" stroke="#cdd9e8"/>

  <!-- input d -->
  <rect x="40" y="140" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="86" y="159" font-size="13" fill="#1e3a8a" text-anchor="middle">d (6×6)</text>
  <text x="86" y="175" font-size="10" fill="#5b6b82" text-anchor="middle">输入块</text>
  <line x1="132" y1="163" x2="166" y2="163" stroke="#334155" stroke-width="1.5"/>
  <polygon points="166,163 158,159 158,167" fill="#334155"/>
  <!-- ITM -->
  <rect x="168" y="138" width="64" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="160" font-size="12" fill="#92400e" text-anchor="middle">ITM</text>
  <text x="200" y="176" font-size="10" fill="#92400e" text-anchor="middle">=Bᵀ(6×6)</text>
  <line x1="232" y1="163" x2="266" y2="163" stroke="#334155" stroke-width="1.5"/>
  <polygon points="266,163 258,159 258,167" fill="#334155"/>
  <!-- D -->
  <rect x="268" y="140" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="314" y="167" font-size="13" fill="#1e3a8a" text-anchor="middle">D = ITM·d·ITMᵀ</text>

  <!-- g -->
  <rect x="40" y="232" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="86" y="251" font-size="13" fill="#1e3a8a" text-anchor="middle">g (3×3)</text>
  <text x="86" y="267" font-size="10" fill="#5b6b82" text-anchor="middle">核</text>
  <line x1="132" y1="255" x2="166" y2="255" stroke="#334155" stroke-width="1.5"/>
  <polygon points="166,255 158,251 158,259" fill="#334155"/>
  <!-- G -->
  <rect x="168" y="230" width="64" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="252" font-size="12" fill="#92400e" text-anchor="middle">G</text>
  <text x="200" y="268" font-size="10" fill="#92400e" text-anchor="middle">(6×3)</text>
  <line x1="232" y1="255" x2="266" y2="255" stroke="#334155" stroke-width="1.5"/>
  <polygon points="266,255 258,251 258,259" fill="#334155"/>
  <!-- K -->
  <rect x="268" y="232" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="314" y="259" font-size="13" fill="#1e3a8a" text-anchor="middle">K = G·g·Gᵀ</text>

  <!-- D,K -> Hadamard -->
  <line x1="360" y1="163" x2="408" y2="200" stroke="#334155" stroke-width="1.5"/>
  <polygon points="408,200 399,197 403,189" fill="#334155"/>
  <line x1="360" y1="255" x2="408" y2="210" stroke="#334155" stroke-width="1.5"/>
  <polygon points="408,210 403,203 399,211" fill="#334155"/>
  <!-- Hadamard -->
  <rect x="410" y="190" width="96" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="458" y="208" font-size="13" fill="#991b1b" text-anchor="middle">M = D ⊙ K</text>
  <text x="458" y="223" font-size="9" fill="#991b1b" text-anchor="middle">36 次逐元素乘</text>
  <line x1="506" y1="210" x2="540" y2="210" stroke="#334155" stroke-width="1.5"/>
  <polygon points="540,210 532,206 532,214" fill="#334155"/>
  <!-- OTM -->
  <rect x="542" y="188" width="64" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="574" y="210" font-size="12" fill="#92400e" text-anchor="middle">OTM</text>
  <text x="574" y="226" font-size="10" fill="#92400e" text-anchor="middle">=Aᵀ(4×6)</text>
  <line x1="606" y1="213" x2="624" y2="213" stroke="#334155" stroke-width="1.5"/>
  <polygon points="632,213 624,209 624,217" fill="#334155"/>
  <!-- Y -->
  <rect x="626" y="190" width="40" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="646" y="209" font-size="12" fill="#166534" text-anchor="middle">Y</text>
  <text x="646" y="224" font-size="9" fill="#166534" text-anchor="middle">4×4</text>

  <text x="40" y="300" font-size="11" fill="#475569">ncnn 真实常数：G(:5692) / ITM 注释(:5803) / OTM 注释(:6602) / 驱动 conv3x3s1_winograd43(:7258)。整图对拍 maxdiff ≈ 5e-15。</text>

  <!-- ============================ 5b ============================ -->
  <text x="24" y="338" font-size="15" font-weight="bold" fill="#0b5cad">⑤b  Winograd F(3×3,3×3)  ——  5×5 输入块 → 3×3 输出   |   MAC 81 → 25  (3.24×)</text>
  <line x1="24" y1="350" x2="656" y2="350" stroke="#cdd9e8"/>

  <rect x="40" y="384" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="86" y="403" font-size="13" fill="#1e3a8a" text-anchor="middle">d (5×5)</text>
  <text x="86" y="419" font-size="10" fill="#5b6b82" text-anchor="middle">输入块</text>
  <line x1="132" y1="407" x2="166" y2="407" stroke="#334155" stroke-width="1.5"/>
  <polygon points="166,407 158,403 158,411" fill="#334155"/>
  <rect x="168" y="382" width="64" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="404" font-size="12" fill="#92400e" text-anchor="middle">Bᵀ</text>
  <text x="200" y="420" font-size="10" fill="#92400e" text-anchor="middle">(5×5)</text>
  <line x1="232" y1="407" x2="266" y2="407" stroke="#334155" stroke-width="1.5"/>
  <polygon points="266,407 258,403 258,411" fill="#334155"/>
  <rect x="268" y="384" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="314" y="411" font-size="13" fill="#1e3a8a" text-anchor="middle">D = Bᵀ·d·B</text>

  <rect x="40" y="476" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="86" y="495" font-size="13" fill="#1e3a8a" text-anchor="middle">g (3×3)</text>
  <text x="86" y="511" font-size="10" fill="#5b6b82" text-anchor="middle">核</text>
  <line x1="132" y1="499" x2="166" y2="499" stroke="#334155" stroke-width="1.5"/>
  <polygon points="166,499 158,495 158,503" fill="#334155"/>
  <rect x="168" y="474" width="64" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="496" font-size="12" fill="#92400e" text-anchor="middle">G</text>
  <text x="200" y="512" font-size="10" fill="#92400e" text-anchor="middle">(5×3)</text>
  <line x1="232" y1="499" x2="266" y2="499" stroke="#334155" stroke-width="1.5"/>
  <polygon points="266,499 258,495 258,503" fill="#334155"/>
  <rect x="268" y="476" width="92" height="46" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="314" y="503" font-size="13" fill="#1e3a8a" text-anchor="middle">K = G·g·Gᵀ</text>

  <line x1="360" y1="407" x2="408" y2="444" stroke="#334155" stroke-width="1.5"/>
  <polygon points="408,444 399,441 403,433" fill="#334155"/>
  <line x1="360" y1="499" x2="408" y2="454" stroke="#334155" stroke-width="1.5"/>
  <polygon points="408,454 403,447 399,455" fill="#334155"/>
  <rect x="410" y="434" width="96" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="458" y="452" font-size="13" fill="#991b1b" text-anchor="middle">M = D ⊙ K</text>
  <text x="458" y="467" font-size="9" fill="#991b1b" text-anchor="middle">25 次逐元素乘</text>
  <line x1="506" y1="454" x2="540" y2="454" stroke="#334155" stroke-width="1.5"/>
  <polygon points="540,454 532,450 532,458" fill="#334155"/>
  <rect x="542" y="432" width="64" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="574" y="454" font-size="12" fill="#92400e" text-anchor="middle">Aᵀ</text>
  <text x="574" y="470" font-size="10" fill="#92400e" text-anchor="middle">(3×5)</text>
  <line x1="606" y1="457" x2="624" y2="457" stroke="#334155" stroke-width="1.5"/>
  <polygon points="632,457 624,453 624,461" fill="#334155"/>
  <rect x="626" y="434" width="40" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="646" y="453" font-size="12" fill="#166534" text-anchor="middle">Y</text>
  <text x="646" y="468" font-size="9" fill="#166534" text-anchor="middle">3×3</text>

  <text x="40" y="544" font-size="11" fill="#475569">ncnn 不 ship 此 tile —— ALS（交替最小二乘）+ 联合 Gauss-Newton 在双线性约束下数值构造，</text>
  <text x="40" y="560" font-size="11" fill="#475569">残差 1.69e-15，2D 卷积对拍 ≈ 3e-15（_solve_w33.py + verify_neon_winobig_pack8.py）。</text>

  <!-- ============================ 6 ============================ -->
  <text x="24" y="598" font-size="15" font-weight="bold" fill="#0b5cad">⑥  Depthwise 3×3 pack8  ——  8 通道/一对 float32x4，逐 pack 同时算</text>
  <line x1="24" y1="610" x2="656" y2="610" stroke="#cdd9e8"/>

  <!-- pack -->
  <rect x="40" y="640" width="120" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="100" y="660" font-size="12" fill="#5b21b6" text-anchor="middle">C 通道按 8 对齐打包</text>
  <text x="100" y="677" font-size="10" fill="#5b21b6" text-anchor="middle">P = div_up(C,8)*8</text>
  <line x1="160" y1="665" x2="196" y2="665" stroke="#334155" stroke-width="1.5"/>
  <polygon points="196,665 188,661 188,669" fill="#334155"/>
  <!-- 8 ch -->
  <rect x="198" y="640" width="92" height="50" rx="8" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="244" y="660" font-size="12" fill="#1e3a8a" text-anchor="middle">8 通道</text>
  <text x="244" y="677" font-size="10" fill="#5b6b82" text-anchor="middle">float32x4 ×2</text>
  <line x1="290" y1="665" x2="324" y2="665" stroke="#334155" stroke-width="1.5"/>
  <polygon points="324,665 316,661 316,669" fill="#334155"/>
  <!-- sliding 3x3 -->
  <rect x="326" y="640" width="120" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="386" y="660" font-size="12" fill="#92400e" text-anchor="middle">每个位置 3×3 滑窗</text>
  <text x="386" y="677" font-size="10" fill="#92400e" text-anchor="middle">inv[8]·kern[8]</text>
  <line x1="446" y1="665" x2="480" y2="665" stroke="#334155" stroke-width="1.5"/>
  <polygon points="480,665 472,661 472,669" fill="#334155"/>
  <!-- acc -->
  <rect x="482" y="640" width="92" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="528" y="660" font-size="12" fill="#166534" text-anchor="middle">acc[8]</text>
  <text x="528" y="677" font-size="10" fill="#166534" text-anchor="middle">fmla 累加</text>
  <line x1="574" y1="665" x2="608" y2="665" stroke="#334155" stroke-width="1.5"/>
  <polygon points="616,665 608,661 608,669" fill="#334155"/>
  <!-- out -->
  <rect x="618" y="640" width="48" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="642" y="660" font-size="12" fill="#5b21b6" text-anchor="middle">out</text>
  <text x="642" y="677" font-size="10" fill="#5b21b6" text-anchor="middle">写回</text>

  <!-- channel strip -->
  <text x="40" y="724" font-size="11" fill="#475569">逐 pack 内 8 通道并行：</text>
  <g font-size="10" fill="#334155">
    <rect x="40" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="51" y="752" text-anchor="middle">c0</text>
    <rect x="66" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="77" y="752" text-anchor="middle">c1</text>
    <rect x="92" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="103" y="752" text-anchor="middle">c2</text>
    <rect x="118" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="129" y="752" text-anchor="middle">c3</text>
    <rect x="144" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="155" y="752" text-anchor="middle">c4</text>
    <rect x="170" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="181" y="752" text-anchor="middle">c5</text>
    <rect x="196" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="207" y="752" text-anchor="middle">c6</text>
    <rect x="222" y="736" width="22" height="22" rx="3" fill="#ddd6fe"/><text x="233" y="752" text-anchor="middle">c7</text>
  </g>
  <text x="256" y="752" font-size="11" fill="#475569">← 一对 float32x4 同时承载</text>

  <text x="40" y="792" font-size="11" fill="#475569">MAC = 9·C·H·W（比普通 3×3 的 9·C²·H·W 少 C 倍）；数值严格 == 逐通道 naive。</text>
  <text x="40" y="808" font-size="11" fill="#475569">重建基础：标量 convolutiondepthwise_3x3.h 的 repack(:36-42) + ext/fmla 滑窗(:71-115)；Python 对拍误差 0.0。</text>

  <!-- summary -->
  <rect x="24" y="836" width="632" height="120" rx="10" fill="#ffffff" stroke="#cdd9e8"/>
  <text x="40" y="860" font-size="13" font-weight="bold" fill="#14233a">降乘 / 打包 小结</text>
  <g font-size="11" fill="#334155">
    <text x="40" y="884">⑤a F(4,3)：144 MAC → 36 乘法 ＝ <tspan fill="#0b5cad" font-weight="bold">4.00×</tspan> 降乘（ncnn 真实常数）</text>
    <text x="40" y="906">⑤b F(3,3)： 81 MAC → 25 乘法 ＝ <tspan fill="#0b5cad" font-weight="bold">3.24×</tspan> 降乘（ALS 自造，残差 1e-15）</text>
    <text x="40" y="928">⑥ pack8： 8 通道 / 一对 float32x4 并行，MAC=9·C·HW，数值 == naive</text>
    <text x="40" y="950" fill="#5b6b82">与 ②/③/④ 站合起来 = ncnn ARM 后端 3×3 卷积完整覆盖：F(2,3)/F(4,3)/(自造 F(3,3))/逐通道 depthwise/INT8</text>
  </g>
</svg>
