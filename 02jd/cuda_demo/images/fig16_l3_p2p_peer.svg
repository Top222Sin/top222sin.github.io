<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="590" fill="#f6f8fa"/>
  <text x="340" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2328">L3 补充：GPU 直接通信 P2P + cudaMemcpyPeer</text>
  <text x="340" y="46" font-size="11" text-anchor="middle" fill="#57606a">NCCL 自动选 transport 的底层物理：peer access 让卡间不绕 host</text>

  <!-- ① staged vs P2P -->
  <rect x="10" y="58" width="320" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="78" font-size="13" font-weight="bold" fill="#1f2328">① 直连 vs 绕 host</text>
  <text x="20" y="94" font-size="10.5" fill="#57606a">传统 staged：两次 PCIe + 一次 host 拷贝</text>
  <!-- staged -->
  <rect x="30" y="104" width="60" height="34" rx="5" fill="#ffeef0" stroke="#fda4af"/>
  <text x="60" y="125" font-size="10" text-anchor="middle" fill="#a4133c">GPU0</text>
  <rect x="120" y="104" width="70" height="34" rx="5" fill="#fff8e6" stroke="#f0c674"/>
  <text x="155" y="119" font-size="9" text-anchor="middle" fill="#8a6d1a">host</text>
  <text x="155" y="131" font-size="8" text-anchor="middle" fill="#8a6d1a">pinned</text>
  <rect x="230" y="104" width="60" height="34" rx="5" fill="#ffeef0" stroke="#fda4af"/>
  <text x="260" y="125" font-size="10" text-anchor="middle" fill="#a4133c">GPU1</text>
  <line x1="90" y1="121" x2="120" y2="121" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="190" y1="121" x2="230" y2="121" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="90" y="113" font-size="7.5" text-anchor="middle" fill="#57606a">PCIe读</text>
  <text x="205" y="113" font-size="7.5" text-anchor="middle" fill="#57606a">memcpy</text>
  <text x="210" y="140" font-size="8" fill="#cf222e">~10–20 µs · CPU 全程参与</text>
  <!-- P2P direct -->
  <rect x="30" y="170" width="60" height="34" rx="5" fill="#e6ffed" stroke="#7ee2a8"/>
  <text x="60" y="191" font-size="10" text-anchor="middle" fill="#1a7f37">GPU0</text>
  <rect x="230" y="170" width="60" height="34" rx="5" fill="#e6ffed" stroke="#7ee2a8"/>
  <text x="260" y="191" font-size="10" text-anchor="middle" fill="#1a7f37">GPU1</text>
  <line x1="90" y1="187" x2="230" y2="187" stroke="#2da44e" stroke-width="2.5"/>
  <text x="160" y="180" font-size="8" text-anchor="middle" fill="#1a7f37">NVLink/PCIe P2P 直达</text>
  <text x="160" y="200" font-size="8" text-anchor="middle" fill="#1a7f37">PCIe ~3–5µs / NVLink ~1–2µs</text>
  <text x="20" y="222" font-size="10" fill="#57606a">1 GB 搬运耗时模型：</text>
  <text x="20" y="240" font-size="10.5" fill="#cf222e">绕 host  102.5 ms</text>
  <text x="20" y="258" font-size="10.5" fill="#9a6700">PCIe P2P  31.3 ms  (3.3×)</text>
  <text x="20" y="276" font-size="10.5" fill="#1a7f37">NVLink    2.22 ms  (46×)</text>

  <!-- ② enable flow -->
  <rect x="350" y="58" width="320" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="78" font-size="13" font-weight="bold" fill="#1f2328">② EnablePeerAccess 流程</text>
  <text x="360" y="94" font-size="10.5" fill="#57606a">四步，映射非对称要双向 enable</text>
  <rect x="366" y="104" width="288" height="22" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="374" y="119" font-size="9.5" fill="#05395c">1) cudaDeviceCanAccessPeer(&amp;can, 0, 1)</text>
  <rect x="366" y="132" width="288" height="22" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="374" y="147" font-size="9.5" fill="#05395c">2) setDevice(0); EnablePeerAccess(1, 0)</text>
  <rect x="366" y="160" width="288" height="22" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="374" y="175" font-size="9.5" fill="#05395c">3) setDevice(1); EnablePeerAccess(0, 0)</text>
  <rect x="366" y="188" width="288" height="22" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="374" y="203" font-size="9.5" fill="#05395c">4) cudaMemcpyPeer(dst,1, src,0, n)</text>
  <rect x="366" y="220" width="288" height="74" rx="4" fill="#fff8e6" stroke="#f0c674"/>
  <text x="374" y="236" font-size="9.5" fill="#8a6d1a">坑① 映射非对称：0→1 ≠ 1→0，各 enable 一次</text>
  <text x="374" y="252" font-size="9.5" fill="#8a6d1a">坑② 不与其他 op 并发：拷贝前须排干两卡</text>
  <text x="374" y="268" font-size="9.5" fill="#8a6d1a">     在飞任务；期间不能起别的 kernel</text>
  <text x="374" y="284" font-size="9.5" fill="#8a6d1a">硬条件：UVA + 同 Root Complex / 同 NUMA</text>

  <!-- ③ topology matrix -->
  <rect x="10" y="322" width="320" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="342" font-size="13" font-weight="bold" fill="#1f2328">③ 拓扑矩阵 nvidia-smi topo -m</text>
  <text x="20" y="358" font-size="10.5" fill="#57606a">连接类型决定能否 P2P / 带宽上限</text>
  <!-- matrix -->
  <text x="70" y="380" font-size="10" text-anchor="middle" fill="#57606a">GPU0</text>
  <text x="120" y="380" font-size="10" text-anchor="middle" fill="#57606a">GPU1</text>
  <text x="170" y="380" font-size="10" text-anchor="middle" fill="#57606a">GPU2</text>
  <text x="220" y="380" font-size="10" text-anchor="middle" fill="#57606a">GPU3</text>
  <text x="35" y="395" font-size="10" fill="#57606a">GPU0</text>
  <text x="35" y="415" font-size="10" fill="#57606a">GPU1</text>
  <text x="35" y="435" font-size="10" fill="#57606a">GPU2</text>
  <text x="35" y="455" font-size="10" fill="#57606a">GPU3</text>
  <rect x="62" y="385" width="34" height="18" rx="3" fill="#e6ffed" stroke="#7ee2a8"/>
  <text x="79" y="398" font-size="9" text-anchor="middle" fill="#1a7f37">X</text>
  <rect x="112" y="385" width="34" height="18" rx="3" fill="#dafbe1" stroke="#2da44e"/>
  <text x="129" y="398" font-size="9" text-anchor="middle" fill="#1a7f37">NV</text>
  <rect x="162" y="385" width="34" height="18" rx="3" fill="#fff1e6" stroke="#f0a35e"/>
  <text x="179" y="398" font-size="9" text-anchor="middle" fill="#a3520a">SYS</text>
  <rect x="212" y="385" width="34" height="18" rx="3" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="229" y="398" font-size="9" text-anchor="middle" fill="#05395c">NODE</text>
  <rect x="62" y="405" width="34" height="18" rx="3" fill="#dafbe1" stroke="#2da44e"/>
  <text x="79" y="418" font-size="9" text-anchor="middle" fill="#1a7f37">NV</text>
  <rect x="112" y="405" width="34" height="18" rx="3" fill="#e6ffed" stroke="#7ee2a8"/>
  <text x="129" y="418" font-size="9" text-anchor="middle" fill="#1a7f37">X</text>
  <rect x="162" y="405" width="34" height="18" rx="3" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="179" y="418" font-size="9" text-anchor="middle" fill="#05395c">NODE</text>
  <rect x="212" y="405" width="34" height="18" rx="3" fill="#fff1e6" stroke="#f0a35e"/>
  <text x="229" y="418" font-size="9" text-anchor="middle" fill="#a3520a">SYS</text>
  <rect x="62" y="425" width="34" height="18" rx="3" fill="#fff1e6" stroke="#f0a35e"/>
  <text x="79" y="438" font-size="9" text-anchor="middle" fill="#a3520a">SYS</text>
  <rect x="112" y="425" width="34" height="18" rx="3" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="129" y="438" font-size="9" text-anchor="middle" fill="#05395c">NODE</text>
  <rect x="162" y="425" width="34" height="18" rx="3" fill="#e6ffed" stroke="#7ee2a8"/>
  <text x="179" y="438" font-size="9" text-anchor="middle" fill="#1a7f37">X</text>
  <rect x="212" y="425" width="34" height="18" rx="3" fill="#dafbe1" stroke="#2da44e"/>
  <text x="229" y="438" font-size="9" text-anchor="middle" fill="#1a7f37">NV</text>
  <rect x="62" y="445" width="34" height="18" rx="3" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="79" y="458" font-size="9" text-anchor="middle" fill="#05395c">NODE</text>
  <rect x="112" y="445" width="34" height="18" rx="3" fill="#fff1e6" stroke="#f0a35e"/>
  <text x="129" y="458" font-size="9" text-anchor="middle" fill="#a3520a">SYS</text>
  <rect x="162" y="445" width="34" height="18" rx="3" fill="#dafbe1" stroke="#2da44e"/>
  <text x="179" y="458" font-size="9" text-anchor="middle" fill="#1a7f37">NV</text>
  <rect x="212" y="445" width="34" height="18" rx="3" fill="#e6ffed" stroke="#7ee2a8"/>
  <text x="229" y="458" font-size="9" text-anchor="middle" fill="#1a7f37">X</text>
  <text x="20" y="478" font-size="9" fill="#57606a">NV(450) &gt; PIX/NODE(32) &gt; PHB(16) &gt; SYS(12) GB/s</text>
  <text x="20" y="494" font-size="9" fill="#57606a">图例: NV=NVLink最佳 PIX=同switch NODE=同NUMA</text>
  <text x="20" y="508" font-size="9" fill="#57606a">      PHB=同bridge SYS=跨NUMA(禁P2P) X=自身</text>
  <text x="20" y="528" font-size="9.5" fill="#cf222e">SYS 对必须 staged → NCCL 要避开</text>
  <text x="20" y="546" font-size="9.5" fill="#1a7f37">NV/NODE 对可直连 → TP 留在此域</text>

  <!-- ④ NCCL rides on P2P -->
  <rect x="350" y="322" width="320" height="252" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="342" font-size="13" font-weight="bold" fill="#1f2328">④ NCCL 骑在 P2P 上</text>
  <text x="360" y="358" font-size="10.5" fill="#57606a">transport 自动优先级（= peer access 结果）</text>
  <rect x="366" y="368" width="288" height="20" rx="4" fill="#dafbe1" stroke="#2da44e"/>
  <text x="374" y="382" font-size="9.5" fill="#1a7f37">同节点: NVLink &gt; PCIe P2P &gt; SHM(兜底)</text>
  <rect x="366" y="392" width="288" height="20" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="374" y="406" font-size="9.5" fill="#05395c">跨节点: RDMA(IB/GDR) &gt; Socket(TCP)</text>
  <rect x="366" y="420" width="288" height="60" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="374" y="436" font-size="9.5" fill="#57606a">P2P transport =</text>
  <text x="374" y="452" font-size="9.5" fill="#57606a">peer mappings(EnablePeerAccess)</text>
  <text x="374" y="468" font-size="9.5" fill="#57606a">+ IPC(cudaIpcGet/OpenMemHandle)</text>
  <rect x="366" y="486" width="288" height="74" rx="4" fill="#fff8e6" stroke="#f0c674"/>
  <text x="374" y="502" font-size="9.5" fill="#8a6d1a">排查: NCCL_DEBUG=INFO</text>
  <text x="374" y="518" font-size="9.5" fill="#8a6d1a">  通道见 P2P/CUMEM | P2P/IPC = 生效</text>
  <text x="374" y="534" font-size="9.5" fill="#8a6d1a">  SHM=共享内存兜底(慢)</text>
  <text x="374" y="550" font-size="9.5" fill="#8a6d1a">  NET/Socket=最差</text>
</svg>
