<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1180" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arwb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0ea5e9"/>
    </marker>
    <style>
      .t   { fill:#0f172a; }
      .s   { fill:#64748b; }
      .a   { fill:#0ea5e9; }
      .g   { fill:#10b981; }
      .am  { fill:#f59e0b; }
      .r   { fill:#ef4444; }
      .card{ fill:#ffffff; stroke:#e2e8f0; }
      .bx  { fill:#f1f5f9; stroke:#cbd5e1; }
      .bxB { fill:#e0f2fe; stroke:#0ea5e9; }
      .bxG { fill:#ecfdf5; stroke:#10b981; }
      .bxA { fill:#fef3c7; stroke:#f59e0b; }
      .bxR { fill:#fee2e2; stroke:#ef4444; }
      .mono{ font-family:"Consolas",monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="1180" fill="#f8fafc"/>
  <text x="20" y="0" font-size="2" fill="#f8fafc">.</text>

  <!-- ===================== Panel 1 ===================== -->
  <rect class="card" x="20" y="20" width="880" height="190" rx="14"/>
  <text x="40" y="50" font-size="17" class="a" font-weight="bold">① ONNX 算子：FusedMatMul</text>
  <text x="40" y="74" font-size="13" class="s">图优化把「MatMul → Add(bias) → 激活」融合为单算子</text>

  <!-- node -->
  <rect class="bxB" x="360" y="92" width="200" height="50" rx="10"/>
  <text x="460" y="116" font-size="15" class="t" text-anchor="middle" font-weight="bold">FusedMatMul</text>
  <text x="460" y="134" font-size="11" class="s" text-anchor="middle">Y = activation( α·A@B + bias )</text>

  <!-- inputs -->
  <rect class="bx" x="60" y="100" width="60" height="34" rx="8"/>
  <text x="90" y="122" font-size="13" class="t" text-anchor="middle">A</text>
  <rect class="bx" x="200" y="100" width="60" height="34" rx="8"/>
  <text x="230" y="122" font-size="13" class="t" text-anchor="middle">B</text>
  <rect class="bx" x="140" y="150" width="80" height="30" rx="8"/>
  <text x="180" y="170" font-size="12" class="t" text-anchor="middle">Bias[N]</text>

  <line x1="120" y1="117" x2="358" y2="117" stroke="#475569" marker-end="url(#arw)"/>
  <line x1="260" y1="117" x2="358" y2="117" stroke="#475569" marker-end="url(#arw)"/>
  <line x1="180" y1="150" x2="430" y2="142" stroke="#475569" marker-end="url(#arw)"/>

  <!-- output -->
  <rect class="bxG" x="700" y="100" width="60" height="34" rx="8"/>
  <text x="730" y="122" font-size="13" class="g" text-anchor="middle" font-weight="bold">Y</text>
  <line x1="562" y1="117" x2="698" y2="117" stroke="#10b981" marker-end="url(#arw)"/>

  <!-- ===================== Panel 2 ===================== -->
  <rect class="card" x="20" y="230" width="880" height="250" rx="14"/>
  <text x="40" y="260" font-size="17" class="a" font-weight="bold">② ORT：cublasLt 枚举 epilogue（MMA 形状「不透明」）</text>

  <!-- MMA opaque -->
  <rect class="bx" x="40" y="290" width="240" height="70" rx="10"/>
  <text x="160" y="316" font-size="14" class="t" text-anchor="middle" font-weight="bold">MMA 计算段</text>
  <text x="160" y="336" font-size="11" class="s" text-anchor="middle">tile / 调度 / 精度</text>
  <text x="160" y="352" font-size="11" class="r" text-anchor="middle">由 cuBLASLt autotuner 内部选定</text>

  <!-- epilogue enum -->
  <rect class="bxA" x="360" y="284" width="300" height="150" rx="10"/>
  <text x="510" y="306" font-size="13" class="am" text-anchor="middle" font-weight="bold">CUBLASLT_MATMUL_DESC_EPILOGUE</text>
  <text x="510" y="328" font-size="12" class="mono" text-anchor="middle">= CUBLASLT_EPILOGUE_BIAS_GELU</text>
  <text x="380" y="352" font-size="11" class="s">闭集：</text>
  <text x="380" y="372" font-size="11" class="mono">DEFAULT BIAS RELU</text>
  <text x="380" y="390" font-size="11" class="mono">BIAS_RELU GELU</text>
  <text x="380" y="408" font-size="11" class="mono">BIAS_GELU DRELU</text>

  <!-- bias pointer -->
  <rect class="bxA" x="700" y="300" width="170" height="60" rx="10"/>
  <text x="785" y="324" font-size="12" class="am" text-anchor="middle" font-weight="bold">BIAS_POINTER</text>
  <text x="785" y="344" font-size="11" class="s" text-anchor="middle">bias 列广播</text>

  <line x1="280" y1="325" x2="358" y2="325" stroke="#475569" marker-end="url(#arw)"/>
  <line x1="660" y1="330" x2="698" y2="330" stroke="#f59e0b" marker-end="url(#arw)"/>
  <line x1="510" y1="434" x2="510" y2="458" stroke="#475569" marker-end="url(#arw)"/>

  <rect class="bxG" x="380" y="458" width="120" height="14" rx="6"/>
  <text x="440" y="469" font-size="11" class="g" text-anchor="middle">D = GELU(α·A@B + bias)</text>
  <text x="40" y="468" font-size="12" class="s">映射：激活名 → 枚举（闭集外 ⇒ 退化成独立 kernel）</text>

  <!-- ===================== Panel 3 ===================== -->
  <rect class="card" x="20" y="500" width="880" height="330" rx="14"/>
  <text x="40" y="530" font-size="17" class="a" font-weight="bold">③ CUTLASS：一组 GemmShape（显式）+ 一棵 EVT 访客树（开放组合）</text>

  <!-- GemmShape -->
  <rect class="bxB" x="40" y="556" width="360" height="250" rx="10"/>
  <text x="60" y="582" font-size="13" class="a" font-weight="bold">MMA 形状（全显式）</text>
  <text x="60" y="612" font-size="12" class="mono">GemmShape&lt;128,128,32&gt;  // Threadblock</text>
  <text x="60" y="640" font-size="12" class="mono">GemmShape&lt; 64, 64,32&gt;  // Warp</text>
  <text x="60" y="668" font-size="12" class="mono">GemmShape&lt; 16,  8,16&gt;  // Instruction(TC)</text>
  <text x="60" y="700" font-size="12" class="mono">kStages = 2          // 双缓冲</text>
  <text x="60" y="736" font-size="12" class="s">三级 tile + pipeline 全由用户指定</text>
  <text x="60" y="760" font-size="12" class="s">→ 精确控制占用率 / smem / 深度</text>
  <text x="60" y="788" font-size="12" class="g">换激活 ⇒ 这一块一行不动</text>

  <!-- EVT tree -->
  <rect class="bxG" x="470" y="556" width="400" height="250" rx="10"/>
  <text x="490" y="582" font-size="13" class="g" font-weight="bold">epilogue 访客树 (EVT)</text>
  <!-- tree nodes -->
  <rect class="bxG" x="600" y="596" width="160" height="34" rx="8"/>
  <text x="680" y="618" font-size="12" class="t" text-anchor="middle" font-weight="bold">StoreD（根·写D）</text>
  <rect class="bxG" x="600" y="646" width="160" height="34" rx="8"/>
  <text x="680" y="668" font-size="12" class="t" text-anchor="middle">Compute·gelu</text>
  <rect class="bxG" x="600" y="696" width="160" height="34" rx="8"/>
  <text x="680" y="718" font-size="12" class="t" text-anchor="middle">Compute·plus</text>
  <rect class="bx" x="470" y="746" width="120" height="34" rx="8"/>
  <text x="530" y="768" font-size="12" class="t" text-anchor="middle">AuxLoad(bias)</text>
  <rect class="bx" x="820" y="746" width="40" height="34" rx="8"/>
  <text x="840" y="768" font-size="12" class="t" text-anchor="middle">acc</text>

  <line x1="680" y1="630" x2="680" y2="644" stroke="#10b981" marker-end="url(#arw)"/>
  <line x1="680" y1="680" x2="680" y2="694" stroke="#10b981" marker-end="url(#arw)"/>
  <line x1="600" y1="713" x2="590" y2="744" stroke="#10b981" marker-end="url(#arw)"/>
  <line x1="760" y1="713" x2="840" y2="744" stroke="#10b981" marker-end="url(#arw)"/>
  <text x="490" y="800" font-size="11" class="s">后序求值：根=StoreD；二元节点左操作数恒为 accum</text>

  <!-- ===================== Panel 4 ===================== -->
  <rect class="card" x="20" y="850" width="880" height="300" rx="14"/>
  <text x="40" y="880" font-size="17" class="a" font-weight="bold">④ 对照：开放树 vs 闭集枚举（差异收敛到「输出算子是否可任意组合」）</text>

  <rect class="bxG" x="40" y="900" width="410" height="120" rx="10"/>
  <text x="60" y="926" font-size="14" class="g" font-weight="bold">CUTLASS：开放可组合</text>
  <text x="60" y="952" font-size="12" class="t">• epilogue = 用户任意组合的访客树</text>
  <text x="60" y="974" font-size="12" class="t">• 新增 Swish ⇒ 加一个 Compute 节点</text>
  <text x="60" y="996" font-size="12" class="t">• MMA(GemmShape) 一行不动 ✅ 可融合</text>

  <rect class="bxR" x="470" y="900" width="410" height="120" rx="10"/>
  <text x="490" y="926" font-size="14" class="r" font-weight="bold">ORT / cuBLASLt：闭集枚举</text>
  <text x="490" y="952" font-size="12" class="t">• epilogue ∈ 有限种固定枚举（现代 10+）</text>
  <text x="490" y="974" font-size="12" class="t">• 新增 Swish ⇒ 枚举外 ⇒ 退化</text>
  <text x="490" y="996" font-size="12" class="t">• [MatMul]+[独立 kernel]，多一次往返 ❌</text>

  <rect class="bx" x="40" y="1040" width="840" height="92" rx="10"/>
  <text x="60" y="1066" font-size="13" class="a" font-weight="bold">端到端映射一句话</text>
  <text x="60" y="1092" font-size="12" class="mono">ONNX FusedMatMul</text>
  <text x="60" y="1114" font-size="12" class="t">├─ ORT     → (1 个枚举 epilogue) + (bias 指针)            + [MMA 形状：库内部]</text>
  <text x="60" y="1132" font-size="12" class="t">└─ CUTLASS → (1 棵 epilogue 访客树 EVT) + (1 组 GemmShape) + (kStages 双缓冲)</text>
</svg>
