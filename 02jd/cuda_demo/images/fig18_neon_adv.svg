<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" font-family="Consolas, Menlo, monospace">
  <!-- background -->
  <rect x="0" y="0" width="680" height="760" fill="#0f1420"/>
  <text x="20" y="34" fill="#e8eef7" font-size="20" font-weight="bold">ncnn ARM NEON ②/③/④：Winograd · Depthwise · INT8</text>
  <text x="20" y="56" fill="#8aa0bf" font-size="12">纯 C++ 仿真已对拍：Winograd 全尺寸 PASS · Depthwise PASS · INT8 rel≈1.2%</text>

  <!-- ============ Panel 1: Winograd ============ -->
  <rect x="14" y="72" width="652" height="220" rx="10" fill="#15203a" stroke="#2b3b63"/>
  <text x="28" y="96" fill="#7fd1ff" font-size="14" font-weight="bold">② Winograd F(2x2,3x3) — 乘计数 36 → 16 (2.25×)</text>

  <!-- input block -->
  <rect x="34" y="118" width="64" height="64" rx="6" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="66" y="156" fill="#cfe0ff" font-size="11" text-anchor="middle">d 4x4</text>
  <text x="66" y="172" fill="#7f93b5" font-size="9" text-anchor="middle">input tile</text>

  <text x="108" y="156" fill="#9fb4d6" font-size="16">──B──▶</text>
  <rect x="138" y="118" width="64" height="64" rx="6" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="170" y="150" fill="#cfe0ff" font-size="10" text-anchor="middle">D=B·d·Bᵀ</text>
  <text x="170" y="164" fill="#7f93b5" font-size="9" text-anchor="middle">4x4</text>

  <!-- kernel side -->
  <rect x="34" y="220" width="64" height="44" rx="6" fill="#1d2b4d" stroke="#6a3a9a"/>
  <text x="66" y="240" fill="#e6cfff" font-size="11" text-anchor="middle">g 3x3</text>
  <text x="66" y="256" fill="#b58fd6" font-size="9" text-anchor="middle">kernel</text>
  <text x="108" y="244" fill="#9fb4d6" font-size="16">──G──▶</text>
  <rect x="138" y="220" width="64" height="44" rx="6" fill="#1d2b4d" stroke="#6a3a9a"/>
  <text x="170" y="242" fill="#e6cfff" font-size="10" text-anchor="middle">K=G·g·Gᵀ</text>
  <text x="170" y="256" fill="#b58fd6" font-size="9" text-anchor="middle">4x4</text>

  <!-- Hadamard -->
  <text x="232" y="176" fill="#ffd27f" font-size="20" text-anchor="middle">⊙</text>
  <text x="232" y="194" fill="#ffb74d" font-size="9" text-anchor="middle">Hadamard</text>

  <rect x="258" y="158" width="64" height="44" rx="6" fill="#243a2b" stroke="#3a9a5a"/>
  <text x="290" y="180" fill="#bff5cf" font-size="11" text-anchor="middle">M = D⊙K</text>
  <text x="290" y="194" fill="#7fc79a" font-size="9" text-anchor="middle">4x4</text>

  <text x="332" y="182" fill="#9fb4d6" font-size="16">──A──▶</text>
  <rect x="362" y="158" width="64" height="44" rx="6" fill="#243a2b" stroke="#3a9a5a"/>
  <text x="394" y="180" fill="#bff5cf" font-size="11" text-anchor="middle">Y=Aᵀ·M·A</text>
  <text x="394" y="194" fill="#7fc79a" font-size="9" text-anchor="middle">2x2 out</text>

  <!-- MAC note -->
  <rect x="470" y="120" width="182" height="150" rx="8" fill="#101a30" stroke="#2b3b63"/>
  <text x="482" y="142" fill="#ffd27f" font-size="11" font-weight="bold">MAC 对比 (每块)</text>
  <text x="482" y="166" fill="#cfe0ff" font-size="10">直接法: 2·2·3·3 = 36</text>
  <text x="482" y="186" fill="#cfe0ff" font-size="10">Winograd: 4·4 = 16 乘</text>
  <text x="482" y="206" fill="#7fd1ff" font-size="10">→ 降到 2.25×</text>
  <text x="482" y="230" fill="#9fb4d6" font-size="9">代价: 变换开销 +</text>
  <text x="482" y="244" fill="#9fb4d6" font-size="9">略大数值误差；</text>
  <text x="482" y="258" fill="#9fb4d6" font-size="9">仅 3x3/s1/C≥8 启用</text>

  <!-- ============ Panel 2: Depthwise ============ -->
  <rect x="14" y="308" width="652" height="180" rx="10" fill="#15203a" stroke="#2b3b63"/>
  <text x="28" y="332" fill="#7fd1ff" font-size="14" font-weight="bold">③ Depthwise 3×3 — 逐通道，MAC 比普通 3×3 少 C 倍</text>

  <!-- channels -->
  <rect x="34" y="352" width="40" height="40" rx="5" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="54" y="377" fill="#cfe0ff" font-size="11" text-anchor="middle">C0</text>
  <rect x="34" y="400" width="40" height="40" rx="5" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="54" y="425" fill="#cfe0ff" font-size="11" text-anchor="middle">C1</text>
  <rect x="34" y="448" width="40" height="20" rx="5" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="54" y="463" fill="#7f93b5" font-size="10" text-anchor="middle">…Ck</text>

  <text x="86" y="402" fill="#9fb4d6" font-size="16">3×3→</text>
  <text x="86" y="422" fill="#9fb4d6" font-size="9">per-chan</text>

  <rect x="124" y="352" width="40" height="40" rx="5" fill="#243a2b" stroke="#3a9a5a"/>
  <text x="144" y="377" fill="#bff5cf" font-size="11" text-anchor="middle">C0′</text>
  <rect x="124" y="400" width="40" height="40" rx="5" fill="#243a2b" stroke="#3a9a5a"/>
  <text x="144" y="425" fill="#bff5cf" font-size="11" text-anchor="middle">C1′</text>
  <rect x="124" y="448" width="40" height="20" rx="5" fill="#243a2b" stroke="#3a9a5a"/>
  <text x="144" y="463" fill="#7fc79a" font-size="10" text-anchor="middle">…Ck′</text>

  <text x="184" y="402" fill="#ffb74d" font-size="12">无跨通道累加 ✓</text>

  <!-- NEON note -->
  <rect x="300" y="350" width="342" height="120" rx="8" fill="#101a30" stroke="#2b3b63"/>
  <text x="312" y="372" fill="#ffd27f" font-size="11" font-weight="bold">NEON 套路 (convolutiondepthwise_3x3.h)</text>
  <text x="312" y="394" fill="#cfe0ff" font-size="10">核 9 权重 repack 成 3×float32x4：</text>
  <text x="312" y="412" fill="#9fb4d6" font-size="10">_k012x / _k345x / _k678x  (:36-42)</text>
  <text x="312" y="434" fill="#cfe0ff" font-size="10">ext 抽取每行 3 像素滑窗 +</text>
  <text x="312" y="452" fill="#9fb4d6" font-size="10">fmla 单权重标量广播累加  (:71-115)</text>
  <text x="312" y="474" fill="#7fd1ff" font-size="10">MAC: 9·C·HW  vs 普通 9·C²·HW</text>

  <!-- ============ Panel 3: INT8 ============ -->
  <rect x="14" y="504" width="652" height="232" rx="10" fill="#15203a" stroke="#2b3b63"/>
  <text x="28" y="528" fill="#7fd1ff" font-size="14" font-weight="bold">④ INT8 定点 — 1/4 带宽换 ~2~4× 算力（rel≈1.2%）</text>

  <!-- pipeline -->
  <rect x="34" y="548" width="78" height="48" rx="6" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="73" y="568" fill="#cfe0ff" font-size="10" text-anchor="middle">int8 in</text>
  <text x="73" y="584" fill="#7f93b5" font-size="9" text-anchor="middle">× scale_a</text>

  <text x="120" y="576" fill="#9fb4d6" font-size="16">×</text>
  <rect x="138" y="548" width="78" height="48" rx="6" fill="#1d2b4d" stroke="#3a5a9a"/>
  <text x="177" y="568" fill="#cfe0ff" font-size="10" text-anchor="middle">int8 wt</text>
  <text x="177" y="584" fill="#7f93b5" font-size="9" text-anchor="middle">× scale_w</text>

  <text x="224" y="576" fill="#9fb4d6" font-size="16">▶</text>
  <rect x="242" y="548" width="120" height="48" rx="6" fill="#2a2440" stroke="#7a4a9a"/>
  <text x="302" y="566" fill="#e6cfff" font-size="10" text-anchor="middle">SDOT / SMLAL</text>
  <text x="302" y="582" fill="#b58fd6" font-size="9" text-anchor="middle">int8·int8→int32 累加</text>

  <text x="372" y="576" fill="#9fb4d6" font-size="16">▶</text>
  <rect x="390" y="548" width="120" height="48" rx="6" fill="#243a2b" stroke="#3a9a5a"/>
  <text x="450" y="566" fill="#bff5cf" font-size="10" text-anchor="middle">requant</text>
  <text x="450" y="582" fill="#7fc79a" font-size="9" text-anchor="middle">× scale_out → float/int8</text>

  <!-- primitive table -->
  <rect x="34" y="616" width="300" height="100" rx="8" fill="#101a30" stroke="#2b3b63"/>
  <text x="46" y="638" fill="#ffd27f" font-size="11" font-weight="bold">定点原语</text>
  <text x="46" y="660" fill="#cfe0ff" font-size="10">sdot  v16.4s,v0.16b,v4.4b[0]</text>
  <text x="46" y="678" fill="#9fb4d6" font-size="9">→ 4×int8·int8→int32  (gemm_int8.h:790)</text>
  <text x="46" y="700" fill="#cfe0ff" font-size="10">smlal v8.4s,v3.4h,v0.h[0]</text>
  <text x="46" y="718" fill="#9fb4d6" font-size="9">→ int8→int16×int16→int32 (3x3_int8.h:170)</text>

  <rect x="350" y="616" width="300" height="100" rx="8" fill="#101a30" stroke="#2b3b63"/>
  <text x="362" y="638" fill="#ffd27f" font-size="11" font-weight="bold">为什么 int32 累加</text>
  <text x="362" y="660" fill="#cfe0ff" font-size="10">点积有几十~几百项累加，</text>
  <text x="362" y="678" fill="#cfe0ff" font-size="10">int8 中间态会溢出 → 必须</text>
  <text x="362" y="696" fill="#cfe0ff" font-size="10">留 int32；反量化用每通道</text>
  <text x="362" y="714" fill="#7fd1ff" font-size="10">scale (gemm_int8.h:1889-1918)</text>
</svg>
