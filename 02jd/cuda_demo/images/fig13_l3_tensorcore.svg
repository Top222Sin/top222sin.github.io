<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="590" fill="#fafbfc"/>
  <text x="340" y="24" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">L3.2  Tensor Core (WMMA / MMA PTX / CUTLASS) + 混合精度（四联图）</text>

  <!-- ============ Panel 1: TC unit ============ -->
  <g>
    <rect x="10" y="38" width="320" height="242" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">① Tensor Core 单元：D = A·B + C</text>
    <rect x="30" y="92" width="54" height="26" rx="4" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="57" y="109" font-size="10" fill="#495057" text-anchor="middle">A fp16</text>
    <rect x="30" y="128" width="54" height="26" rx="4" fill="#ffd8a8" stroke="#f08c00"/>
    <text x="57" y="145" font-size="10" fill="#495057" text-anchor="middle">B fp16</text>
    <rect x="30" y="164" width="54" height="26" rx="4" fill="#a5d8ff" stroke="#1c7ed6"/>
    <text x="57" y="181" font-size="10" fill="#495057" text-anchor="middle">C fp32</text>
    <rect x="120" y="118" width="96" height="62" rx="8" fill="#7048e8" stroke="#5f3dc4"/>
    <text x="168" y="142" font-size="11" fill="#fff" text-anchor="middle">Tensor Core</text>
    <text x="168" y="160" font-size="9" fill="#e9e3ff" text-anchor="middle">低精度乘</text>
    <text x="168" y="172" font-size="9" fill="#e9e3ff" text-anchor="middle">+ 高精度加</text>
    <rect x="250" y="138" width="54" height="26" rx="4" fill="#a5d8ff" stroke="#1c7ed6"/>
    <text x="277" y="155" font-size="10" fill="#495057" text-anchor="middle">D fp32</text>
    <line x1="84" y1="105" x2="118" y2="128" stroke="#868e96" stroke-width="1.5"/>
    <line x1="84" y1="141" x2="118" y2="148" stroke="#868e96" stroke-width="1.5"/>
    <line x1="84" y1="177" x2="118" y2="160" stroke="#868e96" stroke-width="1.5"/>
    <line x1="216" y1="149" x2="248" y2="151" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="168" y="216" font-size="10" fill="#7048e8" text-anchor="middle">关键：输入低精度 → ALU 更密、吞吐高</text>
    <text x="168" y="234" font-size="10" fill="#495057" text-anchor="middle">累加 fp32 → 避免 K 次加法放大舍入误差</text>
    <text x="168" y="262" font-size="10" fill="#868e96" text-anchor="middle">Volta(SM_70)+ 引入；V100 fp16 TC≈8× fp32 算力</text>
  </g>

  <!-- ============ Panel 2: WMMA flow ============ -->
  <g>
    <rect x="350" y="38" width="320" height="242" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="60" font-size="13" font-weight="bold" fill="#1f2d3d">② WMMA fragment API 流程</text>
    <rect x="360" y="92" width="62" height="28" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="391" y="110" font-size="9" fill="#495057" text-anchor="middle">全局 A/B</text>
    <rect x="438" y="92" width="86" height="28" rx="4" fill="#4c6ef5" stroke="#3b5bdb"/>
    <text x="481" y="110" font-size="9" fill="#fff" text-anchor="middle">load_matrix_sync</text>
    <rect x="540" y="92" width="74" height="28" rx="4" fill="#2f9e44" stroke="#2b8a3e"/>
    <text x="577" y="106" font-size="9" fill="#fff" text-anchor="middle">fragment</text>
    <text x="577" y="116" font-size="8" fill="#e6fcf0" text-anchor="middle">(寄存器)</text>
    <line x1="422" y1="106" x2="436" y2="106" stroke="#868e96" stroke-width="1.5"/>
    <line x1="524" y1="106" x2="538" y2="106" stroke="#868e96" stroke-width="1.5"/>
    <rect x="438" y="158" width="74" height="28" rx="4" fill="#7048e8" stroke="#5f3dc4"/>
    <text x="475" y="176" font-size="9" fill="#fff" text-anchor="middle">mma_sync</text>
    <rect x="540" y="158" width="86" height="28" rx="4" fill="#a5d8ff" stroke="#1c7ed6"/>
    <text x="583" y="176" font-size="9" fill="#495057" text-anchor="middle">accumulator(fp32)</text>
    <line x1="490" y1="120" x2="475" y2="156" stroke="#868e96" stroke-width="1.5"/>
    <line x1="512" y1="172" x2="538" y2="172" stroke="#868e96" stroke-width="1.5"/>
    <rect x="360" y="158" width="62" height="28" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="391" y="176" font-size="9" fill="#495057" text-anchor="middle">全局 C</text>
    <line x1="540" y1="186" x2="422" y2="172" stroke="#1c7ed6" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="582" y="206" font-size="9" fill="#7048e8">c = a·b + c（fp16 乘, fp32 累加）</text>
    <text x="510" y="240" font-size="10" fill="#495057" text-anchor="middle">fragment 形状 = 一条 mma.sync 的 warp tile（如 16×16×16）</text>
    <text x="510" y="258" font-size="9" fill="#868e96" text-anchor="middle">可取数接 L3.1 的 cp.async 流水线；写回用 store_matrix_sync</text>
  </g>

  <!-- ============ Panel 3: MMA PTX ============ -->
  <g>
    <rect x="10" y="300" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">③ MMA PTX（WMMA 编译后的底层指令）</text>
    <rect x="30" y="338" width="280" height="120" rx="4" fill="#1f2d3d"/>
    <text x="42" y="360" font-size="11" fill="#a5d8ff" font-family="Consolas,monospace">mma.sync.aligned</text>
    <text x="42" y="378" font-size="11" fill="#a5d8ff" font-family="Consolas,monospace">  .m16n8k16.row.col</text>
    <text x="42" y="396" font-size="11" fill="#ffd8a8" font-family="Consolas,monospace">  .f32.f16.f16.f32</text>
    <text x="42" y="414" font-size="11" fill="#b2f2bb" font-family="Consolas,monospace">  {d0..d3},{a0..a3},</text>
    <text x="42" y="432" font-size="11" fill="#b2f2bb" font-family="Consolas,monospace">  {b0},{c0..c3};</text>
    <text x="42" y="452" font-size="9" fill="#ced4da" font-family="Consolas,monospace">// sync=warp 协作；2×m16n8k16=16×16</text>
    <text x="170" y="476" font-size="10" fill="#7048e8" text-anchor="middle">.f32.f16.f16.f32 = fp32 累加 + fp16 输入</text>
    <text x="170" y="494" font-size="10" fill="#495057" text-anchor="middle">变体：tf32→.m16n8k8；int8→.m16n8k32.s8.s8.s32</text>
    <text x="170" y="520" font-size="9" fill="#868e96" text-anchor="middle">{a0..a3} 等是寄存器组，由编译器/ABI 分配</text>
    <text x="170" y="540" font-size="10" fill="#7048e8" text-anchor="middle">CUTLASS 在 warp_mma_tensor_op.h:167 封装此指令</text>
  </g>

  <!-- ============ Panel 4: mixed precision triangle ============ -->
  <g>
    <rect x="350" y="300" width="320" height="262" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="362" y="322" font-size="13" font-weight="bold" fill="#1f2d3d">④ 混合精度三角（精度/带宽/吞吐）</text>
    <polygon points="510,344 392,470 628,470" fill="#f8f0fc" stroke="#7048e8" stroke-width="1.5"/>
    <text x="510" y="350" font-size="10" fill="#5f3dc4" text-anchor="middle">精度</text>
    <text x="510" y="364" font-size="9" fill="#5f3dc4" text-anchor="middle">fp16/bf16/tf32/int8</text>
    <text x="392" y="478" font-size="10" fill="#2b8a3e" text-anchor="middle">带宽 2×↓</text>
    <text x="628" y="478" font-size="10" fill="#e8590c" text-anchor="middle">吞吐 数倍~数十倍↑</text>
    <text x="510" y="430" font-size="11" font-weight="bold" fill="#1f2d3d" text-anchor="middle">fp32 累加</text>
    <text x="510" y="448" font-size="9" fill="#868e96" text-anchor="middle">(低精度乘 + 高精度加)</text>
    <line x1="510" y1="364" x2="392" y2="470" stroke="#ced4da" stroke-width="1"/>
    <line x1="510" y1="364" x2="628" y2="470" stroke="#ced4da" stroke-width="1"/>
    <line x1="392" y1="470" x2="628" y2="470" stroke="#ced4da" stroke-width="1"/>
    <text x="510" y="506" font-size="9" fill="#868e96" text-anchor="middle">fp16 动态范围小 → 训练需 loss scaling</text>
    <text x="510" y="522" font-size="9" fill="#868e96" text-anchor="middle">bf16 范围同 fp32 / tf32 零改动提速</text>
    <text x="510" y="540" font-size="9" fill="#868e96" text-anchor="middle">int8 推理需量化 + scale 因子</text>
    <text x="510" y="556" font-size="9" fill="#495057" text-anchor="middle">代码 report_memory()：fp16 输入 → 内存/带宽 2×↓</text>
  </g>
</svg>
