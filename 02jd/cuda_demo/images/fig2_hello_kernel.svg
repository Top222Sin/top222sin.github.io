<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">Host–Device 五步数据流 + launch_bounds 对占用率的影响</text>

  <!-- ===== left: five-step data flow ===== -->
  <text x="20" y="50" font-size="12" font-weight="700" fill="#1d4ed8">① 五步数据流（host ↔ device）</text>

  <!-- host box -->
  <rect x="20" y="64" width="150" height="230" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="34" y="84" font-size="11" font-weight="700" fill="#1e3a8a">Host (CPU)</text>
  <rect x="34" y="96" width="122" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="42" y="110" font-size="9" fill="#1e40af">h_x, h_y (vector)</text>
  <rect x="34" y="124" width="122" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="42" y="138" font-size="9" fill="#1e40af">h_z (结果)</text>
  <rect x="34" y="152" width="122" height="20" rx="4" fill="#fef9c3" stroke="#eab308"/>
  <text x="42" y="166" font-size="9" fill="#854d0e">main() 流程</text>
  <text x="34" y="200" font-size="8" fill="#475569">1) 准备数据</text>
  <text x="34" y="214" font-size="8" fill="#475569">2) cudaMalloc</text>
  <text x="34" y="228" font-size="8" fill="#475569">3) H2D 拷入</text>
  <text x="34" y="242" font-size="8" fill="#475569">4) &lt;&lt;&lt;grid,block&gt;&gt;&gt;</text>
  <text x="34" y="256" font-size="8" fill="#475569">5) D2H 拷回</text>
  <text x="34" y="270" font-size="8" fill="#475569">   cudaFree</text>

  <!-- arrows H2D / D2H -->
  <g stroke="#10b981" stroke-width="2" marker-end="url(#ah)">
    <line x1="172" y1="120" x2="248" y2="120"/>
  </g>
  <g stroke="#f97316" stroke-width="2" marker-end="url(#ao)">
    <line x1="248" y1="160" x2="172" y2="160"/>
  </g>
  <text x="176" y="114" font-size="8" fill="#047857">H2D</text>
  <text x="176" y="154" font-size="8" fill="#c2410c">D2H</text>

  <!-- device box -->
  <rect x="250" y="64" width="150" height="230" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="264" y="84" font-size="11" font-weight="700" fill="#065f46">Device (GPU)</text>
  <rect x="264" y="96" width="122" height="20" rx="4" fill="#bbf7d0" stroke="#86efac"/>
  <text x="272" y="110" font-size="9" fill="#064e3b">d_x, d_y (显存)</text>
  <rect x="264" y="124" width="122" height="20" rx="4" fill="#bbf7d0" stroke="#86efac"/>
  <text x="272" y="138" font-size="9" fill="#064e3b">d_z (结果)</text>
  <rect x="264" y="152" width="122" height="44" rx="4" fill="#fef9c3" stroke="#eab308"/>
  <text x="272" y="170" font-size="9" fill="#854d0e">kernel 执行</text>
  <text x="272" y="184" font-size="8" fill="#713f12">大量线程并行</text>
  <text x="272" y="196" font-size="8" fill="#713f12">block 在 SM 上</text>
  <text x="264" y="222" font-size="8" fill="#475569">SM 0  ▮▮▮▮</text>
  <text x="264" y="238" font-size="8" fill="#475569">SM 1  ▮▮▮▮</text>
  <text x="264" y="254" font-size="8" fill="#475569">SM 2  ▮▮▮▯</text>
  <text x="264" y="270" font-size="8" fill="#475569">...   (occupancy)</text>

  <!-- ===== right: launch_bounds impact ===== -->
  <text x="430" y="50" font-size="12" font-weight="700" fill="#9a3412">② __launch_bounds__ 影响占用率</text>
  <rect x="430" y="64" width="230" height="230" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="444" y="84" font-size="10" font-weight="700" fill="#7c2d12">SM 寄存器总量 (固定)</text>
  <text x="444" y="98" font-size="9" fill="#9a3412">÷ (maxThreads × minBlocks)</text>
  <text x="444" y="116" font-size="9" fill="#9a3412">= 每线程寄存器上限</text>

  <!-- two scenarios -->
  <rect x="444" y="132" width="98" height="64" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="452" y="150" font-size="9" font-weight="700" fill="#991b1b">无提示 / 大值</text>
  <text x="452" y="166" font-size="8" fill="#7f1d1d">寄存器用得多</text>
  <text x="452" y="180" font-size="8" fill="#7f1d1d">→ occupancy 低</text>
  <text x="452" y="192" font-size="8" fill="#7f1d1d">→ 掩盖延迟差</text>

  <rect x="556" y="132" width="94" height="64" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="564" y="150" font-size="9" font-weight="700" fill="#166534">launch_bounds</text>
  <text x="564" y="166" font-size="8" fill="#14532d">(256,4)</text>
  <text x="564" y="180" font-size="8" fill="#14532d">寄存器省 →</text>
  <text x="564" y="192" font-size="8" fill="#14532d">occupancy 高</text>

  <text x="444" y="220" font-size="8" fill="#713f12">权衡：寄存器太小会"溢出"到</text>
  <text x="444" y="232" font-size="8" fill="#713f12">local memory（慢）— 非越小越好</text>
  <text x="444" y="252" font-size="8" fill="#334155">maxThreadsPerBlock 必须 ≥</text>
  <text x="444" y="264" font-size="8" fill="#334155">实际 blockDim.x（本例 256）</text>
  <text x="444" y="282" font-size="8" fill="#334155">可选提示，不写也能跑；</text>
  <text x="444" y="294" font-size="8" fill="#334155">Nsight 看 occupancy 再调</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/>
    </marker>
  </defs>
</svg>