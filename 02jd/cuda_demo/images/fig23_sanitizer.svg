<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="590" fill="#fafbfc"/>
  <text x="340" y="24" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">L4 compute-sanitizer 调试：捕获 OOB / 未初始化 / 数据竞争（四联图）</text>

  <!-- Panel 1: OOB -->
  <rect x="14" y="40" width="320" height="245" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="30" y="64" font-size="13" font-weight="bold" fill="#e8590c">① 越界访问 OOB</text>
  <text x="30" y="88" font-size="10.5" fill="#495057">buggy: d[i+n] = 1  （缺 i&lt;N 保护）</text>
  <rect x="34" y="100" width="280" height="40" rx="4" fill="#fff0e6" stroke="#e8590c"/>
  <text x="44" y="118" font-size="10" fill="#1f2d3d" font-family="Consolas,monospace">gmem: [0][1]...[7] | [8][9]...  ← 写 N+5 越界</text>
  <text x="44" y="134" font-size="10" fill="#e8590c" font-family="Consolas,monospace">gstore(N+5) → oob=true</text>
  <rect x="34" y="150" width="280" height="1" fill="#e9ecef"/>
  <text x="30" y="172" font-size="10.5" fill="#2f9e44" font-weight="bold">sanitizer 抓到</text>
  <text x="30" y="190" font-size="10.5" fill="#495057">插桩原语 gstore 检查 idx∈[0,N)</text>
  <text x="30" y="208" font-size="10.5" fill="#495057">越界 → 标记 oob，clean()=false</text>
  <text x="30" y="232" font-size="10" fill="#868e96">CLI: compute-sanitizer --tool memcheck</text>

  <!-- Panel 2: uninit -->
  <rect x="346" y="40" width="320" height="245" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="362" y="64" font-size="13" font-weight="bold" fill="#7048e8">② 读未初始化 uninit</text>
  <text x="362" y="88" font-size="10.5" fill="#495057">buggy: __shared__ 先读后写</text>
  <rect x="362" y="100" width="280" height="40" rx="4" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="372" y="118" font-size="10" fill="#1f2d3d" font-family="Consolas,monospace">tid0: sload(0)  // 任一写前读</text>
  <text x="372" y="134" font-size="10" fill="#7048e8" font-family="Consolas,monospace">sload(0) → !swritten[0] → uninit=true</text>
  <rect x="362" y="150" width="280" height="1" fill="#e9ecef"/>
  <text x="362" y="172" font-size="10.5" fill="#2f9e44" font-weight="bold">sanitizer 抓到</text>
  <text x="362" y="190" font-size="10.5" fill="#495057">每个 load 先查"该元素是否被写过"</text>
  <text x="362" y="208" font-size="10.5" fill="#495057">未写即读 → 标记 uninit</text>
  <text x="362" y="232" font-size="10" fill="#868e96">CLI: compute-sanitizer --tool initcheck</text>

  <!-- Panel 3: race -->
  <rect x="14" y="300" width="320" height="245" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="30" y="324" font-size="13" font-weight="bold" fill="#c92a2a">③ 数据竞争 race</text>
  <text x="30" y="348" font-size="10.5" fill="#495057">buggy: 直方图无 atomic</text>
  <rect x="34" y="360" width="280" height="40" rx="4" fill="#fff5f5" stroke="#c92a2a"/>
  <text x="44" y="378" font-size="10" fill="#1f2d3d" font-family="Consolas,monospace">bin=tid%4; gstore(bin,tid,1)</text>
  <text x="44" y="394" font-size="10" fill="#c92a2a" font-family="Consolas,monospace">tid0 与 tid4 写同 bin → race=true</text>
  <rect x="34" y="410" width="280" height="1" fill="#e9ecef"/>
  <text x="30" y="432" font-size="10.5" fill="#2f9e44" font-weight="bold">sanitizer 抓到</text>
  <text x="30" y="450" font-size="10.5" fill="#495057">记录每址上次写者 tid；异 tid 写同址</text>
  <text x="30" y="468" font-size="10.5" fill="#495057">且未 barrier → 标记 race</text>
  <text x="30" y="492" font-size="10" fill="#868e96">CLI: compute-sanitizer --tool racecheck</text>

  <!-- Panel 4: fixed -->
  <rect x="346" y="300" width="320" height="245" rx="8" fill="#fff" stroke="#ced4da"/>
  <text x="362" y="324" font-size="13" font-weight="bold" fill="#2f9e44">④ fixed：atomic 消除竞争</text>
  <text x="362" y="348" font-size="10.5" fill="#495057">fixed: atomicAdd(&amp;bins[tid%4], 1)</text>
  <rect x="362" y="360" width="280" height="40" rx="4" fill="#e6fcf0" stroke="#2f9e44"/>
  <text x="372" y="378" font-size="10" fill="#1f2d3d" font-family="Consolas,monospace">gatomic(bin,tid,1) → 不报 race</text>
  <text x="372" y="394" font-size="10" fill="#2f9e44" font-family="Consolas,monospace">clean()==true（oob/uninit/race 全 false）</text>
  <rect x="362" y="410" width="280" height="1" fill="#e9ecef"/>
  <text x="362" y="432" font-size="10.5" fill="#495057">数值校验：bins == ref[tid%4]</text>
  <text x="362" y="450" font-size="10.5" fill="#495057">NT=8 → 每 bin=2（2,2,2,2）</text>
  <text x="362" y="474" font-size="10" fill="#868e96">应用：真实 kernel 的竞态/越界/非确定</text>
  <text x="362" y="494" font-size="10" fill="#868e96">bug 全靠运行时诊断，编译期查不出</text>

  <text x="14" y="582" font-size="10" fill="#adb5bd">纯 C++ 可跑（g++）；受管 Python 双复核 5/5 PASS。配色沿用 cuda_demo L4 规范。</text>
</svg>
