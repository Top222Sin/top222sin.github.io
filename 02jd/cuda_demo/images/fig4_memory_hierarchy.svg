<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="720" height="760" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#0f172a">CUDA 内存层次 + 三大陷阱（合并 / bank conflict / 双缓冲）</text>

  <!-- ===== Panel 1: 四级内存层次 ===== -->
  <rect x="20" y="44" width="680" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="34" y="66" font-size="13" font-weight="700" fill="#1d4ed8">① 四级内存层次（快→慢 / 小→大）</text>
  <!-- bars: 速度 -->
  <g font-size="10">
    <rect x="34" y="78" width="120" height="20" fill="#1e3a8a"/><text x="42" y="92" fill="#fff">register</text>
    <rect x="34" y="102" width="95" height="20" fill="#2563eb"/><text x="42" y="116" fill="#fff">constant</text>
    <rect x="34" y="126" width="70" height="20" fill="#3b82f6"/><text x="42" y="140" fill="#fff">shared</text>
    <rect x="34" y="150" width="160" height="20" fill="#93c5fd"/><text x="42" y="164" fill="#0f172a">global(显存)</text>
    <!-- 容量标注 -->
    <text x="170" y="92" fill="#334155">每线程 ~255 个</text>
    <text x="138" y="116" fill="#334155">64 KB</text>
    <text x="112" y="140" fill="#334155">48–164 KB/SM</text>
    <text x="200" y="164" fill="#334155">GB 级，慢~400 周期</text>
    <text x="34" y="190" font-size="9.5" fill="#64748b">片上：register / constant / shared（快）；片外：global（走显存）。高效 = 把热数据塞进快层。</text>
  </g>

  <!-- ===== Panel 2: 合并 vs 非合并 ===== -->
  <rect x="20" y="208" width="680" height="160" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="34" y="230" font-size="13" font-weight="700" fill="#047857">② 合并访问（coalesced）</text>
  <!-- 合并：32 连续 -> 1 事务 -->
  <text x="34" y="250" font-size="10" fill="#065f46">✅ 合并：线程 i 读 A[i]，warp 32 个连续 → 1 个 128B 事务</text>
  <g>
    <rect x="34" y="256" width="14" height="14" fill="#10b981"/><rect x="48" y="256" width="14" height="14" fill="#10b981"/><rect x="62" y="256" width="14" height="14" fill="#10b981"/><rect x="76" y="256" width="14" height="14" fill="#10b981"/><rect x="90" y="256" width="14" height="14" fill="#10b981"/><rect x="104" y="256" width="14" height="14" fill="#10b981"/><rect x="118" y="256" width="14" height="14" fill="#10b981"/><rect x="132" y="256" width="14" height="14" fill="#10b981"/>
    <text x="156" y="268" font-size="10" fill="#065f46">← warp 连续 128B →</text>
    <rect x="320" y="256" width="120" height="16" rx="3" fill="#059669"/><text x="328" y="268" fill="#fff" font-size="10">1 事务(100%)</text>
  </g>
  <!-- 非合并：跨度 -->
  <text x="34" y="296" font-size="10" fill="#b91c1c">❌ 非合并：线程 i 读 A[i*32]，散落 → 每线程单独事务</text>
  <g>
    <rect x="34" y="302" width="14" height="14" fill="#ef4444"/><rect x="34" y="320" width="14" height="14" fill="#ef4444"/><rect x="34" y="338" width="14" height="14" fill="#ef4444"/><rect x="34" y="356" width="14" height="14" fill="#ef4444"/>
    <text x="56" y="314" font-size="9" fill="#991b1b">A[0]</text><text x="56" y="332" font-size="9" fill="#991b1b">A[32]</text><text x="56" y="350" font-size="9" fill="#991b1b">A[64]</text><text x="56" y="368" font-size="9" fill="#991b1b">A[96]…</text>
    <rect x="320" y="318" width="120" height="16" rx="3" fill="#dc2626"/><text x="328" y="330" fill="#fff" font-size="10">32 事务(利用 1/32)</text>
  </g>
  <text x="34" y="386" font-size="9.5" fill="#047857">记忆法：线程 tid 永远访问 数组[tid]，别写 数组[tid*STRIDE]。</text>

  <!-- ===== Panel 3: bank conflict ===== -->
  <rect x="20" y="380" width="680" height="170" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="34" y="402" font-size="13" font-weight="700" fill="#c2410c">③ shared memory bank conflict（32 bank）</text>
  <text x="34" y="420" font-size="9.5" fill="#7c2d12">bank(i) = i % 32。同周期多线程打同一 bank → 串行。</text>
  <!-- 无冲突 -->
  <text x="34" y="438" font-size="10" fill="#065f46">✅ s[tid]（bank 0..31 各一）</text>
  <g>
    <rect x="34" y="442" width="13" height="13" fill="#10b981"/><rect x="49" y="442" width="13" height="13" fill="#3b82f6"/><rect x="64" y="442" width="13" height="13" fill="#f59e0b"/><rect x="79" y="442" width="13" height="13" fill="#8b5cf6"/><rect x="94" y="442" width="13" height="13" fill="#10b981"/><rect x="109" y="442" width="13" height="13" fill="#3b82f6"/>
    <text x="130" y="453" font-size="9.5" fill="#065f46">1 周期，无冲突</text>
  </g>
  <!-- 32路冲突 -->
  <text x="34" y="474" font-size="10" fill="#b91c1c">❌ s[tid*32]（全落 bank 0）</text>
  <g>
    <rect x="34" y="478" width="13" height="13" fill="#ef4444"/><rect x="49" y="478" width="13" height="13" fill="#ef4444"/><rect x="64" y="478" width="13" height="13" fill="#ef4444"/><rect x="79" y="478" width="13" height="13" fill="#ef4444"/><rect x="94" y="478" width="13" height="13" fill="#ef4444"/><rect x="109" y="478" width="13" height="13" fill="#ef4444"/>
    <text x="130" y="489" font-size="9.5" fill="#b91c1c">串行成 32 事务(慢 32×)</text>
  </g>
  <!-- pad 规避 -->
  <text x="34" y="514" font-size="10" fill="#047857">✅ pad：s[tid*33]，bank(tid*33%32)=bank(tid) 错开</text>
  <g>
    <rect x="34" y="518" width="13" height="13" fill="#10b981"/><rect x="49" y="518" width="13" height="13" fill="#3b82f6"/><rect x="64" y="518" width="13" height="13" fill="#f59e0b"/><rect x="79" y="518" width="13" height="13" fill="#8b5cf6"/><rect x="94" y="518" width="13" height="13" fill="#10b981"/><rect x="109" y="518" width="13" height="13" fill="#3b82f6"/>
    <text x="130" y="529" font-size="9.5" fill="#047857">无冲突等价</text>
  </g>
  <text x="34" y="546" font-size="9.5" fill="#c2410c">转置 pad 写法：tile[BDIM][BDIM+1]，让列距 32→33，与 32 互质。</text>

  <!-- ===== Panel 4: 双缓冲 ===== -->
  <rect x="20" y="564" width="680" height="170" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="34" y="586" font-size="13" font-weight="700" fill="#1d4ed8">④ 双缓冲：用计算掩盖取数延迟</text>
  <!-- 朴素 -->
  <text x="34" y="606" font-size="10" fill="#b91c1c">❌ 朴素分块：load → 算 → load → 算（算被 load 卡住）</text>
  <g>
    <rect x="34" y="612" width="60" height="16" fill="#fca5a5"/><text x="40" y="624" font-size="9" fill="#7f1d1d">load</text>
    <rect x="98" y="612" width="60" height="16" fill="#86efac"/><text x="104" y="624" font-size="9" fill="#14532d">计算</text>
    <rect x="162" y="612" width="60" height="16" fill="#fca5a5"/><text x="168" y="624" font-size="9" fill="#7f1d1d">load</text>
    <rect x="226" y="612" width="60" height="16" fill="#86efac"/><text x="232" y="624" font-size="9" fill="#14532d">计算</text>
  </g>
  <!-- 双缓冲 -->
  <text x="34" y="646" font-size="10" fill="#047857">✅ 双缓冲：算 buf[cur] 的同时预取进 buf[1-cur]</text>
  <g>
    <rect x="34" y="652" width="60" height="16" fill="#86efac"/><text x="40" y="664" font-size="9" fill="#14532d">算 buf0</text>
    <rect x="34" y="672" width="60" height="14" fill="#bfdbfe"/><text x="40" y="683" font-size="8.5" fill="#1e3a8a">预取 buf1</text>
    <rect x="98" y="652" width="60" height="16" fill="#86efac"/><text x="104" y="664" font-size="9" fill="#14532d">算 buf1</text>
    <rect x="98" y="672" width="60" height="14" fill="#bfdbfe"/><text x="104" y="683" font-size="8.5" fill="#1e3a8a">预取 buf0</text>
    <rect x="162" y="652" width="60" height="16" fill="#86efac"/><text x="168" y="664" font-size="9" fill="#14532d">算 buf0</text>
    <rect x="162" y="672" width="60" height="14" fill="#bfdbfe"/><text x="168" y="683" font-size="8.5" fill="#1e3a8a">预取 buf1</text>
  </g>
  <text x="34" y="712" font-size="9.5" fill="#1d4ed8">代价：多一倍 shared 容量；收益：计算≥预取时 load 延迟被完全隐藏。</text>
  <text x="34" y="730" font-size="9" fill="#64748b">这是 L2.4 矩阵乘 tiling 与 L3 异步拷贝 cp.async 的前身——后面只是"硬件自动帮你预取"。</text>
</svg>
