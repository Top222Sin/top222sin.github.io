<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="64" fill="#1e293b"/>
  <text x="24" y="30" font-size="20" font-weight="700" fill="#f8fafc">epilogue 融合对照：CUTLASS 输出算子 vs ORT bias 巧法</text>
  <text x="24" y="52" font-size="13" fill="#cbd5e1">工业界如何用"同一套 MMA+pipeline"描述任意算子（源码线第 3 站）</text>

  <!-- Panel A: CUTLASS epilogue 结构 -->
  <g>
    <rect x="20" y="84" width="380" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="20" y="84" width="380" height="30" rx="10" fill="#0ea5e9"/>
    <rect x="20" y="104" width="380" height="10" fill="#0ea5e9"/>
    <text x="34" y="105" font-size="13" font-weight="700" fill="#ffffff">① CUTLASS epilogue 结构（epilogue_base.h）</text>
    <rect x="44" y="130" width="150" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="52" y="151" font-size="11" fill="#075985">MMA 累加</text>
    <text x="110" y="151" font-size="11" fill="#075985">(寄存器/SMEM)</text>
    <rect x="220" y="130" width="150" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="228" y="151" font-size="11" fill="#075985">EpilogueBase</text>
    <text x="234" y="163" font-size="9.5" fill="#075985">SMEM 重排+合并写回</text>
    <line x1="194" y1="147" x2="220" y2="147" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="132" y="184" width="176" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="140" y="200" font-size="11" font-weight="700" fill="#854d0e">OutputOp（可替换）</text>
    <text x="140" y="215" font-size="9.5" fill="#854d0e">D = α·accum + β·C + act</text>
    <line x1="295" y1="147" x2="295" y2="184" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="220" y1="164" x2="220" y2="184" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="132" y="240" width="176" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="142" y="261" font-size="11" fill="#166534">全局写回 D（合并访问）</text>
    <line x1="220" y1="224" x2="220" y2="240" stroke="#16a34a" stroke-width="2"/>
    <text x="34" y="296" font-size="10" fill="#475569">关键：MMA 段固定不变，"算"全在 OutputOp 里</text>
  </g>

  <!-- Panel B: bias 广播 + 任意激活 -->
  <g>
    <rect x="420" y="84" width="380" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="420" y="84" width="380" height="30" rx="10" fill="#8b5cf6"/>
    <rect x="420" y="104" width="380" height="10" fill="#8b5cf6"/>
    <text x="434" y="105" font-size="13" font-weight="700" fill="#ffffff">② bias 广播 + 任意激活（BiasElementwise）</text>
    <rect x="444" y="128" width="120" height="32" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="452" y="148" font-size="10.5" fill="#5b21b6">α·accum</text>
    <rect x="580" y="128" width="120" height="32" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="588" y="148" font-size="10.5" fill="#5b21b6">β·C（bias 广播）</text>
    <rect x="444" y="176" width="120" height="32" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="452" y="196" font-size="10.5" fill="#5b21b6">binary_op(+)</text>
    <rect x="580" y="176" width="120" height="32" rx="6" fill="#fde68a" stroke="#d97706"/>
    <text x="588" y="196" font-size="10.5" fill="#92400e">ElementwiseOp</text>
    <line x1="564" y1="144" x2="580" y2="144" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="504" y1="160" x2="504" y2="176" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="640" y1="160" x2="640" y2="176" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="444" y="222" width="256" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="452" y="240" font-size="10.5" font-weight="700" fill="#854d0e">z = α·accum + β·C + bias</text>
    <text x="452" y="253" font-size="10" fill="#854d0e">Z = activation(z)   ← 模板参数随便换</text>
    <line x1="504" y1="208" x2="504" y2="222" stroke="#ca8a04" stroke-width="2"/>
    <line x1="640" y1="208" x2="640" y2="222" stroke="#ca8a04" stroke-width="2"/>
    <text x="434" y="296" font-size="10" fill="#475569">换 ReLU/GELU/Sigmoid = 换类型实参，MMA/pipeline 一行不改</text>
  </g>

  <!-- Panel C: ORT bias 巧法 -->
  <g>
    <rect x="20" y="330" width="380" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="20" y="330" width="380" height="30" rx="10" fill="#16a34a"/>
    <rect x="20" y="350" width="380" height="10" fill="#16a34a"/>
    <text x="34" y="351" font-size="13" font-weight="700" fill="#ffffff">③ ORT bias 巧法（gemm.cc:100-142）</text>
    <rect x="44" y="374" width="332" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="52" y="395" font-size="10.5" fill="#166534">第一步：把 bias 广播"预填"进输出缓冲 Y</text>
    <text x="52" y="408" font-size="9.5" fill="#166534">(标量=cublasCopy stride0; (N,)=ones-GEMM)</text>
    <rect x="44" y="420" width="332" height="34" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="52" y="441" font-size="10.5" fill="#166534">第二步：cublasGemm，β = β_ ≠ 0</text>
    <text x="52" y="454" font-size="9.5" fill="#166534">D = α·WᵀX + β·Y   （Y 已含 bias → 白送）</text>
    <line x1="210" y1="408" x2="210" y2="420" stroke="#16a34a" stroke-width="2"/>
    <rect x="44" y="466" width="332" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="52" y="487" font-size="10.5" font-weight="700" fill="#854d0e">复用库自带 epilogue（α·A·B+β·C）</text>
    <text x="52" y="500" font-size="9.5" fill="#854d0e">无需单独加 bias kernel、无需多一次 DRAM 往返</text>
    <line x1="210" y1="454" x2="210" y2="466" stroke="#ca8a04" stroke-width="2"/>
    <text x="34" y="540" font-size="10" fill="#475569">数学结构 = CUTLASS LinearCombination（D=α·accum+β·C）</text>
  </g>

  <!-- Panel D: 同一 pipeline 任意算子 -->
  <g>
    <rect x="420" y="330" width="380" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="420" y="330" width="380" height="30" rx="10" fill="#dc2626"/>
    <rect x="420" y="350" width="380" height="10" fill="#dc2626"/>
    <text x="434" y="351" font-size="13" font-weight="700" fill="#ffffff">④ 同一 pipeline，描述任意算子</text>
    <rect x="444" y="372" width="332" height="20" rx="5" fill="#fee2e2"/>
    <text x="452" y="386" font-size="10" fill="#991b1b">MMA + pipeline（唯一、固定）</text>
    <line x1="610" y1="392" x2="560" y2="404" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="610" y1="392" x2="660" y2="404" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="444" y="404" width="156" height="60" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="452" y="422" font-size="10.5" font-weight="700" fill="#7f1d1d">CUTLASS</text>
    <text x="452" y="437" font-size="9.5" fill="#7f1d1d">换 OutputOp /</text>
    <text x="452" y="450" font-size="9.5" fill="#7f1d1d">访客树(EVT)</text>
    <rect x="620" y="404" width="156" height="60" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="628" y="422" font-size="10.5" font-weight="700" fill="#7f1d1d">ORT</text>
    <text x="628" y="437" font-size="9.5" fill="#7f1d1d">换 β + 融合</text>
    <text x="628" y="450" font-size="9.5" fill="#7f1d1d">kernel / 库能力</text>
    <rect x="444" y="480" width="332" height="58" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="452" y="498" font-size="10" fill="#854d0e">算子差异收敛到"输出算子"</text>
    <text x="452" y="513" font-size="9.5" fill="#854d0e">这一个可替换点：</text>
    <text x="452" y="527" font-size="9.5" fill="#854d0e">GEMM / +bias / +ReLU / +GELU+残差 …</text>
    <text x="434" y="540" font-size="10" fill="#475569">殊途同归：MMA+pipeline 不动，epilogue 可编程</text>
  </g>

  <text x="24" y="582" font-size="9.5" fill="#94a3b8">源码备份：_cutlass_src/（epilogue_base.h · linear_combination*.h · collective/default_epilogue.hpp） · _ort_src/gemm.cc</text>
</svg>
