<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.4 观测器与分离原理</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="300" height="130" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190.0" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">x̂' = Ax̂ + Bu + L(y−Cx̂)</text>
  <text x="190.0" y="103" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">误差 e'=(A−LC)e 可任意配置</text>
  <text x="190.0" y="125" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">观测器极点 = 控制环 3~5 倍快</text>
  <rect x="360" y="55" width="300" height="130" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510.0" y="81" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">分离原理</text>
  <text x="510.0" y="103" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">K 与 L 独立设计、直接拼装</text>
  <text x="510.0" y="125" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">demo: 输出反馈收敛 7e-7 ✅</text>
  <rect x="40" y="215" width="610" height="95" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="345.0" y="241" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">⚠ 坑：观测器模型必须含控制输入 u（漏掉 → 发散 1e+32）</text>
  <text x="345.0" y="263" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">KF 是 L 的噪声最优版（KF_demo 全书）</text>
</svg>
