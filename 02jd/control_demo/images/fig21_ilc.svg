<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="430" fill="#0f1420"/>
  <text x="340" y="28" fill="#e6edf6" font-size="18" font-weight="700" text-anchor="middle">L4.6 迭代学习控制 ILC：E_{k+1}=(I−αGᵀG)E_k</text>
  <g>
    <rect x="10" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="70" fill="#7fd1ff" font-size="13" font-weight="700">① 批次重复任务</text>
    <text x="22" y="94" fill="#cdd6e4" font-size="12">y_k = G · u_k</text>
    <text x="22" y="114" fill="#cdd6e4" font-size="12">e_k = R − y_k</text>
    <text x="22" y="138" fill="#9aa7bd" font-size="11">对象 G: FIR 卷积 (N=16)</text>
    <text x="22" y="156" fill="#9aa7bd" font-size="11">g=[1,0.1,0.05,</text>
    <text x="22" y="172" fill="#9aa7bd" font-size="11">   0.02,0.01,0.005]</text>
    <text x="22" y="200" fill="#ffb454" font-size="11">同轨迹每天跑上万次</text>
  </g>
  <g>
    <rect x="350" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="70" fill="#7fd1ff" font-size="13" font-weight="700">② 更新律 + 收敛</text>
    <text x="362" y="94" fill="#cdd6e4" font-size="12">u_{k+1}=u_k+αGᵀe_k</text>
    <text x="362" y="116" fill="#cdd6e4" font-size="12">E_{k+1}=(I−αGᵀG)E_k</text>
    <text x="362" y="140" fill="#9aa7bd" font-size="11">收敛: ρ=‖I−αGᵀG‖&lt;1</text>
    <text x="362" y="162" fill="#9aa7bd" font-size="11">0&lt;α&lt;2/σ_max²(GᵀG)</text>
    <text x="362" y="200" fill="#ffb454" font-size="11">α=0.8689, ρ=0.2394</text>
  </g>
  <g>
    <rect x="10" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="254" fill="#7fd1ff" font-size="13" font-weight="700">③ 误差单调下降</text>
    <polyline points="34,370 60,360 90,345 120,330 150,318 180,308 210,300 240,293 270,288 300,284" fill="none" stroke="#5ad17a" stroke-width="2.5"/>
    <text x="22" y="282" fill="#9aa7bd" font-size="11">‖E‖ vs 迭代 k</text>
    <text x="22" y="350" fill="#cdd6e4" font-size="11">‖E⁰‖=1.16</text>
    <text x="170" y="350" fill="#cdd6e4" font-size="11">‖E⁴⁰‖=2.8e-27</text>
    <text x="22" y="392" fill="#ffb454" font-size="11">40次迭代学会, 复现R err=9.4e-3</text>
  </g>
  <g>
    <rect x="350" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="254" fill="#7fd1ff" font-size="13" font-weight="700">④ 局限与进阶</text>
    <text x="362" y="278" fill="#cdd6e4" font-size="11">· 模型依赖: 加 Q 滤波</text>
    <text x="362" y="298" fill="#cdd6e4" font-size="11">  抑制未建模高频</text>
    <text x="362" y="318" fill="#cdd6e4" font-size="11">· 需"每次一样"(重复)</text>
    <text x="362" y="338" fill="#cdd6e4" font-size="11">· 是 ‖R−GU‖² 梯度下降</text>
    <text x="362" y="362" fill="#cdd6e4" font-size="11">  见 Least_squares_method_demo</text>
    <text x="362" y="388" fill="#9aa7bd" font-size="11">与 ctrl_l4_mpc 正交可组合</text>
  </g>
</svg>
