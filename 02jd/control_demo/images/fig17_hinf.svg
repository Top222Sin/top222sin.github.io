<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2 H∞ / μ 综合：范数 · 小增益 · 混合灵敏度 · 结构化奇异值</text>
  <defs><marker id="a17" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>

  <rect x="30" y="50" width="290" height="105" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="45" y="74" font-size="13" font-weight="bold" fill="#1e3a8a">Part A · H∞ 范数 + 小增益</text>
  <text x="45" y="96" font-size="12" fill="#1e3a8a">广义对象 M(s)=1/(s²+0.2s+1)</text>
  <text x="45" y="116" font-size="12" fill="#1e3a8a">‖M‖∞=5.03 @ ω=0.99（频域峰值）</text>
  <text x="45" y="138" font-size="12" font-weight="bold" fill="#1e3a8a">闭环稳: ‖M‖∞·|δ|&lt;1</text>

  <rect x="360" y="50" width="290" height="105" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="375" y="74" font-size="13" font-weight="bold" fill="#14532d">小增益互联</text>
  <text x="375" y="96" font-size="12" fill="#14532d">(I−δM)⁻¹M 稳定 ⇔ ‖M‖∞|δ|&lt;1</text>
  <text x="375" y="116" font-size="12" fill="#14532d">δ=0.1: 实测 5.30 &lt; 界 10.10</text>
  <text x="375" y="138" font-size="12" fill="#14532d">充分(非必要)条件</text>

  <path d="M320,102 L360,102" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a17)"/>
  <text x="330" y="96" font-size="11" fill="#555">频域扫描</text>

  <rect x="30" y="200" width="290" height="105" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="45" y="224" font-size="13" font-weight="bold" fill="#78350f">Part B1 · 混合灵敏度</text>
  <text x="45" y="246" font-size="12" fill="#78350f">S=(1+PK)⁻¹, T=PK·S</text>
  <text x="45" y="266" font-size="12" fill="#78350f">目标 ‖W1·S‖∞, ‖W2·T‖∞ &lt; γ</text>
  <text x="45" y="288" font-size="12" font-weight="bold" fill="#78350f">实测 3.33 &lt;4, 0.077 &lt;1</text>

  <rect x="360" y="200" width="290" height="105" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="375" y="224" font-size="13" font-weight="bold" fill="#581c87">Part B2 · 结构化奇异值 μ</text>
  <text x="375" y="246" font-size="12" fill="#581c87">Δ=diag(δ1,δ2) 分块结构</text>
  <text x="375" y="266" font-size="12" fill="#581c87">μ̲≤μ≤μ̄≤‖M‖2 (本例 1.33)</text>
  <text x="375" y="288" font-size="12" font-weight="bold" fill="#581c87">μ-综合比 H∞ 更少保守</text>

  <path d="M320,252 L360,252" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a17)"/>
  <text x="328" y="246" font-size="11" fill="#555">鲁棒界</text>
  <path d="M175,155 L175,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a17)"/>
  <path d="M505,155 L505,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a17)"/>
</svg>
