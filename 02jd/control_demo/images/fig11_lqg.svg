<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.6 LQG = LQR + KF（分离定理）</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="280" height="110" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="82" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">KF（估计侧）</text>
  <text x="180" y="106" font-size="12.5" fill="#14532d" text-anchor="middle">从含噪 y 估 x̂（KF_demo 全书）</text>
  <text x="180" y="130" font-size="12.5" fill="#14532d" text-anchor="middle">K_kf 由 DARE 离线算出</text>
  <rect x="360" y="55" width="280" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="82" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">LQR（控制侧）</text>
  <text x="500" y="106" font-size="12.5" fill="#1e3a8a" text-anchor="middle">u = −K_lqr·x̂（L2.5）</text>
  <text x="500" y="130" font-size="12.5" fill="#1e3a8a" text-anchor="middle">各调各的最优 = 全局最优</text>
  <rect x="40" y="190" width="610" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="215" font-size="12.5" fill="#78350f" text-anchor="middle">demo: 双积分器+噪声, RMS=0.27 ✅（坑: 对象漏 Bd·u = 开环随机游走）</text>
  <text x="345" y="238" font-size="12" fill="#78350f" text-anchor="middle">陷阱: LQG 无鲁棒保证(Doyle 1978) → LTR / H∞ 入口</text>
  <text x="345" y="285" font-size="12.5" fill="#222" text-anchor="middle">跨仓库：KF_demo(L3.7 PX4=ES-EKF版LQG) · Jacobian_demo(MPC=约束版)</text>
</svg>
