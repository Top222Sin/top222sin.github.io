<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.3 无人机姿态 LQR + 积分增强</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="300" height="130" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190.0" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">滚转通道（天然线性）</text>
  <text x="190.0" y="103" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">θ̈ = (l/Jx)·u + d（常值风扰）</text>
  <text x="190.0" y="125" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">u = −Kθ·θ − Kω·ω − Ki·∫θ</text>
  <text x="190.0" y="147" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">K=[14.1, 3.5], Ki=2.0</text>
  <rect x="360" y="55" width="300" height="130" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510.0" y="81" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">demo 结果</text>
  <text x="510.0" y="103" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">θ₀=0.3 + 扰动 0.5 rad/s²</text>
  <text x="510.0" y="125" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">8s: |θ|&lt;0.003, |ω|&lt;4e-4 ✅</text>
  <text x="510.0" y="147" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">常值扰动被 ∫θ 顶掉</text>
  <rect x="40" y="215" width="610" height="95" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345.0" y="241" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">PX4 对照: 姿态 P + 角速率 PID + 前馈（LQR 思想+增益调度）</text>
  <text x="345.0" y="263" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">EKF2 供状态（KF_demo L3.7）→ 完整飞控 = 估计 + 控制</text>
</svg>
