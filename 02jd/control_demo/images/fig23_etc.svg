<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="430" fill="#0f1420"/>
  <text x="340" y="28" fill="#e6edf6" font-size="18" font-weight="700" text-anchor="middle">L4.8 事件触发控制 ETC：只在状态动了够多时才通信</text>
  <g>
    <rect x="10" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="70" fill="#7fd1ff" font-size="13" font-weight="700">① 周期 vs 事件</text>
    <text x="22" y="94" fill="#cdd6e4" font-size="11">周期: 每步传输+计算 (浪费)</text>
    <text x="22" y="116" fill="#cdd6e4" font-size="11">事件: 状态动了够多才触发</text>
    <text x="22" y="138" fill="#9aa7bd" font-size="11">保持 u=−K·x(t_k)</text>
    <text x="22" y="160" fill="#9aa7bd" font-size="11">两次事件间零阶保持</text>
    <text x="22" y="200" fill="#ffb454" font-size="11">省带宽/算力</text>
  </g>
  <g>
    <rect x="350" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="70" fill="#7fd1ff" font-size="13" font-weight="700">② 触发条件</text>
    <text x="362" y="94" fill="#cdd6e4" font-size="12">‖x(k)−x(t_k)‖ &gt; σ‖x(t_k)‖</text>
    <text x="362" y="118" fill="#9aa7bd" font-size="11">⇒ 事件, t_{k+1}=k</text>
    <text x="362" y="142" fill="#9aa7bd" font-size="11">本demo 闭环设计成收缩</text>
    <text x="362" y="160" fill="#9aa7bd" font-size="11">A−BK=D=diag(0.9,0.85)</text>
    <text x="362" y="182" fill="#9aa7bd" font-size="11">A−BK 残差=6.94e-18</text>
    <text x="362" y="200" fill="#ffb454" font-size="11">σ 留足稳定裕度</text>
  </g>
  <g>
    <rect x="10" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="254" fill="#7fd1ff" font-size="13" font-weight="700">③ 节省 85% 传输</text>
    <text x="22" y="278" fill="#cdd6e4" font-size="11">N=400, σ=0.3</text>
    <text x="22" y="300" fill="#cdd6e4" font-size="11">事件数 61 / 401</text>
    <text x="22" y="322" fill="#9aa7bd" font-size="11">终态 ‖x‖=4.43e-10 (稳定)</text>
    <rect x="22" y="334" width="140" height="24" rx="4" fill="#1f3326" stroke="#5ad17a"/>
    <text x="92" y="350" fill="#9bf0b0" font-size="10" text-anchor="middle">节省 85%</text>
    <text x="22" y="392" fill="#ffb454" font-size="11">σ大→省但收敛慢</text>
  </g>
  <g>
    <rect x="350" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="254" fill="#7fd1ff" font-size="13" font-weight="700">④ 边界与组合</text>
    <text x="362" y="278" fill="#cdd6e4" font-size="11">· 最大允许阈值 σ*</text>
    <text x="362" y="298" fill="#cdd6e4" font-size="11">· 临界稳定需加 δ: ‖e‖&gt;σ‖x‖+δ</text>
    <text x="362" y="318" fill="#cdd6e4" font-size="11">· 事件触发 MPC/卡尔曼</text>
    <text x="362" y="338" fill="#cdd6e4" font-size="11">  对称"按需通信"</text>
    <text x="362" y="362" fill="#cdd6e4" font-size="11">· 见 ctrl_l4_mpc, kf_l4_*</text>
    <text x="362" y="388" fill="#9aa7bd" font-size="11">4 passed, 0 failed</text>
  </g>
</svg>
