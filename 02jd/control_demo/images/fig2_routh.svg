<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.2 劳斯判据：第一列符号变化 = 右半平面根数</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="50" y="60" width="260" height="130" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180.0" y="86" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">劳斯表</text>
  <text x="180.0" y="108" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">s³| a3  a1</text>
  <text x="180.0" y="130" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">s²| a2  a0</text>
  <text x="180.0" y="152" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">s¹| (a2a1−a3a0)/a2</text>
  <text x="180.0" y="174" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">s⁰| a0</text>
  <rect x="360" y="60" width="280" height="130" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500.0" y="86" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">demo 对拍</text>
  <text x="500.0" y="108" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">s³+2s²+3s+4 → 0 个右根（稳定）✅</text>
  <text x="500.0" y="130" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">s³+s²+2s+8 → 2 个右根 ✅</text>
  <text x="500.0" y="152" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">s³+6s²+11s+6 → 稳定 ✅</text>
  <rect x="50" y="220" width="590" height="90" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345.0" y="246" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">工业场景</text>
  <text x="345.0" y="268" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">把 K 写进系数 → 扫第一列变号 → 得 K 的稳定区间（比根轨迹快）</text>
</svg>
