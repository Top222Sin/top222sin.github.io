<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="430" fill="#0f1420"/>
  <text x="340" y="28" fill="#e6edf6" font-size="18" font-weight="700" text-anchor="middle">L4.7 容错控制 FTC：失效抵消 + 冗余重分配</text>
  <g>
    <rect x="10" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="70" fill="#7fd1ff" font-size="13" font-weight="700">① 部分失效 ρ∈(0,1]</text>
    <text x="22" y="94" fill="#cdd6e4" font-size="12">u_实际 = Λ·u_指令</text>
    <text x="22" y="114" fill="#cdd6e4" font-size="12">Λ=diag(1, 0.4)</text>
    <text x="22" y="138" fill="#9aa7bd" font-size="11">K=B⁻¹(A−A_des)</text>
    <text x="22" y="156" fill="#9aa7bd" font-size="11">A−BK=A_des (健康极点)</text>
    <text x="22" y="180" fill="#9aa7bd" font-size="11">A−BK 残差=5.55e-17</text>
    <text x="22" y="200" fill="#ffb454" font-size="11">闭环=健康</text>
  </g>
  <g>
    <rect x="350" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="70" fill="#7fd1ff" font-size="13" font-weight="700">② Λ⁻¹ 预补偿抵消</text>
    <text x="362" y="94" fill="#cdd6e4" font-size="12">u=Λ⁻¹·(−Kx+u_ff)</text>
    <text x="362" y="116" fill="#cdd6e4" font-size="12">B·Λ·Λ⁻¹·v = B·v</text>
    <text x="362" y="140" fill="#9aa7bd" font-size="11">失效被精确抵消</text>
    <text x="362" y="162" fill="#9aa7bd" font-size="11">FTC 稳态误差≈0</text>
    <text x="362" y="182" fill="#9aa7bd" font-size="11">名义(无FTC)=0.4225</text>
    <text x="362" y="200" fill="#ffb454" font-size="11">需 ρ&gt;0</text>
  </g>
  <g>
    <rect x="10" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="254" fill="#7fd1ff" font-size="13" font-weight="700">③ 完全卡死 ρ=0</text>
    <text x="22" y="278" fill="#cdd6e4" font-size="11">执行器2死→B_eff第2列清零</text>
    <text x="22" y="300" fill="#cdd6e4" font-size="11">重分配 u₁'=(b₁₁u_h₁+b₁₂u_h₂)/b₁₁</text>
    <text x="22" y="322" fill="#9aa7bd" font-size="11">把输出贡献压到存活执行器1</text>
    <rect x="22" y="334" width="120" height="22" rx="4" fill="#1f3326" stroke="#5ad17a"/>
    <text x="82" y="350" fill="#9bf0b0" font-size="10" text-anchor="middle">FTC输出=1.000</text>
    <rect x="150" y="334" width="140" height="22" rx="4" fill="#3a2330" stroke="#ff6b6b"/>
    <text x="220" y="350" fill="#ff9b9b" font-size="10" text-anchor="middle">名义=1.333</text>
    <text x="22" y="392" fill="#ffb454" font-size="11">冗余是前提</text>
  </g>
  <g>
    <rect x="350" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="254" fill="#7fd1ff" font-size="13" font-weight="700">④ 依赖 FDI + 进阶</text>
    <text x="362" y="278" fill="#cdd6e4" font-size="11">· 先有故障诊断(FDI)</text>
    <text x="362" y="298" fill="#cdd6e4" font-size="11">  给 Λ 或失效标志</text>
    <text x="362" y="318" fill="#cdd6e4" font-size="11">· 见 kf_l4_* 残差诊断</text>
    <text x="362" y="338" fill="#cdd6e4" font-size="11">· 分配=伪逆最小二乘</text>
    <text x="362" y="362" fill="#cdd6e4" font-size="11">· 多失效→ ctrl_l4_mpc 重优化</text>
    <text x="362" y="388" fill="#9aa7bd" font-size="11">6 passed, 0 failed</text>
  </g>
</svg>
