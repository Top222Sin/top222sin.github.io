<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.3 极点配置 (Ackermann)</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="300" height="130" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190.0" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">K = eₙᵀ[B AB]⁻¹φ(A)</text>
  <text x="190.0" y="103" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">期望极点 −2±2j → φ=s²+4s+8</text>
  <text x="190.0" y="125" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">demo: K=[8,4], 特征逐系数 1e-12</text>
  <rect x="360" y="55" width="300" height="130" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510.0" y="81" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">指标→极点</text>
  <text x="510.0" y="103" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">ζ/ωn 公式(L1.1)反推期望极点</text>
  <text x="510.0" y="125" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">再远处放 3~5 倍快极点(主导极点法)</text>
  <rect x="40" y="215" width="610" height="95" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345.0" y="241" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">vs 根轨迹：只能沿轨迹 vs 任意放（需能控）</text>
  <text x="345.0" y="263" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">别贪快：ωn↑→K↑→饱和+噪声放大</text>
</svg>
