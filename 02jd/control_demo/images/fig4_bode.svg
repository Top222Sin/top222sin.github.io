<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.4 Bode：PM/GM 稳定裕度</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="300" height="120" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190.0" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">两个交越</text>
  <text x="190.0" y="103" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">ωc: |G|=1 → PM=180°+∠G(ωc)</text>
  <text x="190.0" y="125" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">ωp: ∠G=−180° → GM=1/|G(ωp)|</text>
  <text x="190.0" y="147" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">经验: ζ≈PM/100</text>
  <rect x="360" y="55" width="300" height="120" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510.0" y="81" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">demo: 三极点系统</text>
  <text x="510.0" y="103" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">PM=54.9°, GM=21.7 dB</text>
  <text x="510.0" y="125" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">预测 ζ≈0.55 超调≈13%</text>
  <text x="510.0" y="147" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">闭环阶跃仿真互证 ✅</text>
  <rect x="40" y="200" width="610" height="110" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="345.0" y="226" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">⚠ 工程坑（demo 踩过）</text>
  <text x="345.0" y="248" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">相位扫描必须解缠绕：atan2 在 ±180° 跳变</text>
  <text x="345.0" y="270" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">直接找 −180° 交越会漏判 GM——频域代码最常见 bug</text>
</svg>
