<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="430" fill="#0f1420"/>
  <text x="340" y="28" fill="#e6edf6" font-size="18" font-weight="700" text-anchor="middle">L4.5 MIMO 静态解耦：D=G(0)⁻¹ 把耦合对象对角化</text>
  <!-- panel template -->
  <g>
    <rect x="10" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="70" fill="#7fd1ff" font-size="13" font-weight="700">① 2×2 耦合对象</text>
    <text x="22" y="92" fill="#cdd6e4" font-size="12">y₁ = G₁₁u₁ + G₁₂u₂</text>
    <text x="22" y="110" fill="#cdd6e4" font-size="12">y₂ = G₂₁u₁ + G₂₂u₂</text>
    <text x="22" y="134" fill="#9aa7bd" font-size="11">DC 增益 K=G(0)=</text>
    <text x="22" y="152" fill="#9aa7bd" font-size="11">[[1.0, 0.5],</text>
    <text x="22" y="170" fill="#9aa7bd" font-size="11"> [0.3, 0.333]]</text>
    <text x="22" y="196" fill="#ffb454" font-size="11">G₁₂,G₂₁≠0 → 交叉耦合</text>
  </g>
  <g>
    <rect x="350" y="48" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="70" fill="#7fd1ff" font-size="13" font-weight="700">② 预补偿器 D=K⁻¹</text>
    <text x="362" y="94" fill="#cdd6e4" font-size="12">u(t) = D · r(t)</text>
    <text x="362" y="116" fill="#cdd6e4" font-size="12">复合增益 D·K = I</text>
    <text x="362" y="140" fill="#9aa7bd" font-size="11">D·K 残差 = 1.57e-16</text>
    <text x="362" y="162" fill="#9aa7bd" font-size="11">直流处严格对角化</text>
    <text x="362" y="200" fill="#ffb454" font-size="11">每路只跟自己的设定值</text>
  </g>
  <g>
    <rect x="10" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="22" y="254" fill="#7fd1ff" font-size="13" font-weight="700">③ r=[1,0] 阶跃响应</text>
    <!-- coupled -->
    <rect x="22" y="266" width="70" height="24" rx="4" fill="#3a2330" stroke="#ff6b6b"/>
    <text x="57" y="282" fill="#ff9b9b" font-size="10" text-anchor="middle">无解耦</text>
    <text x="104" y="272" fill="#cdd6e4" font-size="11">y₂=0.30</text>
    <text x="104" y="286" fill="#9aa7bd" font-size="11">(u₁带跑y₂)</text>
    <!-- decoupled -->
    <rect x="22" y="300" width="70" height="24" rx="4" fill="#1f3326" stroke="#5ad17a"/>
    <text x="57" y="316" fill="#9bf0b0" font-size="10" text-anchor="middle">解耦</text>
    <text x="104" y="306" fill="#cdd6e4" font-size="11">y₂=0.00e+00</text>
    <text x="104" y="320" fill="#9aa7bd" font-size="11">y₁=1.0000</text>
    <text x="22" y="352" fill="#9aa7bd" font-size="11">仿真2000步到达[1.0,0.0]</text>
    <text x="22" y="392" fill="#ffb454" font-size="11">交叉耦合比下降 &gt;100×</text>
  </g>
  <g>
    <rect x="350" y="232" width="320" height="172" rx="8" fill="#161d2e" stroke="#2b3550"/>
    <text x="362" y="254" fill="#7fd1ff" font-size="13" font-weight="700">④ 局限与进阶</text>
    <text x="362" y="278" fill="#cdd6e4" font-size="11">· 仅直流(低频)精确对角</text>
    <text x="362" y="298" fill="#cdd6e4" font-size="11">· 高频需动态解耦/INΛ</text>
    <text x="362" y="318" fill="#cdd6e4" font-size="11">· K 来自子空间辨识</text>
    <text x="362" y="338" fill="#cdd6e4" font-size="11">  (ls_l4_subspace_pem)</text>
    <text x="362" y="362" fill="#cdd6e4" font-size="11">· 强约束直接上 MPC</text>
    <text x="362" y="388" fill="#9aa7bd" font-size="11">see ctrl_l4_mpc</text>
  </g>
</svg>
