<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.1 二阶系统：ζ 与 ωn 决定一切</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="60" width="290" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185.0" y="86" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">超调只看 ζ</text>
  <text x="185.0" y="108" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Mp = exp(−ζπ/√(1−ζ²))</text>
  <text x="185.0" y="130" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">ζ=0.707 → Mp≈4.3%（工程黄金值）</text>
  <rect x="360" y="60" width="290" height="110" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="505.0" y="86" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">速度只看 ζωn</text>
  <text x="505.0" y="108" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">ts(2%) ≈ 4/(ζωn), tp = π/(ωn√(1−ζ²))</text>
  <text x="505.0" y="130" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">想又快又稳 → 提高 ωn（带宽=花钱）</text>
  <rect x="40" y="200" width="610" height="110" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345.0" y="226" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">工业直觉</text>
  <text x="345.0" y="248" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">ζ&lt;0.4 太抖（机械冲击）  ζ&gt;1 太肉（过阻尼）  0.6~0.8 常态</text>
  <text x="345.0" y="270" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">伺服套娃：电流环带宽 ≫ 速度环 ≫ 位置环（各 5~10 倍）</text>
</svg>
