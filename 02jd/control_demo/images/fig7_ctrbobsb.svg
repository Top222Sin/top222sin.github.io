<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.2 能控性与能观性（对偶）</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="300" height="120" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190.0" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">能控性 Wc=[B AB A²B…]</text>
  <text x="190.0" y="103" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">输入够得着所有模态?</text>
  <text x="190.0" y="125" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">rank=n → 极点可任意配置</text>
  <rect x="360" y="55" width="300" height="120" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510.0" y="81" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">能观性 Wo=[C;CA;CA²…]</text>
  <text x="510.0" y="103" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">输出看得见所有模态?</text>
  <text x="510.0" y="125" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">rank=n → 观测器可任意配置</text>
  <rect x="40" y="200" width="610" height="110" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345.0" y="226" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">对偶: (A,C)能观 ⇔ (Aᵀ,Cᵀ)能控</text>
  <text x="345.0" y="248" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">反例: A=diag(−1,−2),B=[1;0] → 模态−2不受控</text>
  <text x="345.0" y="270" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">KF_demo L3.2 用同一判据判"估得出"</text>
</svg>
