<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.5 超前补偿器设计三步</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <rect x="40" y="55" width="190" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135.0" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 现状</text>
  <text x="135.0" y="103" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">wc=4.25</text>
  <text x="135.0" y="125" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">PM=25.2°</text>
  <rect x="250" y="55" width="190" height="110" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345.0" y="81" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">② 求 a</text>
  <text x="345.0" y="103" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">sinφm=(a−1)/(a+1)</text>
  <text x="345.0" y="125" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">φm=31.8° → a=3.23</text>
  <rect x="460" y="55" width="190" height="110" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="555.0" y="81" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">③ 定 T</text>
  <text x="555.0" y="103" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">ωm=1/(√a·T)对准 wc</text>
  <text x="555.0" y="125" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">→ PM=46.6° ✅</text>
  <rect x="40" y="200" width="610" height="110" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="345.0" y="226" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">⚠ 坑：超前抬高交越点 → 新 wc 相位更滞后</text>
  <text x="345.0" y="248" font-size="12.5" font-weight="normal" fill="#581c87" text-anchor="middle">必须预留 10~15° 安全裕量（demo 首版 +8° 差 0.4°）</text>
  <text x="345.0" y="270" font-size="12.5" font-weight="normal" fill="#581c87" text-anchor="middle">超前=加相位提阻尼(D) 滞后=提增益消稳差(I)</text>
</svg>
