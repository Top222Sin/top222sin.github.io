<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3 反馈线性化 / 反步：非线性对象的确定性镇定</text>
  <defs><marker id="a19" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>

  <rect x="30" y="50" width="290" height="105" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="45" y="74" font-size="13" font-weight="bold" fill="#1e3a8a">非线性对象</text>
  <text x="45" y="96" font-size="12" fill="#1e3a8a">ẍ = ƒ(x) + g(x)u</text>
  <text x="45" y="116" font-size="12" fill="#1e3a8a">例: ẍ = x1² + u</text>
  <text x="45" y="138" font-size="12" font-weight="bold" fill="#1e3a8a">LQR/极点配置仅限于线性</text>

  <rect x="360" y="50" width="290" height="105" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="375" y="74" font-size="13" font-weight="bold" fill="#14532d">反馈线性化 FBL</text>
  <text x="375" y="96" font-size="12" fill="#14532d">u = v − ƒ(x)  ⇒  ẍ = v</text>
  <text x="375" y="116" font-size="12" fill="#14532d">精确双积分器(与 ƒ 无关)</text>
  <text x="375" y="138" font-size="12" font-weight="bold" fill="#14532d">跟踪误差 |e|=8.9e-4</text>

  <path d="M320,102 L360,102" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a19)"/>
  <text x="322" y="96" font-size="11" fill="#555">精确抵消</text>

  <rect x="30" y="200" width="290" height="105" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="45" y="224" font-size="13" font-weight="bold" fill="#78350f">反步 Backstepping</text>
  <text x="45" y="246" font-size="12" fill="#78350f">ẋ1=x2, ẋ2=x1+x2²+u</text>
  <text x="45" y="266" font-size="12" fill="#78350f">递归虚拟控制 α1,α2</text>
  <text x="45" y="288" font-size="12" font-weight="bold" fill="#78350f">闭环恰为线性稳定</text>

  <rect x="360" y="200" width="290" height="105" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="375" y="224" font-size="13" font-weight="bold" fill="#581c87">李雅普诺夫证明</text>
  <text x="375" y="246" font-size="12" fill="#581c87">V2=½x1²+½z2²</text>
  <text x="375" y="266" font-size="12" fill="#581c87">ṀV2=−c1x1²−c2z2²&lt;0</text>
  <text x="375" y="288" font-size="12" font-weight="bold" fill="#581c87">x1,x2→0 (调节)</text>

  <path d="M175,155 L175,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a19)"/>
  <path d="M505,155 L505,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a19)"/>
</svg>
