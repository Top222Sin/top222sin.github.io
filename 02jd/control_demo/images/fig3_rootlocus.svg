<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.3 根轨迹：K=K/(s(s+2)) 的极点走向</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs>
  <g transform="translate(60,70)">
    <line x1="0" y1="160" x2="560" y2="160" stroke="#999"/>
    <line x1="280" y1="10" x2="280" y2="200" stroke="#999"/>
    <line x1="120" y1="160" x2="240" y2="30" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a3)"/>
    <line x1="120" y1="160" x2="240" y2="290" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="440" y1="30" x2="240" y2="30" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>
    <line x1="440" y1="290" x2="240" y2="290" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="120" cy="160" r="5" fill="#d97706"/>
    <circle cx="40" cy="160" r="5" fill="#d97706"/>
    <text x="120" y="180" font-size="11" fill="#78350f" text-anchor="middle">开环极点 −2</text>
    <text x="40" y="180" font-size="11" fill="#78350f" text-anchor="middle">极点 0</text>
    <circle cx="240" cy="30" r="5" fill="#dc2626"/>
    <circle cx="240" cy="290" r="5" fill="#dc2626"/>
    <text x="252" y="24" font-size="11" fill="#dc2626">K=1 分离点 s=−1</text>
    <line x1="240" y1="160" x2="280" y2="120" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="330" y="120" font-size="11" fill="#9333ea">ζ 线交点 → K=2 设计点</text>
  </g>
</svg>
