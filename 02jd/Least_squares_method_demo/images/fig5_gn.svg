<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="300" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.5 非线性最小二乘：高斯-牛顿</text>
  <rect x="40" y="55" width="600" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GN 一行公式</text>
  <text x="340" y="102" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">在当前点把非线性'假装线性'，解一个线性 LS，重复</text>
  <rect x="40" y="140" width="600" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="166" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Δ = −(JᵀJ)⁻¹Jᵀr —— ⚠ 负号！(开发时写成 + 就是在爬坡发散)</text>
  <text x="340" y="187" font-size="13" font-weight="normal" fill="#14532d" text-anchor="middle">demo: 指数拟合 8 步收敛，解析雅可比 vs FD 差 1e-10</text>
  <rect x="40" y="225" width="600" height="72" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="251" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">线性化→解线性 LS→迭代；Δ=−(JᵀJ)⁻¹Jᵀr；指数拟合 8 步收敛。</text>
</svg>
