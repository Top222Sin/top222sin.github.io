<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="300" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4.3 软测量与预测性维护</text>
  <rect x="40" y="55" width="600" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">工业大数据两件套</text>
  <text x="340" y="102" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">软测量: 归一化特征回归,β 误差 0.023、预测 RMSE 0.058</text>
  <rect x="40" y="140" width="600" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="166" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">预测性维护: 退化二次拟合(归一化时间)→RUL 预测误差 <1h</text>
  <text x="340" y="187" font-size="13" font-weight="normal" fill="#14532d" text-anchor="middle">⚠ 坑: 特征必须归一化(裸 350~400 会病态);阈值设在观测区间外</text>
  <rect x="40" y="225" width="600" height="72" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="251" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">温度/压力/流量→质量指标多元回归;振动退化趋势拟合外推 RUL。</text>
</svg>
