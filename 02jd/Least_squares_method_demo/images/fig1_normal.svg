<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="300" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.1 线性最小二乘：法方程与几何</text>
  <rect x="40" y="55" width="600" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① LS 是正交投影</text>
  <text x="340" y="102" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">残差 r 垂直于 A 的列空间 → Aᵀr=0（demo 对拍 1e-13）</text>
  <rect x="40" y="140" width="600" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="166" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">法方程 AᵀAx=Aᵀb 就是垂直条件的代数写法</text>
  <text x="340" y="187" font-size="13" font-weight="normal" fill="#14532d" text-anchor="middle">直线拟合 demo: y=2.02x+0.95（真值 2x+1，噪声下无偏）</text>
  <rect x="40" y="225" width="600" height="72" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="251" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">min‖Ax−b‖² → AᵀAx=Aᵀb；残差⊥列空间；法方程=QR（逐位一致）。</text>
</svg>
