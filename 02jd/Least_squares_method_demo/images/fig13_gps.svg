<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="300" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.2 工业用例：GPS 伪距定位</text>
  <rect x="40" y="55" width="600" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">定位=非线性 LS</text>
  <text x="340" y="102" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">5 颗卫星、地心起点：GN 3 步收敛，误差 4.0 m</text>
  <rect x="40" y="140" width="600" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="166" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">未知量 [x,y,z,δt·c]：钟差被同时解出</text>
  <text x="340" y="187" font-size="13" font-weight="normal" fill="#14532d" text-anchor="middle">GDOP=JᵀJ 病态度 → 卫星几何决定精度（选星依据）</text>
  <rect x="40" y="225" width="600" height="72" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="251" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">伪距多球交点；GN 迭代 LS；5 星 3 步收敛误差 4m；GDOP。</text>
</svg>
