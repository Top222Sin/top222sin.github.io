<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="300" fill="#f7f9fc"/>
  <!-- 标题 -->
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">L4.10 Schur 补 BA：块结构 + 边缘化 + 矩阵累加同构</text>

  <!-- ============ 左面板：BA 几何 ============ -->
  <rect x="12" y="34" width="320" height="252" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1.2"/>
  <text x="172" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#185FA5">BA：重投影残差最小化</text>

  <!-- 相机 -->
  <g font-size="10" fill="#0c447c">
    <!-- cam0 固定/锚定 -->
    <polygon points="40,78 64,68 64,88" fill="#9aa7b5" stroke="#5b6770" stroke-width="1"/>
    <rect x="30" y="60" width="14" height="14" rx="2" fill="#ffffff" stroke="#5b6770"/>
    <text x="40" y="98" text-anchor="middle" fill="#5b6770">相机0·锚定</text>
    <!-- cam1 -->
    <polygon points="40,156 64,146 64,166" fill="#185FA5" stroke="#0c447c"/>
    <text x="40" y="184" text-anchor="middle">相机1</text>
    <!-- cam2 -->
    <polygon points="40,234 64,224 64,244" fill="#185FA5" stroke="#0c447c"/>
    <text x="40" y="262" text-anchor="middle">相机2</text>
  </g>

  <!-- 点云 -->
  <g fill="#3B6D11">
    <circle cx="270" cy="70" r="4"/><circle cx="250" cy="100" r="4"/>
    <circle cx="285" cy="125" r="4"/><circle cx="255" cy="150" r="4"/>
    <circle cx="290" cy="180" r="4"/><circle cx="248" cy="205" r="4"/>
    <circle cx="278" cy="230" r="4"/><circle cx="262" cy="255" r="4"/>
  </g>
  <text x="278" y="52" text-anchor="middle" font-size="10" fill="#3B6D11">3D 点 ×8</text>

  <!-- 投影光线 -->
  <g stroke="#185FA5" stroke-width="0.8" opacity="0.5">
    <line x1="64" y1="78" x2="270" y2="70"/><line x1="64" y1="78" x2="255" y2="150"/>
    <line x1="64" y1="156" x2="250" y2="100"/><line x1="64" y1="156" x2="285" y2="125"/>
    <line x1="64" y1="234" x2="248" y2="205"/><line x1="64" y1="234" x2="278" y2="230"/>
  </g>

  <!-- 重投影残差示意 -->
  <g>
    <circle cx="250" cy="100" r="3" fill="#3B6D11"/>
    <circle cx="262" cy="92" r="3" fill="#A32D2D"/>
    <line x1="250" y1="100" x2="262" y2="92" stroke="#A32D2D" stroke-width="1.4"/>
    <text x="200" y="115" font-size="9" fill="#A32D2D">重投影残差</text>
    <text x="200" y="126" font-size="9" fill="#3B6D11">=(投影像素−观测像素)</text>
  </g>
  <text x="172" y="280" text-anchor="middle" font-size="9.5" fill="#5b6770">目标：∑‖投影(Xᵢ)−观测ᵢ‖² 最小（非线性 LS → GN/LM）</text>

  <!-- ============ 右面板：块结构 + Schur ============ -->
  <rect x="348" y="34" width="324" height="252" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1.2"/>
  <text x="510" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#185FA5">法方程块结构与 Schur 补</text>

  <!-- 2x2 块矩阵 -->
  <g>
    <rect x="380" y="66" width="64" height="64" fill="#dce8f6" stroke="#0c447c" stroke-width="1.2"/>
    <text x="412" y="98" text-anchor="middle" font-size="10" fill="#0c447c">Hcc</text>
    <text x="412" y="112" text-anchor="middle" font-size="8" fill="#0c447c">相机×相机</text>
    <text x="412" y="123" text-anchor="middle" font-size="8" fill="#0c447c">12×12</text>

    <rect x="444" y="66" width="64" height="64" fill="#e6eef8" stroke="#0c447c" stroke-width="1.2"/>
    <text x="476" y="98" text-anchor="middle" font-size="10" fill="#0c447c">Hcp</text>
    <text x="476" y="112" text-anchor="middle" font-size="8" fill="#0c447c">相机×点</text>

    <rect x="380" y="130" width="64" height="64" fill="#e6eef8" stroke="#0c447c" stroke-width="1.2"/>
    <text x="412" y="162" text-anchor="middle" font-size="10" fill="#0c447c">Hpc</text>
    <text x="412" y="176" text-anchor="middle" font-size="8" fill="#0c447c">点×相机</text>

    <rect x="444" y="130" width="64" height="64" fill="#dcefdc" stroke="#3B6D11" stroke-width="1.2"/>
    <text x="476" y="162" text-anchor="middle" font-size="10" fill="#3B6D11">Hpp</text>
    <text x="476" y="176" text-anchor="middle" font-size="8" fill="#3B6D11">点×点</text>
    <text x="476" y="187" text-anchor="middle" font-size="8" fill="#3B6D11">24×24 块对角</text>

    <!-- 大括号表示 [H δ = -g] -->
    <text x="520" y="98" font-size="11" fill="#0c447c">[</text>
    <text x="524" y="98" font-size="10" fill="#0c447c">Hcc Hcp</text>
    <text x="524" y="137" font-size="10" fill="#0c447c">Hpc Hpp</text>
    <text x="520" y="171" font-size="11" fill="#0c447c">]</text>
    <text x="540" y="98" font-size="14" fill="#0c447c">·</text>
    <text x="548" y="98" font-size="10" fill="#A32D2D">δc</text>
    <text x="548" y="137" font-size="10" fill="#A32D2D">δp</text>
    <text x="540" y="171" font-size="13" fill="#0c447c">=</text>
    <text x="556" y="98" font-size="10" fill="#0c447c">bc</text>
    <text x="556" y="137" font-size="10" fill="#0c447c">bp</text>
  </g>

  <!-- Schur 公式 -->
  <rect x="372" y="208" width="276" height="34" rx="5" fill="#eef4fb" stroke="#0c447c" stroke-width="1"/>
  <text x="510" y="222" text-anchor="middle" font-size="10.5" fill="#0c447c">S = Hcc − Hcp·Hpp⁻¹·Hpc</text>
  <text x="510" y="236" text-anchor="middle" font-size="9" fill="#0c447c">边缘化 3D 点 → 约化相机系统 S·δc = bc − Hcp·Hpp⁻¹·bp</text>

  <!-- 同构链 -->
  <text x="510" y="266" text-anchor="middle" font-size="9.5" fill="#3B6D11">同构：逐项 JᵢᵀJᵢ 累加 ≡ JᵀJ ≡ XᵀX ≡ SME ZA ≡ KF 因子图</text>
</svg>
