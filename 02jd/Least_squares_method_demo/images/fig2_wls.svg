<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="300" fill="#fafafa"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.2 加权最小二乘与高斯-马尔可夫</text>
  <rect x="40" y="55" width="600" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="81" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">高斯-马尔可夫定理</text>
  <text x="340" y="102" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">等方差不相关 → OLS 是 BLUE（最优线性无偏）</text>
  <rect x="40" y="140" width="600" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="166" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">异方差 σ(x)=0.1+0.02x → WLS 才最优（50 次 MC 对拍）</text>
  <text x="340" y="187" font-size="13" font-weight="normal" fill="#14532d" text-anchor="middle">W=R⁻¹ 与 KF 的观测协方差、BA 的信息矩阵是同一族</text>
  <rect x="40" y="225" width="600" height="72" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="251" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">异方差时按 1/σ² 加权；Cov=(AᵀWA)⁻¹；KF 的 R⁻¹ 同族。</text>
</svg>
