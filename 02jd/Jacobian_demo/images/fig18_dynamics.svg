<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.7 动力学：双积分器 / 自行车 / 倒立摆 三类模型的雅可比 A、B</text>
  <text x="20" y="56" font-size="12" fill="#555">每个模型在 (x,u) 处线性化为 A=∂f/∂x、B=∂f/∂u；再接 MPC 得到最优控制灵敏度 S=∂u*/∂x</text>

  <!-- three model cards -->
  <g font-size="12" fill="#222">
    <!-- double integrator -->
    <rect x="20" y="80" width="195" height="120" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="32" y="102" font-weight="bold" fill="#1e40af">① 双积分器</text>
    <text x="32" y="122">x=(p,v), u=(a)</text>
    <text x="32" y="144">ṗ=v, v̇=a</text>
    <text x="32" y="168" fill="#2563eb">A=[1 0;0 1],</text>
    <text x="32" y="186" fill="#92400e">B=[0;1]</text>

    <!-- bicycle / unicycle -->
    <rect x="242" y="80" width="200" height="120" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="254" y="102" font-weight="bold" fill="#1e40af">② 自行车 / unicycle</text>
    <text x="254" y="122">x=(x,y,θ), u=(v,φ)</text>
    <text x="254" y="144">ẋ=v cosθ</text>
    <text x="254" y="162">ẏ=v sinθ</text>
    <text x="254" y="186" fill="#2563eb">A含 −v sinθ,</text>
    <text x="254" y="204" fill="#92400e">B含 (v/L)sec²φ</text>

    <!-- cart-pole -->
    <rect x="466" y="80" width="194" height="120" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="478" y="102" font-weight="bold" fill="#1e40af">③ 倒立摆 (cart-pole)</text>
    <text x="478" y="122">x=(x,vx,θ,θ̇)</text>
    <text x="478" y="142">u=(F)</text>
    <text x="478" y="164" fill="#2563eb">A,B 全非线性</text>
    <text x="478" y="184" fill="#475569">含重力/耦合项</text>
    <text x="478" y="204">∂(m l θ̇²sinθ)/∂θ</text>
  </g>

  <!-- MPC block -->
  <g transform="translate(150,240)">
    <rect x="0" y="0" width="380" height="70" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="14" y="24" font-size="13" fill="#3730a3" font-weight="bold">MPC 一步最优控制</text>
    <text x="14" y="48" font-size="12" fill="#2563eb">u* = −(BᵀQB+ρI)⁻¹ BᵀQ (Ax − x_g)</text>
    <text x="14" y="66" font-size="12" fill="#92400e">灵敏度 S = ∂u*/∂x = −(BᵀQB+ρI)⁻¹ BᵀQ A</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：所有模型共享同一套"线性化→优化"框架；A,B 由解析求导得到并与有限差分核对（误差 ~1e-8 ~ 1e-9），MPC 灵敏度 S 与对 x 的有限差分一致（~0）。</text>
</svg>
