<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.6 计算机视觉：重投影雅可比 与 束调整(BA)</text>
  <text x="20" y="56" font-size="12" fill="#555">3D 点投影到像面得 x；调节相机/点使 重投影误差 ‖x−x_obs‖ 最小</text>

  <g transform="translate(40,80)">
    <!-- 3D point -->
    <circle cx="60" cy="60" r="7" fill="#d97706"/>
    <text x="40" y="50" font-size="10" fill="#92400e">3D 点 X</text>
    <!-- camera -->
    <rect x="150" y="30" width="60" height="36" rx="5" fill="#eff6ff" stroke="#2563eb"/>
    <text x="158" y="52" font-size="10" fill="#1e40af">相机 C</text>
    <!-- projection ray -->
    <line x1="60" y1="60" x2="180" y2="48" stroke="#94a3b8" stroke-width="2"/>
    <!-- image plane -->
    <line x1="210" y1="20" x2="210" y2="100" stroke="#475569" stroke-width="2"/>
    <circle cx="210" cy="48" r="5" fill="#dc2626"/>
    <text x="216" y="52" font-size="10" fill="#991b1b">x</text>
    <text x="216" y="76" font-size="10" fill="#64748b">(重投影)</text>
    <!-- observed -->
    <circle cx="210" cy="30" r="4" fill="#059669"/>
    <text x="216" y="26" font-size="10" fill="#065f46">x_obs</text>
    <line x1="210" y1="30" x2="210" y2="48" stroke="#059669" stroke-width="1.5" marker-end="url(#arr11g)"/>
  </g>
  <defs><marker id="arr11g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker></defs>

  <g transform="translate(330,110)" font-size="13" fill="#222">
    <text x="0" y="0">x = π(C, X)   (投影)</text>
    <text x="0" y="28" fill="#d97706">∂x/∂C , ∂x/∂X   (重投影雅可比)</text>
    <text x="0" y="56" fill="#2563eb">调 C,X 使 ‖x−x_obs‖² 最小</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：把"3D 结构+相机位姿"一起优化就是 BA（SLAM/SFM 核心）。重投影雅可比告诉每个参数该往哪调。demo 用 2 视角 BA + 回溯线搜索收敛。</text>
</svg>
