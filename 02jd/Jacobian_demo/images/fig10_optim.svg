<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.5 数值优化：Gauss-Newton / Levenberg-Marquardt</text>
  <text x="20" y="56" font-size="12" fill="#555">非线性最小二乘 min Σ rᵢ(θ)²，残差雅可比 J=∂r/∂θ 给出下降方向</text>

  <g transform="translate(50,90)">
    <polyline fill="none" stroke="#cbd5e1" stroke-width="2"
      points="10,150 30,140 50,120 70,95 90,70 110,55 130,48 150,46"/>
    <circle cx="10" cy="150" r="4" fill="#dc2626"/>
    <circle cx="150" cy="46" r="4" fill="#059669"/>
    <text x="0" y="172" font-size="10" fill="#991b1b">数据</text>
    <text x="135" y="42" font-size="10" fill="#065f46">拟合</text>
    <line x1="40" y1="128" x2="62" y2="108" stroke="#2563eb" stroke-width="2" marker-end="url(#arr10)"/>
    <text x="66" y="122" font-size="9" fill="#1e40af">J·Δθ</text>
  </g>
  <defs><marker id="arr10" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>

  <g transform="translate(360,110)" font-size="13" fill="#222">
    <text x="0" y="0">r(θ) = ŷ − f(θ)   (残差)</text>
    <text x="0" y="28" fill="#d97706">J = ∂r/∂θ         (残差雅可比)</text>
    <text x="0" y="56" fill="#2563eb">Δθ = (JᵀJ)⁻¹ Jᵀ r        (G-N)</text>
    <text x="0" y="84" fill="#059669">Δθ = (JᵀJ+λI)⁻¹ Jᵀ r     (L-M)</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：G-N 把残差在 θ 处线性化，用残差雅可比一步跳到最小二乘解附近；L-M 用 λI 在"高斯-牛顿"与"最速下降"间自适应切换，更稳健。demo 拟合 y=a·e^{b x}。</text>
</svg>
