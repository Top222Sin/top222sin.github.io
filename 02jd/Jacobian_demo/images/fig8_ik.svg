<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.3 逆运动学(IK)：DLS 把末端送到目标</text>
  <text x="20" y="56" font-size="12" fill="#555">给定目标 xd，迭代 q ← q + α·Jᵀ(JJᵀ+λ²I)⁻¹(xd−x(q))，直到达标</text>

  <g transform="translate(60,80)">
    <circle cx="0" cy="170" r="6" fill="#475569"/>
    <line x1="0" y1="170" x2="95" y2="100" stroke="#2563eb" stroke-width="5"/>
    <circle cx="95" cy="100" r="6" fill="#1d4ed8"/>
    <line x1="95" y1="100" x2="170" y2="60" stroke="#2563eb" stroke-width="5"/>
    <circle cx="170" cy="60" r="6" fill="#1e40af"/>
    <!-- current end -->
    <circle cx="170" cy="60" r="7" fill="#dc2626"/>
    <text x="178" y="64" font-size="10" fill="#991b1b">x(q)</text>
    <!-- target -->
    <circle cx="150" cy="20" r="7" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="120" y="14" font-size="10" fill="#065f46">xd</text>
    <line x1="170" y1="60" x2="151" y2="24" stroke="#059669" stroke-width="2" marker-end="url(#arr8)"/>
    <text x="176" y="40" font-size="9" fill="#065f46">e=xd−x</text>
  </g>
  <defs><marker id="arr8" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker></defs>

  <g transform="translate(330,110)" font-size="13" fill="#222">
    <text x="0" y="0">e = x_d − x(q)</text>
    <text x="0" y="28" fill="#2563eb">q̇ = Jᵀ(JJᵀ+λ²I)⁻¹ e</text>
    <text x="0" y="56" fill="#059669">q ← q + α·q̇   (回溯线搜索选 α)</text>
    <text x="0" y="84" font-size="11" fill="#555">伪逆在奇点发散；DLS 有界且仍朝 e 下降</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：IK 本质是"用雅可比把 Cartesian 误差反推成关节增量"。demo 用回溯线搜索保证单调下降，误差最终 &lt; 1e-2。</text>
</svg>
