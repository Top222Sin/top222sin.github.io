<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.1 雅可比 = 局部最佳线性近似 + 链式法则</text>

  <!-- 左：映射 f: R^2->R^2 与切平面 -->
  <text x="20" y="56" font-size="12" fill="#555">① 局部线性化：f(p+dp) ≈ f(p) + J(p)·dp</text>
  <g transform="translate(30,74)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="10" y="18" font-size="11" fill="#334155">输入域 R²</text>
    <circle cx="55" cy="70" r="4" fill="#2563eb"/>
    <text x="62" y="74" font-size="10" fill="#1e40af">p</text>
    <line x1="55" y1="70" x2="115" y2="40" stroke="#94a3b8" stroke-dasharray="4"/>
    <text x="78" y="50" font-size="9" fill="#64748b">dp</text>
    <circle cx="115" cy="38" r="3" fill="#2563eb"/>
    <text x="120" y="42" font-size="10" fill="#1e40af">p+dp</text>
  </g>
  <g transform="translate(220,74)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="10" y="18" font-size="11" fill="#334155">值域 R²</text>
    <circle cx="55" cy="70" r="4" fill="#dc2626"/>
    <text x="62" y="74" font-size="10" fill="#991b1b">f(p)</text>
    <circle cx="115" cy="38" r="3" fill="#dc2626"/>
    <text x="120" y="42" font-size="10" fill="#991b1b">f(p+dp)</text>
    <!-- 切平面示意 -->
    <line x1="40" y1="60" x2="135" y2="20" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="100" font-size="9" fill="#2563eb">切平面 = J(p)·dp</text>
  </g>
  <line x1="180" y1="129" x2="220" y2="129" stroke="#475569" marker-end="url(#arr1)"/>
  <!-- arrow marker -->
  <defs><marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>

  <!-- 右：链式法则 g∘f -->
  <text x="400" y="56" font-size="12" fill="#555">② 链式法则：D(g∘f)(p) = Dg(f(p)) · Df(p)</text>
  <g transform="translate(410,90)" font-size="11">
    <rect x="0" y="20" width="70" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="14" y="42" fill="#1e40af" font-weight="bold">f</text>
    <text x="6" y="16" font-size="9" fill="#64748b">R²</text>
    <rect x="120" y="20" width="70" height="44" rx="6" fill="#dcfce7" stroke="#059669"/>
    <text x="134" y="42" fill="#065f46" font-weight="bold">g</text>
    <text x="150" y="16" font-size="9" fill="#64748b">R²</text>
    <line x1="70" y1="42" x2="120" y2="42" stroke="#475569" marker-end="url(#arr1)"/>
    <text x="78" y="36" font-size="9" fill="#1e40af">J_f</text>
    <line x1="190" y1="42" x2="240" y2="42" stroke="#475569" marker-end="url(#arr1)"/>
    <text x="196" y="36" font-size="9" fill="#065f46">J_g</text>
    <!-- 组合 -->
    <rect x="0" y="110" width="70" height="44" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="2" y="132" fill="#334155" font-weight="bold">g∘f</text>
    <line x1="35" y1="64" x2="35" y2="110" stroke="#94a3b8" stroke-dasharray="4"/>
    <text x="44" y="92" font-size="9" fill="#64748b">J_g·J_f</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：雅可比 J(p) 是 f 在 p 处的一阶偏导矩阵，也是"最佳线性近似"；复合映射的雅可比等于各层雅可比相乘（链式法则）。</text>
</svg>
