<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.1 SLAM：位姿图残差雅可比 (SE(2)/SE(3))</text>
  <text x="20" y="56" font-size="12" fill="#555">边约束 Z 给出相对位姿；残差 e=Z⁻¹·Tᵢ⁻¹·Tⱼ，对两顶点位姿的雅可比驱动高斯-牛顿</text>

  <g transform="translate(60,90)">
    <circle cx="60" cy="120" r="20" fill="#dbeafe" stroke="#2563eb"/>
    <text x="52" y="124" font-size="11" fill="#1e40af">位姿 Tᵢ</text>
    <circle cx="260" cy="120" r="20" fill="#dcfce7" stroke="#059669"/>
    <text x="252" y="124" font-size="11" fill="#065f46">位姿 Tⱼ</text>
    <!-- edge -->
    <line x1="80" y1="120" x2="240" y2="120" stroke="#d97706" stroke-width="3" marker-end="url(#arr12)"/>
    <text x="135" y="112" font-size="10" fill="#92400e">测量 Z (相对)</text>
    <!-- residual -->
    <rect x="120" y="150" width="80" height="26" rx="5" fill="#fef3c7" stroke="#d97706"/>
    <text x="130" y="167" font-size="10" fill="#92400e">e = Z⁻¹Tᵢ⁻¹Tⱼ</text>
    <line x1="120" y1="150" x2="80" y2="140" stroke="#94a3b8" stroke-dasharray="3"/>
    <line x1="200" y1="150" x2="240" y2="140" stroke="#94a3b8" stroke-dasharray="3"/>
  </g>
  <defs><marker id="arr12" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker></defs>

  <g transform="translate(360,110)" font-size="13" fill="#222">
    <text x="0" y="0">∂e/∂ξᵢ , ∂e/∂ξⱼ   (李代数雅可比)</text>
    <text x="0" y="28" fill="#2563eb">GN: ξ ← ξ − (ΣJᵀJ)⁻¹ ΣJᵀe</text>
    <text x="0" y="56" font-size="11" fill="#555">SE(3) 同理，只是 6 维旋量</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：SLAM 后端是在流形上做非线性最小二乘。demo 写出 SE(2) 边残差对两顶点的解析雅可比，并用 1 边/2 顶点 GN 把残差优化到 0。</text>
</svg>
