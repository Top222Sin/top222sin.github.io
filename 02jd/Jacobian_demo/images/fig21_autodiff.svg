<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L4 自动微分：前向（JVP）与 反向（VJP）</text>
  <text x="20" y="56" font-size="12" fill="#555">同一张计算图 f: x,y → f1,f2；两种模式各一次传播，得到雅可比-向量积 / 向量-雅可比积</text>

  <!-- ============ 共享计算图 ============ -->
  <g transform="translate(255,80)">
    <!-- inputs -->
    <circle cx="0" cy="40" r="14" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="0" cy="110" r="14" fill="#dbeafe" stroke="#2563eb"/>
    <text x="-26" y="44" font-size="10" fill="#1e40af">x</text>
    <text x="-26" y="114" font-size="10" fill="#1e40af">y</text>
    <!-- internal ops -->
    <circle cx="95" cy="20" r="14" fill="#e5e7eb" stroke="#64748b"/>
    <circle cx="95" cy="90" r="14" fill="#e5e7eb" stroke="#64748b"/>
    <circle cx="185" cy="40" r="14" fill="#e5e7eb" stroke="#64748b"/>
    <circle cx="185" cy="120" r="14" fill="#e5e7eb" stroke="#64748b"/>
    <circle cx="95" cy="160" r="14" fill="#e5e7eb" stroke="#64748b"/>
    <circle cx="185" cy="185" r="14" fill="#e5e7eb" stroke="#64748b"/>
    <text x="86" y="16" font-size="9" fill="#475569">sin</text>
    <text x="88" y="86" font-size="9" fill="#475569">exp</text>
    <text x="179" y="36" font-size="9" fill="#475569">×</text>
    <text x="179" y="116" font-size="9" fill="#475569">×</text>
    <text x="86" y="156" font-size="9" fill="#475569">x²</text>
    <text x="178" y="181" font-size="9" fill="#475569">cos</text>
    <!-- outputs -->
    <circle cx="278" cy="55" r="14" fill="#dcfce7" stroke="#059669"/>
    <circle cx="278" cy="175" r="14" fill="#dcfce7" stroke="#059669"/>
    <text x="296" y="59" font-size="10" fill="#047857">f1</text>
    <text x="296" y="179" font-size="10" fill="#047857">f2</text>
    <!-- edges (gray) -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="14" y1="40" x2="81" y2="20"/>
      <line x1="14" y1="110" x2="81" y2="90"/>
      <line x1="109" y1="20" x2="171" y2="40"/>
      <line x1="109" y1="90" x2="171" y2="120"/>
      <line x1="14" y1="40" x2="171" y2="120"/>
      <line x1="14" y1="110" x2="171" y2="120"/>
      <line x1="199" y1="40" x2="264" y2="55"/>
      <line x1="199" y1="120" x2="264" y2="55"/>
      <line x1="14" y1="40" x2="81" y2="160"/>
      <line x1="109" y1="160" x2="171" y2="185"/>
      <line x1="14" y1="110" x2="171" y2="185"/>
      <line x1="199" y1="185" x2="264" y2="175"/>
    </g>
  </g>

  <!-- ============ 左：前向模式 (JVP) ============ -->
  <g transform="translate(20,250)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#2563eb">前向模式 forward / tangent　∝ 输入维数 n</text>
    <text x="0" y="24" font-size="12" fill="#222">携带切向量 t = (tx,ty) 做一次前向求值</text>
    <text x="0" y="44" font-size="12" fill="#1e40af">→ 得到 JVP = J·t　（雅可比-向量积）</text>
    <line x1="14" y1="62" x2="120" y2="62" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="128" y="66" font-size="11" fill="#2563eb">t 沿图正向流动</text>
    <text x="0" y="92" font-size="11" fill="#666">例：t=(0.3,−0.7) → J·t=(−0.744, 0.627)</text>
  </g>

  <!-- ============ 右：反向模式 (VJP) ============ -->
  <g transform="translate(360,250)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#dc2626">反向模式 reverse / adjoint　∝ 输出维数 m</text>
    <text x="0" y="24" font-size="12" fill="#222">携带余切 u = (u0,u1) 从输出反向累加</text>
    <text x="0" y="44" font-size="12" fill="#b91c1c">→ 得到 VJP = Jᵀ·u　（向量-雅可比积）</text>
    <line x1="14" y1="62" x2="120" y2="62" stroke="#dc2626" stroke-width="3" marker-end="url(#arrR)"/>
    <text x="128" y="66" font-size="11" fill="#dc2626">u 沿图反向流动</text>
    <text x="0" y="92" font-size="11" fill="#666">例：u=(0.4,1.1) → Jᵀ·u=(1.647, 0.146)</text>
  </g>

  <text x="20" y="352" font-size="11" fill="#666">选型铁律：前向 ∝ n，反向 ∝ m。训练是"标量损失 m=1 对百万参数 n 很大" → 反向模式碾压 → 即 [[jac_l3_ml|L3.3]] 的 backprop。</text>

  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
