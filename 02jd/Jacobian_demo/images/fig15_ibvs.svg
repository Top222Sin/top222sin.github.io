<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.4 综合：基于图像的视觉伺服 IBVS（视觉 × 机器人 × 数值）</text>
  <text x="20" y="56" font-size="12" fill="#555">相机在臂末端：图像雅可比 L (CV) 与机械臂雅可比 J (机器人) 串接，DLS 伺服把特征收敛到目标</text>

  <g transform="translate(40,80)">
    <!-- world point -->
    <circle cx="20" cy="60" r="7" fill="#d97706"/>
    <text x="0" y="50" font-size="10" fill="#92400e">特征点 P</text>
    <!-- arm -->
    <line x1="200" y1="200" x2="150" y2="140" stroke="#2563eb" stroke-width="5"/>
    <circle cx="150" cy="140" r="6" fill="#1d4ed8"/>
    <line x1="150" y1="140" x2="90" y2="90" stroke="#2563eb" stroke-width="5"/>
    <circle cx="90" cy="90" r="7" fill="#dc2626"/>
    <text x="96" y="94" font-size="10" fill="#991b1b">相机=末端</text>
    <!-- camera ray to point -->
    <line x1="90" y1="90" x2="28" y2="62" stroke="#94a3b8" stroke-width="2"/>
    <!-- image plane -->
    <line x1="120" y1="50" x2="120" y2="120" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="80" r="5" fill="#dc2626"/>
    <text x="126" y="84" font-size="10" fill="#991b1b">s</text>
    <text x="126" y="106" font-size="10" fill="#64748b">特征</text>
  </g>

  <g transform="translate(300,90)" font-size="13" fill="#222">
    <text x="0" y="0" fill="#d97706">L : ṡ = L·v_c   (图像雅可比)</text>
    <text x="0" y="28" fill="#2563eb">J : v_c = J·q̇   (机械臂雅可比)</text>
    <text x="0" y="56" fill="#059669">v_c* = −λ L⁺(s−s_des)</text>
    <text x="0" y="84" fill="#059669">q̇ = J⁺ v_c*     (均用 DLS)</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：IBVS 是雅可比思想的交汇点——视觉给出"特征如何随相机运动"的雅可比，机器人给出"相机如何随关节运动"的雅可比，二者串接即特征对关节的雅可比，DLS 保证全程鲁棒。</text>
</svg>
