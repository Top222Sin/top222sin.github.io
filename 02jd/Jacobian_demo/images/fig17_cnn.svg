<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L3.6 深度学习：一维 CNN 雅可比 ∂y/∂x 的反向传播求法</text>
  <text x="20" y="56" font-size="12" fill="#555">把 CNN 看成分段线性算子（卷积=稀疏线性、ReLU=对角门控）；雅可比就是"反向传播一个单位矩阵"——∂y/∂x = backprop(I)</text>

  <!-- network flow: forward -->
  <g transform="translate(30,90)">
    <!-- input x -->
    <rect x="0" y="20" width="60" height="80" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="14" y="64" font-size="11" fill="#1e40af">x</text>
    <text x="12" y="80" font-size="9" fill="#1e40af">L0=10</text>
    <!-- conv1 -->
    <rect x="100" y="10" width="70" height="100" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="112" y="54" font-size="10" fill="#065f46">Conv1</text>
    <text x="110" y="70" font-size="9" fill="#065f46">3ch k3</text>
    <!-- relu -->
    <rect x="200" y="30" width="40" height="60" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="208" y="64" font-size="10" fill="#92400e">ReLU</text>
    <!-- conv2 -->
    <rect x="270" y="20" width="70" height="90" rx="4" fill="#dcfce7" stroke="#059669"/>
    <text x="282" y="60" font-size="10" fill="#065f46">Conv2</text>
    <text x="280" y="76" font-size="9" fill="#065f46">2ch k3</text>
    <!-- relu2 -->
    <rect x="370" y="35" width="40" height="50" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="378" y="65" font-size="10" fill="#92400e">ReLU</text>
    <!-- FC -->
    <rect x="440" y="40" width="60" height="50" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="452" y="70" font-size="10" fill="#5b21b6">FC</text>
    <!-- y -->
    <rect x="540" y="50" width="50" height="34" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="552" y="72" font-size="11" fill="#991b1b">y(2)</text>

    <line x1="60" y1="60" x2="100" y2="60" stroke="#475569" marker-end="url(#a17)"/>
    <line x1="170" y1="60" x2="200" y2="60" stroke="#475569" marker-end="url(#a17)"/>
    <line x1="240" y1="60" x2="270" y2="60" stroke="#475569" marker-end="url(#a17)"/>
    <line x1="340" y1="60" x2="370" y2="60" stroke="#475569" marker-end="url(#a17)"/>
    <line x1="410" y1="60" x2="440" y2="60" stroke="#475569" marker-end="url(#a17)"/>
    <line x1="500" y1="65" x2="540" y2="65" stroke="#475569" marker-end="url(#a17)"/>
  </g>
  <defs><marker id="a17" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>

  <!-- backprop arrows (Jacobian) -->
  <g transform="translate(30,90)" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#b17)">
    <line x1="540" y1="96" x2="460" y2="96"/>
    <line x1="440" y1="96" x2="385" y2="96"/>
    <line x1="370" y1="96" x2="282" y2="96"/>
    <line x1="270" y1="96" x2="208" y2="96"/>
    <line x1="200" y1="96" x2="102" y2="96"/>
    <line x1="100" y1="96" x2="62" y2="96"/>
  </g>
  <defs><marker id="b17" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <text x="250" y="210" font-size="11" fill="#dc2626">反向：把输出梯度 I 逐层传回 → 得到 ∂y/∂x (2×10)</text>

  <!-- formula block -->
  <g transform="translate(330,230)" font-size="13" fill="#222">
    <text x="0" y="0" fill="#059669">Conv:  y[c] = Σ_{ci,k} W[c][ci][k] · x[ci][n+k]</text>
    <text x="0" y="26" fill="#d97706">ReLU:  对角门 g = diag(ẏ>0)</text>
    <text x="0" y="52" fill="#2563eb">∂y/∂x = (FC) · g₂ · (Conv2) · g₁ · (Conv1)   (2×10)</text>
    <text x="0" y="78" fill="#7c3aed">backprop(one-hot) 与有限差分误差 ≈ 1.8e-10</text>
  </g>
</svg>
