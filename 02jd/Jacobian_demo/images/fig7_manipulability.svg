<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.2 可操作度椭球 w=√det(JJᵀ) 与 阻尼最小二乘(DLS)</text>
  <text x="20" y="56" font-size="12" fill="#555">椭球体积 ∝ w；奇异位形下椭球塌缩成线(w→0)。DLS 用 λ² 抬底，避免速度爆炸</text>

  <g transform="translate(40,90)">
    <text x="0" y="-4" font-size="11" fill="#334155">正常位形：椭球饱满</text>
    <ellipse cx="80" cy="110" rx="70" ry="40" fill="#dbeafe" stroke="#2563eb"/>
    <text x="40" y="170" font-size="10" fill="#1e40af">w 大</text>
  </g>
  <g transform="translate(230,90)">
    <text x="0" y="-4" font-size="11" fill="#334155">近奇异：椭球塌缩成线</text>
    <line x1="20" y1="110" x2="150" y2="110" stroke="#dc2626" stroke-width="6"/>
    <text x="55" y="170" font-size="10" fill="#991b1b">w→0</text>
  </g>
  <g transform="translate(410,90)">
    <text x="0" y="-4" font-size="11" fill="#334155">DLS：λ² 抬底 → 椭球回圆</text>
    <ellipse cx="80" cy="110" rx="48" ry="44" fill="#dcfce7" stroke="#059669"/>
    <text x="45" y="170" font-size="10" fill="#065f46">有界</text>
  </g>

  <g transform="translate(40,280)" font-size="13" fill="#222">
    <text x="0" y="0">w = √det(J Jᵀ)   （各方向可达速度之积的根）</text>
    <text x="0" y="26" fill="#2563eb">q̇ = Jᵀ (J Jᵀ + λ²I)⁻¹ ẋ    ← DLS 顺序：先 Jᵀ 再求逆</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：可操作度用 JJᵀ 的特征椭球刻画末端"各方向灵活度"。普通伪逆在奇点处速度发散；DLS 用 λ²I 给分母兜底，速度保持有界。</text>
</svg>
