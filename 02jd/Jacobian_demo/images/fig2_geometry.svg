<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.2 雅可比的几何意义：det J = 局部面积缩放因子</text>

  <text x="20" y="56" font-size="12" fill="#555">小平行四边形在 f 下面积由 |det J| 放大；rank 不足则"压扁"成线（面积→0）</text>
  <!-- 域 -->
  <g transform="translate(40,90)">
    <text x="0" y="-8" font-size="11" fill="#334155">输入域：单位方格 dA</text>
    <polygon points="10,70 70,70 70,10 10,10" fill="#dbeafe" stroke="#2563eb"/>
    <line x1="10" y1="10" x2="70" y2="70" stroke="#60a5fa" stroke-dasharray="3"/>
    <text x="20" y="95" font-size="9" fill="#1e40af">面积 = dA</text>
  </g>
  <line x1="160" y1="130" x2="210" y2="130" stroke="#475569" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>
  <!-- 值域 -->
  <g transform="translate(220,90)">
    <text x="0" y="-8" font-size="11" fill="#334155">值域：映射后平行四边形</text>
    <polygon points="20,80 120,30 160,90 60,140" fill="#fee2e2" stroke="#dc2626"/>
    <text x="70" y="170" font-size="9" fill="#991b1b">面积 = |det J| · dA</text>
  </g>

  <!-- rank 不足示意 -->
  <g transform="translate(440,90)">
    <text x="0" y="-8" font-size="11" fill="#334155">rank 不足（如 f(x,y)=(x, x²)）</text>
    <polygon points="30,40 130,40 130,40 30,40" fill="none" stroke="#dc2626" stroke-width="0"/>
    <line x1="30" y1="80" x2="150" y2="80" stroke="#dc2626" stroke-width="3"/>
    <text x="40" y="100" font-size="9" fill="#991b1b">压扁成线 → 面积 0</text>
    <text x="40" y="116" font-size="9" fill="#991b1b">det J = 0 → rank 亏损</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：|det J(p)| 给出 f 在 p 处对面积/体积的局部放大率；det J=0 意味着该点邻域被"降维"压扁，映射不可逆 —— 这与机械臂奇异位形同源。</text>
</svg>
