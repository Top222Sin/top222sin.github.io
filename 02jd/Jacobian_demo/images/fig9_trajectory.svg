<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L2.4 冗余机械臂：主任务 + 零空间次要任务</text>
  <text x="20" y="56" font-size="12" fill="#555">3R 冗余臂：主任务跟踪 x；次要任务（如避开关节极限）只作用在零空间，不干扰主任务</text>

  <g transform="translate(50,80)">
    <circle cx="0" cy="190" r="6" fill="#475569"/>
    <line x1="0" y1="190" x2="80" y2="130" stroke="#2563eb" stroke-width="5"/>
    <circle cx="80" cy="130" r="6" fill="#1d4ed8"/>
    <line x1="80" y1="130" x2="150" y2="80" stroke="#2563eb" stroke-width="5"/>
    <circle cx="150" cy="80" r="6" fill="#1d4ed8"/>
    <line x1="150" y1="80" x2="200" y2="55" stroke="#2563eb" stroke-width="5"/>
    <circle cx="200" cy="55" r="7" fill="#dc2626"/>
    <text x="206" y="59" font-size="10" fill="#991b1b">末端</text>
    <!-- primary velocity -->
    <line x1="200" y1="55" x2="245" y2="30" stroke="#059669" stroke-width="2.5" marker-end="url(#arr9)"/>
    <text x="248" y="34" font-size="9" fill="#065f46">主任务 ẋ</text>
    <!-- null space -->
    <line x1="150" y1="80" x2="120" y2="120" stroke="#d97706" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr9o)"/>
    <text x="96" y="134" font-size="9" fill="#92400e">零空间</text>
  </g>
  <defs>
    <marker id="arr9" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="arr9o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>

  <g transform="translate(360,110)" font-size="13" fill="#222">
    <text x="0" y="0">q̇ = J⁺ ẋ</text>
    <text x="20" y="24" fill="#059669">+ (I − J⁺J)·ẋ_second</text>
    <text x="0" y="56" font-size="11" fill="#475569">J⁺J 投影掉次要任务中</text>
    <text x="0" y="74" font-size="11" fill="#475569">影响主任务的分量</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：冗余自由度(关节数>任务维数)让臂能"顺手"完成次要目标。零空间投影 (I−J⁺J) 保证次要任务绝不拖慢主任务跟踪。</text>
</svg>
