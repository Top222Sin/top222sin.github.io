<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">L1.4 数值梯度 ↔ 雅可比（标量函数的特例）</text>
  <text x="20" y="56" font-size="12" fill="#555">∇f 处处垂直于等高线，指向上升最快方向；最速下降沿 −∇f 收敛到极小</text>

  <g transform="translate(60,80)">
    <!-- contours -->
    <circle cx="200" cy="150" r="20" fill="none" stroke="#cbd5e1"/>
    <circle cx="200" cy="150" r="45" fill="none" stroke="#cbd5e1"/>
    <circle cx="200" cy="150" r="70" fill="none" stroke="#cbd5e1"/>
    <circle cx="200" cy="150" r="95" fill="none" stroke="#cbd5e1"/>
    <circle cx="200" cy="150" r="4" fill="#dc2626"/>
    <text x="206" y="154" font-size="10" fill="#991b1b">极小</text>
    <!-- gradient/descent path -->
    <polyline fill="none" stroke="#059669" stroke-width="2.5"
      points="40,30 70,55 95,80 120,100 150,120 180,138 200,150"/>
    <!-- descent arrows -->
    <line x1="40" y1="30" x2="62" y2="50" stroke="#2563eb" stroke-width="2" marker-end="url(#arr4)"/>
    <line x1="120" y1="100" x2="142" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#arr4)"/>
    <text x="6" y="24" font-size="10" fill="#2563eb">−∇f 方向</text>
  </g>
  <defs><marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>

  <g transform="translate(380,110)" font-size="13" fill="#222">
    <text x="0" y="0">f: Rⁿ → R</text>
    <text x="0" y="28" fill="#2563eb">∇f = [∂f/∂x1 … ∂f/∂xn]ᵀ</text>
    <text x="0" y="56" fill="#059669">x ← x − α ∇f   (最速下降)</text>
    <text x="0" y="84" font-size="11" fill="#555">标量 loss 的"雅可比"就是梯度</text>
  </g>

  <text x="20" y="350" font-size="11" fill="#666">要点：梯度是雅可比在 m=1（标量输出）时的转置。demo 用中心差分估计 ∂f/∂x，并跑最速下降收敛到 (2,3)。</text>
</svg>
